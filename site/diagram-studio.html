<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem('dgs:'+k);}catch{return null;}},set(k,v){try{localStorage.setItem('dgs:'+k,v);}catch{}}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1800);};

/* starter content, themed on the AI cooking channel */
const STARTERS={
 roadmap:{title:'AI cooking channel · launch roadmap',subtitle:'Six months, four workstreams',data:{periods:['Nov','Dec','Jan','Feb','Mar','Apr'],today:'0',lanes:['Pipeline','Content','Growth','Money'],
  items:[{label:'Photoreal identity locked',lane:0,start:0,end:0,status:'doing',progress:.6},{label:'Video model + upscaler',lane:0,start:0,end:1,status:'planned'},{label:'Render + approval gate',lane:0,start:1,end:2,status:'planned'},{label:'Scheduler',lane:0,start:2,end:2,status:'planned'},
   {label:'Pilot: 4 episodes',lane:1,start:1,end:2,status:'planned'},{label:'Weekly episodes',lane:1,start:3,end:5,status:'planned'},{label:'Chef roster (4 chefs)',lane:1,start:0,end:0,status:'done'},
   {label:'Shorts cut-downs',lane:2,start:2,end:5,status:'planned'},{label:'Community replies',lane:2,start:3,end:5,status:'planned'},{label:'Analytics: what lands',lane:2,start:3,end:4,status:'risk'},
   {label:'YPP threshold',lane:3,start:4,end:5,status:'planned'},{label:'First brand deal',lane:3,start:5,end:5,status:'planned'}],
  milestones:[{label:'Pilot live',at:'2'},{label:'Monetised',at:'5'}]}},
 org:{title:'Channel team',subtitle:'Who owns what',data:{text:`Ava Reyes — Founder, creative director
  Sam Okafor — Producer [Production]
    Lena Park — AI video lead [Production]
    Marco Diaz — Editor + colourist [Production]
    Open role — Sound designer [Production]
  Priya Shah — Head of growth [Growth]
    Tom Becker — Shorts editor [Growth]
    Open role — Community manager [Growth]
    Jade Wu — Analyst [Growth]
    Noor Haddad — Partnerships [Growth]
    Ben Cole — Social producer [Growth]
  Kai Mensah — Recipe researcher [Content]`}},
 journey:{title:'Viewer journey',subtitle:'From first scroll to regular viewer',data:{persona:'Home cook, 28, watches food Shorts on the commute',stages:[
  {name:'Discover',doing:'Scrolls Shorts\nStops on a sizzling close-up',touchpoints:'Shorts feed; TikTok For You',thinking:'That looks unreal, is it AI?',feeling:1,feelingNote:'curious',pains:'Unsure if the recipe is real',ideas:'Show the real recipe card in the first 3 s'},
  {name:'Watch',doing:'Watches the full episode\nRewinds the plating',touchpoints:'YouTube long-form',thinking:'The chef has a personality',feeling:2,feelingNote:'hooked',pains:'Episode runs long in the middle',ideas:'Tighter cut; chapter markers'},
  {name:'Try',doing:'Looks for the recipe\nCooks it at the weekend',touchpoints:'Description; pinned comment',thinking:'Where are the exact amounts?',feeling:-1,feelingNote:'stuck',pains:'Amounts only in the video',ideas:'Printable recipe page per episode'},
  {name:'Share',doing:'Posts their attempt\nTags the channel',touchpoints:'Comments; Instagram',thinking:'Will they notice mine?',feeling:0,feelingNote:'hopeful',pains:'No replies to fan posts',ideas:'Weekly fan-dish round-up'},
  {name:'Return',doing:'Subscribes\nTurns on notifications',touchpoints:'Subscriptions feed',thinking:'Same chef, new dish every week',feeling:2,feelingNote:'loyal',pains:'Irregular upload days',ideas:'Fixed weekly slot per chef'}]}},
 matrix:{title:'How should we publish?',subtitle:'Three set-ups for posting to YouTube, TikTok and Instagram',data:{columns:[{name:'Post by hand',note:'Today'},{name:'Scheduler tool',note:'Monthly fee',pick:true},{name:'Custom pipeline',note:'Built in-house'}],
  rows:[{group:'Effort'},{label:'Time per week',cells:['3–4 h','30 min','10 min']},{label:'Set-up time',cells:['None','An afternoon','2–3 weeks']},
   {group:'Reach'},{label:'All three platforms',cells:['yes','yes','yes']},{label:'Platform-specific captions',cells:['yes','yes','partial']},{label:'Best-time posting',cells:['no','yes','partial']},
   {group:'Learning'},{label:'Analytics in one place',cells:['no','partial','yes']},{label:'Feeds the what-worked memory',cells:['no','no','yes']},
   {group:'Cost'},{label:'Monthly cost',cells:['£0','£15–40','Hosting only']}]}}};
const KINDHELP={roadmap:'Workstreams over time: what happens when, what is done, what is at risk.',org:'Who reports to whom. Big teams of individual contributors stack in a column so the chart stays readable.',journey:'One customer’s experience, stage by stage: what they do, think and feel, where it hurts and what to fix.',matrix:'Options side by side against the same criteria, with the recommendation marked so readers get the answer first.'};
const ICON={roadmap:'<path d="M1 6h32M1 14h32M1 22h32"/><rect x="3" y="3" width="12" height="6" rx="2" fill="currentColor" stroke="none"/><rect x="12" y="11" width="16" height="6" rx="2"/><rect x="20" y="19" width="10" height="6" rx="2"/>',
 org:'<rect x="12" y="1" width="10" height="7" rx="2"/><rect x="1" y="19" width="9" height="7" rx="2"/><rect x="12.5" y="19" width="9" height="7" rx="2"/><rect x="24" y="19" width="9" height="7" rx="2"/><path d="M17 8v5M5.5 19v-6h23v6M17 13v6"/>',
 journey:'<path d="M2 18C7 18 8 6 13 6s6 16 11 16 5-10 8-10"/><circle cx="13" cy="6" r="2.5" fill="currentColor"/><circle cx="24" cy="22" r="2.5" fill="currentColor"/>',
 matrix:'<rect x="1" y="2" width="32" height="24" rx="3"/><path d="M1 9h32M12 2v24M23 2v24"/><circle cx="17.5" cy="15" r="2" fill="currentColor"/><circle cx="28" cy="20" r="2" fill="currentColor"/>'};

/* the fourteen kinds from dataviz/diagrams-more.js bring their own starter, icon and editor schema */
const MORE=Diagrams.more||{};for(const k in MORE){STARTERS[k]={title:MORE[k].starter.title,subtitle:MORE[k].starter.subtitle,data:MORE[k].starter.data};KINDHELP[k]=MORE[k].hint+'.';ICON[k]=MORE[k].icon;}
const load=()=>{try{return JSON.parse(store.get('state')||'null');}catch{return null;}};
const S=Object.assign({kind:'roadmap',style:'workflow',docs:{},zoom:1,x:0,y:0,last:null},load()||{});
for(const k in STARTERS)if(!S.docs[k])S.docs[k]=JSON.parse(JSON.stringify(STARTERS[k]));
const save=()=>store.set('state',JSON.stringify({kind:S.kind,style:S.style,docs:S.docs}));
const doc=()=>S.docs[S.kind],D=()=>doc().data;

/* kinds + styles */
function drawKinds(){$('kinds').innerHTML=Diagrams.KINDS.map(k=>`<button class="type" data-kind="${k.id}" aria-pressed="${k.id===S.kind}" title="${esc(k.hint)}"><svg viewBox="0 0 34 28" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">${ICON[k.id]}</svg><b>${k.name}</b><span>${k.hint}</span></button>`).join('');$('why').textContent=KINDHELP[S.kind];}
$('kinds').onclick=e=>{const b=e.target.closest('[data-kind]');if(!b)return;S.kind=b.dataset.kind;drawKinds();drawEditor();syncTitle();render(true);commit();};
const chipHTML=st=>`<button class="chip" data-style="${st.id}" aria-pressed="${st.id===S.style}" title="${st.kicker}"><span class="sw" style="background:${st.t.bg.startsWith('#')?st.t.bg:'#0B0F1A'}"><i style="background:${st.t.accent}"></i></span>${st.name}</button>`;
$('styles').innerHTML=`<span class="lbl">Your brand</span>${DVStyles.filter(s=>s.brand).map(chipHTML).join('')}<span class="lbl">From your board</span>${DVStyles.filter(s=>s.board).map(chipHTML).join('')}<span class="lbl">Researched</span>${DVStyles.filter(s=>!s.board&&!s.brand).map(chipHTML).join('')}`;
$('styles').onclick=e=>{const b=e.target.closest('[data-style]');if(!b)return;S.style=b.dataset.style;$('styles').querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(c===b)));render(true);};
$('guideLink')&&($('guideLink').href='chart-styles.html#s='+S.style);
function syncTitle(){$('title').value=doc().title||'';$('subtitle').value=doc().subtitle||'';}
$('title').oninput=()=>{doc().title=$('title').value;later();};$('subtitle').oninput=()=>{doc().subtitle=$('subtitle').value;later();};

/* ---------- editors ---------- */
const opts=(arr,sel,blank)=>(blank?`<option value=""${sel===''||sel==null?' selected':''}>${blank}</option>`:'')+arr.map((p,i)=>`<option value="${i}"${String(sel)===String(i)?' selected':''}>${esc(p)}</option>`).join('');
/* a form built from the kind's schema: fields, then lists of items that can be dragged into a new order */
function fieldHTML(f,val,attrs){const d=D(),lab=esc(f.label),full=f.half?'':' class="full"';val=val??'';
 if(f.type==='textarea')return `<label${full}>${lab}<textarea ${attrs}${f.code?' class="code" style="min-height:150px" spellcheck="false"':''}>${esc(val)}</textarea></label>`;
 if(f.type==='select')return `<label${full}>${lab}<select ${attrs}>${f.options.map(([v,l])=>`<option value="${v}"${String(val)===v?' selected':''}>${esc(l)}</option>`).join('')}</select></label>`;
 if(f.type==='actor'||f.type==='table'){const names=(f.type==='actor'?(d.actors||[]).map(a=>a.name):(d.tables||[]).map(t=>t.name));return `<label${full}>${lab}<select ${attrs}><option value="">—</option>${names.map(n=>`<option${n===val?' selected':''}>${esc(n)}</option>`).join('')}</select></label>`;}
 return `<label${full}>${lab}<input type="${f.type==='number'?'number':'text'}" ${attrs} value="${esc(val)}"></label>`;}
function genEditor(){const k=MORE[S.kind],d=D(),sc=k.schema;let h='';
 if(sc.fields&&!sc.lists)h+=`<div class="flds">${sc.fields.map(f=>fieldHTML(f,d[f.k],`data-gf="${f.k}"`)).join('')}</div>`;
 else if(sc.fields)h+=`<div class="flds">${sc.fields.filter(f=>f.type!=='textarea'||f.code).map(f=>fieldHTML(f,d[f.k],`data-gf="${f.k}"`)).join('')}</div>`;
 (sc.lists||[]).forEach(Ls=>{const arr=d[Ls.k]||[];h+=`<h3>${esc(Ls.label)} <small style="text-transform:none;letter-spacing:0;font-weight:500">drag ⋮⋮ to reorder</small></h3><ul class="list">`+arr.map((it,i)=>`<li class="item" data-drag="${Ls.k}:${i}" data-li="${Ls.k}" data-ix="${i}"><div class="ihead"><button class="drag" type="button" aria-label="Move ${esc(it[Ls.title]||'item')}: drag, or use the up and down arrow keys">⋮⋮</button><span class="ttl" style="flex:1;min-width:0;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it[Ls.title]||'')}</span><button class="x" type="button" data-gdel="${Ls.k}:${i}" aria-label="Remove ${esc(it[Ls.title]||'item')}">×</button></div><div class="flds">${Ls.fields.map(f=>fieldHTML(f,it[f.k],`data-gl="${Ls.k}" data-gi="${i}" data-gk="${f.k}"`)).join('')}</div></li>`).join('')+`</ul>${Ls.max&&arr.length>=Ls.max?'':`<button class="add" type="button" data-gadd="${Ls.k}">+ ${esc(Ls.label.replace(/[,(].*$/,'').replace(/s\s*$/,'').trim()||'Item')}</button>`}`;});
 if(sc.fields&&sc.lists)h+=`<div class="flds">${sc.fields.filter(f=>f.type==='textarea'&&!f.code).map(f=>fieldHTML(f,d[f.k],`data-gf="${f.k}"`)).join('')}</div>`;
 return h;}
function drawEditor(){const d=D(),ed=$('ed');let h='';if(MORE[S.kind]){ed.innerHTML=genEditor();return;}
 if(S.kind==='roadmap'){h+=`<label>Periods, comma separated<input type="text" data-f="periods" value="${esc(d.periods.join(', '))}"></label>
  <label>Today marker<select data-f="today">${opts(d.periods,d.today,'None')}</select></label>
  <h3>Workstreams</h3><ul class="list">${d.lanes.map((l,i)=>`<li class="line"><input type="text" data-lane="${i}" value="${esc(l)}" aria-label="Workstream ${i+1}"><button class="x" data-del-lane="${i}" aria-label="Remove ${esc(l)}">×</button></li>`).join('')}</ul><button class="add" data-add="lane">+ Workstream</button>
  <h3>Items <small style="text-transform:none;letter-spacing:0;font-weight:500">drag ⋮⋮ to reorder</small></h3><ul class="list">${d.items.map((it,i)=>`<li class="item" data-drag="items:${i}"><div class="line" style="grid-template-columns:auto minmax(0,1fr) auto"><button class="drag" type="button" aria-label="Move ${esc(it.label)}: drag, or use the up and down arrow keys">⋮⋮</button><input type="text" data-item="${i}" data-k="label" value="${esc(it.label)}" aria-label="Item name"><button class="x" data-del-item="${i}" aria-label="Remove item">×</button></div>
   <div class="grid2"><label>Workstream<select data-item="${i}" data-k="lane">${opts(d.lanes,it.lane)}</select></label><label>Status<select data-item="${i}" data-k="status">${['planned','doing','done','risk'].map(s=>`<option value="${s}"${it.status===s?' selected':''}>${{planned:'Planned',doing:'In progress',done:'Done',risk:'At risk'}[s]}</option>`).join('')}</select></label>
   <label>From<select data-item="${i}" data-k="start">${opts(d.periods,it.start)}</select></label><label>To<select data-item="${i}" data-k="end">${opts(d.periods,it.end)}</select></label></div></li>`).join('')}</ul><button class="add" data-add="item">+ Item</button>
  <h3>Milestones</h3><ul class="list">${(d.milestones||[]).map((m,i)=>`<li class="line" style="grid-template-columns:minmax(0,1fr) 96px auto"><input type="text" data-ms="${i}" data-k="label" value="${esc(m.label)}" aria-label="Milestone"><select data-ms="${i}" data-k="at" aria-label="When">${opts(d.periods,m.at)}</select><button class="x" data-del-ms="${i}" aria-label="Remove milestone">×</button></li>`).join('')}</ul><button class="add" data-add="ms">+ Milestone</button>`;}
 else if(S.kind==='org'){h+=`<p class="hint">One person per line: <b>Name — Role [Team]</b>. Indent two spaces under the person they report to. Start a line with “Open role” to show a vacancy.</p><textarea class="code" data-f="text" spellcheck="false" aria-label="People">${esc(d.text)}</textarea>`;}
 else if(S.kind==='journey'){h+=`<label>Persona<input type="text" data-f="persona" value="${esc(d.persona||'')}"></label><p class="hint">One idea per line in each box.</p><ul class="list">${d.stages.map((s,i)=>`<li class="item" data-drag="stages:${i}"><div class="stagehd"><button class="drag" type="button" aria-label="Move stage ${esc(s.name)}: drag, or use the up and down arrow keys">⋮⋮</button><input type="text" data-st="${i}" data-k="name" value="${esc(s.name)}" aria-label="Stage name"><button class="x" data-mv-st="${i}" data-d="-1" aria-label="Move stage earlier"${i?'':' disabled'}>↑</button><button class="x" data-mv-st="${i}" data-d="1" aria-label="Move stage later"${i<d.stages.length-1?'':' disabled'}>↓</button><button class="x" data-del-st="${i}" aria-label="Remove stage">×</button></div>
   <label>Doing<textarea data-st="${i}" data-k="doing">${esc(s.doing||'')}</textarea></label><label>Touchpoints<textarea data-st="${i}" data-k="touchpoints">${esc(s.touchpoints||'')}</textarea></label><label>Thinking<textarea data-st="${i}" data-k="thinking">${esc(s.thinking||'')}</textarea></label>
   <div class="feel"><span>Feeling</span><input type="range" min="-2" max="2" step="1" data-st="${i}" data-k="feeling" value="${+s.feeling||0}" aria-label="Feeling from very negative to very positive"><input type="text" data-st="${i}" data-k="feelingNote" value="${esc(s.feelingNote||'')}" placeholder="word" style="width:84px" aria-label="Feeling in a word"></div>

function undo(){if(!hist.past.length)return;hist.future.push(hist.last);hist.last=hist.past.pop();restoreSnap(hist.last);syncUndo();toast('Undone');}
function redo(){if(!hist.future.length)return;hist.past.push(hist.last);hist.last=hist.future.pop();restoreSnap(hist.last);syncUndo();toast('Redone');}

const io=()=>MORE[S.kind]||OLDIO[S.kind];
$('importOpen').onclick=()=>{const k=io();$('impHelp').innerHTML=k.help;$('impBox').value=k.toText(D());$('impDlg').showModal();$('impBox').focus();};
$('impDlg').addEventListener('close',()=>{if($('impDlg').returnValue!=='ok')return;try{const d=io().parse($('impBox').value);{const st=STARTERS[S.kind];/* the starter's title and subtitle describe the starter, not your text */if(st&&doc().title===st.title)doc().title='';if(st&&doc().subtitle===st.subtitle)doc().subtitle='';}doc().data=d;$('title').value=doc().title||'';$('subtitle').value=doc().subtitle||'';drawEditor();render(true);commit();toast('Imported');}catch(err){console.warn(err);toast('Could not read that text: '+(err.message||err));}});
$('exJson').onclick=()=>{DVExport.download(slug()+'.txt',io().toText(D()),'text/plain');toast('Text version downloaded; paste it into Import text to rebuild');};
$('exEmbed').onclick=async()=>{const r=S.last,st=DVStyle(S.style);const fonts=st.fonts&&st.fonts.length?`<link rel="stylesheet" href="https://fonts.googleapis.com/css2?${st.fonts.map(f=>'family='+f).join('&')}&display=swap">\n`:'';
 const svg=r.svg.replace(/<svg([^>]*) width="\d+(\.\d+)?" height="\d+(\.\d+)?"/,'<svg$1 width="100%" style="height:auto;display:block"');const h=`<!-- ${esc(doc().title||S.kind)} · made in Diagram studio -->\n${fonts}<figure style="margin:0;max-width:${r.width}px">\n${svg}\n<details style="margin-top:8px;font:13px system-ui,sans-serif"><summary>Text version</summary><pre style="white-space:pre-wrap">${esc(io().toText(D()))}</pre></details>\n</figure>\n`;
 try{await navigator.clipboard.writeText(h);toast('Embed HTML copied; a file was downloaded too');}catch{}DVExport.download(slug()+'-embed.html',h,'text/html');};
document.addEventListener('click',e=>{document.querySelectorAll('details.menu[open]').forEach(d=>{if(!d.contains(e.target))d.open=false;});if(e.target.closest('.pop button')){const m=e.target.closest('details.menu');if(m&&m.id==='exportMenu')m.open=false;}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('details.menu[open]').forEach(d=>{d.open=false;d.querySelector('summary').focus();});});

/* templates gallery */
let tplKind=null;
function tplItems(k){const m=MORE[k];const list=[{name:'Starter',title:STARTERS[k].title,subtitle:STARTERS[k].subtitle,data:STARTERS[k].data}];if(m&&m.templates)list.push(...m.templates);return list;}
function drawTpl(){const st=DVStyle(S.style);$('tplCats').innerHTML=Diagrams.KINDS.map(k=>`<button type="button" data-tk="${k.id}" aria-pressed="${k.id===tplKind}">${esc(k.name)}</button>`).join('');
 $('tplGrid').innerHTML=tplItems(tplKind).map((t,i)=>{let svg='';try{svg=Diagrams.render(tplKind,JSON.parse(JSON.stringify(t.data)),st,{title:t.title,subtitle:t.subtitle,id:'tp'+i}).svg.replace(/ role="img"/,' aria-hidden="true"');}catch(e){svg='';}
  return `<button type="button" class="tpl-card" data-ti="${i}"><div class="tpl-thumb">${svg}</div><div class="tpl-meta"><b>${esc(t.title||t.name)}</b><span>${esc(Diagrams.KINDS.find(k=>k.id===tplKind).name)} · ${esc(t.name)}</span></div></button>`;}).join('');}
$('tplOpen').onclick=()=>{tplKind=S.kind;drawTpl();$('tpl').showModal();};$('tplClose').onclick=()=>$('tpl').close();
$('tpl').addEventListener('click',e=>{if(e.target===$('tpl'))$('tpl').close();const c=e.target.closest('[data-tk]');if(c){tplKind=c.dataset.tk;drawTpl();return;}const b=e.target.closest('[data-ti]');if(!b)return;const t=tplItems(tplKind)[+b.dataset.ti];
 S.kind=tplKind;S.docs[S.kind]={title:t.title||'',subtitle:t.subtitle||'',data:JSON.parse(JSON.stringify(t.data))};$('tpl').close();drawKinds();syncTitle();drawEditor();render(true);commit();toast('Template loaded: '+(t.title||t.name));});

/* drafts and share links */
const b64u={enc:bytes=>{let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');},dec:str=>Uint8Array.from(atob(str.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))};
async function pack(o){const json=new TextEncoder().encode(JSON.stringify(o));if(window.CompressionStream){try{const buf=await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();return 'z.'+b64u.enc(new Uint8Array(buf));}catch{}}return 'j.'+b64u.enc(json);}
async function unpack(tok){const bytes=b64u.dec(tok.slice(2));if(tok[0]==='z'){const buf=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();return JSON.parse(new TextDecoder().decode(buf));}return JSON.parse(new TextDecoder().decode(bytes));}
$('share').onclick=async()=>{const tok=await pack({kind:S.kind,style:S.style,doc:doc()});history.replaceState(null,'','#d='+tok);const url=location.href;try{await navigator.clipboard.writeText(url);toast('Link copied: it opens this exact diagram');}catch{toast('Link is in the address bar; copy it from there');}};
const drafts=()=>{try{return JSON.parse(store.get('drafts')||'[]');}catch{return [];}};
function drawDrafts(){const d=drafts();$('drafts').innerHTML=`<button type="button" data-save>Save this diagram as a draft</button>${d.length?'<hr>':''}${d.map((x,i)=>`<div class="drow"><button type="button" data-load="${i}"><span>${esc(x.name)}</span><small>${esc((Diagrams.KINDS.find(k=>k.id===x.kind)||{}).name||'')}</small></button><button type="button" data-deld="${i}" aria-label="Delete draft ${esc(x.name)}">×</button></div>`).join('')}`;}
$('draftsMenu').addEventListener('toggle',()=>{if($('draftsMenu').open)drawDrafts();});
$('drafts').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=drafts();
 if(b.hasAttribute('data-save')){const name=(doc().title||(Diagrams.KINDS.find(k=>k.id===S.kind)||{}).name||'Diagram').slice(0,60);const i=d.findIndex(x=>x.name===name&&x.kind===S.kind);const it={name,kind:S.kind,style:S.style,ts:Date.now(),doc:JSON.parse(JSON.stringify(doc()))};if(i>=0)d[i]=it;else d.unshift(it);
  try{localStorage.setItem('dgs:drafts',JSON.stringify(d.slice(0,40)));toast('Draft saved: '+name);}catch{toast('Could not save: browser storage is full or blocked');}}
 else if(b.dataset.load!=null){const x=d[+b.dataset.load];S.kind=x.kind;S.style=x.style||S.style;S.docs[x.kind]=JSON.parse(JSON.stringify(x.doc));$('draftsMenu').open=false;$('styles').querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.style===S.style)));drawKinds();syncTitle();drawEditor();render(true);commit();toast('Draft opened');return;}
 else if(b.dataset.deld!=null){d.splice(+b.dataset.deld,1);try{localStorage.setItem('dgs:drafts',JSON.stringify(d));}catch{}}
 drawDrafts();});

/* animation */
let play=null;
function stopPlay(){if(!play)return;cancelAnimationFrame(play.raf);play.P.reset();play=null;$('mvPlay').querySelector('span').textContent='Play';}
$('mvPlay').onclick=()=>{if(play){stopPlay();return;}const el=paper.querySelector('svg');if(!el)return;const P=FlowReveal.plan(el,{order:order(),speed:+$('mvSpeed').value});P.apply(0);const t0=performance.now();play={P,raf:0};$('mvPlay').querySelector('span').textContent='Stop';
 const tick=now=>{if(!play)return;const t=now-t0;P.apply(t);if(t>=P.duration+600){stopPlay();return;}play.raf=requestAnimationFrame(tick);};play.raf=requestAnimationFrame(tick);};
const busy=on=>{['mvPlay','mvVideo','mvGif'].forEach(id=>$(id).disabled=on);if(!on)setTimeout(()=>{$('mvProg').textContent='';},2500);};
const animOpts=()=>({svgEl:paper.querySelector('svg'),width:S.last.width,height:S.last.height,style:DVStyle(S.style),order:order(),speed:+$('mvSpeed').value,onProgress:p=>{$('mvProg').textContent=`Rendering ${Math.round(p*100)}%`;}});
$('mvVideo').onclick=async()=>{stopPlay();busy(true);try{const {blob,ext}=await DVExport.video(animOpts());DVExport.download(slug()+'-build.'+ext,blob);$('mvProg').textContent='Done';toast(ext==='mp4'?'MP4 downloaded':'WebM downloaded (this browser has no H.264 encoder)');}catch(err){console.error(err);toast('Video export failed: '+(err.message||err));}finally{busy(false);}};
$('mvGif').onclick=async()=>{stopPlay();busy(true);try{DVExport.download(slug()+'-build.gif',await DVExport.gif(animOpts()));$('mvProg').textContent='Done';toast('GIF downloaded');}catch(err){console.error(err);toast('GIF export failed: '+(err.message||err));}finally{busy(false);}};

/* start: #roadmap, #org, #journey or #matrix picks the kind */
const h=location.hash.slice(1);if(Diagrams.KINDS.some(k=>k.id===h))S.kind=h;
window.DiagramStudio={get state(){return S;},get last(){return S.last;},set(p){if(p.kind)S.kind=p.kind;if(p.style)S.style=p.style;if(p.data)S.docs[S.kind].data=p.data;$('styles').querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.style===S.style)));drawKinds();syncTitle();drawEditor();render(true);commit();return S.last;},selectRef,moveItem,io,pack,unpack};
if(/^d=[zj]\./.test(h)){unpack(h.slice(2)).then(o=>{if(!o||!o.doc||!Diagrams.KINDS.some(k=>k.id===o.kind))throw new Error('bad link');S.kind=o.kind;if(DVStyles.some(s=>s.id===o.style))S.style=o.style;S.docs[o.kind]=o.doc;$('styles').querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.style===S.style)));drawKinds();syncTitle();drawEditor();render(true);hist.last=snap();toast('Opened the shared diagram');}).catch(err=>{console.warn(err);toast('That share link could not be read');});}
if(!DVStyles.some(s=>s.id===S.style))S.style='workflow';$('styles').querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.style===S.style)));
drawKinds();syncTitle();drawEditor();render(true);commit();document.fonts?.ready.then(()=>setTimeout(()=>render(false),60));
$('styles').querySelector('[aria-pressed=true]')?.scrollIntoView({block:'nearest',inline:'center'});
})();
</script>
<script src="studio-tabs.js"></script>
</body></html>
