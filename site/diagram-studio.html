<style>

.main{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}

.tpl-card{display:grid;text-align:left;border:1px solid var(--hair);background:var(--panel);border-radius:14px;padding:0;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
.tpl-card:hover,.tpl-card:focus-visible{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#CBD0DB}
.tpl-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tpl-thumb{height:170px;display:grid;place-items:start center;padding:10px 10px 0;background:var(--soft);border-bottom:1px solid var(--hair);overflow:hidden}

.tpl-meta{padding:10px 12px 12px;display:grid;gap:3px}

.tpl-meta span{font-size:11.5px;color:var(--mute)}
.fe{display:grid;gap:10px}
.fe-stage{border:1px solid var(--hair);border-radius:12px;background:var(--soft);padding:8px}
.fe-head{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.fe-num{font:700 10.5px/1 'JetBrains Mono',ui-monospace,monospace;color:var(--mute);letter-spacing:.06em;padding:0 4px}

.fe-more{display:grid;gap:8px;margin:8px 6px 2px;padding-top:8px;border-top:1px solid var(--hair)}
.fe-f{display:grid;gap:4px;font-size:11.5px;color:var(--mute)}
.fe-f input,.fe-f select,.fe-links input,.fe-links select{min-width:0;border:1px solid var(--hair);border-radius:8px;padding:6px 8px;background:var(--panel);font-size:12.5px}

.fe-acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fe-btn{border:1px solid var(--hair);background:var(--panel);border-radius:8px;min-height:32px;padding:0 10px;font-size:12px;font-weight:550;cursor:pointer}
.fe-btn:hover{border-color:#CBD0DB}.fe-btn.danger{color:#C02F2F}
.fe-add{width:100%;margin-top:6px;border:1px dashed #CBD0DB;background:none;border-radius:9px;min-height:34px;font-size:12.5px;color:var(--mute);cursor:pointer}
.fe-add:hover{color:var(--ink);border-color:var(--ink)}
.fe-foot{padding-top:2px}
.fe-hint{margin:8px 0 0;font-size:12px;color:var(--mute)}
.fe-err{font-size:12.5px;color:#C02F2F}
.fe :focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.type{position:relative;display:grid;grid-template-columns:34px 1fr;gap:2px 8px;align-items:center;text-align:left;padding:8px;border-radius:10px;border:1px solid var(--hair);background:var(--panel);min-height:52px}

<div class="app">
 <header>

  </div>
  <div class="sec">
   <h2>Style</h2>

  <div class="sec">

 </aside>
 <main class="main">

   <div class="zoom"><button id="zOut" aria-label="Zoom out">−</button><output id="zVal">100%</output><button id="zIn" aria-label="Zoom in">+</button><button id="zFit" aria-label="Fit to screen">Fit</button></div>
  </div>
 </main>

<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem('dgs:'+k);}catch{return null;}},set(k,v){try{localStorage.setItem('dgs:'+k,v);}catch{}}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1800);};

/* starter content, themed on the AI cooking channel */
const STARTERS={
 roadmap:{title:'AI cooking channel · launch roadmap',subtitle:'Six months, four workstreams',data:{periods:['Nov','Dec','Jan','Feb','Mar','Apr'],today:'0',lanes:['Pipeline','Content','Growth','Money'],
  items:[{label:'Photoreal identity locked',lane:0,start:0,end:0,status:'doing',progress:.6},{label:'Video model + upscaler',lane:0,start:0,end:1,status:'planned'},{label:'Render + approval gate',lane:0,start:1,end:2,status:'planned'},{label:'Scheduler',lane:0,start:2,end:2,status:'planned'},
   {label:'Pilot: 4 episodes',lane:1,start:1,end:2,status:'planned'},{label:'Weekly episodes',lane:1,start:3,end:5,status:'planned'},{label:'Chef roster (4 chefs)',lane:1,start:0,end:0,status:'done'},
   {label:'Shorts cut-downs',lane:2,start:2,end:5,status:'planned'},{label:'Community replies',lane:2,start:3,end:5,status:'planned'},{label:'Analytics: what lands',lane:2,start:3,end:4,status:'risk'},
   {label:'YPP threshold',lane:3,start:4,end:5,status:'planned'},{label:'First brand deal',lane:3,start:5,end:5,status:'planned'}],
  milestones:[{label:'Pilot live',at:'2'},{label:'Monetised',at:'5'}]}},
 org:{title:'Channel team',subtitle:'Who owns what',data:{text:`Ava Reyes — Founder, creative director
  Sam Okafor — Producer [Production]
    Lena Park — AI video lead [Production]
    Marco Diaz — Editor + colourist [Production]
    Open role — Sound designer [Production]
  Priya Shah — Head of growth [Growth]
    Tom Becker — Shorts editor [Growth]
    Open role — Community manager [Growth]
    Jade Wu — Analyst [Growth]
    Noor Haddad — Partnerships [Growth]
    Ben Cole — Social producer [Growth]
  Kai Mensah — Recipe researcher [Content]`}},
 journey:{title:'Viewer journey',subtitle:'From first scroll to regular viewer',data:{persona:'Home cook, 28, watches food Shorts on the commute',stages:[
  {name:'Discover',doing:'Scrolls Shorts\nStops on a sizzling close-up',touchpoints:'Shorts feed; TikTok For You',thinking:'That looks unreal, is it AI?',feeling:1,feelingNote:'curious',pains:'Unsure if the recipe is real',ideas:'Show the real recipe card in the first 3 s'},
  {name:'Watch',doing:'Watches the full episode\nRewinds the plating',touchpoints:'YouTube long-form',thinking:'The chef has a personality',feeling:2,feelingNote:'hooked',pains:'Episode runs long in the middle',ideas:'Tighter cut; chapter markers'},
  {name:'Try',doing:'Looks for the recipe\nCooks it at the weekend',touchpoints:'Description; pinned comment',thinking:'Where are the exact amounts?',feeling:-1,feelingNote:'stuck',pains:'Amounts only in the video',ideas:'Printable recipe page per episode'},
  {name:'Share',doing:'Posts their attempt\nTags the channel',touchpoints:'Comments; Instagram',thinking:'Will they notice mine?',feeling:0,feelingNote:'hopeful',pains:'No replies to fan posts',ideas:'Weekly fan-dish round-up'},
  {name:'Return',doing:'Subscribes\nTurns on notifications',touchpoints:'Subscriptions feed',thinking:'Same chef, new dish every week',feeling:2,feelingNote:'loyal',pains:'Irregular upload days',ideas:'Fixed weekly slot per chef'}]}},
 matrix:{title:'How should we publish?',subtitle:'Three set-ups for posting to YouTube, TikTok and Instagram',data:{columns:[{name:'Post by hand',note:'Today'},{name:'Scheduler tool',note:'Monthly fee',pick:true},{name:'Custom pipeline',note:'Built in-house'}],
  rows:[{group:'Effort'},{label:'Time per week',cells:['3–4 h','30 min','10 min']},{label:'Set-up time',cells:['None','An afternoon','2–3 weeks']},
   {group:'Reach'},{label:'All three platforms',cells:['yes','yes','yes']},{label:'Platform-specific captions',cells:['yes','yes','partial']},{label:'Best-time posting',cells:['no','yes','partial']},
   {group:'Learning'},{label:'Analytics in one place',cells:['no','partial','yes']},{label:'Feeds the what-worked memory',cells:['no','no','yes']},
   {group:'Cost'},{label:'Monthly cost',cells:['£0','£15–40','Hosting only']}]}}};
const KINDHELP={roadmap:'Workstreams over time: what happens when, what is done, what is at risk.',org:'Who reports to whom. Big teams of individual contributors stack in a column so the chart stays readable.',journey:'One customer’s experience, stage by stage: what they do, think and feel, where it hurts and what to fix.',matrix:'Options side by side against the same criteria, with the recommendation marked so readers get the answer first.'};
const ICON={roadmap:'<path d="M1 6h32M1 14h32M1 22h32"/><rect x="3" y="3" width="12" height="6" rx="2" fill="currentColor" stroke="none"/><rect x="12" y="11" width="16" height="6" rx="2"/><rect x="20" y="19" width="10" height="6" rx="2"/>',
 org:'<rect x="12" y="1" width="10" height="7" rx="2"/><rect x="1" y="19" width="9" height="7" rx="2"/><rect x="12.5" y="19" width="9" height="7" rx="2"/><rect x="24" y="19" width="9" height="7" rx="2"/><path d="M17 8v5M5.5 19v-6h23v6M17 13v6"/>',
 journey:'<path d="M2 18C7 18 8 6 13 6s6 16 11 16 5-10 8-10"/><circle cx="13" cy="6" r="2.5" fill="currentColor"/><circle cx="24" cy="22" r="2.5" fill="currentColor"/>',
 matrix:'<rect x="1" y="2" width="32" height="24" rx="3"/><path d="M1 9h32M12 2v24M23 2v24"/><circle cx="17.5" cy="15" r="2" fill="currentColor"/><circle cx="28" cy="20" r="2" fill="currentColor"/>'};

const load=()=>{try{return JSON.parse(store.get('state')||'null');}catch{return null;}};
const S=Object.assign({kind:'roadmap',style:'workflow',docs:{},zoom:1,x:0,y:0,last:null},load()||{});
for(const k in STARTERS)if(!S.docs[k])S.docs[k]=JSON.parse(JSON.stringify(STARTERS[k]));
const save=()=>store.set('state',JSON.stringify({kind:S.kind,style:S.style,docs:S.docs}));
const doc=()=>S.docs[S.kind],D=()=>doc().data;

/* kinds + styles */
function drawKinds(){$('kinds').innerHTML=Diagrams.KINDS.map(k=>`<button class="type" data-kind="${k.id}" aria-pressed="${k.id===S.kind}"><svg viewBox="0 0 34 28" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">${ICON[k.id]}</svg><b>${k.name}</b><span>${k.hint}</span></button>`).join('');$('why').textContent=KINDHELP[S.kind];}
$('kinds').onclick=e=>{const b=e.target.closest('[data-kind]');if(!b)return;S.kind=b.dataset.kind;drawKinds();drawEditor();syncTitle();render(true);};
const chipHTML=st=>`<button class="chip" data-style="${st.id}" aria-pressed="${st.id===S.style}" title="${st.kicker}"><span class="sw" style="background:${st.t.bg.startsWith('#')?st.t.bg:'#0B0F1A'}"><i style="background:${st.t.accent}"></i></span>${st.name}</button>`;
$('styles').innerHTML=`<span class="lbl">From your board</span>${DVStyles.filter(s=>s.board).map(chipHTML).join('')}<span class="lbl">Researched</span>${DVStyles.filter(s=>!s.board).map(chipHTML).join('')}`;
$('styles').onclick=e=>{const b=e.target.closest('[data-style]');if(!b)return;S.style=b.dataset.style;$('styles').querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(c===b)));render(true);};
function syncTitle(){$('title').value=doc().title||'';$('subtitle').value=doc().subtitle||'';}
$('title').oninput=()=>{doc().title=$('title').value;later();};$('subtitle').oninput=()=>{doc().subtitle=$('subtitle').value;later();};

/* ---------- editors ---------- */
const opts=(arr,sel,blank)=>(blank?`<option value=""${sel===''||sel==null?' selected':''}>${blank}</option>`:'')+arr.map((p,i)=>`<option value="${i}"${String(sel)===String(i)?' selected':''}>${esc(p)}</option>`).join('');
function drawEditor(){const d=D(),ed=$('ed');let h='';
 if(S.kind==='roadmap'){h+=`<label>Periods, comma separated<input type="text" data-f="periods" value="${esc(d.periods.join(', '))}"></label>
  <label>Today marker<select data-f="today">${opts(d.periods,d.today,'None')}</select></label>
  <h3>Workstreams</h3><ul class="list">${d.lanes.map((l,i)=>`<li class="line"><input type="text" data-lane="${i}" value="${esc(l)}" aria-label="Workstream ${i+1}"><button class="x" data-del-lane="${i}" aria-label="Remove ${esc(l)}">×</button></li>`).join('')}</ul><button class="add" data-add="lane">+ Workstream</button>
  <h3>Items</h3><ul class="list">${d.items.map((it,i)=>`<li class="item"><div class="line"><input type="text" data-item="${i}" data-k="label" value="${esc(it.label)}" aria-label="Item name"><button class="x" data-del-item="${i}" aria-label="Remove item">×</button></div>
   <div class="grid2"><label>Workstream<select data-item="${i}" data-k="lane">${opts(d.lanes,it.lane)}</select></label><label>Status<select data-item="${i}" data-k="status">${['planned','doing','done','risk'].map(s=>`<option value="${s}"${it.status===s?' selected':''}>${{planned:'Planned',doing:'In progress',done:'Done',risk:'At risk'}[s]}</option>`).join('')}</select></label>
   <label>From<select data-item="${i}" data-k="start">${opts(d.periods,it.start)}</select></label><label>To<select data-item="${i}" data-k="end">${opts(d.periods,it.end)}</select></label></div></li>`).join('')}</ul><button class="add" data-add="item">+ Item</button>
  <h3>Milestones</h3><ul class="list">${(d.milestones||[]).map((m,i)=>`<li class="line" style="grid-template-columns:minmax(0,1fr) 96px auto"><input type="text" data-ms="${i}" data-k="label" value="${esc(m.label)}" aria-label="Milestone"><select data-ms="${i}" data-k="at" aria-label="When">${opts(d.periods,m.at)}</select><button class="x" data-del-ms="${i}" aria-label="Remove milestone">×</button></li>`).join('')}</ul><button class="add" data-add="ms">+ Milestone</button>`;}
 else if(S.kind==='org'){h+=`<p class="hint">One person per line: <b>Name — Role [Team]</b>. Indent two spaces under the person they report to. Start a line with “Open role” to show a vacancy.</p><textarea class="code" data-f="text" spellcheck="false" aria-label="People">${esc(d.text)}</textarea>`;}
 else if(S.kind==='journey'){h+=`<label>Persona<input type="text" data-f="persona" value="${esc(d.persona||'')}"></label><p class="hint">One idea per line in each box.</p><ul class="list">${d.stages.map((s,i)=>`<li class="item"><div class="stagehd"><input type="text" data-st="${i}" data-k="name" value="${esc(s.name)}" aria-label="Stage name"><button class="x" data-mv-st="${i}" data-d="-1" aria-label="Move stage earlier"${i?'':' disabled'}>↑</button><button class="x" data-mv-st="${i}" data-d="1" aria-label="Move stage later"${i<d.stages.length-1?'':' disabled'}>↓</button><button class="x" data-del-st="${i}" aria-label="Remove stage">×</button></div>
   <label>Doing<textarea data-st="${i}" data-k="doing">${esc(s.doing||'')}</textarea></label><label>Touchpoints<textarea data-st="${i}" data-k="touchpoints">${esc(s.touchpoints||'')}</textarea></label><label>Thinking<textarea data-st="${i}" data-k="thinking">${esc(s.thinking||'')}</textarea></label>
   <div class="feel"><span>Feeling</span><input type="range" min="-2" max="2" step="1" data-st="${i}" data-k="feeling" value="${+s.feeling||0}" aria-label="Feeling from very negative to very positive"><input type="text" data-st="${i}" data-k="feelingNote" value="${esc(s.feelingNote||'')}" placeholder="word" style="width:84px" aria-label="Feeling in a word"></div>
   <label>Pain points<textarea data-st="${i}" data-k="pains">${esc(s.pains||'')}</textarea></label><label>Opportunities<textarea data-st="${i}" data-k="ideas">${esc(s.ideas||'')}</textarea></label></li>`).join('')}</ul><button class="add" data-add="stage">+ Stage</button>`;}
 else if(S.kind==='matrix'){h+=`<h3>Options</h3><ul class="list">${d.columns.map((c,i)=>`<li class="item"><div class="line"><input type="text" data-col="${i}" data-k="name" value="${esc(c.name)}" aria-label="Option name"><button class="x" data-del-col="${i}" aria-label="Remove option">×</button></div><div class="grid2"><input type="text" data-col="${i}" data-k="note" value="${esc(c.note||'')}" placeholder="Short note" aria-label="Note"><label style="display:flex;gap:6px;align-items:center;font-size:12.5px"><input type="radio" name="pick" data-pick="${i}"${c.pick?' checked':''}> Recommend</label></div></li>`).join('')}</ul><button class="add" data-add="col">+ Option</button>
  <h3>Criteria <small style="text-transform:none;letter-spacing:0;font-weight:500">yes · no · partial · or any text</small></h3><div class="mx"><table><thead><tr><th>Criterion</th>${d.columns.map(c=>`<th>${esc(c.name)}</th>`).join('')}<th></th></tr></thead><tbody>${d.rows.map((r,i)=>r.group!=null?`<tr class="grp"><td colspan="${d.columns.length+1}"><input type="text" data-row="${i}" data-k="group" value="${esc(r.group)}" aria-label="Group heading"></td><td><button class="x" data-del-row="${i}" aria-label="Remove group">×</button></td></tr>`:`<tr><td><input type="text" data-row="${i}" data-k="label" value="${esc(r.label)}" aria-label="Criterion"></td>${d.columns.map((c,j)=>`<td><input type="text" data-cell="${i}" data-j="${j}" value="${esc((r.cells||[])[j]??'')}" aria-label="${esc(r.label)} for ${esc(c.name)}"></td>`).join('')}<td><button class="x" data-del-row="${i}" aria-label="Remove criterion">×</button></td></tr>`).join('')}</tbody></table></div>
  <div class="grid2"><button class="add" data-add="row">+ Criterion</button><button class="add" data-add="group">+ Group heading</button></div>`;}
 ed.innerHTML=h;}
const ed=$('ed');
ed.addEventListener('input',e=>{const el=e.target,d=D(),v=el.value;
 if(el.dataset.f==='periods'){d.periods=v.split(',').map(x=>x.trim()).filter(Boolean);}
 else if(el.dataset.f)d[el.dataset.f]=v;
 else if(el.dataset.lane!=null)d.lanes[+el.dataset.lane]=v;
 else if(el.dataset.item!=null){const it=d.items[+el.dataset.item],k=el.dataset.k;it[k]=['lane','start','end'].includes(k)?+v:v;}
 else if(el.dataset.ms!=null)d.milestones[+el.dataset.ms][el.dataset.k]=v;
 else if(el.dataset.st!=null){const s=d.stages[+el.dataset.st];s[el.dataset.k]=el.dataset.k==='feeling'?+v:v;}
 else if(el.dataset.col!=null)d.columns[+el.dataset.col][el.dataset.k]=v;
 else if(el.dataset.row!=null)d.rows[+el.dataset.row][el.dataset.k]=v;
 else if(el.dataset.cell!=null){const r=d.rows[+el.dataset.cell];r.cells=r.cells||[];r.cells[+el.dataset.j]=v;}
 else return;later();});
ed.addEventListener('change',e=>{const el=e.target,d=D();if(el.dataset.pick!=null){d.columns.forEach((c,i)=>c.pick=i===+el.dataset.pick);later();}
 if(el.dataset.f==='periods'||(el.dataset.lane!=null)||(el.dataset.col!=null&&el.dataset.k==='name'))drawEditor();});
ed.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=D(),a=b.dataset;let focus=null;
 if(a.add==='lane'){d.lanes.push('New workstream');focus='[data-lane]:last-of-type';}
 else if(a.add==='item'){d.items.push({label:'New item',lane:0,start:0,end:0,status:'planned'});focus='[data-item][data-k=label]';}
 else if(a.add==='ms'){(d.milestones=d.milestones||[]).push({label:'Milestone',at:0});}
 else if(a.add==='stage'){d.stages.push({name:'New stage',doing:'',touchpoints:'',thinking:'',feeling:0,pains:'',ideas:''});}
 else if(a.add==='col'){d.columns.push({name:'Option '+(d.columns.length+1)});d.rows.forEach(r=>{if(r.cells)r.cells.push('');});}
 else if(a.add==='row'){d.rows.push({label:'New criterion',cells:d.columns.map(()=>'')});}
 else if(a.add==='group'){d.rows.push({group:'Group'});}
 else if(a.delLane!=null){const i=+a.delLane;if(d.lanes.length<2)return toast('Keep at least one workstream');d.lanes.splice(i,1);d.items=d.items.filter(it=>it.lane!==i).map(it=>({...it,lane:it.lane>i?it.lane-1:it.lane}));}
 else if(a.delItem!=null)d.items.splice(+a.delItem,1);
 else if(a.delMs!=null)d.milestones.splice(+a.delMs,1);
 else if(a.delSt!=null){if(d.stages.length<2)return toast('Keep at least one stage');d.stages.splice(+a.delSt,1);}
 else if(a.mvSt!=null){const i=+a.mvSt,j=i+(+a.d);[d.stages[i],d.stages[j]]=[d.stages[j],d.stages[i]];}
 else if(a.delCol!=null){if(d.columns.length<2)return toast('Keep at least one option');const i=+a.delCol;d.columns.splice(i,1);d.rows.forEach(r=>{if(r.cells)r.cells.splice(i,1);});}
 else if(a.delRow!=null)d.rows.splice(+a.delRow,1);
 else return;drawEditor();render(false);if(focus){const els=ed.querySelectorAll(focus.replace(':last-of-type',''));const el=els[els.length-1];if(el){el.focus();el.select&&el.select();}}});

/* ---------- render ---------- */
let timer=0;const later=()=>{clearTimeout(timer);timer=setTimeout(()=>render(false),160);};
const order=()=>(Diagrams.KINDS.find(k=>k.id===S.kind)||{}).order||'y';
const loadedFonts=new Set();
function render(fit){stopPlay();const st=DVStyle(S.style);DVFonts(st);
 if(!loadedFonts.has(st.id)&&document.fonts){loadedFonts.add(st.id);const fam=st.t.font.split(',')[0],hd=st.t.head.split(',')[0];Promise.all([document.fonts.load(`600 14px ${fam}`),document.fonts.load(`400 12px ${fam}`),document.fonts.load(`600 20px ${hd}`)]).then(()=>render(false)).catch(()=>{});}
 let r;try{r=Diagrams.render(S.kind,D(),st,{title:(doc().title||'').trim(),subtitle:(doc().subtitle||'').trim(),id:'dg'});}catch(err){console.error(err);$('notes').innerHTML=`<li class="warn">Could not draw that: ${esc(err.message||err)}</li>`;return;}
 S.last=r;$('paper').innerHTML=r.svg;$('paper').style.width=r.width+'px';$('paper').style.height=r.height+'px';
 $('notes').innerHTML=(r.notes||[]).map(n=>`<li class="${n.ok?'':'warn'}">${esc(n.text)}</li>`).join('');
 $('styleinfo').innerHTML=`<b>${st.name}</b><span style="display:block;color:var(--mute);font-size:11.5px;margin-bottom:4px">${st.kicker}</span><span>${st.blurb}</span>`;
 save();if(fit)fitView();else apply();}

/* pan and zoom */
const stage=$('stage'),paper=$('paper');
function apply(){paper.style.transform=`translate(${S.x}px,${S.y}px) scale(${S.zoom})`;$('zVal').textContent=Math.round(S.zoom*100)+'%';}
function fitView(){const r=S.last;if(!r)return;const W=stage.clientWidth,H=stage.clientHeight,pad=40;const all=Math.min((W-pad*2)/r.width,(H-pad*2-40)/r.height);S.zoom=Math.min(1.25,Math.max(.15,Math.min((W-pad*2)/r.width,Math.max(all,.62))));S.x=(W-r.width*S.zoom)/2;S.y=r.height*S.zoom>H-pad*2-40?pad:Math.max(pad,(H-40-r.height*S.zoom)/2);apply();}
function zoomAt(k,cx,cy){const z=Math.min(3,Math.max(.12,S.zoom*k));S.x=cx-(cx-S.x)*(z/S.zoom);S.y=cy-(cy-S.y)*(z/S.zoom);S.zoom=z;apply();}
stage.addEventListener('wheel',e=>{if(!(e.ctrlKey||e.metaKey)){S.x-=e.deltaX;S.y-=e.deltaY;apply();e.preventDefault();return;}e.preventDefault();const b=stage.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0022),e.clientX-b.left,e.clientY-b.top);},{passive:false});
let drag=null;stage.addEventListener('pointerdown',e=>{if(e.target.closest('.zoom,.motion'))return;drag={x:e.clientX,y:e.clientY,sx:S.x,sy:S.y};stage.classList.add('drag');stage.setPointerCapture(e.pointerId);});
stage.addEventListener('pointermove',e=>{if(!drag)return;S.x=drag.sx+e.clientX-drag.x;S.y=drag.sy+e.clientY-drag.y;apply();});
stage.addEventListener('pointerup',()=>{drag=null;stage.classList.remove('drag');});
$('zIn').onclick=()=>zoomAt(1.2,stage.clientWidth/2,stage.clientHeight/2);$('zOut').onclick=()=>zoomAt(1/1.2,stage.clientWidth/2,stage.clientHeight/2);$('zFit').onclick=fitView;
addEventListener('resize',()=>fitView());

/* exports */
const slug=()=>((doc().title||S.kind).trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''))||S.kind;
$('exSvg').onclick=async()=>{DVExport.download(slug()+'.svg',await DVExport.svgWithFonts(S.last.svg,DVStyle(S.style)),'image/svg+xml');toast('SVG downloaded with fonts embedded');};
$('exPng').onclick=async()=>{try{DVExport.download(slug()+'.png',await DVExport.png(S.last.svg,S.last.width,S.last.height,DVStyle(S.style)));toast('PNG downloaded at 2×');}catch{toast('PNG export failed in this browser; use SVG');}};
$('exCopy').onclick=async()=>{try{await navigator.clipboard.writeText(S.last.svg);toast('SVG copied');}catch{toast('Copy was blocked by the browser');}};
$('exReset').onclick=()=>{S.docs[S.kind]=JSON.parse(JSON.stringify(STARTERS[S.kind]));syncTitle();drawEditor();render(true);toast('Back to the starter '+(Diagrams.KINDS.find(k=>k.id===S.kind)||{}).name.toLowerCase());};

/* animation */
let play=null;
function stopPlay(){if(!play)return;cancelAnimationFrame(play.raf);play.P.reset();play=null;$('mvPlay').querySelector('span').textContent='Play';}
$('mvPlay').onclick=()=>{if(play){stopPlay();return;}const el=paper.querySelector('svg');if(!el)return;const P=FlowReveal.plan(el,{order:order(),speed:+$('mvSpeed').value});P.apply(0);const t0=performance.now();play={P,raf:0};$('mvPlay').querySelector('span').textContent='Stop';
 const tick=now=>{if(!play)return;const t=now-t0;P.apply(t);if(t>=P.duration+600){stopPlay();return;}play.raf=requestAnimationFrame(tick);};play.raf=requestAnimationFrame(tick);};
const busy=on=>{['mvPlay','mvVideo','mvGif'].forEach(id=>$(id).disabled=on);if(!on)setTimeout(()=>{$('mvProg').textContent='';},2500);};
const animOpts=()=>({svgEl:paper.querySelector('svg'),width:S.last.width,height:S.last.height,style:DVStyle(S.style),order:order(),speed:+$('mvSpeed').value,onProgress:p=>{$('mvProg').textContent=`Rendering ${Math.round(p*100)}%`;}});
$('mvVideo').onclick=async()=>{stopPlay();busy(true);try{const {blob,ext}=await DVExport.video(animOpts());DVExport.download(slug()+'-build.'+ext,blob);$('mvProg').textContent='Done';toast(ext==='mp4'?'MP4 downloaded':'WebM downloaded (this browser has no H.264 encoder)');}catch(err){console.error(err);toast('Video export failed: '+(err.message||err));}finally{busy(false);}};
$('mvGif').onclick=async()=>{stopPlay();busy(true);try{DVExport.download(slug()+'-build.gif',await DVExport.gif(animOpts()));$('mvProg').textContent='Done';toast('GIF downloaded');}catch(err){console.error(err);toast('GIF export failed: '+(err.message||err));}finally{busy(false);}};

/* start: #roadmap, #org, #journey or #matrix picks the kind */
const h=location.hash.slice(1);if(Diagrams.KINDS.some(k=>k.id===h))S.kind=h;
if(!DVStyles.some(s=>s.id===S.style))S.style='workflow';$('styles').querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.style===S.style)));
drawKinds();syncTitle();drawEditor();render(true);document.fonts?.ready.then(()=>setTimeout(()=>render(false),60));
$('styles').querySelector('[aria-pressed=true]')?.scrollIntoView({block:'nearest',inline:'center'});
})();
</script>
</body></html>
