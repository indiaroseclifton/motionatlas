<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>01ai · Direction 20 · Command Deck</title>
<meta name="description" content="01ai home page, direction 20: Command Deck.">
<meta name="theme-color" content="#07090C"><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Geist:wght@400..700&display=swap">
<link rel="stylesheet" href="kit.css">
<style>
:root{--f-display:'Geist',system-ui,sans-serif;--f-body:'Geist',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;--dock:clamp(250px,22vw,300px)}
.scrim{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(7,9,12,.85),transparent 50%),linear-gradient(0deg,rgba(7,9,12,.7),transparent 35%)}
main{position:relative;z-index:2}
.hero{min-height:100vh;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr) var(--dock);grid-template-rows:1fr auto;gap:0 clamp(16px,2vw,28px);padding:110px var(--gut) 66px}
.copy{align-self:center;display:grid;gap:18px}
h1{margin:0;font:600 clamp(48px,7.6vw,128px)/.9 var(--f-display);letter-spacing:-.055em;max-width:10.5ch;text-wrap:balance}
.sub{margin:0;font:500 clamp(13px,1.1vw,15px) var(--f-mono);color:var(--cyan)}
.pn{background:rgba(9,12,16,.78);border:1px solid var(--line2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);min-width:0}
.ph{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font:500 10.5px var(--f-mono);letter-spacing:.12em;color:var(--fg3)}
.ph b{color:var(--green);font-weight:500}
.dock{grid-row:1/3;grid-column:2;align-self:stretch;display:grid;grid-template-rows:auto auto 1fr;}
.sec{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:8px;align-content:start}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 10px;margin:0;font:12px var(--f-mono);color:var(--fg3)}
.kv b{color:var(--fg);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.ga{width:120px;aspect-ratio:1;justify-self:center;max-width:100%}
.ga p{margin:0;text-align:center;font:10px var(--f-mono);color:var(--fg3);letter-spacing:.1em}
.ga b{display:block;font:700 22px var(--f-mono);color:var(--fg);letter-spacing:0}
[data-bars]{height:46px}
.cli{grid-column:1;grid-row:2;margin-top:20px}
.cli .body{padding:10px 12px;font:12px/1.65 var(--f-mono);color:var(--fg2);min-width:0}
.cli .out{list-style:none;margin:0;padding:0;height:80px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.cli .out li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cli .out .ok{color:var(--green)}.cli .out .dim{color:var(--fg3)}
.cmd{display:flex;gap:10px;align-items:center;margin-top:6px;color:var(--fg)}
.cmd .ps{color:var(--cyan)}
.cmd .cur{display:inline-block;width:8px;height:15px;background:var(--cyan);animation:bl 1s steps(1) infinite;vertical-align:-2px}
@keyframes bl{50%{opacity:0}}
.claims{position:relative;z-index:2;padding:18vh var(--gut) 12vh;background:linear-gradient(180deg,transparent,var(--bg) 20%)}
@media (max-width:960px){.hero{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto}.dock{grid-row:auto;grid-column:1;margin-top:20px;grid-template-rows:auto}.dock .lg{display:none}.cli{grid-row:auto}.ga{display:none}}
</style></head>
<body data-dir="20" id="top">
<canvas class="k-canvas" id="cv" aria-hidden="true"></canvas><div class="scrim" aria-hidden="true"></div>
<header data-kit="head"></header>
<main>
<section class="hero" aria-labelledby="h">
 <div class="copy"><h1 id="h">The most powerful agentic system.</h1><p class="sub">Coordinated. Adaptive. Unyielding.</p></div>
 <aside class="dock pn" aria-label="War room">
  <p class="ph" style="margin:0"><span>SESSION · WAR ROOM</span><b>● LIVE</b></p>
  <div class="sec"><div class="ga" data-gauge="cpu"><p>CPU<b data-v="cpu">63.2%</b></p></div><p class="kv"><span>memory</span><b data-v="mem">72.7%</b><span>nodes</span><b data-v="nodes">14,208</b><span>latency</span><b data-v="lat">4.2ms</b><span>models</span><b data-v="models">1,042</b></p></div>
  <div class="sec lg"><p class="kv"><span>tasks/s</span><b data-v="tps">48,210</b></p><div data-bars="tps" data-n="32" aria-hidden="true"></div></div>
 </aside>
 <div class="cli pn"><p class="ph" style="margin:0"><span>01 · COMMAND</span><span data-clock>00:00:00 UTC</span></p>
  <div class="body"><ol class="out" id="out" aria-label="Command output" aria-live="off"></ol><p class="cmd" style="margin:6px 0 0"><span class="ps">›</span><span id="typed"></span><span class="cur" aria-hidden="true"></span></p></div></div>
</section>
<section class="claims" data-kit="claims" aria-label="The stack"></section>
</main>
<footer data-kit="foot"></footer>
<script src="../../../vendor/three-r128.min.js"></script><script src="city3d.js"></script><script src="kit.js"></script>
<script>
Kit.init();
Kit.city(document.getElementById('cv'),{seed:14,tall:.3,cam:{a:[30,12,34],b:[16,6,4],la:[-4,2,-14],lb:[-22,2,-44]},drift:.08});
(()=>{const CMDS=[['01 spawn --agents 4 --goal "launch EU pricing"',['routing… 4 models selected','spawned AGENT_4410 · AGENT_4411 · AGENT_4412 · AGENT_4413','<span class="ok">✓ plan ready in 1.8s</span>']],
 ['01 audit --scope invoices --period Q3',['reading 18,402 invoices','<span class="ok">✓ 3 anomalies flagged · £41,220 recovered</span>']],
 ['01 learn --skill "board-pack" --from ./decks',['skill SK-77120 acquired','<span class="ok">✓ 9 agents updated</span>']],
 ['01 status --all',['<span class="dim">nodes 14,2xx · models 1,04x · uptime 99.999%</span>','<span class="ok">✓ nothing else comes close</span>']]];
 const out=document.getElementById('out'),ty=document.getElementById('typed');let k=0;
 const add=h=>{const li=document.createElement('li');li.innerHTML=h;out.append(li);while(out.children.length>4)out.firstElementChild.remove()};
 add('<span class="dim">01ai console v1.0 · connected to WAR ROOM</span>');
 if(Kit.reduce){ty.textContent=CMDS[0][0];CMDS[0][1].forEach(add);return}
 const paused=()=>document.documentElement.classList.contains('k-paused');
 async function run(){const wait=ms=>new Promise(r=>setTimeout(r,ms));for(;;){const [c,res]=CMDS[k++%CMDS.length];ty.textContent='';for(const ch of c){while(paused())await wait(300);ty.textContent+=ch;await wait(28+Math.random()*40)}await wait(450);add('<span class="dim">› '+c.replace(/</g,'&lt;')+'</span>');ty.textContent='';for(const r of res){await wait(380);add(r)}await wait(2400)}}
 run();
})();
</script>
</body></html>
