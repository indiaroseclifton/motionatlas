<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>01ai · Direction 17 · Kinetic Type</title>
<meta name="description" content="01ai home page, direction 17: Kinetic Type.">
<meta name="theme-color" content="#000000"><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600&display=swap">
<link rel="stylesheet" href="kit.css">
<style>
:root{--bg:#000;--f-display:'Archivo Black',system-ui,sans-serif;--f-body:'Archivo',system-ui,sans-serif;--f-mono:ui-monospace,'SFMono-Regular',Menlo,monospace}
/* the city shows only through the letters: black layer multiplied over the canvas */
.hero{position:relative;min-height:100vh;min-height:100svh}
.lift{position:absolute;inset:0;background:linear-gradient(180deg,rgba(221,251,255,.34),rgba(221,251,255,.12) 55%,rgba(221,251,255,0))}
.mask{position:absolute;inset:0;background:#000;color:#fff;mix-blend-mode:multiply;display:grid;align-content:center;padding:96px 0 170px;overflow:hidden}
.ln{display:block;white-space:nowrap;font:400 clamp(64px,15.5vw,270px)/.8 var(--f-display);letter-spacing:-.04em;text-transform:uppercase;padding-left:var(--gut);will-change:transform}
.ln.c{color:#9FF0FB}
.ln .k-ch{transform:translateY(105%);animation:rise .9s cubic-bezier(.2,.8,.1,1) forwards;animation-delay:calc(var(--i)*35ms)}
.lw{display:block;overflow:hidden}
@keyframes rise{to{transform:none}}
.sub{position:absolute;z-index:3;left:var(--gut);bottom:128px;margin:0;font:500 clamp(14px,1.3vw,18px) var(--f-body);letter-spacing:.24em;text-transform:uppercase;color:var(--cyan)}
.feeds{position:absolute;z-index:3;left:var(--gut);right:var(--gut);bottom:64px;display:flex;flex-wrap:wrap;gap:8px 32px;align-items:baseline;font:12px var(--f-mono);letter-spacing:.08em;color:var(--fg3);border-top:1px solid var(--line);padding-top:12px}
.feeds b{color:var(--fg);font-weight:500;margin-left:8px;font-variant-numeric:tabular-nums}
.feeds .k-log{flex:1 1 300px;height:19px;font-size:11.5px;min-width:0}
.claims{position:relative;z-index:2;padding:18vh var(--gut) 12vh;background:var(--bg)}
.claims .k-h2{font-family:var(--f-display);font-weight:400;text-transform:uppercase;letter-spacing:-.03em}
.claims .k-claims h3{font-family:var(--f-display);font-weight:400;text-transform:uppercase;letter-spacing:-.03em;font-size:clamp(24px,4vw,58px)}
@media (max-width:620px){.ln{font-size:13.6vw}.mask{padding:110px 0 220px}.sub{bottom:170px;letter-spacing:.14em}.feeds .hide{display:none}}
</style></head>
<body data-dir="17" id="top">
<canvas class="k-canvas" id="cv" aria-hidden="true"></canvas>
<header data-kit="head"></header>
<main>
<section class="hero" aria-labelledby="h">
 <h1 id="h" class="vh">The most powerful agentic system.</h1>
 <div class="lift" aria-hidden="true"></div><div class="mask" aria-hidden="true"><span class="lw"><span class="ln" data-x="-1">The most</span></span><span class="lw"><span class="ln" data-x="1">powerful</span></span><span class="lw"><span class="ln c" data-x="-1.4">agentic</span></span><span class="lw"><span class="ln" data-x=".8">system.</span></span></div>
 <p class="sub">Coordinated. Adaptive. Unyielding.</p>
 <div class="feeds" aria-label="War room"><span>CPU<b data-v="cpu">63.2%</b></span><span>NODES<b data-v="nodes">14,208</b></span><span class="hide">MODELS<b data-v="models">1,042</b></span><ol class="k-log" data-log="1" aria-label="Node log"></ol></div>
</section>
<section class="claims" data-kit="claims" aria-label="The stack"></section>
</main>
<footer data-kit="foot"></footer>
<script src="../../../vendor/three-r128.min.js"></script><script src="city3d.js"></script><script src="kit.js"></script>
<script>
Kit.init();
(()=>{let i=0;document.querySelectorAll('.ln').forEach(l=>{l.innerHTML=[...l.textContent].map(c=>`<span class="k-ch" style="--i:${i++}">${c===' '?'&nbsp;':c}</span>`).join('')});
 Kit.city(document.getElementById('cv'),{seed:7,tall:.34,traffic:2600,trafficSize:1.5,fog:.014,edges:.6,cam:{a:[24,21,24],b:[14,13,6],la:[-6,0,-10],lb:[-20,0,-34]},fov:50,drift:.12});
 if(Kit.reduce)return;const L=[...document.querySelectorAll('.ln')];let y=0,t=0;
 const f=()=>{t+=.004;y+=(scrollY-y)*.12;L.forEach(l=>{const k=+l.dataset.x;l.style.transform=`translateX(${(k*y*.35+Math.sin(t+k)*k*12).toFixed(1)}px)`});if(!document.documentElement.classList.contains('k-paused'))requestAnimationFrame(f);else{const w=setInterval(()=>{if(!document.documentElement.classList.contains('k-paused')){clearInterval(w);requestAnimationFrame(f)}},300)}};requestAnimationFrame(f);
})();
</script>
</body></html>
