<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#07090C"><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300..800&family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="kit.css">
<style>
:root{--f-display:'Oxanium',system-ui,sans-serif;--f-body:'Oxanium',system-ui,sans-serif;--f-mono:'Roboto Mono',ui-monospace,monospace}
.scrim{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(7,9,12,.9),rgba(7,9,12,.3) 50%,transparent 75%),linear-gradient(0deg,rgba(7,9,12,.92),transparent 38%)}
main{position:relative;z-index:2}
.hero{min-height:100vh;min-height:100svh;display:grid;grid-template-rows:1fr auto;grid-template-columns:minmax(0,1fr);padding:0 var(--gut)}
.copy{align-self:center;padding-top:120px;display:grid;gap:20px}
.note{margin:0;font:12px var(--f-mono);color:var(--fg3)}
.note b{color:var(--green);font-weight:500}
h1{margin:0;font:700 clamp(50px,8.4vw,142px)/.88 var(--f-display);letter-spacing:-.04em;max-width:10ch;text-wrap:balance}
.sub{margin:0;font:500 clamp(13px,1.2vw,16px) var(--f-mono);letter-spacing:.08em;color:var(--cyan)}
.hist{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 28px;align-items:end;padding-bottom:72px}
.hist .lab{grid-column:1/-1;margin:0;display:flex;justify-content:space-between;gap:12px;font:11px var(--f-mono);letter-spacing:.12em;color:var(--fg3)}
.hist [data-bars]{height:84px;gap:3px;border-bottom:1px solid var(--line2)}
.hist [data-bars] i{background:linear-gradient(0deg,rgba(127,231,247,.25),var(--cyan));opacity:1;transition:height .5s steps(5)}
.hist [data-bars] i:last-child{background:var(--green)}
.nums{display:grid;grid-template-columns:auto auto;gap:6px 22px;font:12px var(--f-mono);color:var(--fg3);margin:0}
.nums b{font:600 22px var(--f-display);color:var(--fg);text-align:right;font-variant-numeric:tabular-nums}
.claims{position:relative;z-index:2;padding:18vh var(--gut) 12vh;background:linear-gradient(180deg,transparent,var(--bg) 20%)}
.claims .k-claims h3{font-weight:700;letter-spacing:-.03em}
@media (max-width:700px){.hist{grid-template-columns:minmax(0,1fr)}.hist [data-bars]{height:60px}.nums{grid-template-columns:auto auto auto auto}.nums b{font-size:16px}}
</style></head>
<body data-dir="14" id="top">
<canvas class="k-canvas" id="cv" aria-hidden="true"></canvas><div class="scrim" aria-hidden="true"></div>
<header data-kit="head"></header>
<main>
<section class="hero" aria-labelledby="h">
 <div class="copy"><p class="note">Every tower is a live node. Height = load. <b>Now: <span data-v="tps">48,210</span> tasks/s</b></p><h1 id="h">The most powerful agentic system.</h1><p class="sub">Coordinated. Adaptive. Unyielding.</p></div>
 <div class="hist" aria-label="War room">
  <p class="lab"><span>THROUGHPUT · TASKS PER SECOND · LAST 60 TICKS</span><span data-clock>00:00:00 UTC</span></p>
  <div data-bars="tps" data-n="60" aria-hidden="true"></div>
  <p class="nums"><span>CPU</span><b data-v="cpu">63.2%</b><span>MODELS</span><b data-v="models">1,042</b></p>
 </div>
</section>
<section class="claims" data-kit="claims" aria-label="The stack"></section>
</main>
<footer data-kit="foot"></footer>
<script src="../../../vendor/three-r128.min.js"></script><script src="city3d.js"></script><script src="kit.js"></script>
<script>
Kit.init();
(()=>{const ph=[];const base=(i,c)=>{ph[i]=ph[i]??Math.random()*6.28;return c.h0b=c.h0b??c.h0};
 const h=Kit.city(document.getElementById('cv'),{seed:9,tall:.3,heights:(i,c)=>c.h,cam:{a:[32,13,36],b:[16,6,6],la:[-6,2,-14],lb:[-24,2,-44]}});
 if(!h)return;h.chips.forEach((c,i)=>base(i,c));
 Kit.on('tick',(S,H)=>{const load=S.tps/62000;h.setHeights((i,c)=>c.tall?c.h0b*(.45+load*.9+.25*Math.sin(Date.now()/2400+ph[i])):c.h0b*(.7+.5*Math.random()))});
})();
</script>
</body></html>
