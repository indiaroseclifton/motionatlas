<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>01ai · Direction 12 · Split Screen</title>
<meta name="description" content="01ai home page, direction 12: Split Screen.">
<meta name="theme-color" content="#0B0E12"><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="kit.css">
<style>
:root{--bg:#0B0E12;--f-display:'Bricolage Grotesque',system-ui,sans-serif;--f-body:'Bricolage Grotesque',system-ui,sans-serif;--f-mono:'Geist Mono',ui-monospace,monospace}
.hero{min-height:100vh;min-height:100svh;display:grid;grid-template-columns:minmax(0,45fr) minmax(0,55fr)}
.left{display:grid;grid-template-rows:1fr auto;padding:120px clamp(20px,3vw,48px) 70px var(--gut);gap:40px}
.copy{align-self:center;display:grid;gap:22px}
h1{margin:0;font:800 clamp(48px,6.6vw,120px)/.9 var(--f-display);font-variation-settings:"opsz" 96;letter-spacing:-.05em;text-wrap:balance}
h1 span{color:var(--cyan)}
.sub{margin:0;font:400 clamp(13px,1.1vw,15px) var(--f-mono);letter-spacing:.08em;color:var(--fg2)}
.list{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.list>li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font:12px var(--f-mono);letter-spacing:.08em;color:var(--fg3)}
.list>li>b{font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums}
.list .lg{grid-template-columns:minmax(0,1fr)}
.list .k-log{height:40px;font-size:11px;letter-spacing:0}
/* the window */
.win{position:relative;margin:clamp(96px,12vh,124px) var(--gut) clamp(20px,3vh,32px) 0;border:1px solid var(--line2);overflow:hidden;min-height:0}
.win canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.win canvas.k-fallback{background:var(--bg) url('../assets/city-poster.jpg') center/cover}
.coord{position:absolute;z-index:2;font:10.5px var(--f-mono);letter-spacing:.14em;color:var(--fg2);padding:10px 12px;background:rgba(11,14,18,.7)}
.coord.tl{left:0;top:0}.coord.br{right:0;bottom:0;color:var(--cyan)}
.claims{padding:16vh var(--gut) 12vh;max-width:1320px}
.claims .k-claims h3{font-weight:700;letter-spacing:-.04em}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto}.win{order:-1;height:52vh;margin:92px var(--gut) 0}.left{padding-top:36px}}
</style></head>
<body data-dir="12" id="top">
<header data-kit="head"></header>
<main>
<section class="hero" aria-labelledby="h">
 <div class="left">
  <div class="copy"><h1 id="h">The most powerful <span>agentic</span> system.</h1><p class="sub">Coordinated. Adaptive. Unyielding.</p></div>
  <ul class="list" aria-label="War room">
   <li><span>CPU LOAD</span><b data-v="cpu">63.2%</b></li>
   <li><span>INFERENCE NODES</span><b data-v="nodes">14,208</b></li>
   <li><span>MODELS ONLINE</span><b data-v="models">1,042</b></li>
   <li class="lg"><ol class="k-log" data-log="2" aria-label="Node log"></ol></li>
  </ul>
 </div>
 <div class="win" aria-hidden="true"><canvas id="cv"></canvas><span class="coord tl">NODE: WAR ROOM · 51.5072° N</span><span class="coord br" data-clock>00:00:00 UTC</span></div>
</section>
<section class="claims" data-kit="claims" aria-label="The stack"></section>
</main>
<footer data-kit="foot"></footer>
<script src="../../../vendor/three-r128.min.js"></script><script src="city3d.js"></script><script src="kit.js"></script>
<script>Kit.init();Kit.city(document.getElementById('cv'),{seed:4,tall:.3,fov:38,pal:{bg:'#0B0E12'},cam:{a:[30,11,30],b:[14,5,2],la:[-10,3,-18],lb:[-26,3,-46]}});</script>
</body></html>
