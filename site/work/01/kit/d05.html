<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>01ai · Direction 05 · Binary Metropolis</title>
<meta name="description" content="01ai home page, direction 05: Binary Metropolis.">
<meta name="theme-color" content="#07090C"><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300..800&display=swap">
<link rel="stylesheet" href="kit.css">
<style>
:root{--f-display:'JetBrains Mono',ui-monospace,monospace;--f-body:'JetBrains Mono',ui-monospace,monospace;--f-mono:'JetBrains Mono',ui-monospace,monospace}
.scrim{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(7,9,12,.9),rgba(7,9,12,.4) 40%,transparent 66%)}
main{position:relative;z-index:2}
.hero{min-height:100vh;min-height:100svh;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:end;gap:24px;padding:0 var(--gut) 70px}
.copy{padding-top:130px;display:grid;gap:20px;align-self:center}
.prompt{margin:0;font:12px var(--f-mono);color:var(--green)}
h1{margin:0;font:700 clamp(40px,6.4vw,104px)/.95 var(--f-display);letter-spacing:-.06em;text-wrap:balance}
h1::after{content:"";display:inline-block;width:.5em;height:.08em;background:var(--cyan);margin-left:.1em;animation:blink 1s steps(1) infinite;vertical-align:baseline}
@keyframes blink{50%{opacity:0}}
.sub{margin:0;font:400 clamp(13px,1.2vw,16px) var(--f-mono);color:var(--cyan)}
.sub::before{content:"// ";color:var(--fg3)}
/* terminal windows, staggered */
.wins{position:relative;display:grid;gap:0;min-width:0}
.win{background:rgba(9,12,16,.9);border:1px solid var(--line2);min-width:0}
.win+.win{margin:-18px 0 0 clamp(0px,6vw,90px);position:relative;box-shadow:0 -20px 40px rgba(0,0,0,.4)}
.bar{display:flex;justify-content:space-between;gap:12px;padding:7px 12px;border-bottom:1px solid var(--line);font:10.5px var(--f-mono);letter-spacing:.08em;color:var(--fg3)}
.bar b{color:var(--fg2);font-weight:500}
.body{padding:12px;display:grid;gap:8px;min-width:0}
.k-log{height:116px;font-size:11px}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;font:12px var(--f-mono);color:var(--fg3);margin:0}
.kv b{color:var(--fg);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.kv .k-meter{height:6px;background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 6px)}
.kv .k-meter::after{background:repeating-linear-gradient(90deg,var(--cyan) 0 4px,transparent 4px 6px)}
.claims{position:relative;z-index:2;padding:18vh var(--gut) 12vh;background:var(--bg)}
.claims .k-claims h3{font-weight:700;letter-spacing:-.05em;font-size:clamp(22px,3.4vw,48px)}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}.win+.win{margin:-10px 0 0 24px}}
@media (max-width:560px){.win.lg{display:none}.win+.win{margin:0}}
</style></head>
<body data-dir="05" id="top">
<canvas class="k-canvas" id="cv" aria-hidden="true"></canvas><div class="scrim" aria-hidden="true"></div>
<header data-kit="head"></header>
<main>
<section class="hero" aria-labelledby="h">
 <div class="copy"><p class="prompt">root@war-room:~$ ./01ai --boot</p><h1 id="h">The most powerful agentic system.</h1><p class="sub">Coordinated. Adaptive. Unyielding.</p></div>
 <div class="wins" aria-label="War room">
  <div class="win"><p class="bar"><b>tty1 · telemetry</b><span data-clock>00:00:00 UTC</span></p><div class="body">
   <p class="kv"><span>cpu</span><span class="k-meter" data-bar="cpu"></span><b data-v="cpu">63.2%</b><span>mem</span><span class="k-meter" data-bar="mem"></span><b data-v="mem">72.7%</b><span>nodes</span><span class="k-meter" data-bar="nodes"></span><b data-v="nodes">14,208</b><span>models</span><span class="k-meter" data-bar="models"></span><b data-v="models">1,042</b></p></div></div>
  <div class="win lg"><p class="bar"><b>tty2 · node.log</b><span>tail -f</span></p><div class="body"><ol class="k-log" data-log="7" aria-label="Node log"></ol></div></div>
 </div>
</section>
<section class="claims" data-kit="claims" aria-label="The stack"></section>
</main>
<footer data-kit="foot"></footer>
<script src="hero2d.js"></script><script src="kit.js"></script>
<script>Kit.init();Kit.flat('glyphs',document.getElementById('cv'),{seed:5,font:'"JetBrains Mono",monospace'});</script>
</body></html>
