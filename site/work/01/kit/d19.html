<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>01ai · Direction 19 · Swarm Lights</title>
<meta name="description" content="01ai home page, direction 19: Swarm Lights.">
<meta name="theme-color" content="#07090C"><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300..800&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="kit.css">
<style>
:root{--f-display:'Plus Jakarta Sans',system-ui,sans-serif;--f-body:'Plus Jakarta Sans',system-ui,sans-serif;--f-mono:'Geist Mono',ui-monospace,monospace}
.scrim{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(7,9,12,.85),transparent 55%)}
main{position:relative;z-index:2}
.hero{min-height:100vh;min-height:100svh;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:end;gap:32px;padding:0 var(--gut) 72px}
.copy{align-self:center;padding-top:120px;display:grid;gap:22px}
h1{margin:0;font:800 clamp(48px,7.8vw,132px)/.92 var(--f-display);letter-spacing:-.055em;max-width:10ch;text-wrap:balance}
h1 span{background:linear-gradient(90deg,var(--cyan),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0;font:500 clamp(15px,1.4vw,19px) var(--f-body);color:var(--fg2)}
.ledger{margin:0;padding:18px 20px;list-style:none;border-radius:16px;background:rgba(11,14,18,.55);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:grid;gap:9px;min-width:0;max-width:440px;justify-self:end;width:100%}
.ledger>li{display:flex;align-items:baseline;gap:8px;font:13px var(--f-body);color:var(--fg2)}
.ledger>li::after{content:"";order:2;flex:1;border-bottom:1px dotted var(--line2);transform:translateY(-4px)}
.ledger>li>b{order:3;font:500 14px var(--f-mono);color:var(--fg);font-variant-numeric:tabular-nums}
.ledger>li.lg{display:block;border-top:1px solid var(--line);padding-top:10px}
.ledger>li.lg::after{display:none}
.ledger .k-log{height:56px;font-size:11px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c,var(--cyan));box-shadow:0 0 10px var(--c,var(--cyan));flex:none;transform:translateY(-1px)}
.claims{position:relative;z-index:2;padding:18vh var(--gut) 12vh;background:linear-gradient(180deg,transparent,var(--bg) 20%)}
.claims .k-claims h3{font-weight:800;letter-spacing:-.05em}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}.ledger{justify-self:start}}
@media (max-width:560px){.ledger .lg{display:none}}
</style></head>
<body data-dir="19" id="top">
<canvas class="k-canvas" id="cv" aria-hidden="true"></canvas><div class="scrim" aria-hidden="true"></div>
<header data-kit="head"></header>
<main>
<section class="hero" aria-labelledby="h">
 <div class="copy"><h1 id="h">The most powerful <span>agentic</span> system.</h1><p class="sub">Coordinated. Adaptive. Unyielding.</p></div>
 <ul class="ledger" aria-label="War room">
  <li><i class="dot"></i>Agents in flight<b data-v="agents">3,912</b></li>
  <li><i class="dot" style="--c:var(--green)"></i>Tasks per second<b data-v="tps">48,210</b></li>
  <li><i class="dot" style="--c:var(--purple)"></i>Skills learned<b data-v="skills">88,412</b></li>
  <li><i class="dot" style="--c:var(--amber)"></i>Models online<b data-v="models">1,042</b></li>
  <li class="lg"><ol class="k-log" data-log="3" data-fmt="short" aria-label="Node log"></ol></li>
 </ul>
</section>
<section class="claims" data-kit="claims" aria-label="The stack"></section>
</main>
<footer data-kit="foot"></footer>
<script src="hero2d.js"></script><script src="kit.js"></script>
<script>Kit.init();Kit.flat('swarm',document.getElementById('cv'),{seed:8,n:420});</script>
</body></html>
