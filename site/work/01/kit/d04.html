<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>01ai · Direction 04 · Long Exposure</title>
<meta name="description" content="01ai home page, direction 04: Long Exposure.">
<meta name="theme-color" content="#07090C"><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..800&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="kit.css">
<style>
:root{--f-display:'Inter Tight',system-ui,sans-serif;--f-body:'Inter Tight',system-ui,sans-serif;--f-mono:'DM Mono',ui-monospace,monospace}
.scrim{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(100deg,rgba(7,9,12,.88),rgba(7,9,12,.35) 45%,transparent 70%)}
main{position:relative;z-index:2}
.hero{min-height:100vh;min-height:100svh;display:grid;grid-template-rows:1fr auto;grid-template-columns:minmax(0,1fr)}
.copy{align-self:center;padding:130px var(--gut) 30px;display:grid;gap:26px}
h1{margin:0;font:700 clamp(56px,10vw,170px)/.84 var(--f-display);letter-spacing:-.065em;max-width:9ch;text-wrap:balance}
h1 i{font-style:normal;background:linear-gradient(90deg,var(--fg) 30%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0;font:400 clamp(14px,1.3vw,17px) var(--f-mono);color:var(--fg2)}
.sub em{font-style:normal;color:var(--cyan)}
/* rail: stats row + log ticker */
.rail{border-top:1px solid var(--line);background:linear-gradient(0deg,rgba(7,9,12,.92),rgba(7,9,12,.55));padding-bottom:58px}
.stats{display:flex;flex-wrap:wrap;gap:8px clamp(18px,3vw,48px);padding:16px var(--gut);border-bottom:1px solid var(--line);font:12px var(--f-mono);color:var(--fg3);letter-spacing:.06em}
.stats b{color:var(--fg);font-weight:400;font-variant-numeric:tabular-nums;margin-left:8px}
.stats .live{color:var(--green)}
.stats .live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);margin-right:8px;vertical-align:0}
.tick{padding:14px 0;font:13px var(--f-mono);color:var(--fg2)}
.tick .k-l-v{color:var(--cyan)}.tick em{font-style:normal;color:var(--green)}
.tick .k-ti::before{content:"—";color:var(--fg3);margin-right:22px}
.claims{position:relative;z-index:2;padding:18vh var(--gut) 12vh;background:var(--bg)}
.claims .k-claims h3{font-weight:700;letter-spacing:-.05em}
@media (max-width:620px){.stats .hide{display:none}}
</style></head>
<body data-dir="04" id="top">
<canvas class="k-canvas" id="cv" aria-hidden="true"></canvas><div class="scrim" aria-hidden="true"></div>
<header data-kit="head"></header>
<main>
<section class="hero" aria-labelledby="h">
 <div class="copy"><h1 id="h">The most powerful <i>agentic system.</i></h1><p class="sub"><em>Coordinated.</em> Adaptive. Unyielding.</p></div>
 <div class="rail" aria-label="War room">
  <p class="stats"><span class="live">LIVE</span><span>CPU<b data-v="cpu">63.2%</b></span><span>MEM<b data-v="mem">72.7%</b></span><span>NODES<b data-v="nodes">14,208</b></span><span class="hide">TASKS/S<b data-v="tps">48,210</b></span><span>MODELS<b data-v="models">1,042</b></span></p>
  <div class="tick" data-ticker="log" aria-hidden="true"></div>
 </div>
</section>
<section class="claims" data-kit="claims" aria-label="The stack"></section>
</main>
<footer data-kit="foot"></footer>
<script src="hero2d.js"></script><script src="kit.js"></script>
<script>Kit.init();Kit.flat('trails',document.getElementById('cv'),{seed:11,cars:520});</script>
</body></html>
