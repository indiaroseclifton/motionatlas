<style>
:root{--bg:#04060A;--f-display:'Space Grotesk',system-ui,sans-serif;--f-body:'Space Grotesk',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace}
.scrim{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 90% at 0% 60%,rgba(4,6,10,.92),rgba(4,6,10,.3) 55%,transparent 80%)}
main{position:relative;z-index:2}
.hero{min-height:100vh;min-height:100svh;display:grid;grid-template-rows:1fr auto;grid-template-columns:minmax(0,1fr)}
.copy{align-self:end;padding:120px var(--gut) clamp(28px,6vh,64px);display:grid;gap:18px}
h1{margin:0;font:600 clamp(52px,8.6vw,138px)/.88 var(--f-display);letter-spacing:-.05em;max-width:11ch;text-wrap:balance}
h1 .w{color:transparent;-webkit-text-stroke:1.2px var(--cyan)}
.sub{margin:0;font:500 clamp(13px,1.1vw,15px) var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--fg2)}
.sub b{color:var(--cyan);font-weight:500}
/* terminal strip */
.strip{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr) minmax(0,.9fr) minmax(0,.8fr);border-top:1px solid rgba(127,231,247,.5);background:rgba(4,6,10,.82);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);padding-bottom:58px}
.strip>div{padding:14px var(--gut) 16px;border-right:1px solid var(--line);min-width:0;display:grid;gap:8px;align-content:start}
.strip>div:last-child{border-right:0}
.lab{margin:0;font:10.5px var(--f-mono);letter-spacing:.14em;color:var(--cyan)}
.lab::before{content:"$ "}
.row{display:flex;justify-content:space-between;gap:10px;font:12px var(--f-mono);color:var(--fg2)}
.row b{font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums}
.k-log{height:84px;font-size:11px}
.big{margin:0;font:500 38px/1 var(--f-mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.k-sparkc{height:30px}
.claims{position:relative;z-index:2;padding:18vh var(--gut) 12vh;max-width:1320px;background:linear-gradient(180deg,transparent,var(--bg) 20%)}
.claims .k-claims h3 em{color:transparent;-webkit-text-stroke:1px var(--cyan)}
@media (max-width:980px){.strip{grid-template-columns:1fr 1fr}.strip>div:nth-child(2){grid-column:1/-1;order:3;border-top:1px solid var(--line)}}
@media (max-width:560px){.strip>.clk{display:none}.strip{grid-template-columns:1fr}.strip>div{border-right:0}}
</style></head>

 </div>
