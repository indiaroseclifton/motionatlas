<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>01ai · Sign in</title>
<meta name="description" content="Sign in to 01ai.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07090C"><link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="01.css">
<style>
.wrap{min-height:100vh;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:clamp(30px,8vw,140px);align-items:center;padding:140px var(--gut) 100px;max-width:1400px}
.wrap h1{font-size:clamp(56px,9vw,140px);line-height:.9;letter-spacing:-.055em;font-weight:500;margin:0}
.side{display:grid;gap:22px}
form{display:grid;gap:28px}
.msg{margin:0;font:13px/1.5 var(--f-mono);letter-spacing:.04em;color:var(--pt-3);min-height:1.5em}
.msg.bad{color:var(--amber)}
.alt{display:grid;gap:8px;padding-top:24px;border-top:1px solid var(--line);color:var(--pt-3);font-size:15px}
.alt a{color:var(--pt)}
@media (max-width:860px){.wrap{grid-template-columns:1fr;align-content:start;padding-top:130px}}
</style></head><body>
<main id="main" class="wrap">
 <div><p class="o-kick mono" style="margin-bottom:22px">Members</p><h1><span data-decode-now>Sign in.</span></h1></div>
 <div class="side">
  <form id="f" novalidate aria-describedby="msg">
   <div class="o-field"><label for="e">Email</label><input class="o-input" id="e" type="email" autocomplete="username" required aria-describedby="e-err"><p class="o-err" id="e-err"></p></div>
   <div class="o-field"><label for="k">Access key</label><input class="o-input" id="k" type="password" autocomplete="current-password" required aria-describedby="k-err"><p class="o-err" id="k-err"></p></div>
   <button class="o-btn solid" type="submit" style="justify-self:start">Sign in</button>
   <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
  <div class="alt"><span>Not a member? <a href="apply.html">Apply</a></span><span>Curious? <a href="chat.html">Preview the interface</a></span></div>
 </div>
</main>
<script src="01.js"></script>
<script>
O1.init({page:'login'});
(()=>{const f=document.getElementById('f'),e=document.getElementById('e'),k=document.getElementById('k'),msg=document.getElementById('msg');
 const err=(el,t)=>{document.getElementById(el.id+'-err').textContent=t;el.setAttribute('aria-invalid',t?'true':'false')};
 f.onsubmit=ev=>{ev.preventDefault();const okE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e.value.trim()),okK=k.value.length>=8;
  err(e,okE?'':'Enter the email your access was issued to.');err(k,okK?'':'Access keys are at least 8 characters.');
  if(!okE||!okK){O1.Sound.deny();(okE?k:e).focus();msg.textContent='';msg.className='msg';return}
  msg.className='msg';msg.textContent='Verifying…';O1.Sound.tick();
  setTimeout(()=>{O1.Sound.buzz();msg.className='msg bad';msg.textContent='Sign-in isn\'t connected in this preview. Nothing you typed was sent anywhere.'},900)}})();
</script>
</body></html>
