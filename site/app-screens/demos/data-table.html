<style>/* Tokens: change these to restyle the whole screen. --ac is the brand colour. */

/* App shell: sidebar, top bar, content */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
.side{display:flex;flex-direction:column;gap:4px;padding:14px 10px;background:var(--panel);border-right:1px solid var(--line);overflow:auto}

.side .who{margin-top:auto;display:flex;align-items:center;gap:9px;padding:10px 8px 2px;border-top:1px solid var(--line);font-size:13px}
.side .who small{display:block;color:var(--mute);font-size:12px}
.work{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.top .find{position:relative;flex:1;max-width:340px}.top .find .ic{position:absolute;left:10px;top:9px;color:var(--mute)}.top .find input{width:100%;padding-left:34px}
.main{flex:1;min-height:0;overflow:auto;padding:20px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.head p{color:var(--mute);font-size:13px}
#menu{display:none}
@media(max-width:860px){.app{grid-template-columns:1fr}#menu{display:inline-flex}.side{position:fixed;inset:0 auto 0 0;width:250px;z-index:30;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 0 100vmax rgba(0,0,0,0)}.side.open{transform:none;box-shadow:0 0 0 100vmax rgba(10,12,20,.45)}.top{padding:10px 14px}.main{padding:14px}.top .find{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.bar .in{flex:1;min-width:180px;max-width:300px}
th button{all:unset;cursor:pointer;display:inline-flex;gap:5px;align-items:center;font:inherit;color:inherit}th button:focus-visible{outline:2px solid var(--ac);outline-offset:3px;border-radius:4px}th[aria-sort] button{color:var(--ink)}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--soft)}tbody tr.sel{background:var(--ac-soft)}
td .who{display:flex;gap:10px;align-items:center}td small{display:block;color:var(--mute);font-size:12px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--ac)}
.bulk{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--ac-soft);border-bottom:1px solid var(--line);color:var(--ac);font-weight:600}
.foot{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.drawer{position:fixed;inset:0 0 0 auto;width:min(380px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-20px 0 40px -20px rgba(0,0,0,.3);padding:20px;overflow:auto;z-index:40;transform:translateX(102%);transition:transform .22s;visibility:hidden}.drawer.open{transform:none;visibility:visible}
.drawer dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:16px 0}.drawer dt{color:var(--mute)}.drawer dd{margin:0;text-align:right}
.act{list-style:none;margin:8px 0 0;padding:0}.act li{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.act small{display:block;color:var(--mute)}
</style>

<script>/* Shared helpers: element lookup, theme switch (add #dark to the address to start dark), mobile menu. */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const root=document.documentElement;
function setTheme(dark){root.dataset.theme=dark?'dark':'light';const b=$('#theme');if(b){b.setAttribute('aria-pressed',dark);b.setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme')}document.dispatchEvent(new Event('themechange'))}
/* The address can carry a look, for example #dark, #ocean-soft or #sand-serif-dark. A copied file can set the same thing on the html element. */
const SKINS=['ocean','forest','sunset','rose','sand'],LOOKS=['soft','sharp','serif','compact'],PRE=root.dataset.theme==='dark';
function look(){const h=location.hash,w=h.slice(1).toLowerCase().match(/[a-z]+/g)||[];
 if(h){const s=w.find(x=>SKINS.includes(x)),l=w.find(x=>LOOKS.includes(x));s?root.dataset.skin=s:delete root.dataset.skin;l?root.dataset.look=l:delete root.dataset.look}
 setTheme(h?/dark/.test(h):PRE)}
look();addEventListener('hashchange',look);
$('#theme')?.addEventListener('click',()=>setTheme(root.dataset.theme!=='dark'));
{const m=$('#menu'),s=$('.side');if(m&&s){const set=o=>{s.classList.toggle('open',o);m.setAttribute('aria-expanded',o)};m.addEventListener('click',()=>set(!s.classList.contains('open')));addEventListener('keydown',e=>{if(e.key==='Escape')set(false)});document.addEventListener('click',e=>{if(s.classList.contains('open')&&!s.contains(e.target)&&!m.contains(e.target))set(false)})}}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* DATA: 40 generated records. Replace with a fetch to your API. */
const F=['Lena','Omar','Sofia','Kenji','Grace','Noah','Isla','Mateo','Aisha','Tomás','Yuki','Elena','Kwame','Freya','Ravi','Chloé','Hugo','Zara','Ibrahim','Mila'],S=['Fischer','Haddad','Rossi','Watanabe','Mensah','Lindqvist','Morgan','García','Rahman','Reyes'],CO=['Fernhill Studio','Kiln & Co','Slow Mornings','Northlight','Paper Boat','Tidewater','Juniper Labs','Halcyon'],PL=[['Starter',19],['Team',79],['Business',249]],ST=['Active','Active','Active','Trial','Churned'];
const DATA=Array.from({length:40},(_,i)=>{const f=F[i%20],s=S[(i*7+(i>19?3:0))%10],p=PL[(i*5)%3],st=ST[(i*3)%5];return {id:i,name:f+' '+s,email:(f+'.'+s).toLowerCase().normalize('NFD').replace(/[^a-z.]/g,'')+'@example.com',co:CO[(i*3)%8],plan:p[0],st,mrr:st==='Active'?p[1]*(1+i%4):0,seen:(i*5)%29+1}});
const KIND={Active:'ok',Trial:'ac',Churned:'bad'},PER=8,state={q:'',status:'All',sort:'name',dir:1,page:0,sel:new Set()};let view=[],opener=null;
function render(){const q=state.q.toLowerCase();view=DATA.filter(r=>(state.status==='All'||r.st===state.status)&&(r.name+r.email+r.co).toLowerCase().includes(q)).sort((a,b)=>(a[state.sort]>b[state.sort]?1:a[state.sort]<b[state.sort]?-1:0)*state.dir);
 const pages=Math.max(1,Math.ceil(view.length/PER));state.page=Math.min(state.page,pages-1);const pg=view.slice(state.page*PER,state.page*PER+PER);
 $('#count').textContent=view.length+' of '+DATA.length+' customers';
 $('#rows').innerHTML=pg.map(r=>`<tr data-id="${r.id}" class="${state.sel.has(r.id)?'sel':''}"><td><input type="checkbox" ${state.sel.has(r.id)?'checked':''} aria-label="Select ${r.name}"></td><td><span class="who"><span class="av">${r.name.split(' ').map(w=>w[0]).join('')}</span><span><b><a href="#" class="open">${r.name}</a></b><small>${r.email}</small></span></span></td><td>${r.co}</td><td>${r.plan}</td><td><span class="badge ${KIND[r.st]}"><i></i>${r.st}</span></td><td class="num">${r.mrr?'£'+r.mrr:'—'}</td><td class="mute">${r.seen} day${r.seen>1?'s':''} ago</td></tr>`).join('')||'<tr><td colspan="7" class="mute" style="padding:28px;text-align:center">No customers match. Clear the search or pick another status.</td></tr>';
 $$('th[data-k]').forEach(th=>{th.dataset.k===state.sort?th.setAttribute('aria-sort',state.dir>0?'ascending':'descending'):th.removeAttribute('aria-sort');th.firstChild.textContent=th.firstChild.textContent.replace(/ [↑↓]$/,'')+(th.dataset.k===state.sort?(state.dir>0?' ↑':' ↓'):'')});
 $('#range').textContent=view.length?`${state.page*PER+1}–${state.page*PER+pg.length} of ${view.length}`:'0 results';$('#prev').disabled=!state.page;$('#next').disabled=state.page>=pages-1;
 $('#bulk').hidden=!state.sel.size;$('#nsel').textContent=state.sel.size+' selected';const a=$('#all');a.checked=pg.length>0&&pg.every(r=>state.sel.has(r.id));a.indeterminate=!a.checked&&pg.some(r=>state.sel.has(r.id))}
$('#flt').innerHTML=['All','Active','Trial','Churned'].map(s=>`<button aria-pressed="${s==='All'}">${s}</button>`).join('');
$$('#flt button').forEach(b=>b.onclick=()=>{state.status=b.textContent;state.page=0;$$('#flt button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
$('#q').oninput=e=>{state.q=e.target.value;state.page=0;render()};
$$('th[data-k] button').forEach(b=>b.onclick=()=>{const k=b.parentNode.dataset.k;state.dir=state.sort===k?-state.dir:1;state.sort=k;render()});
$('#prev').onclick=()=>{state.page--;render()};$('#next').onclick=()=>{state.page++;render()};
$('#all').onchange=e=>{view.slice(state.page*PER,state.page*PER+PER).forEach(r=>e.target.checked?state.sel.add(r.id):state.sel.delete(r.id));render()};
$('#rows').addEventListener('click',e=>{const tr=e.target.closest('tr[data-id]');if(!tr)return;const id=+tr.dataset.id;if(e.target.matches('input')){e.target.checked?state.sel.add(id):state.sel.delete(id);render();return}e.preventDefault();openDrawer(DATA[id],tr.querySelector('.open'))});
$$('#bulk button').forEach(b=>b.onclick=()=>{toast(b.dataset.a+' '+state.sel.size+' customers');state.sel.clear();render()});
function openDrawer(r,from){opener=from;const d=$('#drawer');d.innerHTML=`<div class="row"><span class="av" style="width:44px;height:44px;font-size:15px">${r.name.split(' ').map(w=>w[0]).join('')}</span><div><h2>${r.name}</h2><span class="mute">${r.email}</span></div><span class="sp"></span><button class="btn sq ghost" id="shut" aria-label="Close details">✕</button></div><dl><dt>Company</dt><dd>${r.co}</dd><dt>Plan</dt><dd>${r.plan}</dd><dt>Status</dt><dd><span class="badge ${KIND[r.st]}"><i></i>${r.st}</span></dd><dt>MRR</dt><dd class="num">${r.mrr?'£'+r.mrr:'—'}</dd><dt>Last seen</dt><dd>${r.seen} days ago</dd></dl><div class="row"><button class="btn pri">Send email</button><button class="btn">Add note</button></div><h3 style="margin-top:22px">Recent activity</h3><ul class="act"><li>Invited two teammates<small>3 days ago</small></li><li>Upgraded to ${r.plan}<small>2 weeks ago</small></li><li>Created first project<small>1 month ago</small></li></ul>`;d.classList.add('open');d.focus();$('#shut').onclick=shut}
function shut(){$('#drawer').classList.remove('open');opener?.focus()}addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#drawer').classList.contains('open'))shut()});
$('#add').onclick=()=>toast('Add customer form would open here');render();
</script>
</body>
