<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inbox, three panes</title>
<style>/* Tokens: change these to restyle the whole screen. --ac is the brand colour. */
:root{--bg:#FAFAFA;--panel:#FFFFFF;--ink:#141824;--mute:#5F677B;--line:#E3E6EE;--soft:#EEF0F6;--ac:#18181B;--ac-ink:#FFFFFF;--ac-soft:#F1F1F3;--ok:#12805C;--warn:#96560A;--bad:#C2362B;--ok-soft:#E3F5EC;--warn-soft:#FCF0D9;--bad-soft:#FBE6E3;--r:12px;--sh:0 1px 2px rgba(16,24,40,.05),0 8px 24px -16px rgba(16,24,40,.22);--font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
html[data-theme=dark]{--bg:#0E1117;--panel:#161A23;--ink:#ECEEF4;--mute:#9AA3B5;--line:#272D3A;--soft:#1D2230;--ac:#FAFAFA;--ac-ink:#0E1117;--ac-soft:#272A33;--ok:#4ADE9B;--warn:#F0B454;--bad:#FF8B80;--ok-soft:#12301F;--warn-soft:#33260C;--bad-soft:#3A1714;--sh:0 1px 2px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}h1{font-size:20px;line-height:1.2;letter-spacing:-.01em}h2{font-size:15px}h3{font-size:13px}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mute{color:var(--mute)}.num{font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:0 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--soft)}.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}.btn.ghost:hover{background:var(--soft)}.btn.sq{width:36px;padding:0}.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:16px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--mute);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.ac{background:var(--ac-soft);color:var(--ac)}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor}
.av{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:50%;background:var(--ac-soft);color:var(--ac);font-size:11.5px;font-weight:700}
.in{min-height:36px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);min-width:0}
.in::placeholder{color:var(--mute)}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--soft);gap:2px}
.seg button{min-height:30px;padding:0 11px;border:0;border-radius:8px;background:none;font-size:13px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.12)}
.row{display:flex;align-items:center;gap:10px}.sp{margin-left:auto}
table{border-collapse:collapse;width:100%}th{font-size:12px;font-weight:600;color:var(--mute);text-align:left}th,td{padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}tbody tr:last-child td{border-bottom:0}
.scroll{overflow:auto;position:relative}
/* App shell: sidebar, top bar, content */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
.side{display:flex;flex-direction:column;gap:4px;padding:14px 10px;background:var(--panel);border-right:1px solid var(--line);overflow:auto}
.logo{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;font-weight:700;font-size:15px}
.logo span{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--ac);color:var(--ac-ink)}
.side a{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 10px;border-radius:9px;color:var(--mute);font-weight:500;text-decoration:none}
.side a:hover{background:var(--soft);color:var(--ink)}.side a[aria-current=page]{background:var(--ac-soft);color:var(--ac);font-weight:600}
.side a b{margin-left:auto;font-size:11.5px;padding:0 7px;border-radius:99px;background:var(--soft)}
.side .who{margin-top:auto;display:flex;align-items:center;gap:9px;padding:10px 8px 2px;border-top:1px solid var(--line);font-size:13px}
.side .who small{display:block;color:var(--mute);font-size:12px}
.work{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.top .find{position:relative;flex:1;max-width:340px}.top .find .ic{position:absolute;left:10px;top:9px;color:var(--mute)}.top .find input{width:100%;padding-left:34px}
.main{flex:1;min-height:0;overflow:auto;padding:20px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.head p{color:var(--mute);font-size:13px}
#menu{display:none}
@media(max-width:860px){.app{grid-template-columns:1fr}#menu{display:inline-flex}.side{position:fixed;inset:0 auto 0 0;width:250px;z-index:30;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 0 100vmax rgba(0,0,0,0)}.side.open{transform:none;box-shadow:0 0 0 100vmax rgba(10,12,20,.45)}.top{padding:10px 14px}.main{padding:14px}.top .find{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.main{padding:0!important;overflow:hidden!important}
.mail{display:grid;grid-template-columns:190px minmax(260px,340px) minmax(0,1fr);height:100%}
.mail>*{min-height:0;overflow:auto}.fold{padding:14px 10px;border-right:1px solid var(--line)}.fold button{display:flex;width:100%;align-items:center;gap:8px;min-height:34px;padding:0 10px;border:0;border-radius:8px;background:none;font-weight:500;color:var(--mute);text-align:left}.fold button[aria-current=true]{background:var(--ac-soft);color:var(--ac);font-weight:600}.fold button b{margin-left:auto;font-size:12px}
.fold h3{padding:16px 10px 6px;color:var(--mute);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em}.fold i{width:9px;height:9px;border-radius:3px}
.list{border-right:1px solid var(--line);background:var(--panel)}.list [role=option]{display:grid;grid-template-columns:30px 1fr auto;gap:2px 10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.list [role=option][aria-selected=true]{background:var(--ac-soft)}.list [role=option]:focus-visible{outline-offset:-2px}
.list .who{font-weight:500}.list .un .who,.list .un .sub{font-weight:700}.list .un::before{content:"";position:absolute;left:4px;top:22px;width:6px;height:6px;border-radius:50%;background:var(--ac)}
.list time{font-size:12px;color:var(--mute)}.list .sub{grid-column:2/4}.list .pre{grid-column:2/4;color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{all:unset;cursor:pointer;color:var(--mute);font-size:15px;line-height:1;padding:2px}.star[aria-pressed=true]{color:#E8A317}.star:focus-visible{outline:2px solid var(--ac);border-radius:4px}
.read{padding:22px 26px;display:flex;flex-direction:column;gap:14px}.read .body{max-width:68ch;display:grid;gap:12px;line-height:1.65}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:13px}
.reply{margin-top:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:10px}.reply textarea{width:100%;border:0;background:none;resize:vertical;min-height:64px;outline:0}
.mine{align-self:flex-end;background:var(--ac-soft);padding:10px 14px;border-radius:12px 12px 2px 12px;max-width:60ch}
#back{display:none}
@media(max-width:900px){.mail{grid-template-columns:1fr}.fold{display:none}.mail.reading .list{display:none}.mail:not(.reading) .read{display:none}#back{display:inline-flex}.read{padding:16px}}
</style>
<body>
<div class="app"><nav class="side" aria-label="Main"><div class="logo"><span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3 5 13.500h6L10 21l8-10.500h-6Z"/></svg></span>Northwind</div><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4Z"/></svg>Overview</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V4M4 20h16M8 16v-5M12 16V8M16 16v-3"/></svg>Analytics</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.6 3.4-5.5 6.5-5.5s5.500 1.900 6.500 5.500M16 4.800a3.500 3.500 0 0 1 0 6.400M18 14.800c1.700.8 2.900 2.500 3.500 5.200"/></svg>Customers</a><a href="#" aria-current="page"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13 6.500 5h11L20 13v6H4Z"/><path d="M4 13h5l1 2.500h4l1-2.500h5"/></svg>Inbox<b>12</b></a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9.300 4v16M14.700 4v10"/></svg>Projects</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4Z"/></svg>Assistant</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Calendar</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3Z"/></svg>Files</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10.500h18"/></svg>Billing</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.600 5.600l2.100 2.100M16.300 16.300l2.100 2.100M5.600 18.400l2.100-2.100M16.300 7.700l2.100-2.100"/></svg>Settings</a><div class="who"><span class="av">AK</span><span>Amara Khan<small>Admin</small></span></div></nav>
<div class="work"><header class="top"><button class="btn sq ghost" id="menu" aria-label="Menu" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><label class="find"><span class="sr">Search</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.500"/><path d="m16 16 4.500 4.500"/></svg><input class="in" type="search" placeholder="Search mail"></label><span class="sp"></span><button class="btn sq ghost" id="theme" aria-pressed="false" aria-label="Switch to dark theme"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.500A8 8 0 0 1 9.500 4a8 8 0 1 0 10.500 10.500Z"/></svg></button><button class="btn sq ghost" aria-label="Notifications"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></button><span class="av" aria-label="Your account">AK</span></header>
<main class="main" id="main"><div class="mail" id="mail"><nav class="fold" aria-label="Folders" id="fold"></nav>
<div class="list" role="listbox" aria-label="Messages" id="list" tabindex="-1"></div>
<article class="read" id="read" aria-live="polite"></article></div></main></div></div>
<script>/* Shared helpers: element lookup, theme switch (add #dark to the address to start dark), mobile menu. */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const root=document.documentElement;
function setTheme(dark){root.dataset.theme=dark?'dark':'light';const b=$('#theme');if(b){b.setAttribute('aria-pressed',dark);b.setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme')}document.dispatchEvent(new Event('themechange'))}
setTheme(/dark/.test(location.hash));addEventListener('hashchange',()=>setTheme(/dark/.test(location.hash)));
$('#theme')?.addEventListener('click',()=>setTheme(root.dataset.theme!=='dark'));
{const m=$('#menu'),s=$('.side');if(m&&s){const set=o=>{s.classList.toggle('open',o);m.setAttribute('aria-expanded',o)};m.addEventListener('click',()=>set(!s.classList.contains('open')));addEventListener('keydown',e=>{if(e.key==='Escape')set(false)});document.addEventListener('click',e=>{if(s.classList.contains('open')&&!s.contains(e.target)&&!m.contains(e.target))set(false)})}}
function toast(t){let n=$('#toast');if(!n){n=document.createElement('div');n.id='toast';n.setAttribute('role','status');n.style.cssText='position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;z-index:60;transition:opacity .2s;max-width:calc(100vw - 32px)';document.body.append(n)}n.textContent=t;n.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>n.style.opacity=0,2000)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let MAIL=[['Maya Okafor','MO','09:42','Launch checklist, final pass','I went through the list again this morning and there are only three things left before Thursday.',['I went through the list again this morning and there are only three things left before Thursday: the pricing copy, the redirect map and the status page link in the footer.','Could you take the redirect map? I have attached the spreadsheet with the old and new addresses.','If we get those done by Wednesday lunchtime we can spend the afternoon testing.'],'redirects.xlsx · 48 KB',1,0],['Stripe','ST','08:15','Your November payout is on its way','£12,480.20 will arrive in your account ending 4471 within two working days.',['£12,480.20 will arrive in your account ending 4471 within two working days.','You can see the full breakdown of charges, refunds and fees in your dashboard.'],'',1,0],['Tomás Reyes','TR','Yesterday','Re: Nav menu on small screens','Good catch. I have switched the panel to an accordion under 420 pixels.',['Good catch. I have switched the panel to an accordion under 420 pixels and added the missing focus return on Escape.','It is on the preview branch if you want to try it on your phone.'],'',0,1],['Priya Nair','PN','Yesterday','Photos for the case study','Here are twelve from the shoot. My favourites are 3, 7 and 11.',['Here are twelve from the shoot. My favourites are 3, 7 and 11, but use whichever fit the layout.','All of them are cleared for web and social.'],'shoot-selects.zip · 86 MB',1,0],['GitHub','GH','Mon','[northwind/app] Pull request #482 approved','amara-k approved your pull request: Add keyboard support to the board.',['amara-k approved your pull request: Add keyboard support to the board.','All 214 checks have passed. You can merge when ready.'],'',0,0],['Kwame Mensah','KM','Mon','Lunch on Friday?','A few of us are trying the new place on Canal Street at 12:30.',['A few of us are trying the new place on Canal Street at 12:30. Want to join?'],'',0,0]].map(([from,ini,time,sub,pre,body,att,un,star],id)=>({id,from,ini,time,sub,pre,body,att,un,star,folder:'Inbox',thread:[]}));
let folder='Inbox',sel=0;const FOLD=['Inbox','Starred','Sent','Archive'],LAB=[['Clients','#7C5CFF'],['Finance','#12805C'],['Team','#E8A317']];
const inFolder=m=>folder==='Starred'?m.star&&m.folder!=='Archive':m.folder===folder;
function render(keep){const list=MAIL.filter(inFolder);if(!list.find(m=>m.id===sel))sel=list[0]?.id??-1;
 $('#fold').innerHTML=FOLD.map(f=>{const n=f==='Inbox'?MAIL.filter(m=>m.folder==='Inbox'&&m.un).length:0;return `<button aria-current="${f===folder}" data-f="${f}">${f}${n?`<b aria-label="${n} unread">${n}</b>`:''}</button>`}).join('')+'<h3>Labels</h3>'+LAB.map(([n,c])=>`<button><i style="background:${c}"></i>${n}</button>`).join('');
 $('#list').innerHTML=list.map(m=>`<div role="option" tabindex="${m.id===sel?0:-1}" aria-selected="${m.id===sel}" data-id="${m.id}" class="${m.un?'un':''}"><span class="av" style="grid-row:1/3">${m.ini}</span><span class="who">${m.from}${m.un?'<span class="sr">, unread</span>':''}</span><time>${m.time}</time><span class="sub">${m.sub}</span><span class="pre">${m.pre}</span></div>`).join('')||'<p class="mute" style="padding:30px;text-align:center">Nothing in '+folder+'.</p>';
 const m=MAIL.find(x=>x.id===sel);$('#read').innerHTML=m?`<div class="row" style="flex-wrap:wrap"><button class="btn" id="back">← Inbox</button><h1 style="flex:1;min-width:200px">${m.sub}</h1><button class="star" aria-pressed="${!!m.star}" aria-label="Star" id="st">${m.star?'★':'☆'}</button><button class="btn" id="ar">Archive</button><button class="btn" id="mu">Mark unread</button></div><div class="row"><span class="av">${m.ini}</span><div><b>${m.from}</b><div class="mute" style="font-size:12.5px">to me · ${m.time}</div></div></div><div class="body">${m.body.map(p=>`<p>${p}</p>`).join('')}</div>${m.att?`<div><span class="chip">📎 ${m.att}</span></div>`:''}${m.thread.map(t=>`<p class="mine">${esc(t)}</p>`).join('')}<form class="reply" id="rf"><label class="sr" for="rt">Reply to ${m.from}</label><textarea id="rt" placeholder="Reply to ${m.from.split(' ')[0]}…"></textarea><div class="row"><span class="sp"></span><button class="btn pri">Send</button></div></form>`:'<p class="mute" style="margin:auto">Select a message to read it.</p>';
 if(keep)$(`#list [data-id="${sel}"]`)?.focus()}
function open(id,focus){sel=id;const m=MAIL.find(x=>x.id===id);if(m)m.un=0;$('#mail').classList.add('reading');render(focus)}
$('#fold').onclick=e=>{const b=e.target.closest('[data-f]');if(b){folder=b.dataset.f;sel=-1;$('#mail').classList.remove('reading');render()}};
$('#list').addEventListener('click',e=>{const o=e.target.closest('[role=option]');if(o)open(+o.dataset.id,true)});
$('#list').addEventListener('keydown',e=>{const list=MAIL.filter(inFolder),i=list.findIndex(m=>m.id===sel),d=(e.key==='ArrowDown'||e.key==='j')?1:(e.key==='ArrowUp'||e.key==='k')?-1:0;if(d&&list[i+d]){e.preventDefault();open(list[i+d].id,true)}});
$('#read').addEventListener('click',e=>{const m=MAIL.find(x=>x.id===sel);if(!m)return;if(e.target.id==='st'){m.star=!m.star;render();$('#st').focus()}else if(e.target.id==='ar'){m.folder='Archive';toast('Archived');$('#mail').classList.remove('reading');render(true)}else if(e.target.id==='mu'){m.un=1;$('#mail').classList.remove('reading');render(true);toast('Marked as unread')}else if(e.target.id==='back'){$('#mail').classList.remove('reading');render(true)}});
$('#read').addEventListener('submit',e=>{e.preventDefault();const t=$('#rt').value.trim();if(!t)return;MAIL.find(x=>x.id===sel).thread.push(t);render();toast('Reply sent')});
MAIL[0].un=0;render();
</script>
