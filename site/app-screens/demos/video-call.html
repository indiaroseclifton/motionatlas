 <button class="gb" id="ppl" aria-label="Show people"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.6 3.4-5.5 6.5-5.5s5.500 1.900 6.500 5.500M16 4.800a3.500 3.500 0 0 1 0 6.400M18 14.800c1.700.8 2.900 2.500 3.500 5.200"/></svg><span id="pn" class="num">6</span></button><button class="gb sq" id="theme" aria-pressed="false" aria-label="Switch to dark theme"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.500A8 8 0 0 1 9.500 4a8 8 0 1 0 10.500 10.500Z"/></svg></button></header>

<script>/* Shared helpers: element lookup, theme switch (add #dark to the address to start dark), mobile menu. */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const root=document.documentElement;
function setTheme(dark){root.dataset.theme=dark?'dark':'light';const b=$('#theme');if(b){b.setAttribute('aria-pressed',dark);b.setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme')}document.dispatchEvent(new Event('themechange'))}
/* The address can carry a look, for example #dark, #ocean-soft or #sand-serif-dark. A copied file can set the same thing on the html element. */
const SKINS=['ocean','forest','sunset','rose','sand'],LOOKS=['soft','sharp','serif','compact'],PRE=root.dataset.theme==='dark';
function look(){const h=location.hash,w=h.slice(1).toLowerCase().match(/[a-z]+/g)||[];
 if(h){const s=w.find(x=>SKINS.includes(x)),l=w.find(x=>LOOKS.includes(x));s?root.dataset.skin=s:delete root.dataset.skin;l?root.dataset.look=l:delete root.dataset.look}
 setTheme(h?/dark/.test(h):PRE)}
look();addEventListener('hashchange',look);
$('#theme')?.addEventListener('click',()=>setTheme(root.dataset.theme!=='dark'));
{const m=$('#menu'),s=$('.side');if(m&&s){const set=o=>{s.classList.toggle('open',o);m.setAttribute('aria-expanded',o)};m.addEventListener('click',()=>set(!s.classList.contains('open')));addEventListener('keydown',e=>{if(e.key==='Escape')set(false)});document.addEventListener('click',e=>{if(s.classList.contains('open')&&!s.contains(e.target)&&!m.contains(e.target))set(false)})}}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* DATA: mic and cam are on or off; share marks the person presenting. */
const P=[{n:'Amara Khan',me:1,mic:1,cam:1},{n:'Priya Nair',mic:1,cam:1},{n:'Tom Becker',mic:0,cam:1},{n:'Maya Okafor',mic:1,cam:1},{n:'Kenji Watanabe',mic:0,cam:0},{n:'Lena Fischer',mic:1,cam:1,share:1}];
let CHAT=[['Tom Becker','24:02','Slides are in the team folder if anyone wants to follow along.'],['Maya Okafor','24:10','Can we come back to the billing item at the end?'],['Priya Nair','24:15','Yes, I have kept ten minutes for it.']];
let layout='sp',speaker=5,hand=false,panel='',secs=24*60+18,gone=false;

const tile=(p,i,main)=>`<div class="tile ${i===speaker&&p.mic?'on':''}" data-i="${i}">${main&&p.share?SLIDE:`<span class="face p${i}">${ini(p.n)}</span>`}<span class="nm">${p.mic?(i===speaker?'<span class="lv" aria-hidden="true"><i></i><i></i><i></i></span>':''):'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.500 11a6.500 6.500 0 0 0 13 0M12 17.500V21"/></svg>'}<span>${p.me?'You':p.n}${main&&p.share?' is presenting':''}${p.mic?'':'<span class="sr">, muted</span>'}</span></span>${p.me&&hand?'<span class="hand" role="img" aria-label="Hand raised"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 12V5.500a1.500 1.500 0 0 1 3 0V11M11 10V4.500a1.500 1.500 0 0 1 3 0V11M14 6.500a1.500 1.500 0 0 1 3 0V12M17 9.500a1.500 1.500 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.500a6 6 0 0 1-5-2.700L4 13.500a1.500 1.500 0 0 1 2.500-1.700L8 14"/></svg></span>':''}${!p.cam&&!(main&&p.share)?'<span class="off">Camera off</span>':''}</div>`;
const SLIDE=`<div class="slide"><div><h2>Roadmap, January to March</h2><p>Product review · 12 November 2026</p></div><div class="cols"><div><h3>Now</h3><span class="d">Boards: keyboard moves</span><span class="d">Invoices as PDF</span><span class="a">New onboarding</span></div><div><h3>Next</h3><span class="a">Timeline zoom</span><span>Saved filters</span><span>Mobile inbox</span></div><div><h3>Later</h3><span>Public API, version 2</span><span>Audit log export</span></div></div></div>`;
function tiles(){if(gone)return;const t=$('#tiles');t.className='tiles l'+layout;const pres=P.findIndex(p=>p.share);
 t.innerHTML=layout==='sp'?tile(P[pres],pres,true)+'<div class="strip">'+P.map((p,i)=>i===pres?'':tile(p,i)).join('')+'</div>':P.map((p,i)=>tile(p,i)).join('')}
function draw(){if(gone)return;tiles();const me=P[0];$('#ctl').innerHTML=[['mic',me.mic?'Mute':'Unmute','mic',me.mic?'':'x',!me.mic],['cam',me.cam?'Stop video':'Start video','video',me.cam?'':'x',!me.cam],['share','Share','screen','s',false],['hand',hand?'Lower hand':'Raise hand','hand','h',hand],['chat','Chat','chat','c',panel==='Chat']].map(([id,l,ic,c,on])=>`<button class="cb ${c}" data-a="${id}" aria-pressed="${on}">${ICON[ic]}${l}</button>`).join('')+'<button class="cb leave" data-a="leave"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h3l2 5-2.500 1.500a11 11 0 0 0 6 6L16 13l5 2v3c0 1.700-1.300 3-3 3A15 15 0 0 1 3 6c0-1.700 1.300-3 3-3Z"/></svg>Leave</button>';
 $('#pn').textContent=P.length;side()}
const ICON={mic:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.500 11a6.500 6.500 0 0 0 13 0M12 17.500V21"/></svg>`,video:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10.500 5-3v9l-5-3"/></svg>`,screen:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>`,hand:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 12V5.500a1.500 1.500 0 0 1 3 0V11M11 10V4.500a1.500 1.500 0 0 1 3 0V11M14 6.500a1.500 1.500 0 0 1 3 0V12M17 9.500a1.500 1.500 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.500a6 6 0 0 1-5-2.700L4 13.500a1.500 1.500 0 0 1 2.500-1.700L8 14"/></svg>`,chat:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4Z"/></svg>`};
function side(){const s=$('#side');s.hidden=!panel;if(!panel)return;
 s.innerHTML=`<header><div class="seg" role="tablist" aria-label="Panel">${['Chat','People'].map(x=>`<button role="tab" aria-selected="${x===panel}" data-p="${x}">${x}${x==='People'?' ('+P.length+')':''}</button>`).join('')}</div><button class="btn sq ghost" data-p="" aria-label="Close panel"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>`+(panel==='Chat'?`<div class="sb" id="sb" role="log" aria-label="Chat">${CHAT.map(([n,t,x])=>`<div class="cm ${n==='You'?'me':''}"><span class="av">${n==='You'?'AK':ini(n)}</span><b>${n}<small>${t}</small></b><p>${esc(x)}</p></div>`).join('')}</div><form id="cf"><label class="sr" for="ci">Message everyone</label><input class="in" id="ci" placeholder="Message everyone" autocomplete="off"><button class="btn pri sq" aria-label="Send"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4 3 11l7 3 3 7Z"/><path d="m10 14 4-4"/></svg></button></form>`:`<div class="sb">${P.map((p,i)=>`<div class="pl"><span class="av">${ini(p.n)}</span><span><b>${p.n}${p.me?' (you)':''}</b><small>${p.share?'Presenting':i===0?'Host':p.cam?'In the call':'Camera off'}</small></span><svg class="ic ${p.mic?'':'m'}" viewBox="0 0 24 24" role="img" aria-label="${p.mic?'Mic on':'Muted'}"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.500 6.500 0 0 0 13 0M12 17.500V21${p.mic?'':'M4 4l16 16'}"/></svg></div>`).join('')}<button class="btn" id="mall">Mute everyone else</button></div>`);
 const b=$('#sb');if(b)b.scrollTop=b.scrollHeight}
const clock=()=>String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');
$('#ctl').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,me=P[0];
 if(a==='mic'){me.mic=1-me.mic;toast(me.mic?'Your microphone is on':'You are muted')}else if(a==='cam'){me.cam=1-me.cam;toast(me.cam?'Camera on':'Camera off')}
 else if(a==='hand'){hand=!hand;toast(hand?'Hand raised':'Hand lowered')}else if(a==='chat')panel=panel==='Chat'?'':'Chat';
 else if(a==='share'){toast('Lena is presenting. Ask her to stop before you share.');return}
 else if(a==='leave'){gone=true;const n=clock();$('#call').innerHTML=`<div class="left"><h1>You left the call</h1><p>Weekly product review · ${n} · 6 people</p><button class="gb" id="rejoin">Rejoin</button></div>`;$('#rejoin').focus();$('#rejoin').onclick=()=>location.reload();return}
 draw();$(`[data-a="${a}"]`)?.focus()};
$$('.hd .seg button').forEach(b=>b.onclick=()=>{layout=b.dataset.l;$$('.hd .seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});
$('#ppl').onclick=()=>{panel=panel==='People'?'':'People';draw()};
$('#side').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b){panel=b.dataset.p;draw();panel?$(`#side [data-p="${panel}"]`).focus():$('#ppl').focus()}else if(e.target.id==='mall'){P.forEach(p=>{if(!p.me)p.mic=0});draw();toast('Everyone else is muted')}});
$('#side').addEventListener('submit',e=>{e.preventDefault();const v=$('#ci').value.trim();if(!v)return;CHAT.push(['You',clock(),v]);side();$('#ci').focus()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&panel){panel='';draw();$('#ppl').focus()}});
/* The speaker moves to another unmuted person every few seconds; the clock counts real seconds. */
setInterval(()=>{if(gone)return;secs++;$('#clock').textContent=clock();if(secs%4===0){const live=P.map((p,i)=>p.mic?i:-1).filter(i=>i>=0&&i!==speaker);if(live.length){speaker=live[Math.floor(Math.random()*live.length)];$$('.tile').forEach(t=>{const i=+t.dataset.i,on=i===speaker&&P[i].mic;if(t.classList.contains('on')!==on)tiles()})}}},1000);
draw();
</script>
</body>
</html>
