<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kanban board</title>
<style>/* Tokens: change these to restyle the whole screen. --ac is the brand colour. */
:root{--bg:#F5F6FA;--panel:#FFFFFF;--ink:#141824;--mute:#5F677B;--line:#E3E6EE;--soft:#EEF0F6;--ac:#4F46E5;--ac-ink:#FFFFFF;--ac-soft:#EEF0FF;--ok:#12805C;--warn:#96560A;--bad:#C2362B;--ok-soft:#E3F5EC;--warn-soft:#FCF0D9;--bad-soft:#FBE6E3;--r:12px;--sh:0 1px 2px rgba(16,24,40,.05),0 8px 24px -16px rgba(16,24,40,.22);--font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
html[data-theme=dark]{--bg:#0E1117;--panel:#161A23;--ink:#ECEEF4;--mute:#9AA3B5;--line:#272D3A;--soft:#1D2230;--ac:#928CFF;--ac-ink:#0E1117;--ac-soft:#23244B;--ok:#4ADE9B;--warn:#F0B454;--bad:#FF8B80;--ok-soft:#12301F;--warn-soft:#33260C;--bad-soft:#3A1714;--sh:0 1px 2px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}h1{font-size:20px;line-height:1.2;letter-spacing:-.01em}h2{font-size:15px}h3{font-size:13px}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mute{color:var(--mute)}.num{font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:0 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--soft)}.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}.btn.ghost:hover{background:var(--soft)}.btn.sq{width:36px;padding:0}.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:16px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--mute);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.ac{background:var(--ac-soft);color:var(--ac)}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor}
.av{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:50%;background:var(--ac-soft);color:var(--ac);font-size:11.5px;font-weight:700}
.in{min-height:36px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);min-width:0}
.in::placeholder{color:var(--mute)}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--soft);gap:2px}
.seg button{min-height:30px;padding:0 11px;border:0;border-radius:8px;background:none;font-size:13px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.12)}
.row{display:flex;align-items:center;gap:10px}.sp{margin-left:auto}
table{border-collapse:collapse;width:100%}th{font-size:12px;font-weight:600;color:var(--mute);text-align:left}th,td{padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}tbody tr:last-child td{border-bottom:0}
.scroll{overflow:auto}
/* App shell: sidebar, top bar, content */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
.side{display:flex;flex-direction:column;gap:4px;padding:14px 10px;background:var(--panel);border-right:1px solid var(--line);overflow:auto}
.logo{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;font-weight:700;font-size:15px}
.logo span{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--ac);color:var(--ac-ink)}
.side a{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 10px;border-radius:9px;color:var(--mute);font-weight:500;text-decoration:none}
.side a:hover{background:var(--soft);color:var(--ink)}.side a[aria-current=page]{background:var(--ac-soft);color:var(--ac);font-weight:600}
.side a b{margin-left:auto;font-size:11.5px;padding:0 7px;border-radius:99px;background:var(--soft)}
.side .who{margin-top:auto;display:flex;align-items:center;gap:9px;padding:10px 8px 2px;border-top:1px solid var(--line);font-size:13px}
.side .who small{display:block;color:var(--mute);font-size:12px}
.work{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.top .find{position:relative;flex:1;max-width:340px}.top .find .ic{position:absolute;left:10px;top:9px;color:var(--mute)}.top .find input{width:100%;padding-left:34px}
.main{flex:1;min-height:0;overflow:auto;padding:20px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.head p{color:var(--mute);font-size:13px}
#menu{display:none}
@media(max-width:860px){.app{grid-template-columns:1fr}#menu{display:inline-flex}.side{position:fixed;inset:0 auto 0 0;width:250px;z-index:30;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 0 100vmax rgba(0,0,0,0)}.side.open{transform:none;box-shadow:0 0 0 100vmax rgba(10,12,20,.45)}.top{padding:10px 14px}.main{padding:14px}.top .find{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.board{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:14px;align-items:start;overflow-x:auto;padding-bottom:10px}
.col{background:var(--soft);border-radius:var(--r);padding:10px;min-height:120px}.col.over{outline:2px dashed var(--ac);outline-offset:-2px}
.col header{display:flex;align-items:center;gap:8px;padding:4px 6px 10px}.col header b{font-size:13.5px}.col header span{font-size:12px;color:var(--mute);background:var(--panel);border-radius:99px;padding:0 8px}
.cards{list-style:none;margin:0;padding:0;display:grid;gap:8px;min-height:10px}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;box-shadow:0 1px 2px rgba(16,24,40,.05);cursor:grab;display:grid;gap:8px}.kc.drag{opacity:.4}.kc.line{box-shadow:0 -3px 0 var(--ac)}
.kc h3{font-weight:600;line-height:1.35}.kc .meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);white-space:nowrap}.kc .av{width:24px;height:24px;font-size:10px}
.kc select{margin-left:auto;font-size:12px;border:1px solid var(--line);border-radius:7px;background:var(--panel);min-height:26px;max-width:92px}
.tag{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:5px}
.addf{display:flex;gap:6px;margin-top:8px}.addf input{flex:1}
.addb{width:100%;margin-top:8px;justify-content:flex-start;color:var(--mute)}
</style>
<body>
<div class="app"><nav class="side" aria-label="Main"><div class="logo"><span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3 5 13.500h6L10 21l8-10.500h-6Z"/></svg></span>Northwind</div><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4Z"/></svg>Overview</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V4M4 20h16M8 16v-5M12 16V8M16 16v-3"/></svg>Analytics</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.6 3.4-5.5 6.5-5.5s5.500 1.900 6.500 5.500M16 4.800a3.500 3.500 0 0 1 0 6.400M18 14.800c1.700.8 2.900 2.500 3.500 5.200"/></svg>Customers</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13 6.500 5h11L20 13v6H4Z"/><path d="M4 13h5l1 2.500h4l1-2.500h5"/></svg>Inbox<b>12</b></a><a href="#" aria-current="page"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9.300 4v16M14.700 4v10"/></svg>Projects</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4Z"/></svg>Assistant</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Calendar</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3Z"/></svg>Files</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10.500h18"/></svg>Billing</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.600 5.600l2.100 2.100M16.300 16.300l2.100 2.100M5.600 18.400l2.100-2.100M16.300 7.700l2.100-2.100"/></svg>Settings</a><div class="who"><span class="av">AK</span><span>Amara Khan<small>Admin</small></span></div></nav>
<div class="work"><header class="top"><button class="btn sq ghost" id="menu" aria-label="Menu" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><label class="find"><span class="sr">Search</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.500"/><path d="m16 16 4.500 4.500"/></svg><input class="in" type="search" placeholder="Search cards"></label><span class="sp"></span><button class="btn sq ghost" id="theme" aria-pressed="false" aria-label="Switch to dark theme"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.500A8 8 0 0 1 9.500 4a8 8 0 1 0 10.500 10.500Z"/></svg></button><button class="btn sq ghost" aria-label="Notifications"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></button><span class="av" aria-label="Your account">AK</span></header>
<main class="main" id="main"><div class="head"><div><h1>Website relaunch</h1><p>Sprint 14 · 3 to 14 November</p></div><span class="sp"></span><span class="mute" style="font-size:12.5px">Drag a card, or focus it and press Alt + arrow keys</span></div>
<div class="board" id="board"></div><p class="sr" aria-live="assertive" id="say"></p></main></div></div>
<script>/* Shared helpers: element lookup, theme switch (add #dark to the address to start dark), mobile menu. */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const root=document.documentElement;
function setTheme(dark){root.dataset.theme=dark?'dark':'light';const b=$('#theme');if(b){b.setAttribute('aria-pressed',dark);b.setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme')}document.dispatchEvent(new Event('themechange'))}
setTheme(/dark/.test(location.hash));addEventListener('hashchange',()=>setTheme(/dark/.test(location.hash)));
$('#theme')?.addEventListener('click',()=>setTheme(root.dataset.theme!=='dark'));
{const m=$('#menu'),s=$('.side');if(m&&s){const set=o=>{s.classList.toggle('open',o);m.setAttribute('aria-expanded',o)};m.addEventListener('click',()=>set(!s.classList.contains('open')));addEventListener('keydown',e=>{if(e.key==='Escape')set(false)});document.addEventListener('click',e=>{if(s.classList.contains('open')&&!s.contains(e.target)&&!m.contains(e.target))set(false)})}}
function toast(t){let n=$('#toast');if(!n){n=document.createElement('div');n.id='toast';n.setAttribute('role','status');n.style.cssText='position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;z-index:60;transition:opacity .2s;max-width:calc(100vw - 32px)';document.body.append(n)}n.textContent=t;n.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>n.style.opacity=0,2000)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLS=['Backlog','In progress','Review','Done'],TAG={Design:['#EDE9FE','#5B21B6'],Build:['#DBEAFE','#1E40AF'],Content:['#FEF3C7','#92400E'],QA:['#DCFCE7','#166534']};
let CARDS=[['Audit the current sitemap','Content','Low','12 Nov','MO',2,0],['Write the pricing page copy','Content','High','13 Nov','PN',5,0],['Dark theme tokens','Design','Medium','14 Nov','TR',1,0],['Checkout flow prototype','Design','High','11 Nov','MO',8,1],['Build the nav menu','Build','Medium','12 Nov','TR',3,1],['Image pipeline','Build','Low','14 Nov','AK',0,1],['Home page hero','Design','High','10 Nov','PN',4,2],['Form validation','Build','Medium','11 Nov','AK',2,2],['Analytics events','QA','Low','7 Nov','TR',1,3],['Brand tokens','Design','Medium','5 Nov','MO',6,3]].map(([t,tag,pri,due,who,com,col],id)=>({id,t,tag,pri,due,who,com,col}));
let nid=CARDS.length,dragId=null;const PRI={High:'bad',Medium:'warn',Low:''};
const say=t=>{$('#say').textContent='';requestAnimationFrame(()=>$('#say').textContent=t)};
function render(focusId){$('#board').innerHTML=COLS.map((c,i)=>{const list=CARDS.filter(k=>k.col===i);return `<section class="col" data-col="${i}" aria-labelledby="c${i}"><header><b id="c${i}">${c}</b><span>${list.length}</span></header><ul class="cards">${list.map(k=>`<li class="kc" draggable="true" tabindex="0" data-id="${k.id}" aria-label="${esc(k.t)}, ${k.pri} priority, due ${k.due}"><div class="row"><span class="tag" style="background:${TAG[k.tag][0]};color:${TAG[k.tag][1]}">${k.tag}</span><span class="badge ${PRI[k.pri]}">${k.pri}</span><select aria-label="Move ${esc(k.t)} to">${COLS.map((n,j)=>`<option value="${j}" ${j===i?'selected':''}>${n}</option>`).join('')}</select></div><h3>${esc(k.t)}</h3><div class="meta"><span>Due ${k.due}</span><span>·</span><span>${k.com} comments</span><span class="av sp">${k.who}</span></div></li>`).join('')}</ul><button class="btn ghost addb" data-add="${i}">+ Add card</button></section>`}).join('');
 if(focusId!=null)$(`.kc[data-id="${focusId}"]`)?.focus()}
function move(id,col,before){const k=CARDS.find(x=>x.id===id);CARDS=CARDS.filter(x=>x!==k);k.col=col;const at=before==null?-1:CARDS.findIndex(x=>x.id===before);at<0?CARDS.push(k):CARDS.splice(at,0,k);render(id);const list=CARDS.filter(x=>x.col===col);say(`Moved ${k.t} to ${COLS[col]}, position ${list.indexOf(k)+1} of ${list.length}`)}
const B=$('#board');
B.addEventListener('dragstart',e=>{const c=e.target.closest('.kc');if(!c)return;dragId=+c.dataset.id;c.classList.add('drag');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)});
B.addEventListener('dragend',()=>{dragId=null;$$('.drag,.line,.over').forEach(x=>x.classList.remove('drag','line','over'))});
B.addEventListener('dragover',e=>{const col=e.target.closest('.col');if(!col||dragId==null)return;e.preventDefault();$$('.line,.over').forEach(x=>x.classList.remove('line','over'));const c=e.target.closest('.kc');c&&+c.dataset.id!==dragId?c.classList.add('line'):col.classList.add('over')});
B.addEventListener('drop',e=>{const col=e.target.closest('.col');if(!col||dragId==null)return;e.preventDefault();const c=e.target.closest('.kc');move(dragId,+col.dataset.col,c&&+c.dataset.id!==dragId?+c.dataset.id:null)});
B.addEventListener('change',e=>{if(e.target.matches('.kc select'))move(+e.target.closest('.kc').dataset.id,+e.target.value)});
B.addEventListener('keydown',e=>{const c=e.target.closest('.kc');if(!c||!e.altKey||e.target!==c)return;const k=CARDS.find(x=>x.id===+c.dataset.id),list=CARDS.filter(x=>x.col===k.col),i=list.indexOf(k);
 if(e.key==='ArrowRight'&&k.col<3){e.preventDefault();move(k.id,k.col+1)}else if(e.key==='ArrowLeft'&&k.col>0){e.preventDefault();move(k.id,k.col-1)}else if(e.key==='ArrowUp'&&i>0){e.preventDefault();move(k.id,k.col,list[i-1].id)}else if(e.key==='ArrowDown'&&i<list.length-1){e.preventDefault();move(k.id,k.col,list[i+2]?.id)}});
B.addEventListener('click',e=>{const b=e.target.closest('[data-add]');if(!b)return;const col=+b.dataset.add;b.outerHTML=`<form class="addf" data-col="${col}"><input class="in" aria-label="Card title" placeholder="Card title" required><button class="btn pri">Add</button></form>`;$(`form[data-col="${col}"] input`).focus()});
B.addEventListener('submit',e=>{e.preventDefault();const f=e.target,t=f.querySelector('input').value.trim();if(!t)return;const k={id:nid++,t,tag:'Build',pri:'Medium',due:'14 Nov',who:'AK',com:0,col:+f.dataset.col};CARDS.push(k);render(k.id);say('Added '+t+' to '+COLS[k.col])});
B.addEventListener('focusout',e=>{const f=e.target.closest('.addf');if(f&&!f.contains(e.relatedTarget)&&!f.querySelector('input').value)setTimeout(()=>render(),0)});
render();
</script>
</body>
</html>
