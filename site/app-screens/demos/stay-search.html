.pin{position:absolute;transform:translate(-50%,-100%) scale(calc(1/var(--z)));transform-origin:50% 100%;min-height:32px;padding:0 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums;box-shadow:0 2px 8px rgba(16,24,40,.22);transition:transform .15s}
.pin::after{content:"";position:absolute;left:50%;bottom:-5px;width:9px;height:9px;background:inherit;border:inherit;border-width:0 1px 1px 0;transform:translateX(-50%) rotate(45deg)}
.pin:hover,.pin.on,.pin[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg);z-index:2;transform:translate(-50%,-100%) scale(calc(1.1/var(--z)))}
.zoom{position:absolute;right:14px;top:14px;display:grid;border-radius:var(--rb);overflow:hidden;border:1px solid var(--line);box-shadow:var(--sh)}.zoom button{display:grid;place-items:center;width:38px;height:38px;border:0;background:var(--panel)}.zoom button+button{border-top:1px solid var(--line)}.zoom button:hover{background:var(--soft)}
.mini{position:absolute;left:14px;bottom:14px;width:min(330px,calc(100% - 28px));display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:8px;z-index:3}.mini img{width:96px;height:76px;object-fit:cover;border-radius:var(--rb);display:block}.mini h3{font-size:13.5px;line-height:1.3}.mini .x{position:absolute;top:4px;right:4px;min-height:28px;width:28px}
.none{padding:40px 20px;text-align:center;border:1px dashed var(--line);border-radius:var(--r);color:var(--mute);display:grid;gap:10px;justify-items:center}
#swap{display:none}

look();addEventListener('hashchange',look);

{const m=$('#menu'),s=$('.side');if(m&&s){const set=o=>{s.classList.toggle('open',o);m.setAttribute('aria-expanded',o)};m.addEventListener('click',()=>set(!s.classList.contains('open')));addEventListener('keydown',e=>{if(e.key==='Escape')set(false)});document.addEventListener('click',e=>{if(s.classList.contains('open')&&!s.contains(e.target)&&!m.contains(e.target))set(false)})}}

 {t:'Room in a Victorian terrace',a:'Chorlton',k:'Private room',r:4.7,n:58,p:52,free:0,bfast:1,img:'property-apartment-complex',x:70,y:74,sleeps:'1 double · shared bathroom'},
 {t:'Tenth-floor flat with a balcony',a:'Deansgate',k:'Entire flat',r:4.6,n:143,p:141,free:0,bfast:0,img:'property-apartment-building-balconies',x:24,y:60,sleeps:'2 beds · sleeps 4'},
 {t:'Garden room in the painted house',a:'Didsbury',k:'Private room',r:4.9,n:31,p:64,free:1,bfast:1,img:'property-colorful-apartment-building',x:46,y:90,sleeps:'1 double · own bathroom'},
 {t:'Tower studio by the station',a:'Piccadilly',k:'Entire studio',r:4.4,n:187,p:79,free:1,bfast:0,img:'property-apartment-high-rise-building',x:60,y:41,sleeps:'Studio · sleeps 2'}];
STAYS.forEach((s,i)=>{s.id=i;s.saved=i===1});
const F={entire:false,free:false,bfast:false};let sel=-1;
const shown=()=>{const mx=+$('#max').value,so=$('#sort').value;return STAYS.filter(s=>s.p<=mx&&(!F.entire||s.k.startsWith('Entire'))&&(!F.free||s.free)&&(!F.bfast||s.bfast)).sort((a,b)=>so==='price'?a.p-b.p:so==='rate'?b.r-a.r||b.n-a.n:a.id-b.id)};
const STAR='<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.500 2.600 5.400 5.900.8-4.300 4.100 1 5.800L12 16.900l-5.200 2.700 1-5.800L3.500 9.700l5.900-.8Z"/></svg>';
function draw(){const L=shown(),mx=+$('#max').value;$('#mv').textContent='£'+mx+(mx===150?'+':'');if(!L.find(s=>s.id===sel))sel=-1;
 $('#list').innerHTML=`<p><b role="status">${L.length} of ${STAYS.length} stays in Manchester</b><span class="mute" style="font-size:13px">13 to 15 November · ${NIGHTS} nights · 2 guests</span></p>`+(L.map(s=>`<article class="st ${s.id===sel?'on':''}" data-id="${s.id}" tabindex="0" aria-label="${s.t}, £${s.p} a night"><div class="ph"><img src="${PH+s.img}-640.webp" alt="" loading="lazy"><button class="hrt" aria-pressed="${s.saved}" aria-label="Save ${s.t}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20C6 15.500 3.500 12.500 3.500 9.200A4.200 4.200 0 0 1 12 7.500a4.200 4.200 0 0 1 8.500 1.700c0 3.300-2.500 6.300-8.500 10.800Z"/></svg></button></div>
 <div class="inf"><span class="mute">${s.k} · ${s.a}</span><h2>${s.t}</h2><span class="mute">${s.sleeps}</span><span class="rt">${STAR}${s.r.toFixed(1)} <span>(${s.n} reviews)</span></span><div class="tags">${s.free?'<span class="badge ok">Free cancellation</span>':''}${s.bfast?'<span class="badge">Breakfast included</span>':''}</div>
 <div class="pr"><b class="num">£${s.p}</b><span class="mute">a night · £${s.p*NIGHTS} total</span><button class="btn pri" data-book>Reserve</button></div></div></article>`).join('')||'<div class="none"><b>No stays match those filters</b><span>Raise the price limit or remove a filter.</span><button class="btn" id="reset">Clear filters</button></div>');
 $('#pins').innerHTML=STAYS.map(s=>`<span class="dn" style="left:${s.x}%;top:${s.y}%" aria-hidden="true">${s.a}</span>`).join('')+L.map(s=>`<button class="pin" data-id="${s.id}" style="left:${s.x}%;top:${s.y}%" aria-pressed="${s.id===sel}" aria-label="${s.t}, £${s.p} a night">£${s.p}</button>`).join('');mini()}
function mini(){const s=STAYS[sel];$('#mini').innerHTML=s?`<div class="card mini"><img src="${PH+s.img}-640.webp" alt=""><div><span class="mute" style="font-size:12px">${s.k} · ${s.a}</span><h3>${s.t}</h3><span class="rt">${STAR}${s.r.toFixed(1)}</span> <b class="num">· £${s.p}</b> <span class="mute">a night</span></div><button class="btn sq ghost x" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>`:''}
const lit=(id,on)=>{$$('.pin').forEach(p=>p.classList.toggle('on',on&&+p.dataset.id===id));$$('.st').forEach(c=>c.classList.toggle('on',(on&&+c.dataset.id===id)||+c.dataset.id===sel))};
['pointerover','focusin'].forEach(ev=>{$('#list').addEventListener(ev,e=>{const c=e.target.closest('.st');if(c)lit(+c.dataset.id,true)});$('#pins').addEventListener(ev,e=>{const p=e.target.closest('.pin');if(p)lit(+p.dataset.id,true)})});
$('#list').addEventListener('pointerleave',()=>lit(-1,false));$('#pins').addEventListener('pointerout',()=>lit(-1,false));
$('#pins').onclick=e=>{const p=e.target.closest('.pin');if(!p)return;sel=sel===+p.dataset.id?-1:+p.dataset.id;draw();$(`.st[data-id="${sel}"]`)?.scrollIntoView({block:'nearest',behavior:'smooth'});$(`.pin[data-id="${p.dataset.id}"]`).focus()};
$('#mini').onclick=e=>{if(e.target.closest('.x')){const id=sel;sel=-1;draw();$(`.pin[data-id="${id}"]`)?.focus()}};
$('#list').onclick=e=>{const c=e.target.closest('.st'),h=e.target.closest('.hrt');if(e.target.id==='reset'){Object.keys(F).forEach(k=>F[k]=false);$$('.pill').forEach(b=>b.setAttribute('aria-pressed',false));$('#max').value=150;draw();return}if(!c)return;const s=STAYS[c.dataset.id];
 if(h){s.saved=!s.saved;h.setAttribute('aria-pressed',s.saved);toast(s.saved?'Saved to your list':'Removed from your list')}else if(e.target.closest('[data-book]'))toast('Held for 15 minutes: '+s.t+', £'+s.p*NIGHTS)};
$$('.pill').forEach(b=>b.onclick=()=>{F[b.dataset.f]=!F[b.dataset.f];b.setAttribute('aria-pressed',F[b.dataset.f]);draw()});
$('#max').oninput=draw;$('#sort').onchange=draw;
$('#swap').onclick=e=>{const m=$('#lay').classList.toggle('m');e.currentTarget.lastChild.textContent=m?'List':'Map'};
$('.go').onclick=()=>toast(shown().length+' stays found in Manchester');
let zoom=1;$('.zoom').onclick=e=>{const b=e.target.closest('button');if(!b)return;zoom=Math.max(1,Math.min(1.9,zoom+b.dataset.z*.3));$('#map').style.setProperty('--z',zoom.toFixed(1))};
draw();
</script>
</body>
</html>
