<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendar</title>
<style>/* Tokens: change these to restyle the whole screen. --ac is the brand colour. */
:root{--bg:#FAFAFA;--panel:#FFFFFF;--ink:#141824;--mute:#5F677B;--line:#E3E6EE;--soft:#EEF0F6;--ac:#18181B;--ac-ink:#FFFFFF;--ac-soft:#F1F1F3;--ok:#12805C;--warn:#96560A;--bad:#C2362B;--ok-soft:#E3F5EC;--warn-soft:#FCF0D9;--bad-soft:#FBE6E3;--r:12px;--sh:0 1px 2px rgba(16,24,40,.05),0 8px 24px -16px rgba(16,24,40,.22);--font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
html[data-theme=dark]{--bg:#0E1117;--panel:#161A23;--ink:#ECEEF4;--mute:#9AA3B5;--line:#272D3A;--soft:#1D2230;--ac:#FAFAFA;--ac-ink:#0E1117;--ac-soft:#272A33;--ok:#4ADE9B;--warn:#F0B454;--bad:#FF8B80;--ok-soft:#12301F;--warn-soft:#33260C;--bad-soft:#3A1714;--sh:0 1px 2px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}h1{font-size:20px;line-height:1.2;letter-spacing:-.01em}h2{font-size:15px}h3{font-size:13px}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mute{color:var(--mute)}.num{font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:0 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--soft)}.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}.btn.ghost:hover{background:var(--soft)}.btn.sq{width:36px;padding:0}.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:16px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--mute);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.ac{background:var(--ac-soft);color:var(--ac)}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor}
.av{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:50%;background:var(--ac-soft);color:var(--ac);font-size:11.5px;font-weight:700}
.in{min-height:36px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);min-width:0}
.in::placeholder{color:var(--mute)}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--soft);gap:2px}
.seg button{min-height:30px;padding:0 11px;border:0;border-radius:8px;background:none;font-size:13px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.12)}
.row{display:flex;align-items:center;gap:10px}.sp{margin-left:auto}
table{border-collapse:collapse;width:100%}th{font-size:12px;font-weight:600;color:var(--mute);text-align:left}th,td{padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}tbody tr:last-child td{border-bottom:0}
.scroll{overflow:auto;position:relative}
/* App shell: sidebar, top bar, content */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
.side{display:flex;flex-direction:column;gap:4px;padding:14px 10px;background:var(--panel);border-right:1px solid var(--line);overflow:auto}
.logo{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;font-weight:700;font-size:15px}
.logo span{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--ac);color:var(--ac-ink)}
.side a{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 10px;border-radius:9px;color:var(--mute);font-weight:500;text-decoration:none}
.side a:hover{background:var(--soft);color:var(--ink)}.side a[aria-current=page]{background:var(--ac-soft);color:var(--ac);font-weight:600}
.side a b{margin-left:auto;font-size:11.5px;padding:0 7px;border-radius:99px;background:var(--soft)}
.side .who{margin-top:auto;display:flex;align-items:center;gap:9px;padding:10px 8px 2px;border-top:1px solid var(--line);font-size:13px}
.side .who small{display:block;color:var(--mute);font-size:12px}
.work{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.top .find{position:relative;flex:1;max-width:340px}.top .find .ic{position:absolute;left:10px;top:9px;color:var(--mute)}.top .find input{width:100%;padding-left:34px}
.main{flex:1;min-height:0;overflow:auto;padding:20px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.head p{color:var(--mute);font-size:13px}
#menu{display:none}
@media(max-width:860px){.app{grid-template-columns:1fr}#menu{display:inline-flex}.side{position:fixed;inset:0 auto 0 0;width:250px;z-index:30;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 0 100vmax rgba(0,0,0,0)}.side.open{transform:none;box-shadow:0 0 0 100vmax rgba(10,12,20,.45)}.top{padding:10px 14px}.main{padding:14px}.top .find{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.cal{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.wd{padding:8px 10px;font-size:12px;font-weight:600;color:var(--mute);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.day{all:unset;box-sizing:border-box;min-height:96px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;align-content:start;gap:3px;cursor:pointer;min-width:0}
.day:hover{background:var(--soft)}.day:focus-visible{outline:2px solid var(--ac);outline-offset:-2px}.day.out{color:var(--mute);background:color-mix(in srgb,var(--soft) 50%,transparent)}
.day .n{font-size:12.5px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}.day.today .n{box-shadow:inset 0 0 0 1.5px var(--ac)}.day[aria-pressed=true] .n{background:var(--ac);color:var(--ac-ink)}
.ev{font-size:11.5px;padding:1px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.more{font-size:11px;color:var(--mute);padding-left:4px}
.side ul{list-style:none;margin:10px 0 14px;padding:0;display:grid;gap:8px}.side li{display:grid;grid-template-columns:4px 1fr;gap:10px;font-size:13.5px}.side li i{border-radius:2px;background:var(--c)}.side li small{display:block;color:var(--mute)}
.add{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px}.add .in{width:100%}
.ag{list-style:none;margin:0;padding:0}.ag li{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}.ag li:last-child{border:0}
@media(max-width:900px){.cal{grid-template-columns:1fr}}@media(max-width:700px){.day{min-height:58px}.ev{display:none}.day .dot{display:block}.wd{padding:6px 2px;text-align:center}}
.dot{display:none;width:6px;height:6px;border-radius:50%;background:var(--ac);margin-left:9px}
</style>
<body>
<div class="app"><nav class="side" aria-label="Main"><div class="logo"><span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3 5 13.500h6L10 21l8-10.500h-6Z"/></svg></span>Northwind</div><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4Z"/></svg>Overview</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V4M4 20h16M8 16v-5M12 16V8M16 16v-3"/></svg>Analytics</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.6 3.4-5.5 6.5-5.5s5.500 1.900 6.500 5.500M16 4.800a3.500 3.500 0 0 1 0 6.400M18 14.800c1.700.8 2.900 2.500 3.500 5.200"/></svg>Customers</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13 6.500 5h11L20 13v6H4Z"/><path d="M4 13h5l1 2.500h4l1-2.500h5"/></svg>Inbox<b>12</b></a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9.300 4v16M14.700 4v10"/></svg>Projects</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4Z"/></svg>Assistant</a><a href="#" aria-current="page"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Calendar</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3Z"/></svg>Files</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10.500h18"/></svg>Billing</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.600 5.600l2.100 2.100M16.300 16.300l2.100 2.100M5.600 18.400l2.100-2.100M16.300 7.700l2.100-2.100"/></svg>Settings</a><div class="who"><span class="av">AK</span><span>Amara Khan<small>Admin</small></span></div></nav>
<div class="work"><header class="top"><button class="btn sq ghost" id="menu" aria-label="Menu" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><label class="find"><span class="sr">Search</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.500"/><path d="m16 16 4.500 4.500"/></svg><input class="in" type="search" placeholder="Search events"></label><span class="sp"></span><button class="btn sq ghost" id="theme" aria-pressed="false" aria-label="Switch to dark theme"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.500A8 8 0 0 1 9.500 4a8 8 0 1 0 10.500 10.500Z"/></svg></button><button class="btn sq ghost" aria-label="Notifications"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></button><span class="av" aria-label="Your account">AK</span></header>
<main class="main" id="main"><div class="head"><h1 id="title" aria-live="polite"></h1><button class="btn sq" id="prev" aria-label="Previous month">‹</button><button class="btn sq" id="next" aria-label="Next month">›</button><button class="btn" id="today">Today</button><span class="sp"></span><div class="seg" role="group" aria-label="View"><button data-v="month" aria-pressed="true">Month</button><button data-v="agenda" aria-pressed="false">Agenda</button></div></div>
<div class="cal"><section class="card" id="view" style="overflow:hidden"></section>
<aside class="card pad side"><h2 id="sd"></h2><ul id="sl"></ul><form class="add" id="add"><label class="sr" for="et">Event title</label><input class="in" id="et" placeholder="Add an event" required><div class="row"><label class="sr" for="tm">Time</label><input class="in" id="tm" type="time" value="10:00" style="flex:1"><label class="sr" for="cl">Calendar</label><select class="in" id="cl" style="flex:1"><option>Work</option><option>Personal</option><option>Team</option></select></div><button class="btn pri">Add event</button></form></aside></div></main></div></div>
<script>/* Shared helpers: element lookup, theme switch (add #dark to the address to start dark), mobile menu. */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const root=document.documentElement;
function setTheme(dark){root.dataset.theme=dark?'dark':'light';const b=$('#theme');if(b){b.setAttribute('aria-pressed',dark);b.setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme')}document.dispatchEvent(new Event('themechange'))}
setTheme(/dark/.test(location.hash));addEventListener('hashchange',()=>setTheme(/dark/.test(location.hash)));
$('#theme')?.addEventListener('click',()=>setTheme(root.dataset.theme!=='dark'));
{const m=$('#menu'),s=$('.side');if(m&&s){const set=o=>{s.classList.toggle('open',o);m.setAttribute('aria-expanded',o)};m.addEventListener('click',()=>set(!s.classList.contains('open')));addEventListener('keydown',e=>{if(e.key==='Escape')set(false)});document.addEventListener('click',e=>{if(s.classList.contains('open')&&!s.contains(e.target)&&!m.contains(e.target))set(false)})}}
function toast(t){let n=$('#toast');if(!n){n=document.createElement('div');n.id='toast';n.setAttribute('role','status');n.style.cssText='position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;z-index:60;transition:opacity .2s;max-width:calc(100vw - 32px)';document.body.append(n)}n.textContent=t;n.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>n.style.opacity=0,2000)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COL={Work:'#2563EB',Personal:'#12805C',Team:'#E4572E'},TODAY=new Date(2026,10,11),iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let EV=[['2026-11-02','09:30','Sprint planning','Team'],['2026-11-04','13:00','Lunch with Maya','Personal'],['2026-11-05','10:00','Design review','Work'],['2026-11-11','09:00','Stand-up','Team'],['2026-11-11','11:30','Pricing page copy','Work'],['2026-11-11','15:00','Dentist','Personal'],['2026-11-11','16:30','Investor update','Work'],['2026-11-13','14:00','Launch rehearsal','Team'],['2026-11-17','10:00','Customer call: Tidewater','Work'],['2026-11-19','18:30','Football','Personal'],['2026-11-24','09:30','Quarterly review','Work'],['2026-11-27','12:00','Team lunch','Team'],['2026-12-03','10:00','Roadmap workshop','Team']].map(([date,time,title,cal])=>({date,time,title,cal}));
const st={y:2026,m:10,sel:iso(TODAY),view:'month'},on=d=>EV.filter(e=>e.date===d).sort((a,b)=>a.time.localeCompare(b.time));
function render(focus){const first=new Date(st.y,st.m,1),start=new Date(st.y,st.m,1-((first.getDay()+6)%7));$('#title').textContent=first.toLocaleString('en-GB',{month:'long',year:'numeric'});
 if(st.view==='month'){let h='<div class="grid" role="grid" aria-label="'+$('#title').textContent+'">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="wd" role="columnheader">${d}</div>`).join('');
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=iso(d),es=on(k);h+=`<button class="day ${d.getMonth()!==st.m?'out':''} ${k===iso(TODAY)?'today':''}" data-d="${k}" aria-pressed="${k===st.sel}" tabindex="${k===st.sel?0:-1}" aria-label="${d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}, ${es.length} event${es.length===1?'':'s'}"><span class="n">${d.getDate()}</span>${es.length?'<span class="dot"></span>':''}${es.slice(0,3).map(e=>`<span class="ev" style="--c:${COL[e.cal]}">${esc(e.title)}</span>`).join('')}${es.length>3?`<span class="more">+${es.length-3} more</span>`:''}</button>`}
  $('#view').innerHTML=h+'</div>'}
 else{const days=[...new Set(EV.map(e=>e.date))].filter(d=>d>=iso(TODAY)).sort().slice(0,14);$('#view').innerHTML='<ul class="ag">'+days.map(d=>`<li><b>${new Date(d).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}</b><span>${on(d).map(e=>`<div><span class="mute num">${e.time}</span> ${esc(e.title)} <span class="badge">${e.cal}</span></div>`).join('')}</span></li>`).join('')+'</ul>'}
 const sd=new Date(st.sel);$('#sd').textContent=sd.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});$('#sl').innerHTML=on(st.sel).map(e=>`<li style="--c:${COL[e.cal]}"><i></i><span>${esc(e.title)}<small>${e.time} · ${e.cal}</small></span></li>`).join('')||'<li style="grid-template-columns:1fr" class="mute">Nothing planned.</li>';
 if(focus)$(`.day[data-d="${st.sel}"]`)?.focus()}
const shift=n=>{const d=new Date(st.y,st.m+n,1);st.y=d.getFullYear();st.m=d.getMonth();render()};$('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);$('#today').onclick=()=>{st.y=2026;st.m=10;st.sel=iso(TODAY);render()};
$$('.seg button').forEach(b=>b.onclick=()=>{st.view=b.dataset.v;$$('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
$('#view').addEventListener('click',e=>{const d=e.target.closest('.day');if(d){st.sel=d.dataset.d;render(true)}});
$('#view').addEventListener('keydown',e=>{const d=e.target.closest('.day');if(!d)return;const m={ArrowRight:1,ArrowLeft:-1,ArrowDown:7,ArrowUp:-7}[e.key];if(!m)return;e.preventDefault();const n=new Date(st.sel);n.setDate(n.getDate()+m);st.sel=iso(n);if(n.getMonth()!==st.m){st.y=n.getFullYear();st.m=n.getMonth()}render(true)});
$('#add').onsubmit=e=>{e.preventDefault();const t=$('#et').value.trim();if(!t)return;EV.push({date:st.sel,time:$('#tm').value||'09:00',title:t,cal:$('#cl').value});$('#et').value='';render();toast('Event added')};
render();
</script>
</body>
</html>
