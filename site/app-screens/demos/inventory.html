<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product inventory</title>
<style>/* Tokens: change these to restyle the whole screen. --ac is the brand colour. */
:root{--bg:#FAFAFA;--panel:#FFFFFF;--ink:#141824;--mute:#5F677B;--line:#E3E6EE;--soft:#EEF0F6;--ac:#18181B;--ac-ink:#FFFFFF;--ac-soft:#F1F1F3;--ok:#12805C;--warn:#96560A;--bad:#C2362B;--ok-soft:#E3F5EC;--warn-soft:#FCF0D9;--bad-soft:#FBE6E3;--r:12px;--sh:0 1px 2px rgba(16,24,40,.05),0 8px 24px -16px rgba(16,24,40,.22);--font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
html[data-theme=dark]{--bg:#0E1117;--panel:#161A23;--ink:#ECEEF4;--mute:#9AA3B5;--line:#272D3A;--soft:#1D2230;--ac:#FAFAFA;--ac-ink:#0E1117;--ac-soft:#272A33;--ok:#4ADE9B;--warn:#F0B454;--bad:#FF8B80;--ok-soft:#12301F;--warn-soft:#33260C;--bad-soft:#3A1714;--sh:0 1px 2px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}h1{font-size:20px;line-height:1.2;letter-spacing:-.01em}h2{font-size:15px}h3{font-size:13px}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mute{color:var(--mute)}.num{font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:0 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--soft)}.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}.btn.ghost:hover{background:var(--soft)}.btn.sq{width:36px;padding:0}.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:16px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--mute);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.ac{background:var(--ac-soft);color:var(--ac)}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor}
.av{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:50%;background:var(--ac-soft);color:var(--ac);font-size:11.5px;font-weight:700}
.in{min-height:36px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);min-width:0}
.in::placeholder{color:var(--mute)}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--soft);gap:2px}
.seg button{min-height:30px;padding:0 11px;border:0;border-radius:8px;background:none;font-size:13px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.12)}
.row{display:flex;align-items:center;gap:10px}.sp{margin-left:auto}
table{border-collapse:collapse;width:100%}th{font-size:12px;font-weight:600;color:var(--mute);text-align:left}th,td{padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}tbody tr:last-child td{border-bottom:0}
.scroll{overflow:auto;position:relative}
/* App shell: sidebar, top bar, content */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
.side{display:flex;flex-direction:column;gap:4px;padding:14px 10px;background:var(--panel);border-right:1px solid var(--line);overflow:auto}
.logo{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;font-weight:700;font-size:15px}
.logo span{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--ac);color:var(--ac-ink)}
.side a{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 10px;border-radius:9px;color:var(--mute);font-weight:500;text-decoration:none}
.side a:hover{background:var(--soft);color:var(--ink)}.side a[aria-current=page]{background:var(--ac-soft);color:var(--ac);font-weight:600}
.side a b{margin-left:auto;font-size:11.5px;padding:0 7px;border-radius:99px;background:var(--soft)}
.side .who{margin-top:auto;display:flex;align-items:center;gap:9px;padding:10px 8px 2px;border-top:1px solid var(--line);font-size:13px}
.side .who small{display:block;color:var(--mute);font-size:12px}
.work{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.top .find{position:relative;flex:1;max-width:340px}.top .find .ic{position:absolute;left:10px;top:9px;color:var(--mute)}.top .find input{width:100%;padding-left:34px}
.main{flex:1;min-height:0;overflow:auto;padding:20px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.head p{color:var(--mute);font-size:13px}
#menu{display:none}
@media(max-width:860px){.app{grid-template-columns:1fr}#menu{display:inline-flex}.side{position:fixed;inset:0 auto 0 0;width:250px;z-index:30;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 0 100vmax rgba(0,0,0,0)}.side.open{transform:none;box-shadow:0 0 0 100vmax rgba(10,12,20,.45)}.top{padding:10px 14px}.main{padding:14px}.top .find{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:14px}
.big{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:2px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.bar .in{flex:1 1 180px}.bar select.in{flex:0 1 170px}
.sw{all:unset;box-sizing:border-box;flex:none;width:40px;height:24px;border-radius:99px;background:var(--line);position:relative;cursor:pointer}.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}.sw[aria-checked=true]{background:var(--ac)}.sw[aria-checked=true]::after{transform:translateX(16px)}.sw:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
html[data-theme=dark] .sw[aria-checked=true]::after{background:var(--ac-ink)}
.pr{display:flex;align-items:center;gap:10px}.pr i{width:34px;height:34px;border-radius:9px;flex:none}
.stp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stp button{width:30px;height:30px;border:0;background:none;font-size:16px;line-height:1}.stp button:hover{background:var(--soft)}.stp b{min-width:38px;text-align:center}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);padding:20px;width:min(420px,calc(100vw - 32px));box-shadow:0 24px 60px -20px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(10,12,20,.45)}
dialog form{display:grid;gap:12px}dialog label{display:grid;gap:5px;font-size:13px;font-weight:600}.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--bad);font-size:13px;min-height:1.2em}
</style>
<body>
<div class="app"><nav class="side" aria-label="Main"><div class="logo"><span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3 5 13.500h6L10 21l8-10.500h-6Z"/></svg></span>Northwind</div><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4Z"/></svg>Overview</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V4M4 20h16M8 16v-5M12 16V8M16 16v-3"/></svg>Analytics</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.6 3.4-5.5 6.5-5.5s5.500 1.900 6.500 5.500M16 4.800a3.500 3.500 0 0 1 0 6.400M18 14.800c1.700.8 2.900 2.500 3.500 5.200"/></svg>Customers</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13 6.500 5h11L20 13v6H4Z"/><path d="M4 13h5l1 2.500h4l1-2.500h5"/></svg>Inbox<b>12</b></a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9.300 4v16M14.700 4v10"/></svg>Projects</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4Z"/></svg>Assistant</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Calendar</a><a href="#" aria-current="page"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3Z"/></svg>Files</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10.500h18"/></svg>Billing</a><a href="#" ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.600 5.600l2.100 2.100M16.300 16.300l2.100 2.100M5.600 18.400l2.100-2.100M16.300 7.700l2.100-2.100"/></svg>Settings</a><div class="who"><span class="av">AK</span><span>Amara Khan<small>Admin</small></span></div></nav>
<div class="work"><header class="top"><button class="btn sq ghost" id="menu" aria-label="Menu" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><label class="find"><span class="sr">Search</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.500"/><path d="m16 16 4.500 4.500"/></svg><input class="in" type="search" placeholder="Search the whole shop"></label><span class="sp"></span><button class="btn sq ghost" id="theme" aria-pressed="false" aria-label="Switch to dark theme"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.500A8 8 0 0 1 9.500 4a8 8 0 1 0 10.500 10.500Z"/></svg></button><button class="btn sq ghost" aria-label="Notifications"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></button><span class="av" aria-label="Your account">AK</span></header>
<main class="main" id="main"><div class="head"><div><h1>Inventory</h1><p>Stock across the Leeds warehouse, counted this morning.</p></div><span class="sp"></span><button class="btn pri" id="add">+ Add product</button></div>
<section class="g4" aria-label="Stock totals" id="stats"></section>
<section class="card"><div class="bar"><label class="sr" for="q">Search products</label><input class="in" id="q" type="search" placeholder="Search by name or SKU"><label class="sr" for="cat">Category</label><select class="in" id="cat"></select><span class="row"><button class="sw" id="low" role="switch" aria-checked="false" aria-labelledby="lowl"></button><span id="lowl">Low stock only</span></span></div>
<div class="scroll"><table><thead><tr><th>Product</th><th>SKU</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Listed</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<dialog id="dlg" aria-labelledby="dt"><form id="form" novalidate><h2 id="dt">Add a product</h2>
<label>Name<input class="in" name="name" autocomplete="off"></label>
<label>Category<select class="in" name="cat"></select></label>
<div class="f2"><label>Price, £<input class="in" name="price" inputmode="decimal"></label><label>Stock<input class="in" name="stock" inputmode="numeric" value="0"></label></div>
<p class="err" id="err" role="alert"></p>
<div class="row"><span class="sp"></span><button class="btn" type="button" id="cancel">Cancel</button><button class="btn pri">Add product</button></div></form></dialog></main></div></div>
<script>/* Shared helpers: element lookup, theme switch (add #dark to the address to start dark), mobile menu. */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const root=document.documentElement;
function setTheme(dark){root.dataset.theme=dark?'dark':'light';const b=$('#theme');if(b){b.setAttribute('aria-pressed',dark);b.setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme')}document.dispatchEvent(new Event('themechange'))}
setTheme(/dark/.test(location.hash));addEventListener('hashchange',()=>setTheme(/dark/.test(location.hash)));
$('#theme')?.addEventListener('click',()=>setTheme(root.dataset.theme!=='dark'));
{const m=$('#menu'),s=$('.side');if(m&&s){const set=o=>{s.classList.toggle('open',o);m.setAttribute('aria-expanded',o)};m.addEventListener('click',()=>set(!s.classList.contains('open')));addEventListener('keydown',e=>{if(e.key==='Escape')set(false)});document.addEventListener('click',e=>{if(s.classList.contains('open')&&!s.contains(e.target)&&!m.contains(e.target))set(false)})}}
function toast(t){let n=$('#toast');if(!n){n=document.createElement('div');n.id='toast';n.setAttribute('role','status');n.style.cssText='position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;z-index:60;transition:opacity .2s;max-width:calc(100vw - 32px)';document.body.append(n)}n.textContent=t;n.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>n.style.opacity=0,2000)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* DATA: name, SKU, category, price, stock, listed, swatch colour */
const LOW=10,ITEMS=[['Linen throw, oat','TX-1042','Textiles',68,34,true,'#D9C7A8'],['Stoneware mug, moss','CR-2210','Ceramics',18,7,true,'#7A8C6A'],['Beeswax candle set','HM-3015','Home',24,0,true,'#E6B450'],['Oak serving board','KT-4107','Kitchen',42,58,true,'#A9764A'],['Wool cushion, rust','TX-1077','Textiles',39,12,true,'#B5553C'],['Speckled bowl, large','CR-2254','Ceramics',32,4,true,'#C9C2B4'],['Brass candle holder','HM-3090','Home',27,21,false,'#C8A24A'],['Linen apron, ink','KT-4160','Kitchen',36,9,true,'#2F3A56'],['Glass carafe','KT-4188','Kitchen',29,0,false,'#9CC3C9'],['Cotton napkins, set of 4','TX-1103','Textiles',22,46,true,'#E8DDD0']];
const CATS=['All categories',...new Set(ITEMS.map(i=>i[2]))];
let q='',cat=CATS[0],low=false;
const gbp=n=>'£'+n.toLocaleString('en-GB',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});
const state=n=>n===0?['bad','Out of stock']:n<LOW?['warn','Low stock']:['ok','In stock'];
$('#cat').innerHTML=CATS.map(c=>`<option>${c}</option>`).join('');$('#form [name=cat]').innerHTML=CATS.slice(1).map(c=>`<option>${c}</option>`).join('');
function stats(){const v=ITEMS.reduce((a,i)=>a+i[3]*i[4],0);
 $('#stats').innerHTML=[['Products',ITEMS.length,ITEMS.filter(i=>i[5]).length+' listed in the shop'],['Low stock',ITEMS.filter(i=>i[4]>0&&i[4]<LOW).length,'Fewer than '+LOW+' left'],['Out of stock',ITEMS.filter(i=>!i[4]).length,'Hidden from buyers'],['Stock value',gbp(v),'At retail price']].map(s=>`<article class="card pad"><span class="mute">${s[0]}</span><div class="big num">${s[1]}</div><span class="mute" style="font-size:13px">${s[2]}</span></article>`).join('')}
function rows(){const list=ITEMS.filter(i=>(cat===CATS[0]||i[2]===cat)&&(!low||i[4]<LOW)&&(i[0]+i[1]).toLowerCase().includes(q));
 $('#rows').innerHTML=list.map(i=>{const k=ITEMS.indexOf(i),s=state(i[4]);return `<tr><td><span class="pr"><i style="background:${i[6]}"></i><b>${esc(i[0])}</b></span></td><td class="num mute">${i[1]}</td><td>${i[2]}</td><td class="num">${gbp(i[3])}</td><td><span class="stp" role="group" aria-label="Stock for ${esc(i[0])}"><button data-k="${k}" data-d="-1" aria-label="Remove one" ${i[4]?'':'disabled'}>−</button><b class="num" aria-live="polite">${i[4]}</b><button data-k="${k}" data-d="1" aria-label="Add one">+</button></span></td><td><span class="badge ${s[0]}"><i></i>${s[1]}</span></td><td><button class="sw" role="switch" data-l="${k}" aria-checked="${i[5]}" aria-label="${esc(i[0])} listed in the shop"></button></td></tr>`}).join('')||'<tr><td colspan="7" class="mute" style="padding:28px 14px;text-align:center">No products match. Clear the search or filters to see everything.</td></tr>'}
const draw=()=>{stats();rows()};
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();rows()};$('#cat').onchange=e=>{cat=e.target.value;rows()};
$('#low').onclick=e=>{low=!low;e.currentTarget.setAttribute('aria-checked',low);rows()};
$('#rows').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.d){const i=ITEMS[b.dataset.k];i[4]=Math.max(0,i[4]+ +b.dataset.d);draw();$(`#rows button[data-k="${b.dataset.k}"][data-d="${i[4]||b.dataset.d==='1'?b.dataset.d:'1'}"]`)?.focus()}
 else if(b.dataset.l){const i=ITEMS[b.dataset.l];i[5]=!i[5];draw();$(`#rows [data-l="${b.dataset.l}"]`)?.focus();toast(i[0]+(i[5]?' is listed':' is hidden'))}};
const dlg=$('#dlg'),form=$('#form');
$('#add').onclick=()=>{form.reset();$('#err').textContent='';dlg.showModal();form.name.focus()};$('#cancel').onclick=()=>dlg.close();
dlg.onclick=e=>{if(e.target===dlg)dlg.close()};
form.onsubmit=e=>{e.preventDefault();const name=form.name.value.trim(),price=parseFloat(form.price.value),stock=parseInt(form.stock.value,10);
 if(!name){$('#err').textContent='Give the product a name.';form.name.focus();return}
 if(!(price>0)){$('#err').textContent='Enter a price above zero.';form.price.focus();return}
 if(!(stock>=0)){$('#err').textContent='Stock must be zero or more.';form.stock.focus();return}
 const c=form.cat.value;ITEMS.unshift([name,c.slice(0,2).toUpperCase()+'-'+(5000+ITEMS.length),c,price,stock,true,'#B8BCC8']);dlg.close();draw();toast(name+' added')};
draw();
</script>
</body>
</html>
