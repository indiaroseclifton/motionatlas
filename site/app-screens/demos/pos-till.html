 <button class="btn sq ghost" id="theme" aria-pressed="false" aria-label="Switch to dark theme"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.500A8 8 0 0 1 9.500 4a8 8 0 1 0 10.500 10.500Z"/></svg></button><span class="row who"><span class="av">MO</span><span>Maya</span></span></header>

<script>/* Shared helpers: element lookup, theme switch (add #dark to the address to start dark), mobile menu. */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const root=document.documentElement;
function setTheme(dark){root.dataset.theme=dark?'dark':'light';const b=$('#theme');if(b){b.setAttribute('aria-pressed',dark);b.setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme')}document.dispatchEvent(new Event('themechange'))}
/* The address can carry a look, for example #dark, #ocean-soft or #sand-serif-dark. A copied file can set the same thing on the html element. */
const SKINS=['ocean','forest','sunset','rose','sand'],LOOKS=['soft','sharp','serif','compact'],PRE=root.dataset.theme==='dark';
function look(){const h=location.hash,w=h.slice(1).toLowerCase().match(/[a-z]+/g)||[];
 if(h){const s=w.find(x=>SKINS.includes(x)),l=w.find(x=>LOOKS.includes(x));s?root.dataset.skin=s:delete root.dataset.skin;l?root.dataset.look=l:delete root.dataset.look}
 setTheme(h?/dark/.test(h):PRE)}
look();addEventListener('hashchange',look);
$('#theme')?.addEventListener('click',()=>setTheme(root.dataset.theme!=='dark'));
{const m=$('#menu'),s=$('.side');if(m&&s){const set=o=>{s.classList.toggle('open',o);m.setAttribute('aria-expanded',o)};m.addEventListener('click',()=>set(!s.classList.contains('open')));addEventListener('keydown',e=>{if(e.key==='Escape')set(false)});document.addEventListener('click',e=>{if(s.classList.contains('open')&&!s.contains(e.target)&&!m.contains(e.target))set(false)})}}
function toast(t){let n=$('#toast');if(!n){n=document.createElement('div');n.id='toast';n.setAttribute('role','status');n.style.cssText='position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;z-index:60;transition:opacity .2s;max-width:calc(100vw - 32px)';document.body.append(n)}n.textContent=t;n.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>n.style.opacity=0,2000)}

const PH='../../assets/photos/',ITEMS=[['Flat white',3.4,'Coffee','drink-blue-coffee-cup'],['Cappuccino',3.6,'Coffee','drink-frothy-coffee-in-a-green-cup'],['Latte',3.6,'Coffee','drink-black-coffee-cup'],['Black coffee',2.8,'Coffee','drink-minimalist-black-coffee'],['Pot of tea',3,'Coffee','cafe-copper-tea-kettles'],['Croissant',2.9,'Pastries','food-alisa-anton-2016-03-12'],['Pain au chocolat',3.2,'Pastries','bakery-mink-mingle-2017'],['Iced doughnut',2.7,'Pastries','bakery-sweet-tooth'],['Seeded tin loaf',4.2,'Bread','bakery-fresh-rustic-bread'],['Country loaf',4.8,'Bread','bakery-loaves-of-bread'],['White bloomer',3.6,'Bread','bakery-fresh-bread-and-butter'],['Farmhouse loaf',3.9,'Bread','food-bread-on-the-table'],['Fresh tagliatelle',7.5,'Lunch','food-handmade-pasta-noodles'],['Gnocchi with pesto',8.2,'Lunch','food-gluten-free-gnocchi']];
const CATS=['All','Coffee','Pastries','Bread','Lunch'],gbp=n=>'£'+n.toFixed(2);

const totals=()=>{const sub=[...order].reduce((a,[i,q])=>a+ITEMS[i][1]*q,0),disc=loyal?Math.round(sub*10)/100:0,tot=sub-disc;return {sub,disc,tot,vat:tot/6,n:[...order.values()].reduce((a,b)=>a+b,0)}};
function ticket(){const t=totals();$('#ono').textContent='Order '+String(no).padStart(4,'0');
 $('#lines').innerHTML=[...order].map(([i,q])=>`<li><span><b>${ITEMS[i][0]}</b><small>${gbp(ITEMS[i][1])} each</small></span><span class="stp"><button data-d="-1" data-i="${i}" aria-label="One fewer ${ITEMS[i][0]}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><b aria-label="Quantity">${q}</b><button data-d="1" data-i="${i}" aria-label="One more ${ITEMS[i][0]}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></span><b class="t">${gbp(ITEMS[i][1]*q)}</b></li>`).join('')||'<li class="empty" style="display:grid;border:0"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6Z"/><path d="M9 8V7a3 3 0 0 1 6 0v1"/></svg><span>Nothing here yet.<br>Tap a product to add it.</span></li>';
 $('#sum').innerHTML=`<div><span id="ll">Loyalty card, 10% off</span><button class="sw" role="switch" aria-checked="${loyal}" aria-labelledby="ll" id="loyal"></button></div><div class="mute"><span>Subtotal, ${t.n} item${t.n===1?'':'s'}</span><span>${gbp(t.sub)}</span></div>${loyal?`<div class="mute"><span>Loyalty discount</span><span>−${gbp(t.disc)}</span></div>`:''}<div class="mute"><span>Includes VAT at 20%</span><span>${gbp(t.vat)}</span></div><div class="tot"><span>Total</span><span>${gbp(t.tot)}</span></div><div class="pay"><button class="btn" id="cash" ${t.n?'':'disabled'}>Cash</button><button class="btn pri" id="card" ${t.n?'':'disabled'}><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10.500h18"/></svg>Card</button></div>`}

$('#cats').onclick=e=>{const b=e.target.closest('button');if(b){cat=b.textContent;grid();$$('#cats button').find(x=>x.textContent===cat).focus()}};
$('#grid').onclick=e=>{const b=e.target.closest('.it');if(!b)return;const i=+b.dataset.i;order.set(i,(order.get(i)||0)+1);draw();$(`.it[data-i="${i}"]`).focus()};
$('#lines').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;const i=+b.dataset.i,q=order.get(i)+ +b.dataset.d;q>0?order.set(i,q):order.delete(i);draw();$(`#lines [data-i="${i}"][data-d="${b.dataset.d}"]`)?.focus()};
$('#where').onclick=e=>{const b=e.target.closest('button');if(b)$$('#where button').forEach(x=>x.setAttribute('aria-pressed',x===b))};
/* Payment */
const sheet=$('#sheet'),sd=$('#sd');let given=0;
const show=h=>{sd.innerHTML=h;sheet.hidden=false;(sd.querySelector('[autofocus]')||sd).focus()},hide=()=>{sheet.hidden=true};
function receipt(how,change){const t=totals();show(`<div class="done"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.500 4.500 4.500L19 7.500"/></svg></div><h2 id="sh" style="font-size:22px">Paid ${gbp(t.tot)} by ${how}</h2>${change?`<p class="mute">Change due</p><div class="chg">${gbp(change)}</div>`:'<p class="mute">Approved. Hand over the receipt if they want one.</p>'}<div class="row" style="justify-content:center"><button class="btn" id="rc"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V4h10v5M7 17H4v-7h16v7h-3"/><rect x="7" y="14" width="10" height="6"/></svg>Print receipt</button><button class="btn pri" id="nw" autofocus>New order</button></div>`)}
function cash(){const t=totals().tot,up=n=>Math.ceil(t/n)*n,opts=[...new Set([t,up(5),up(10),up(20)])];if(!given)given=opts[1]||t;
 show(`<h2 id="sh" style="font-size:20px">Cash payment</h2><p class="mute">Total ${gbp(t)}. How much were you handed?</p><div class="quick" role="group" aria-label="Amount handed over">${opts.map(o=>`<button data-g="${o}" aria-pressed="${o===given}">${o===t?'Exact':gbp(o)}</button>`).join('')}</div><p class="mute">Change due</p><div class="chg" aria-live="polite">${gbp(given-t)}</div><div class="row" style="justify-content:center"><button class="btn" data-x>Cancel</button><button class="btn pri" id="take" autofocus>Take payment</button></div>`)}
$('#sum').onclick=e=>{const id=e.target.closest('button')?.id;if(id==='loyal'){loyal=!loyal;ticket();$('#loyal').focus()}else if(id==='cash'){given=0;cash()}
 else if(id==='card'){show(`<div class="spin" role="img" aria-label="Waiting"></div><h2 id="sh" style="font-size:20px">Present card</h2><p class="mute">Waiting for the customer to tap, ${gbp(totals().tot)}.</p><div><button class="btn" data-x>Cancel</button></div>`);clearTimeout(cash.t);cash.t=setTimeout(()=>{if(!sheet.hidden)receipt('card',0)},1600)}};
sd.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.g){given=+b.dataset.g;cash()}else if(b.id==='take')receipt('cash',given-totals().tot)
 else if(b.id==='rc')toast('Receipt sent to the printer')
 else if(b.id==='nw'){order.clear();loyal=false;no++;hide();draw();toast('Order '+String(no-1).padStart(4,'0')+' closed')}
 else if('x' in b.dataset){clearTimeout(cash.t);hide();$('#card')?.focus()}};
addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheet.hidden&&!$('#nw')){clearTimeout(cash.t);hide()}});
const tick=()=>$('#clock').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});tick();setInterval(tick,20000);
draw();
</script>
</body>
</html>
