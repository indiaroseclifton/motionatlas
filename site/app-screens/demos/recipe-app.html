<style>/* Tokens: change these to restyle the whole screen. --ac is the brand colour. */

html[data-skin=rose]{--bg:#FCF5F6;--panel:#FFFFFF;--ink:#2B1419;--mute:#7C5F66;--line:#EFDADE;--soft:#F8E9EC;--ac:#BE123C;--ac-ink:#FFFFFF;--ac-soft:#FDE4EA}
html[data-skin=rose][data-theme=dark]{--bg:#160B0E;--panel:#211217;--ink:#F8E6EA;--mute:#B89AA2;--line:#3A2229;--soft:#2B1920;--ac:#FB7185;--ac-ink:#2B0610;--ac-soft:#47131F}

body{display:grid;place-items:center;padding:16px;background:var(--ac-soft)}
.ph{position:relative;width:min(400px,100%);height:min(840px,calc(100vh - 32px));border-radius:40px;background:var(--panel);box-shadow:0 0 0 9px var(--panel),0 0 0 10px var(--line),0 30px 60px -30px rgba(16,24,40,.5);display:flex;flex-direction:column;overflow:hidden}

.srv{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 16px;border-radius:var(--r);background:var(--soft);margin-bottom:14px;font-weight:600}
.stp{display:inline-flex;align-items:center;gap:4px}.stp button{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel)}.stp button:disabled{opacity:.4}.stp b{min-width:28px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}

.ing b{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}.ing input:checked~span,.ing input:checked~b,.shop input:checked~span{color:var(--mute);text-decoration:line-through}
.mth{list-style:none;margin:14px 0 0;padding:0;counter-reset:s;display:grid;gap:16px}.mth li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:12px;line-height:1.55}.mth li::before{content:counter(s);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ac-soft);color:var(--ac);font-weight:700;font-size:13px}

.rc{display:grid;gap:14px;margin-top:16px}.rc button{position:relative;display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:center;text-align:left;padding:0;border:0;background:none;border-radius:var(--r)}.rc img{width:112px;height:92px;object-fit:cover;border-radius:var(--r);display:block;background:var(--soft)}.rc b{display:block;font-size:15.5px;line-height:1.3}.rc small{color:var(--mute);font-size:12.5px}.rc button:hover b{text-decoration:underline}

<script>/* Shared helpers: element lookup, theme switch (add #dark to the address to start dark), mobile menu. */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const root=document.documentElement;
function setTheme(dark){root.dataset.theme=dark?'dark':'light';const b=$('#theme');if(b){b.setAttribute('aria-pressed',dark);b.setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme')}document.dispatchEvent(new Event('themechange'))}

const SKINS=['ocean','forest','sunset','rose','sand'],LOOKS=['soft','sharp','serif','compact'],PRE=root.dataset.theme==='dark';
function look(){const h=location.hash,w=h.slice(1).toLowerCase().match(/[a-z]+/g)||[];
 if(h){const s=w.find(x=>SKINS.includes(x)),l=w.find(x=>LOOKS.includes(x));s?root.dataset.skin=s:delete root.dataset.skin;l?root.dataset.look=l:delete root.dataset.look}
 setTheme(h?/dark/.test(h):PRE)}
look();addEventListener('hashchange',look);

{const m=$('#menu'),s=$('.side');if(m&&s){const set=o=>{s.classList.toggle('open',o);m.setAttribute('aria-expanded',o)};m.addEventListener('click',()=>set(!s.classList.contains('open')));addEventListener('keydown',e=>{if(e.key==='Escape')set(false)});document.addEventListener('click',e=>{if(s.classList.contains('open')&&!s.contains(e.target)&&!m.contains(e.target))set(false)})}}

 {t:'Gnocchi with basil pesto',img:'food-gluten-free-gnocchi',min:25,lvl:'Easy',r:4.8,saved:true,base:2,ing:[[250,'g','potato gnocchi'],[25,'g','basil leaves'],[15,'g','pine nuts'],[20,'g','parmesan, finely grated'],[.5,'','small garlic clove','small garlic cloves'],[40,'ml','olive oil'],[.25,'','lemon, juiced','lemons, juiced'],[null,'','salt and black pepper']],
  steps:[['Toast the pine nuts in a dry frying pan over a medium heat, shaking now and then, until golden.',180],['Blitz the basil, pine nuts, garlic and parmesan with the oil until almost smooth. Season, then sharpen with the lemon juice.',0],['Boil the gnocchi in well-salted water. They are ready when they float.',120],['Drain, keeping a cupful of the water. Toss the gnocchi with the pesto, loosening it with a splash of the water, and serve with more parmesan.',0]]},
 {t:'Fresh tagliatelle with brown butter',img:'food-handmade-pasta-noodles',min:50,lvl:'Takes practice',r:4.6,saved:false,base:2,ing:[[100,'g','pasta flour'],[1,'','egg','eggs'],[30,'g','butter'],[3,'','sage leaf','sage leaves'],[null,'','salt']],steps:[['Mix the flour and eggs to a dough, knead until smooth, then wrap and rest it.',1800],['Roll thin, fold loosely and cut into ribbons.',0],['Boil the pasta in salted water.',150],['Brown the butter with the sage, toss the pasta through it and serve at once.',0]]},

 else if(tab===1){const missing=R.ing.filter((x,i)=>!have.has(i)).length;
  s.innerHTML=`<div class="hero"><img src="${PH+R.img}-640.webp" alt="${R.t}"><button class="rb" style="left:16px" id="back" aria-label="All recipes"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.500 5.500 8 12l6.500 6.500"/></svg></button><button class="rb" style="right:16px" id="save" aria-pressed="${R.saved}" aria-label="Save recipe"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20C6 15.500 3.500 12.500 3.500 9.200A4.200 4.200 0 0 1 12 7.500a4.200 4.200 0 0 1 8.500 1.700c0 3.300-2.500 6.300-8.500 10.800Z"/></svg></button></div>
  <div class="sheet"><h1>${R.t}</h1><div class="facts"><span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.500"/><path d="M12 7v5l3.500 2"/></svg>${R.min} min</span><span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4h11l-1.500 4 1.500 4H5"/></svg>${R.lvl}</span><span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.500 2.600 5.400 5.900.8-4.300 4.100 1 5.800L12 16.900l-5.200 2.700 1-5.800L3.500 9.700l5.900-.8Z"/></svg>${R.r} from ${[1204,318,2051,642][cur].toLocaleString('en-GB')} cooks</span></div>
  <div class="srv"><span id="sl">Serves</span><span class="stp" role="group" aria-labelledby="sl"><button data-s="-1" ${k<=1?'disabled':''} aria-label="One fewer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><b aria-live="polite">${k}</b><button data-s="1" ${k>=8?'disabled':''} aria-label="One more"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></span></div>
  <div class="seg" role="group" aria-label="Show">${['Ingredients','Method'].map(v=>`<button data-v="${v}" aria-pressed="${v===view}">${v}</button>`).join('')}</div>
  ${view==='Ingredients'?`<ul class="ing">${R.ing.map((x,i)=>{const [q,n]=qty(x,k);return `<li><label><input type="checkbox" data-i="${i}" ${have.has(i)?'checked':''}><span>${n[0].toUpperCase()+n.slice(1)}</span><b>${q}</b></label></li>`}).join('')}</ul><button class="btn pri" id="add" style="width:100%;min-height:46px" ${missing?'':'disabled'}>${missing?'Add '+missing+' to the shopping list':'You have everything'}</button>`
  :`<ol class="mth">${R.steps.map(([t,sec],i)=>{const tm=timers[cur+'-'+i];return `<li><div>${t}${sec?`<br><button class="tmr ${tm?(tm.left?'run':'end'):''}" data-t="${i}" aria-live="off"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.500" r="7"/><path d="M12 13.500V10M9.500 3.500h5"/></svg><span>${tm?(tm.left?mmss(tm.left)+' · stop':'Done'):'Start '+nice(sec)+' timer'}</span></button>`:''}</div></li>`}).join('')}</ol>`}</div>`}
 else s.innerHTML=`<div class="pd"><div class="row"><h1>Shopping</h1><span class="sp"></span>${shop.some(x=>x.done)?'<button class="btn" id="clr">Clear ticked</button>':''}</div>${shop.length?`<p class="mute">${pending()} to buy, for ${[...new Set(shop.map(x=>x.r))].join(' and ')}.</p><ul class="shop">${shop.map((x,i)=>`<li><label><input type="checkbox" data-b="${i}" ${x.done?'checked':''}><span>${x.n}</span><b>${x.q}</b></label></li>`).join('')}</ul>`:`<div class="empty"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6Z"/><path d="M9 8V7a3 3 0 0 1 6 0v1"/></svg><b>Nothing to buy</b><span>Open a recipe and add what you are missing.</span><button class="btn" id="toc">Go to the recipe</button></div>`}</div>`}
$('#scr').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const R=RECIPES[cur];
 if(b.dataset.r){cur=+b.dataset.r;serves=RECIPES[cur].base;have=new Set();view='Ingredients';go(1)}else if(b.id==='back')go(0);else if(b.id==='toc')go(1)
 else if(b.id==='save'){R.saved=!R.saved;draw();$('#save').focus();toast(R.saved?'Saved to your recipes':'Removed from saved')}
 else if(b.dataset.s){serves+=+b.dataset.s;draw();($(`[data-s="${b.dataset.s}"]:not(:disabled)`)||$('.stp button:not(:disabled)')).focus()}
 else if(b.dataset.v){view=b.dataset.v;draw();$(`[data-v="${view}"]`).focus()}
 else if(b.id==='add'){let n=0;R.ing.forEach((x,i)=>{if(have.has(i))return;const [q,nm]=qty(x,serves),name=nm[0].toUpperCase()+nm.slice(1);if(!shop.find(y=>y.n===name&&y.r===R.t)){shop.push({n:name,q,r:R.t,done:false});n++}});bar();toast(n?n+' added to the shopping list':'Those are already on the list')}
 else if(b.dataset.t!=null){const id=cur+'-'+b.dataset.t,sec=R.steps[b.dataset.t][1];if(timers[id]){delete timers[id]}else timers[id]={left:sec};draw();$(`[data-t="${b.dataset.t}"]`).focus()}
 else if(b.id==='clr'){shop=shop.filter(x=>!x.done);draw()}});
$('#scr').addEventListener('change',e=>{const t=e.target;if(t.dataset.i!=null){t.checked?have.add(+t.dataset.i):have.delete(+t.dataset.i);const m=RECIPES[cur].ing.length-have.size,a=$('#add');a.disabled=!m;a.textContent=m?'Add '+m+' to the shopping list':'You have everything'}else if(t.dataset.b!=null){shop[t.dataset.b].done=t.checked;draw();$(`[data-b="${t.dataset.b}"]`)?.focus()}});
/* Step timers count down once a second and write straight into their own button. */
setInterval(()=>{Object.entries(timers).forEach(([id,t])=>{if(!t.left)return;t.left--;const [r,i]=id.split('-'),b=tab===1&&view==='Method'&&+r===cur&&$(`[data-t="${i}"]`);if(b){b.lastChild.textContent=t.left?mmss(t.left)+' · stop':'Done';if(!t.left)b.className='tmr end'}if(!t.left)toast('Timer finished: step '+(+i+1))})},1000);
go(1);
</script>
</body>
</html>
