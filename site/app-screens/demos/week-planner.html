body{display:flex;flex-direction:column}

.cals input{appearance:none;-webkit-appearance:none;width:16px;height:16px;margin:0;border-radius:5px;border:2px solid var(--c);display:grid;place-items:center}.cals input:checked{background:var(--c)}.cals input:checked::after{content:"";width:8px;height:4px;border:solid var(--panel);border-width:0 0 2px 2px;transform:rotate(-45deg) translateY(-1px)}

.next{padding:12px;border-radius:var(--r);background:var(--soft);display:grid;gap:2px;font-size:13px}.next small{color:var(--mute)}

.gut{position:relative;height:calc(var(--h)*12)}.gut span{position:absolute;right:8px;transform:translateY(-50%);font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.col{position:relative;height:calc(var(--h)*12);border-left:1px solid var(--line);background:repeating-linear-gradient(var(--line) 0 1px,transparent 1px var(--h));cursor:cell}.col.t{background-color:var(--bg)}

.ev b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev small{color:var(--mute);font-variant-numeric:tabular-nums}.ev:hover,.ev[aria-expanded=true]{filter:brightness(.96);z-index:2}html[data-theme=dark] .ev:hover{filter:brightness(1.25)}
.ad .ev{position:static;min-height:22px;width:100%}.ev.sm{padding-block:1px;flex-direction:row;gap:6px;align-items:center}
.c0{--c:var(--ac);--cs:var(--ac-soft)}.c1{--c:var(--ok);--cs:var(--ok-soft)}.c2{--c:var(--warn);--cs:var(--warn-soft)}.c3{--c:var(--bad);--cs:var(--bad-soft)}

.pop{position:fixed;z-index:20;width:280px;max-width:calc(100vw - 24px);padding:14px;display:grid;gap:10px}.pop h2{font-size:16px}.pop dl{margin:0;display:grid;grid-template-columns:20px 1fr;gap:6px 8px;font-size:13px;color:var(--mute);align-items:center}.pop dd{margin:0;color:var(--ink)}.pop dt .ic{width:16px;height:16px}
.pop label{display:grid;gap:4px;font-size:12.5px;font-weight:600}.pop .in{width:100%}.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

<header class="bar"><div class="brand"><span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></span><b>Tempo</b></div>

<script>/* Shared helpers: element lookup, theme switch (add #dark to the address to start dark), mobile menu. */

const SKINS=['ocean','forest','sunset','rose','sand'],LOOKS=['soft','sharp','serif','compact'],PRE=root.dataset.theme==='dark';
function look(){const h=location.hash,w=h.slice(1).toLowerCase().match(/[a-z]+/g)||[];
 if(h){const s=w.find(x=>SKINS.includes(x)),l=w.find(x=>LOOKS.includes(x));s?root.dataset.skin=s:delete root.dataset.skin;l?root.dataset.look=l:delete root.dataset.look}

look();addEventListener('hashchange',look);

{const m=$('#menu'),s=$('.side');if(m&&s){const set=o=>{s.classList.toggle('open',o);m.setAttribute('aria-expanded',o)};m.addEventListener('click',()=>set(!s.classList.contains('open')));addEventListener('keydown',e=>{if(e.key==='Escape')set(false)});document.addEventListener('click',e=>{if(s.classList.contains('open')&&!s.contains(e.target)&&!m.contains(e.target))set(false)})}}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const CALS=['Work','Team','Personal','Travel'],H0=8,HOURS=12,TODAY=new Date(2026,10,12),NOW=10.67;
let EVENTS=[[0,10,11.5,'Roadmap review',0,'Room Fen'],[0,14,15,'Design critique',1,'Studio'],[1,11,12,'Interview: product designer',0,'Video call'],[1,13,14,'Lunch with Priya',2,'Canal Street Kitchen'],[1,16,17,'Dentist',2,'Park Road Dental'],[2,10,12.5,'Workshop: onboarding flow',0,'Room Tarn'],[2,15,15.5,'1:1 with Tomás',0,'Video call'],[3,11,12,'Pricing sync',0,'Room Fen'],[3,12.5,13.5,'Gym',2,'The Yard'],[3,14,16,'Focus time',0,'No meetings'],[3,16.5,17.25,'Launch checklist',1,'Room Fen'],[4,8.25,10.5,'Train to Manchester',3,'Platform 4, coach C'],[4,11,15,'Client day, Halden Freight',0,'Halden Freight, Deansgate'],[4,17.5,19.75,'Train home',3,'Manchester Piccadilly'],[5,10,11,'Parkrun',2,'Roundhay Park'],[6,13,15,'Sunday roast at Mum’s',2,'Ilkley']].map(([d,s,e,t,c,p])=>({d,s,e,t,c,p,w:0}));
const ALLDAY=[[0,'Sprint 42 starts',1],[4,'Invoice run',0]];
let off=0,view=innerWidth<700?1:7,day=3,hidden=new Set(),uid=0;EVENTS.forEach(e=>e.id=uid++);
const DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const monday=()=>new Date(2026,10,9+off*7),dateOf=i=>{const m=monday();return new Date(m.getFullYear(),m.getMonth(),m.getDate()+i)};
const hm=h=>String(Math.floor(h)).padStart(2,'0')+':'+String(Math.round(h%1*60)).padStart(2,'0'),same=(a,b)=>a.toDateString()===b.toDateString();
/* The daily stand-up repeats on weekdays in every week; the rest belong to the week of 9 November. */
const eventsFor=i=>[...(i<5?[{id:'s'+i,d:i,s:9.5,e:10,t:'Stand-up',c:1,p:'Video call',rep:1}]:[]),...EVENTS.filter(e=>e.d===i&&e.w===off)].filter(e=>!hidden.has(e.c)).sort((a,b)=>a.s-b.s||b.e-a.e);

 $('#prev').setAttribute('aria-label','Previous '+(view===7?'week':'day'));$('#nxt').setAttribute('aria-label','Next '+(view===7?'week':'day'));
 const g=$('#grid');g.style.setProperty('--n',days.length);

 h+='<div class="ad g">All day</div>'+days.map(i=>`<div class="ad">${off?'':ALLDAY.filter(x=>x[0]===i&&!hidden.has(x[2])).map(x=>`<span class="ev c${x[2]}"><b>${x[1]}</b></span>`).join('')}</div>`).join('');
 h+='<div class="gut" aria-hidden="true">'+Array.from({length:HOURS-1},(_,k)=>`<span style="top:calc(var(--h)*${k+1})">${hm(H0+k+1)}</span>`).join('')+'</div>';
 h+=days.map(i=>{const d=dateOf(i),t=same(d,TODAY);return `<div class="col ${t?'t':''}" data-d="${i}" role="group" aria-label="${DN[i]} ${d.getDate()} ${MN[d.getMonth()]}">${place(eventsFor(i)).map(e=>`<button class="ev c${e.c}${e.e-e.s<.75?' sm':''}" data-id="${e.id}" aria-expanded="false" style="top:calc(var(--h)*${e.s-H0} + 1px);height:calc(var(--h)*${e.e-e.s} - 2px);left:calc(${e.k/e.n*100}% + 2px);width:calc(${100/e.n}% - 5px)"><b>${esc(e.t)}</b>${e.e-e.s>=.75?`<small>${hm(e.s)} – ${hm(e.e)}</small>`:''}</button>`).join('')}${t?`<div class="now" style="top:calc(var(--h)*${NOW-H0})" role="img" aria-label="Now, ${hm(NOW)}"></div>`:''}</div>`}).join('');
 g.innerHTML='<div class="wk">'+h+'</div>';mini()}
function mini(){const m=monday(),y=m.getFullYear(),mo=m.getMonth(),first=new Date(y,mo,1),lead=(first.getDay()+6)%7;$('#mm').textContent=MN[mo]+' '+y;
 let h=DN.map(d=>`<b>${d[0]}</b>`).join('');for(let k=0;k<42;k++){const d=new Date(y,mo,1-lead+k),inW=d>=m&&d<=dateOf(6),wd=(d.getDay()+6)%7;if(k>=35&&d.getMonth()!==mo&&wd===0)break;
  h+=`<span class="${d.getMonth()!==mo?'o ':''}${inW?'w '+(wd===0?'s ':wd===6?'e ':''):''}${same(d,TODAY)?'t':''}">${same(d,TODAY)?'<i>'+d.getDate()+'</i>':d.getDate()}</span>`}$('#mini').innerHTML=h}
$('#cals').innerHTML=CALS.map((c,i)=>`<label class="c${i}"><input type="checkbox" checked data-c="${i}">${c}<small class="num">${EVENTS.filter(e=>e.c===i).length+(i===1?5:0)}</small></label>`).join('');
$('#cals').onchange=e=>{const c=+e.target.dataset.c;e.target.checked?hidden.delete(c):hidden.add(c);draw()};
$('#prev').onclick=()=>{if(view===7)off--;else if(--day<0){day=6;off--}draw()};$('#nxt').onclick=()=>{if(view===7)off++;else if(++day>6){day=0;off++}draw()};
$('#today').onclick=()=>{off=0;day=3;draw();toast('Back to this week')};
$$('.seg button').forEach(b=>b.onclick=()=>{view=+b.dataset.v;$$('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});
/* Popover: event details, or the form for a new event */
const pop=$('#pop');let opener=null;
function show(html,x,y,from){pop.innerHTML=html;pop.hidden=false;opener=from;const w=pop.offsetWidth,h=pop.offsetHeight;pop.style.left=Math.max(12,Math.min(innerWidth-w-12,x))+'px';pop.style.top=Math.max(12,Math.min(innerHeight-h-12,y))+'px';(pop.querySelector('input,button')||pop).focus()}
function hide(){if(pop.hidden)return;pop.hidden=true;$$('.ev[aria-expanded=true]').forEach(b=>b.setAttribute('aria-expanded',false));opener&&document.contains(opener)&&opener.focus();opener=null}
function form(d,s,x,y,from){show(`<form id="nf" style="display:grid;gap:10px"><h2>New event</h2><label>Title<input class="in" name="t" placeholder="Add a title" required></label><div class="f2"><label>Day<select class="in" name="d">${DN.map((n,i)=>`<option value="${i}" ${i===d?'selected':''}>${n} ${dateOf(i).getDate()}</option>`).join('')}</select></label><label>Starts<select class="in" name="s">${Array.from({length:23},(_,k)=>H0+k/2).map(v=>`<option value="${v}" ${v===s?'selected':''}>${hm(v)}</option>`).join('')}</select></label></div><div class="f2"><label>Length<select class="in" name="l"><option value=".5">30 minutes</option><option value="1" selected>1 hour</option><option value="1.5">1 hour 30</option><option value="2">2 hours</option></select></label><label>Calendar<select class="in" name="c">${CALS.map((c,i)=>`<option value="${i}">${c}</option>`).join('')}</select></label></div><div class="row"><span class="sp"></span><button class="btn" type="button" data-x>Cancel</button><button class="btn pri">Add event</button></div></form>`,x,y,from)}
$('#grid').onclick=e=>{const b=e.target.closest('button.ev'),c=e.target.closest('.col');if(b){const id=b.dataset.id,ev=EVENTS.find(v=>v.id==id)||eventsFor(+c.dataset.d).find(v=>v.id==id),r=b.getBoundingClientRect(),d=dateOf(ev.d);hide();b.setAttribute('aria-expanded',true);
  show(`<div class="row"><span class="badge c${ev.c}" style="background:var(--cs);color:var(--c)"><i></i>${CALS[ev.c]}</span><span class="sp"></span><button class="btn sq ghost" data-x aria-label="Close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><h2>${esc(ev.t)}</h2><dl><dt><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.500"/><path d="M12 7v5l3.500 2"/></svg></dt><dd>${DN[ev.d]} ${d.getDate()} ${MN[d.getMonth()]}, ${hm(ev.s)} to ${hm(ev.e)}</dd><dt><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21c-4-4.500-6.500-7.800-6.500-11a6.500 6.500 0 0 1 13 0c0 3.200-2.500 6.500-6.500 11Z"/><circle cx="12" cy="10" r="2.300"/></svg></dt><dd>${esc(ev.p)}</dd>${ev.rep?'<dt><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h14M14 4l4 4-4 4M20 16H6M10 12l-4 4 4 4"/></svg></dt><dd>Repeats every weekday</dd>':''}</dl>${ev.rep?'':`<div class="row"><span class="sp"></span><button class="btn" data-del="${ev.id}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Delete</button></div>`}`,r.right+8,r.top,b)}
 else if(c){const r=c.getBoundingClientRect(),s=Math.min(H0+HOURS-1,H0+Math.floor((e.clientY-r.top)/r.height*HOURS*2)/2);hide();form(+c.dataset.d,s,e.clientX+8,e.clientY-40,null)}};
$('#new').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();hide();form(view===1?day:3,15,r.right-280,r.bottom+8,e.currentTarget)};
pop.onclick=e=>{const d=e.target.closest('[data-del]');if(d){EVENTS=EVENTS.filter(v=>v.id!=d.dataset.del);hide();draw();toast('Event deleted')}else if(e.target.closest('[data-x]'))hide()};
pop.onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),s=+f.get('s'),t=f.get('t').trim();if(!t)return;EVENTS.push({id:uid++,d:+f.get('d'),s,e:Math.min(H0+HOURS,s+ +f.get('l')),t,c:+f.get('c'),p:'No place set',w:off});hidden.delete(+f.get('c'));$$('#cals input').forEach(i=>i.checked=!hidden.has(+i.dataset.c));if(view===1)day=+f.get('d');hide();draw();toast('“'+t+'” added to '+DN[+f.get('d')])};
addEventListener('keydown',e=>{if(e.key==='Escape')hide()});document.addEventListener('pointerdown',e=>{if(!pop.hidden&&!pop.contains(e.target)&&!e.target.closest('.ev,#new'))hide()});
$$('.seg button').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.v===view));draw();
</script>
