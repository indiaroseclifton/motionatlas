body{display:grid;place-items:center;padding:16px;background:var(--soft)}

<script>/* Shared helpers: element lookup, theme switch (add #dark to the address to start dark), mobile menu. */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const root=document.documentElement;
function setTheme(dark){root.dataset.theme=dark?'dark':'light';const b=$('#theme');if(b){b.setAttribute('aria-pressed',dark);b.setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme')}document.dispatchEvent(new Event('themechange'))}
/* The address can carry a look, for example #dark, #ocean-soft or #sand-serif-dark. A copied file can set the same thing on the html element. */
const SKINS=['ocean','forest','sunset','rose','sand'],LOOKS=['soft','sharp','serif','compact'],PRE=root.dataset.theme==='dark';
function look(){const h=location.hash,w=h.slice(1).toLowerCase().match(/[a-z]+/g)||[];
 if(h){const s=w.find(x=>SKINS.includes(x)),l=w.find(x=>LOOKS.includes(x));s?root.dataset.skin=s:delete root.dataset.skin;l?root.dataset.look=l:delete root.dataset.look}
 setTheme(h?/dark/.test(h):PRE)}
look();addEventListener('hashchange',look);
$('#theme')?.addEventListener('click',()=>setTheme(root.dataset.theme!=='dark'));
{const m=$('#menu'),s=$('.side');if(m&&s){const set=o=>{s.classList.toggle('open',o);m.setAttribute('aria-expanded',o)};m.addEventListener('click',()=>set(!s.classList.contains('open')));addEventListener('keydown',e=>{if(e.key==='Escape')set(false)});document.addEventListener('click',e=>{if(s.classList.contains('open')&&!s.contains(e.target)&&!m.contains(e.target))set(false)})}}
function toast(t){let n=$('#toast');if(!n){n=document.createElement('div');n.id='toast';n.setAttribute('role','status');n.style.cssText='position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;z-index:60;transition:opacity .2s;max-width:calc(100vw - 32px)';document.body.append(n)}n.textContent=t;n.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>n.style.opacity=0,2000)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* DATA. Times are minutes after midnight on the day of travel. The demo clock starts at 07:22 and then runs in real time. Photo is CC0, from the atlas photo library. */
const REF='K7QM2X',BOARD=8*60+15,STEPS=[[6*60+40,'check','Taxi to the airport','Picked up from 3B Lark Rise · £24.60'],[7*60+10,'bag','Bag drop','Desk 41, Terminal 2 · 1 bag, 19 kg'],[7*60+45,'shield','Security','Usually 15 minutes at this hour'],[BOARD,'plane','Boarding at gate B14','Group 2 · gate closes 08:40'],[8*60+55,'send','Depart Manchester','Aurel Air AU 418 · 2 h 10 min'],[12*60+5,'pin','Arrive Innsbruck','Local time, one hour ahead'],[15*60,'bed','Check in, Hotel Seeblick','4 nights · breakfast included']];
const ICO={check:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.500 4.500 4.500L19 7.500"/></svg>`,bag:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6Z"/><path d="M9 8V7a3 3 0 0 1 6 0v1"/></svg>`,shield:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.500 19.500 6v6c0 4.200-2.800 7.200-7.500 8.800C7.300 19.200 4.500 16.200 4.500 12V6Z"/></svg>`,plane:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 13 3-1 3 2 4-1.500L8 5l2.500-.8 7 6.300 2.500-.9a1.800 1.800 0 0 1 1.200 3.400L6 18.500Z"/></svg>`,send:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4 3 11l7 3 3 7Z"/><path d="m10 14 4-4"/></svg>`,pin:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21c-4-4.500-6.500-7.800-6.500-11a6.500 6.500 0 0 1 13 0c0 3.200-2.500 6.500-6.500 11Z"/><circle cx="12" cy="10" r="2.300"/></svg>`,bed:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18V7M3 14h18v4M3 11h9a4 4 0 0 1 4 3"/><circle cx="7" cy="9" r="1.500"/></svg>`};
let PACK=[['Documents','Passport',1],['Documents','Travel insurance letter',1],['Documents','Euros, about €150',0],['Clothes','Walking boots',1],['Clothes','Waterproof jacket',1],['Clothes','Warm layers, three',0],['Clothes','Swimming things',0],['Bits','Phone charger and adaptor',1],['Bits','Sunglasses',0],['Bits','Book for the flight',0]].map(([g,n,d])=>({g,n,d:!!d}));
const TABS=[['Trip',`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.500 9 4l6 2.500L21 4v13.500L15 20l-6-2.500L3 20Z"/><path d="M9 4v13.500M15 6.500V20"/></svg>`],['Pass',`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7l9 9-7 7-9-9Z"/><circle cx="8.5" cy="8.5" r="1.2"/></svg>`],['Packing',`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7h12M8 12h12M8 17h12M4 7h.01M4 12h.01M4 17h.01"/></svg>`]],T0=Date.now();
let tab=0,bright=false;
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'),clock=()=>7*60+22+(Date.now()-T0)/60000;
const left=()=>{const s=Math.max(0,Math.round((BOARD-clock())*60));return s>=3600?Math.floor(s/3600)+' h '+Math.floor(s%3600/60)+' min':Math.floor(s/60)+' min '+String(s%60).padStart(2,'0')+' s'};
$('#tb').innerHTML=TABS.map(([n,i],k)=>`<button role="tab" id="t${k}" aria-selected="${!k}" tabindex="${k?-1:0}">${i}${n}</button>`).join('');const tabs=$$('#tb button');
function go(k,focus){tab=k;tabs.forEach((b,i)=>{b.setAttribute('aria-selected',i===k);b.tabIndex=i===k?0:-1});$('#scr').setAttribute('aria-labelledby','t'+k);draw();$('#scr').scrollTop=0;if(focus)tabs[k].focus()}
tabs.forEach((b,i)=>b.onclick=()=>go(i));$('#tb').onkeydown=e=>{const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(d){e.preventDefault();go((tab+d+3)%3,true)}};
/* The barcode: each character of the reference becomes a run of bars, so it is repeatable but not a real, scannable code. */
function bars(){let x=0,h='';[...(REF+REF+'AU418')].forEach(ch=>{const c=ch.charCodeAt(0);[c%4+1,(c>>2)%3+1,(c>>4)%4+1,(c>>1)%3+1].forEach((w,i)=>{if(i%2===0)h+=`<rect x="${x}" width="${w}" height="64"/>`;x+=w})});return `<svg viewBox="0 0 ${x} 64" preserveAspectRatio="none" fill="currentColor" role="img" aria-label="Barcode for booking ${REF}">${h}</svg>`}
function draw(){const s=$('#scr'),now=clock(),nx=STEPS.findIndex(x=>x[0]>now);$('#ph').classList.toggle('bright',bright&&tab===1);
 if(tab===0)s.innerHTML=`<div class="hero"><img src="../../assets/photos/nature-mountain-lake-640.webp" alt="A mountain lake with autumn trees"><div><p>Friday 13 to Tuesday 17 November</p><h1>Innsbruck, four nights</h1></div></div>
  <div class="card next"><span class="av" style="width:44px;height:44px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.500"/><path d="M12 7v5l3.500 2"/></svg></span><div><small>Boarding at gate B14 in</small><b id="cd" role="timer">${left()}</b></div><button class="btn pri sp" id="topass">Pass</button></div>
  <ol class="tl">${STEPS.map(([t,ic,n,d],i)=>`<li class="${i<nx?'past':i===nx?'now':''}"><time>${hm(t)}</time><span class="ico">${i<nx?ICO.check:ICO[ic]}</span><div><b>${n}${i===nx?'<span class="badge ac">Next</span>':''}${i<nx?'<span class="sr"> done</span>':''}</b><small>${d}</small></div></li>`).join('')}</ol>`;
 else if(tab===1)s.innerHTML=`<div class="pd"><div class="tk"><div class="hd inv"><span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 13 3-1 3 2 4-1.500L8 5l2.500-.8 7 6.300 2.500-.9a1.800 1.800 0 0 1 1.200 3.400L6 18.500Z"/></svg>Aurel Air</span><span>AU 418</span></div>
  <div class="rt"><div><b>MAN</b><small>Manchester T2</small></div><div class="fl"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 13 3-1 3 2 4-1.500L8 5l2.500-.8 7 6.300 2.500-.9a1.800 1.800 0 0 1 1.200 3.400L6 18.500Z"/></svg></div><div style="text-align:right"><b>INN</b><small>Innsbruck</small></div></div>
  <div class="gd"><div class="w"><small>Passenger</small><b>Amara Khan</b></div><div><small>Date</small><b>13 Nov</b></div><div><small>Boarding</small><b>${hm(BOARD)}</b></div><div><small>Gate</small><b>B14</b></div><div><small>Seat</small><b>14A</b></div><div><small>Departs</small><b>08:55</b></div><div><small>Group</small><b>2</b></div><div><small>Class</small><b>Economy</b></div></div>
  <div class="perf"></div><div class="bc">${bars()}<small>${REF}</small></div></div>
  <div class="acts"><button class="btn pri" id="wal"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10.500h18"/></svg>Add to wallet</button><button class="btn" id="bri" aria-pressed="${bright}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v5M12 15v5M4 12h5M15 12h5M6.500 6.500l3 3M14.500 14.500l3 3M6.500 17.500l3-3M14.500 9.500l3-3"/></svg>${bright?'Normal screen':'Brighten screen'}</button></div><p class="mute" style="font-size:12.5px;text-align:center;margin-top:12px">Boarding closes 15 minutes before departure. Have your passport open at the photo page.</p></div>`;
 else{const done=PACK.filter(x=>x.d).length;s.innerHTML=`<div class="pd"><h1 style="font-size:26px">Packing</h1><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${PACK.length}" aria-valuenow="${done}" aria-label="Packed"><i style="width:${done/PACK.length*100}%"></i></div><p class="mute" id="pc">${done} of ${PACK.length} packed${done===PACK.length?'. Ready to go.':''}</p>
  ${[...new Set(PACK.map(x=>x.g))].map(g=>`<h2 class="grp">${g}</h2><ul class="pk">${PACK.map((x,i)=>x.g===g?`<li><label><input type="checkbox" data-i="${i}" ${x.d?'checked':''}><span>${esc(x.n)}</span></label></li>`:'').join('')}</ul>`).join('')}
  <form class="addf" id="af"><label class="sr" for="ni">Add an item</label><input class="in" id="ni" placeholder="Add an item" autocomplete="off"><button class="btn">Add</button></form></div>`}}
$('#scr').addEventListener('click',e=>{const id=e.target.closest('button')?.id;if(id==='topass')go(1,true);else if(id==='wal')toast('Pass added to your wallet');else if(id==='bri'){bright=!bright;draw();$('#bri').focus()}});
$('#scr').addEventListener('change',e=>{const i=e.target.dataset.i;if(i==null)return;PACK[i].d=e.target.checked;const done=PACK.filter(x=>x.d).length;$('.prog i').style.width=done/PACK.length*100+'%';$('.prog').setAttribute('aria-valuenow',done);$('#pc').textContent=done+' of '+PACK.length+' packed'+(done===PACK.length?'. Ready to go.':'')});
$('#scr').addEventListener('submit',e=>{e.preventDefault();const v=$('#ni').value.trim();if(!v)return;PACK.push({g:'Bits',n:v,d:false});draw();$('#ni').focus();toast('Added to Bits')});
setInterval(()=>{const c=$('#cd');if(c)c.textContent=left()},1000);
go(1);
</script>
