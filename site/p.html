<body><noscript><nav id="sbNo" aria-label="Atlas" style="position:fixed;top:0;left:0;right:0;height:44px;box-sizing:border-box;z-index:2147483000;background:#fff;border-bottom:1px solid #e8e8ea;padding:12px 16px;font:500 14px/20px system-ui,sans-serif;white-space:nowrap;overflow:auto"><a style="color:#111;font-weight:700;margin-right:16px" href="atlas.html">Atlas</a><a style="color:#111;margin-right:16px" href="tools.html">Tools</a><a style="color:#111;margin-right:16px" href="atlas.html#browse">Catalogue</a><a style="color:#111" href="atlas.html#projects">My projects</a></nav></noscript>
<main id="hub"><div class="msg"><h1>Loading the hub…</h1></div></main>
<footer><span>Made with the Visual &amp; Motion Atlas</span><a href="atlas.html#projects">Make your own project hub →</a></footer>
<script src="supabase-client.js"></script>
<script src="projects-hub.js"></script>
<script>
(()=>{const el=document.getElementById('hub');const id=new URLSearchParams(location.search).get('id')||'';
 const msg=(t,b)=>{el.className='';el.innerHTML=`<div class="msg"><h1>${t}</h1><p>${b}</p><p><a href="atlas.html#projects">Open My projects</a></p></div>`};
 if(!/^[0-9a-f-]{36}$/i.test(id))return msg('No hub here.','This link is missing its project id. Ask the person who shared it for the full link.');
 AtlasCloud.projects.getPublic(id).then(row=>{
  if(!row||row.missing)return msg('This hub isn’t public.','It may be private, or the link may have changed. Ask the owner to turn on its public page.');
  const d=row.data||{};const p=Object.assign({entries:[],notes:{},decisions:'',platform:'',stage:'',files:[]},d,{id:row.id,name:row.name,brief:row.brief||''});
  p.entries=Array.isArray(p.entries)?p.entries:[];p.notes=p.notes&&typeof p.notes==='object'?p.notes:{};p.files=Array.isArray(p.files)?p.files:[];
  p.hub=ProjectHub.clean(p.hub);
  document.title=row.name+' · Project hub';
  const urls=new Map();const signed=f=>urls.get(f.id)||AtlasCloud.files.signedUrl(f.path).then(u=>{urls.set(f.id,u);return u});
  ProjectHub.render(el,p,{editable:false,level:1,atlasHref:'atlas.html',
   files:async p=>Promise.all(p.files.filter(f=>typeof f.path==='string').map(async f=>({id:f.id,name:f.name,type:f.type,size:f.size,url:await signed(f).catch(()=>'')}))),
   fileURL:async(p,fid)=>{const f=p.files.find(x=>x.id===fid);return f?signed(f):''}});
 }).catch(e=>msg('Couldn’t load this hub.',String(e.message||'Try again in a moment.').replace(/[<>&]/g,'')));
})();
</script>
</body></html>
