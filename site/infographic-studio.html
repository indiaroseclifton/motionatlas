<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Infographic studio · Visual & Motion Atlas</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta name="description" content="Turn numbers, steps, a comparison or a timeline into one picture. Eight layouts, your words and colours, icons from the atlas library. Export a PNG or an editable SVG.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,700&family=Space+Grotesk:wght@500;700&family=DM+Serif+Display&family=Archivo+Black&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap">
<style>
/* Infographic studio. The site style (November 2026): one typeface, white chrome, hairlines, 40px controls with 10px corners; the picture sits on the alternate surface. */
:root{--bg:#FFFFFF;--panel:#FFFFFF;--ink:#0F1115;--mute:#5F6573;--hair:#E6E8EC;--hair2:#D5D8DF;--soft:#F6F7F9;--accent:#0F1115;--shadow:0 12px 28px -18px rgba(15,17,21,.25)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;z-index:50;background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px}.skip:focus{top:10px}
/* the bar: name, one line about it, actions on the right */
header.top{position:sticky;top:var(--sb-h,0px);z-index:20;display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;min-height:57px;padding:8px max(20px,env(safe-area-inset-right)) 8px max(20px,env(safe-area-inset-left));background:var(--panel);border-bottom:1px solid var(--hair)}
.brand{display:flex;align-items:baseline;gap:2px 12px;min-width:0;flex-wrap:wrap}
.brand h1{margin:0;font:600 16px/1.25 Inter,system-ui,sans-serif;letter-spacing:-.01em;white-space:nowrap}
.brand p{margin:0;color:var(--mute);font-size:14px}
.acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--hair2);background:var(--panel);font-weight:500;font-size:14px;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--soft)}.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:#000}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details.menu{position:relative}details.menu>summary{list-style:none}details.menu>summary::-webkit-details-marker{display:none}
details.menu>summary::after{content:'';width:6px;height:6px;margin:-3px 2px 0 4px;border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:rotate(45deg);opacity:.75}
.pop{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:280px;max-width:min(340px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--hair);border-radius:14px;box-shadow:0 16px 40px -16px rgba(15,17,21,.28);padding:4px;display:grid;gap:2px}
.pop button{display:grid;gap:1px;text-align:left;border:0;background:none;border-radius:10px;padding:8px 12px;font-size:14px;min-height:44px}.pop button:hover{background:var(--soft)}
.pop b{font-weight:500}.pop small{color:var(--mute);font-size:13px}
/* the side panel */
.app{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);align-items:start;background:var(--soft)}
.side{background:var(--panel);border-right:1px solid var(--hair);min-width:0;min-height:calc(100vh - var(--st-head,57px) - var(--sb-h,0px))}
.sec{padding:16px 20px 20px;border-bottom:1px solid var(--hair);display:grid;gap:12px}
.sec h2{margin:8px 0 0;font:600 13px/1.3 Inter,system-ui,sans-serif;color:var(--ink)}.sec h2:first-child{margin-top:0}
.hint{margin:0;font-size:13px;color:var(--mute);line-height:1.5}
label.f{display:grid;gap:6px;font-size:13px;font-weight:500;color:var(--mute)}
input[type=text],input[type=search],select,textarea{width:100%;min-height:40px;border:1px solid var(--hair2);border-radius:10px;background-color:var(--panel);padding:0 12px;font-size:14px;font-weight:400;color:var(--ink)}
textarea{resize:vertical;min-height:64px;padding:9px 12px}
.seg{display:flex;gap:2px;flex-wrap:wrap;padding:3px;border:1px solid var(--hair);border-radius:10px;background:var(--soft)}
.seg button{flex:1 0 auto;min-height:32px;padding:0 12px;border:0;background:none;border-radius:7px;font-size:14px;font-weight:500;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--hair2)}
.pals{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pals button{height:40px;border-radius:10px;border:1px solid var(--hair);padding:0;overflow:hidden;display:flex}.pals button i{flex:1}.pals button[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:2px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cols label{display:grid;gap:6px;font-size:13px;font-weight:500;color:var(--mute)}
.cols input[type=color]{width:100%;height:40px;border:1px solid var(--hair2);border-radius:10px;background:var(--panel);padding:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* layouts: the same card as the galleries */
#igTpl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
#igTpl button{display:grid;gap:8px;width:100%;text-align:left;border:1px solid var(--hair);background:var(--panel);border-radius:14px;padding:6px 6px 10px;transition:border-color .2s,transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
#igTpl button:hover{border-color:var(--hair2);transform:translateY(-2px);box-shadow:0 12px 28px -18px rgba(15,17,21,.25)}#igTpl button[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
#igTpl b{font-size:14px;font-weight:600;line-height:1.3;letter-spacing:-.01em;padding:0 6px}
.igTh{display:block;border-radius:9px;overflow:hidden;border:1px solid var(--hair)}.igTh svg{display:block;width:100%;height:auto}
.igItem{display:grid;gap:8px;padding:12px;border:1px solid var(--hair);border-radius:14px;background:var(--soft)}
.igTop{display:flex;align-items:center;gap:6px}.igTop b{font-size:13px;font-weight:500;color:var(--mute)}.igSp{flex:1}
.igTop button{min-width:40px;height:40px;border:1px solid var(--hair2);border-radius:10px;background:var(--panel);font-size:14px;line-height:1;padding:0 10px}.igTop button:hover:not(:disabled){background:var(--bg);border-color:var(--ink)}.igTop button:disabled{opacity:.35;cursor:default}
.igIco{display:inline-grid;place-items:center}.igIco svg{width:18px;height:18px}.igIco span{font-size:13px;color:var(--mute)}
/* the preview: artwork on the alternate surface */
.main{padding:20px max(20px,env(safe-area-inset-right)) 32px 20px;min-width:0;display:grid;gap:12px;position:sticky;top:calc(var(--st-head,57px) + var(--sb-h,0px))}
@media(min-width:861px) and (max-width:1180px){:root{--st-head:102px}}/* the bar is two rows there: name and actions, then the studio tabs */
#igStage{display:grid;place-items:center;min-height:240px}
#igStage svg{display:block;width:auto;height:auto;max-width:100%;max-height:calc(100vh - 93px - var(--st-head,57px) - var(--sb-h,0px));border-radius:6px;box-shadow:0 0 0 1px var(--hair)}
#igMeta{margin:0;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;text-align:center}
dialog#igIcons{border:1px solid var(--hair);border-radius:16px;padding:0;width:min(560px,calc(100vw - 24px));max-height:min(640px,calc(100vh - 40px));color:var(--ink);box-shadow:0 24px 60px -24px rgba(15,17,21,.35)}
dialog#igIcons::backdrop{background:rgba(15,17,21,.4)}
.igDh{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--hair);position:sticky;top:0;background:var(--panel)}
#igIconGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;padding:12px}
#igIconGrid button{aspect-ratio:1;border:1px solid var(--hair);border-radius:10px;background:var(--panel);display:grid;place-items:center}#igIconGrid button:hover{border-color:var(--ink)}
#igIconGrid svg{width:24px;height:24px}#igIconGrid p{grid-column:1/-1;margin:8px 0;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s cubic-bezier(.2,.8,.2,1);z-index:60;max-width:calc(100vw - 32px)}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:860px){.stTabs{top:calc(var(--sb-h,0px) - 1px)}.app{grid-template-columns:1fr}.side{border-right:0;border-top:1px solid var(--hair);min-height:0;order:2}.main{padding:16px 16px 16px;order:1;position:static}#igStage svg{max-height:54vh}header.top{--fam-gut:16px;padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right))}}
@media(max-width:640px){.btn,input[type=text],input[type=search],select{min-height:44px}.seg button{min-height:36px}.pals button,.cols input[type=color]{height:44px}.igTop button{min-width:44px;height:44px}}
@media(prefers-reduced-motion:reduce){#igTpl button,.toast,.btn{transition:none}#igTpl button:hover{transform:none}}
</style><meta property="og:type" content="website"><meta property="og:site_name" content="Visual &amp; Motion Atlas"><meta property="og:title" content="Infographic studio · Visual & Motion Atlas"><meta property="og:description" content="Turn numbers, steps, a comparison or a timeline into one picture. Export a PNG or an editable SVG."><meta property="og:url" content="https://motionatlas-ten.vercel.app/infographic-studio"><meta property="og:image" content="https://motionatlas-ten.vercel.app/assets/og-atlas.jpg"><meta name="twitter:card" content="summary_large_image">

<header class="top">
 <div class="brand"><h1>Infographic studio</h1></div>
 <div class="acts">
  <button class="btn" id="igReset" type="button">Start over</button>
  <details class="menu" id="igExport"><summary class="btn primary">Export</summary><div class="pop">
   <button type="button" data-x="png"><b>Picture (PNG)</b><small>Full size, ready to post or drop into slides.</small></button>
   <button type="button" data-x="png2"><b>Large picture (PNG, 2×)</b><small>Twice the size, for print or zooming in.</small></button>
   <button type="button" data-x="svg"><b>Vector (SVG)</b><small>Editable in Figma or Illustrator, fonts included.</small></button>
   <button type="button" data-x="copy"><b>Copy the SVG code</b><small>To paste straight into a page.</small></button>
   <button type="button" data-x="share"><b>Make share image</b><small>Opens it in the Mockup studio to frame for a post.</small></button>
  </div></details>
 </div>
</header>
<div class="app">
<aside class="side" aria-label="Settings">
 <section class="sec" data-pane="layout"><h2>Layout</h2><p class="hint">Pick the kind of picture. Your words stay when you switch.</p><ul id="igTpl"></ul></section>
 <section class="sec" data-pane="content"><h2>Words</h2>
  <label class="f">Title<input type="text" id="igTitle" maxlength="120"></label>
  <label class="f">Subtitle<input type="text" id="igSub" maxlength="200"></label>
  <div class="two" id="igCols" hidden><label class="f">First column<input type="text" id="igColA" maxlength="30"></label><label class="f">Second column<input type="text" id="igColB" maxlength="30"></label></div>
  <h2>Items</h2><div id="igItems" style="display:grid;gap:8px"></div><button class="btn" type="button" id="igAdd">+ Add an item</button>
  <label class="f">Source line<input type="text" id="igFoot" maxlength="200" placeholder="Where the numbers come from"></label>
 </section>
 <section class="sec" data-pane="style"><h2>Shape</h2><div class="seg" id="igSize" role="group" aria-label="Shape"></div>
  <h2>Colour</h2><div class="pals" id="igPals" role="group" aria-label="Palettes"></div>
  <div class="cols"><label>Background<input type="color" id="igBg"></label><label>Text<input type="color" id="igInk"></label><label>Accent<input type="color" id="igAc"></label></div>
  <h2>Type</h2><label class="f">Typeface<select id="igFont"></select></label>
  <h2>Look</h2><div class="seg" id="igLook" role="group" aria-label="Look"></div>
 </section>
</aside>
<main class="main" id="igMain" tabindex="-1">
 <div id="igStage" aria-live="off"></div>
 <p id="igMeta"></p>
</main>
</div>
<dialog id="igIcons" aria-label="Choose an icon"><div class="igDh"><input type="search" id="igIconQ" placeholder="Search icons" aria-label="Search icons"><button class="btn" type="button" id="igIconNone">No icon</button><button class="btn" type="button" id="igIconClose">Close</button></div><div id="igIconGrid"></div></dialog>
<div class="toast" id="igToast" role="status" aria-live="polite"></div>
<script src="dataviz/export.js"></script>
<script src="infographic/studio.js"></script>
<script src="studio-tabs.js"></script>
