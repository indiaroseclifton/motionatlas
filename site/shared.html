<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shared project · Visual & Motion Atlas</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<meta name="description" content="A design project shared from the Visual & Motion Atlas: brief, direction, references and files.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
:root{--bg:#F4F5F8;--panel:#FFFFFF;--ink:#1C1F2A;--mute:#5E6476;--line:#E1E4EC;--accent:#5B2DFF;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px max(18px,4vw);background:var(--panel);border-bottom:1px solid var(--line)}
.top a{font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);text-decoration:none}
.top .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
main{max-width:1180px;margin:0 auto;padding:clamp(28px,6vh,56px) max(18px,4vw) 80px}
.k{font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0}
h1{margin:10px 0 6px;font:italic 500 clamp(40px,6vw,76px)/.95 'Cormorant Garamond',Georgia,serif;letter-spacing:-.01em}
.meta{color:var(--mute);margin:0 0 26px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:#EEEAFF;border:1px solid #D6CCFF;margin-bottom:24px;font-size:14px}
.banner b{font-weight:600}
.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;margin-bottom:30px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.box h2{margin:0 0 8px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600}
.box p{margin:0;white-space:pre-wrap}
.box textarea,.box input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);resize:vertical}
.box label{display:grid;gap:6px;font-size:13px;font-weight:600;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:500;font-size:13.5px;cursor:pointer;text-decoration:none}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
section.s{margin-top:34px}
section.s>h2{margin:0 0 14px;font:italic 500 32px/1 'Cormorant Garamond',Georgia,serif}
section.s>h2 span{font:400 15px Inter,sans-serif;color:var(--mute);font-style:normal}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.file{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid}
.file .pv{display:grid;place-items:center;aspect-ratio:4/3;background:#EEF0F4;overflow:hidden;text-decoration:none}
.file img,.file video{width:100%;height:100%;object-fit:cover}
.file .ext{font:600 16px ui-monospace,monospace;letter-spacing:.08em;color:#4A5163}
.file figcaption{display:grid;gap:2px;padding:10px 12px 12px;font-size:13px}
.file figcaption b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.file figcaption span{color:var(--mute);font-size:12px}
.file .row{display:flex;gap:10px;margin-top:4px}
.file .row a,.file .row button{font-size:12.5px;background:none;border:0;padding:4px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;min-height:32px}
.drop{display:grid;gap:4px;place-items:center;text-align:center;padding:24px 16px;border:1.5px dashed #C7CCD8;border-radius:16px;cursor:pointer;margin-bottom:16px;background:var(--panel)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop:focus-within{outline:2px solid var(--accent);outline-offset:3px}
.drop.over,.drop:hover{border-color:var(--accent)}
.drop span{font-size:13.5px;color:var(--mute)}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.ref{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ref .im{aspect-ratio:3/2;background:#E7E9EF center/cover no-repeat}
.ref div.t{padding:10px 12px 12px;display:grid;gap:3px}
.ref b{font-weight:600}.ref small{color:var(--mute)}
.ref p{margin:4px 0 0;font-size:13px;color:#3E4352;white-space:pre-wrap}
.status{min-height:1.4em;font-size:14px;font-weight:500;margin:8px 0}
.empty{color:var(--mute)}
.state{padding:60px 0;text-align:center}
.state h1{font-size:44px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
</style><meta property="og:type" content="website"><meta property="og:site_name" content="Visual &amp; Motion Atlas"><meta property="og:title" content="Shared project · Visual & Motion Atlas"><meta property="og:description" content="A design project shared from the Visual & Motion Atlas: brief, direction, references and files."><meta property="og:url" content="https://motionatlas-ten.vercel.app/shared"><meta property="og:image" content="https://motionatlas-ten.vercel.app/assets/og-atlas.jpg"><meta name="twitter:card" content="summary_large_image">
<style id="sbPre">html{--sb-h:calc(44px + env(safe-area-inset-top,0px))}body{padding-top:var(--sb-h)}html:not(.sbReady) body::before{content:"";position:fixed;top:0;left:0;right:0;height:var(--sb-h);background:#0d111b;z-index:2147483000}@media print{body{padding-top:0}}</style><script src="site-nav-data.js" defer></script><script src="site-bar.js" defer></script>
</head><body><noscript><nav id="sbNo" aria-label="Atlas" style="position:fixed;top:0;left:0;right:0;height:44px;box-sizing:border-box;z-index:2147483000;background:#0d111b;padding:12px 16px;font:500 14px/20px system-ui,sans-serif;white-space:nowrap;overflow:auto"><a style="color:#fde68a;margin-right:16px" href="atlas.html">Atlas</a><a style="color:#e8edf5;margin-right:16px" href="tools.html">Tools</a><a style="color:#e8edf5;margin-right:16px" href="atlas.html#browse">Catalogue</a><a style="color:#e8edf5" href="atlas.html#projects">My projects</a></nav></noscript>
<header class="top"><a href="atlas.html">← Visual &amp; Motion Atlas</a><div class="sp" id="topActions"></div></header>
<main id="main"><div class="state"><p class="k">Shared project</p><h1>Opening…</h1></div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="share-client.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s),main=$('#main');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const size=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
function say(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(say.t);say.t=setTimeout(()=>t.classList.remove('on'),2200)}
const parts=location.hash.slice(1).split('/');const mode=parts[0],id=parts[1],key=mode==='e'?parts[2]:'';
let share=null,cat=null;
function state(t,m){main.innerHTML=`<div class="state"><p class="k">Shared project</p><h1>${esc(t)}</h1><p>${esc(m)}</p><p><a class="btn" href="atlas.html#projects">Go to my projects</a></p></div>`}
async function catalogue(){if(cat)return cat;try{const [a,b]=await Promise.all([fetch('catalogue.json').then(r=>r.json()),fetch('expansion.json').then(r=>r.json())]);cat=[...a,...(b.entries||[])]}catch(e){cat=[]}return cat}
function thumb(e){const im=e&&e.image;if(!im||!im.url)return '';if((im.columns||2)===1)return im.url;const base=im.url.split('/').pop().replace(/\.(webp|jpe?g|png)$/i,'');return `assets/tiles/${base}-${im.index}-800.webp`}
async function render(){const p=share.project;document.title=p.name+' · Shared project';
 const C=await catalogue();const refs=p.entries.map(id=>C.find(e=>e.id===id)).filter(Boolean);
 main.innerHTML=`<p class="k">Shared project · ${esc(p.platform)} · ${esc(p.stage)}</p><h1 id="pname">${esc(p.name)}</h1><p class="meta">Updated ${new Date(share.updated).toLocaleString()} · ${share.files.length} file${share.files.length===1?'':'s'} · ${refs.length} atlas reference${refs.length===1?'':'s'}</p>
 ${key?`<div class="banner"><b>You can edit this project.</b> Add or remove files and change the brief. Everyone with the link sees your changes.</div>`:''}
 <div class="grid"><div class="box">${key?`<label>Project name<input id="eName" maxlength="100" value="${esc(p.name)}"></label><label>Brief<textarea id="eBrief" rows="5" maxlength="4000">${esc(p.brief)}</textarea></label><label>Direction &amp; decisions<textarea id="eDec" rows="4" maxlength="4000">${esc(p.decisions)}</textarea></label><button class="btn p" id="eSave">Save changes</button><p class="status" id="eStatus" role="status"></p>`:`<h2>Brief</h2><p>${esc(p.brief)||'<span class="empty">No brief yet.</span>'}</p>`}</div>
 <div class="box">${key?'<h2>About editing</h2><p>Changes save to the shared copy. The owner sees them under “Added by collaborators” and in the brief the next time they open the project.</p>':`<h2>Direction &amp; decisions</h2><p>${esc(p.decisions)||'<span class="empty">Nothing recorded yet.</span>'}</p>`}</div></div>
 <section class="s" aria-labelledby="fh"><h2 id="fh">Files <span>${share.files.length}</span></h2>${key?`<label class="drop" id="drop"><input type="file" id="fin" multiple accept="image/*,video/mp4,video/webm,video/quicktime,application/pdf,.woff2,.ttf,.otf,.zip,.txt"><b>Add files</b><span>Drop images, video, PDFs, fonts or a zip, or choose them. Up to 100 MB each.</span></label><p class="status" id="fStatus" role="status" aria-live="polite"></p>`:''}
  <div class="files">${share.files.map(f=>{const k=(f.type||'').split('/')[0];return `<figure class="file"><a class="pv" href="${esc(f.url)}" target="_blank" rel="noopener" aria-label="Open ${esc(f.name)}">${k==='image'?`<img src="${esc(f.url)}" alt="" loading="lazy">`:k==='video'?`<video src="${esc(f.url)}" controls muted playsinline preload="metadata"></video>`:`<span class="ext">${esc((f.name.split('.').pop()||'file').slice(0,5).toUpperCase())}</span>`}</a><figcaption><b title="${esc(f.name)}">${esc(f.name)}</b><span>${size(f.size)}${f.addedBy?' · added by '+esc(f.addedBy):''}</span><div class="row"><a href="${esc(f.url)}" download="${esc(f.name)}">Download</a>${key?`<button data-rm="${esc(f.url)}">Remove</button>`:''}</div></figcaption></figure>`}).join('')||'<p class="empty">No files yet.</p>'}</div></section>
 <section class="s" aria-labelledby="rh"><h2 id="rh">Atlas references <span>${refs.length}</span></h2><div class="refs">${refs.map(e=>`<article class="ref"><div class="im" style="background-image:url('${esc(thumb(e))}')" role="img" aria-label="${esc(e.title)}"></div><div class="t"><b>${esc(e.title)}</b><small>${esc(e.id)} · ${esc(e.group||'')}</small>${p.notes[e.id]?`<p>${esc(p.notes[e.id])}</p>`:''}</div></article>`).join('')||'<p class="empty">No atlas references in this project.</p>'}</div></section>`;
 $('#topActions').innerHTML=`<button class="btn" id="copyLink">Copy view link</button><button class="btn" id="keep">Save to my projects</button>`;
 $('#copyLink').onclick=async()=>{const u=ShareClient.links(id).view;try{await navigator.clipboard.writeText(u);say('View link copied.')}catch(e){say(u)}};
 $('#keep').onclick=keep;
 if(key)bindEdit()}
function keep(){try{const all=JSON.parse(localStorage.getItem('atlas-projects-v1')||'[]');if(all.some(x=>x.share&&x.share.id===id)){say('Already in your projects.');return}const p=share.project;
 all.push({id:crypto.randomUUID(),name:p.name,brief:p.brief,platform:p.platform,stage:p.stage,decisions:p.decisions,entries:p.entries,icons:p.icons,references:[],notes:p.notes,directions:[],created:Date.now(),...(key?{share:{id,key,synced:share.updated,uploaded:{}}}:{})});
 localStorage.setItem('atlas-projects-v1',JSON.stringify(all));say(key?'Saved to your projects, linked to this shared copy.':'Saved a copy to your projects.')}catch(e){say('Could not save in this browser.')}}
function bindEdit(){const st=$('#eStatus');
 $('#eSave').onclick=async()=>{const b=$('#eSave');b.disabled=true;st.textContent='Saving…';try{const p={...share.project,name:$('#eName').value.trim()||share.project.name,brief:$('#eBrief').value,decisions:$('#eDec').value};const r=await ShareClient.update(id,key,{project:p});share=r.share;st.textContent='Saved.';$('#pname').textContent=share.project.name}catch(e){st.textContent=e.message}finally{b.disabled=false}};
 const drop=$('#drop'),fs=$('#fStatus');
 const go=async list=>{list=[...list];if(!list.length)return;const added=[];for(const [i,f] of list.entries()){const bad=ShareClient.check(f);if(bad){fs.textContent=bad;continue}try{fs.textContent=`Uploading ${i+1} of ${list.length}: ${f.name}…`;added.push(await ShareClient.uploadFile(id,key,f,pc=>fs.textContent=`Uploading ${i+1} of ${list.length}: ${f.name} · ${pc}%`))}catch(e){fs.textContent=e.message}}
  if(added.length){try{share=(await ShareClient.update(id,key,{addFiles:added.map(a=>({...a,addedBy:'a collaborator'}))})).share;say(added.length+' file'+(added.length>1?'s':'')+' added.');render()}catch(e){fs.textContent=e.message}}};
 $('#fin').onchange=e=>{go(e.target.files);e.target.value=''};
 ['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over')}));['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over')}));drop.addEventListener('drop',e=>go(e.dataTransfer.files));
 main.addEventListener('click',async e=>{const b=e.target.closest('[data-rm]');if(!b)return;if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='Select again to remove';setTimeout(()=>{if(b.isConnected){b.dataset.c='';b.textContent='Remove'}},5000);return}try{share=(await ShareClient.update(id,key,{removeFiles:[b.dataset.rm]})).share;say('File removed.');render()}catch(err){say(err.message)}})}
(async()=>{if(!/^[ve]$/.test(mode)||!/^[A-Za-z0-9_-]{16}$/.test(id||'')){state('This link is incomplete.','Ask the person who shared it to copy the link again.');return}
 try{share=(await ShareClient.get(id)).share;render()}catch(e){state(e.status===404?'This project is no longer shared.':'We couldn’t open this project.',e.status===404?'The owner stopped sharing it.':e.message)}})();
addEventListener('hashchange',()=>location.reload());
})();
</script></body></html>
