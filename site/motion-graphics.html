<style>
/* Motion graphics studio. The site style (November 2026): one typeface, white chrome, hairlines, 40px controls with 10px corners; the preview sits on the alternate surface. */
:root{--bg:#FFFFFF;--panel:#FFFFFF;--ink:#0F1115;--mute:#5F6573;--hair:#E6E8EC;--hair2:#D5D8DF;--soft:#F6F7F9;--accent:#0F1115;--shadow:0 12px 28px -18px rgba(15,17,21,.25)}
html[data-tt]:not([data-tt=clean]){--hair2:color-mix(in srgb,var(--ink) 24%,var(--panel))}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;z-index:50;background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px}.skip:focus{top:10px}
/* the bar: name, one line about it, actions on the right */
header.top,html[data-tt] body header.top{position:sticky;top:var(--sb-h,0px);z-index:20;display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;min-height:57px;padding:8px max(20px,env(safe-area-inset-right)) 8px max(20px,env(safe-area-inset-left));background:var(--panel);border-bottom:1px solid var(--hair)}
.brand{display:flex;align-items:baseline;gap:2px 12px;min-width:0;flex-wrap:wrap}
.brand h1{margin:0;font:600 16px/1.25 Inter,system-ui,sans-serif;letter-spacing:-.01em;white-space:nowrap}
.brand p{margin:0;color:var(--mute);font-size:14px}
.acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--hair2);background:var(--panel);font-weight:500;font-size:14px;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--soft)}.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:#000}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details.menu{position:relative}details.menu>summary{list-style:none}details.menu>summary::-webkit-details-marker{display:none}
details.menu>summary::after{content:'';width:6px;height:6px;margin:-3px 2px 0 4px;border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:rotate(45deg);opacity:.75}
.pop{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:280px;max-width:min(340px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--hair);border-radius:14px;box-shadow:0 16px 40px -16px rgba(15,17,21,.28);padding:4px;display:grid;gap:2px}
.pop button{display:grid;gap:1px;text-align:left;border:0;background:none;border-radius:10px;padding:8px 12px;font-size:14px;min-height:44px}.pop button:hover{background:var(--soft)}
.pop b{font-weight:500}.pop small{color:var(--mute);font-size:13px}
/* the side panel */
.app{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr)}
.side{background:var(--panel);border-right:1px solid var(--hair);min-width:0;min-height:calc(100vh - 57px - var(--sb-h,0px))}
.sec{padding:16px 20px;border-bottom:1px solid var(--hair);display:grid;gap:12px}
.sec h2{margin:0;font:600 13px/1.3 Inter,system-ui,sans-serif;color:var(--ink)}
.hint{margin:0;font-size:13px;color:var(--mute);line-height:1.5}
label.f{display:grid;gap:6px;font-size:13px;font-weight:500;color:var(--mute)}
label.f>span{display:flex;justify-content:space-between;gap:8px}label.f output{font-variant-numeric:tabular-nums}
input[type=text],select,textarea{width:100%;min-height:40px;border:1px solid var(--hair2);border-radius:10px;background-color:var(--panel);padding:0 12px;font-size:14px;font-weight:400;color:var(--ink)}
textarea{resize:vertical;min-height:64px;padding:9px 12px}
input[type=range]{width:100%;accent-color:var(--accent);min-height:28px}
.seg{display:flex;gap:2px;flex-wrap:wrap;padding:3px;border:1px solid var(--hair);border-radius:10px;background:var(--soft)}
.seg button{flex:1 0 auto;min-height:32px;padding:0 12px;border:0;background:none;border-radius:7px;font-size:14px;font-weight:500;color:var(--mute)}
.seg button[aria-pressed=true],html[data-tt] .side .seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--hair2)}
.pals{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pals button{height:40px;border-radius:10px;border:1px solid var(--hair);padding:0;overflow:hidden;display:flex}.pals button i{flex:1}.pals button[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:2px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cols label{display:grid;gap:6px;font-size:13px;font-weight:500;color:var(--mute)}
.cols input[type=color]{width:100%;height:40px;border:1px solid var(--hair2);border-radius:10px;background:var(--panel);padding:3px}
.check{display:flex;gap:10px;align-items:center;font-size:14px;min-height:44px}.check input{width:20px;height:20px;flex:none;margin:0;accent-color:var(--accent)}
/* the preview: artwork on the alternate surface */
.main{padding:20px max(20px,env(safe-area-inset-right)) 40px 20px;min-width:0;display:grid;gap:14px;align-content:start;background:var(--soft)}
#mgStage{display:grid;place-items:center;background:repeating-conic-gradient(#ECEEF2 0 25%,#FFFFFF 0 50%) 0 0/20px 20px;border:1px solid var(--hair);border-radius:14px;padding:16px;min-height:200px}
#mgCanvas{max-width:100%;max-height:62vh;height:auto;width:auto;border-radius:6px;box-shadow:0 0 0 1px var(--hair);display:block}
.transport{display:flex;gap:12px;align-items:center}.transport input{flex:1}.transport output{font:500 13px/1 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--mute);min-width:84px;text-align:right}
.transport .btn{min-width:76px}
/* templates: the same card as the galleries */
.gal h2{margin:0 0 4px;font:600 13px/1.3 Inter,system-ui,sans-serif}
.mgPick{margin:12px 0 0}.mgPick select{width:100%}.mgShown{margin:8px 0 12px;color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
#mgGrid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
#mgGrid button{display:grid;gap:4px;width:100%;text-align:left;border:1px solid var(--hair);background:var(--panel);border-radius:14px;padding:6px 6px 10px;transition:border-color .2s,transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
#mgGrid button:hover{border-color:var(--hair2);transform:translateY(-2px);box-shadow:0 12px 28px -18px rgba(15,17,21,.25)}#mgGrid button[aria-current=true]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
#mgGrid canvas{width:100%;aspect-ratio:16/9;border-radius:9px;display:block;background:#111;margin-bottom:4px}
#mgGrid b{font-size:14px;font-weight:600;line-height:1.3;letter-spacing:-.01em;padding:0 6px}#mgGrid span{font:500 12px/1.3 Inter,system-ui,sans-serif;color:var(--mute);padding:0 6px}
#mgStatus{margin:0;min-height:20px;font-size:13px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s cubic-bezier(.2,.8,.2,1);z-index:60;max-width:calc(100vw - 32px)}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:860px){.stTabs{top:calc(var(--sb-h,0px) - 1px)}.app{grid-template-columns:1fr}.side{border-right:0;border-top:1px solid var(--hair);min-height:0;order:2}.main{padding:16px 16px 20px;order:1}#mgCanvas{max-height:46vh}header.top,html[data-tt] body header.top{padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right))}}
@media(max-width:640px){.btn,input[type=text],select{min-height:44px}.seg button{min-height:36px}.pals button,.cols input[type=color]{height:44px}}
@media(prefers-reduced-motion:reduce){#mgGrid button,.btn,.toast{transition:none}#mgGrid button:hover{transform:none}}
</style><meta property="og:type" content="website"><meta property="og:site_name" content="Visual &amp; Motion Atlas"><meta property="og:title" content="Motion graphics studio · Visual & Motion Atlas"><meta property="og:description" content="Animated titles, lower thirds, logo stings, transitions, counters and looping backdrops. Change the words, colours and shape, then export a video, a GIF, a PNG sequence or one HTML file."><meta property="og:url" content="https://motionatlas-ten.vercel.app/motion-graphics"><meta property="og:image" content="https://motionatlas-ten.vercel.app/assets/og-atlas.jpg"><meta name="twitter:card" content="summary_large_image">

<header class="top">
 <div class="brand"><h1>Motion graphics studio</h1><p id="mgCount"></p></div>
 <div class="acts">
  <button class="btn" id="mgCopy" type="button">Copy as HTML</button>
  <details class="menu" id="mgExport"><summary class="btn primary">Export</summary><div class="pop">
   <button type="button" data-x="webm"><b>Video (WebM)</b><small>Full size, 60 frames a second. Keeps a transparent background.</small></button>
   <button type="button" data-x="gif"><b>GIF</b><small>640 px wide, 20 frames a second, loops forever.</small></button>
   <button type="button" data-x="png"><b>This frame (PNG)</b><small>The frame showing now, at full size.</small></button>
   <button type="button" data-x="seq"><b>PNG sequence (ZIP)</b><small>Every frame at 30 a second, for a video editor.</small></button>
   <button type="button" data-x="html"><b>One HTML file</b><small>The animation as code, no libraries, ready to embed.</small></button>
  </div></details>
 </div>
</header>
<div class="app">
<aside class="side" aria-label="Settings">
 <section class="sec"><h2 id="mgName">Template</h2><p class="hint" id="mgDesc"></p></section>
 <section class="sec" id="mgWords"><h2>Words</h2></section>
 <section class="sec"><h2>Type</h2>
  <label class="f"><span>Typeface</span><select id="mgFont"></select></label>
 </section>
 <section class="sec"><h2>Colour</h2>
  <div class="pals" id="mgPals" role="group" aria-label="Palettes"></div>
  <div class="cols"><label>Background<input type="color" id="mgBg"></label><label>Text<input type="color" id="mgInk"></label><label>Accent<input type="color" id="mgAccent"></label></div>
  <label class="check"><input type="checkbox" id="mgAlpha"> Transparent background</label>
  <p class="hint">Transparent is kept in the WebM video, PNG and HTML exports, so a lower third or transition can sit over your footage.</p>
 </section>
 <section class="sec"><h2>Shape and length</h2>
  <div class="seg" id="mgRatio" role="group" aria-label="Shape"></div>
  <label class="f"><span>Length <output id="mgDurOut"></output></span><input type="range" id="mgDur" min="1.5" max="12" step="0.5"></label>
 </section>
</aside>
<main class="main" id="mgMain" tabindex="-1">
 <div id="mgStage"><canvas id="mgCanvas" role="img" aria-label="Preview of the animation"></canvas></div>
 <div class="transport"><button class="btn" id="mgPlay" type="button" aria-pressed="true">Pause</button><input type="range" id="mgScrub" min="0" max="1000" value="0" aria-label="Position in the animation"><output id="mgTime"></output></div>
 <p id="mgStatus" role="status" aria-live="polite"></p>
 <section class="gal" aria-labelledby="mgGalH"><h2 id="mgGalH">Templates</h2><p class="hint">Pick one to edit. Thumbnails play when you point at them.</p>
  <div class="mgPick"><select id="mgCat" aria-label="Kind of template"></select></div><p class="mgShown" id="mgShown" role="status"></p><ul id="mgGrid"></ul></section>
</main>
</div>
<div class="toast" id="mgToast" role="status" aria-live="polite"></div>
