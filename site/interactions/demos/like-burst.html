<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Like button with a burst</title>
<style>
:root{--bg:#FAFAFA;--ink:#111113;--mute:#6B6F76;--hot:#BD0F2C}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;display:grid;place-items:center}
.row{display:flex;gap:28px;align-items:center}
.like{position:relative;display:inline-flex;align-items:center;gap:10px;border:0;background:#fff;border-radius:999px;padding:12px 20px 12px 14px;font:700 16px/1 system-ui;color:var(--ink);cursor:pointer;box-shadow:0 6px 20px -10px rgba(120,40,30,.5)}
.like:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.heart{position:relative;width:30px;height:30px;display:grid;place-items:center}
.heart svg{width:26px;height:26px;fill:none;stroke:var(--mute);stroke-width:2;transition:fill .2s,stroke .2s}
.like[aria-pressed=true] svg{fill:var(--hot);stroke:var(--hot);animation:pop .5s cubic-bezier(.2,1.8,.4,1)}
.heart i{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--c);opacity:0}
.like[aria-pressed=true] .heart i{animation:fly .6s ease-out}
.heart::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--hot);opacity:0}
.like[aria-pressed=true] .heart::after{animation:ring .5s ease-out}
.n{display:inline-block;min-width:2.4ch;font-variant-numeric:tabular-nums;overflow:hidden;height:1em}
.n span{display:block;transition:transform .35s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes fly{0%{transform:rotate(var(--a)) translateY(0) scale(1);opacity:1}100%{transform:rotate(var(--a)) translateY(-30px) scale(.2);opacity:0}}
p{text-align:center;color:var(--mute);font-size:13px}
@media(prefers-reduced-motion:reduce){.like[aria-pressed=true] svg,.like[aria-pressed=true] .heart i,.like[aria-pressed=true] .heart::after{animation:none}.n span{transition:none}}
</style></head><body>
<div><div class="row">
<button class="like" aria-pressed="false" data-n="128"><span class="heart" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10A4.4 4.4 0 0 1 12 7.6a4.4 4.4 0 0 1 7.5 2.9c0 5.4-7.5 10-7.5 10z"/></svg></span><span class="sr">Like</span><span class="n" aria-hidden="true"><span>128<br>129</span></span></button>
<button class="like" aria-pressed="false" data-n="2041"><span class="heart" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10A4.4 4.4 0 0 1 12 7.6a4.4 4.4 0 0 1 7.5 2.9c0 5.4-7.5 10-7.5 10z"/></svg></span><span class="sr">Like</span><span class="n" aria-hidden="true"><span>2041<br>2042</span></span></button>
</div><p>The heart pops, a ring expands, eight dots fly out and the count rolls up.</p></div>
<style>.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}</style>
<script>
document.querySelectorAll('.like').forEach(b=>{const h=b.querySelector('.heart'),n=b.querySelector('.n span'),C=['#FF3B5C','#FFB703','#7C5CFF','#3DDC97'];
 for(let i=0;i<8;i++){const d=document.createElement('i');d.style.setProperty('--a',i*45+'deg');d.style.setProperty('--c',C[i%4]);h.append(d)}
 b.addEventListener('click',()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);n.style.transform=on?'translateY(-50%)':'';b.querySelector('.sr').textContent=on?'Liked, '+(+b.dataset.n+1)+' likes':'Like, '+b.dataset.n+' likes'})});
</script></body></html>
