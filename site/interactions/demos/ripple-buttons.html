<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ripple buttons</title>
<style>
:root{--bg:#F2F0FA;--ink:#18162A;--mute:#5C5873;--card:#FFFFFF;--v:#5B3DF5;--hair:#E2DEF2}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:30px 16px}
.wrap{width:min(900px,100%)}
h1{margin:0 0 6px;font:650 clamp(30px,4.4vw,50px)/1.02 system-ui;letter-spacing:-.04em}
.lede{margin:0 0 26px;color:var(--mute);max-width:54ch}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cell{background:var(--card);border:1px solid var(--hair);border-radius:20px;padding:26px 18px 16px;display:grid;justify-items:center;gap:14px;min-height:150px;align-content:center}
.cell small{font:500 11px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.rb{position:relative;overflow:hidden;isolation:isolate;font:600 15px/1 system-ui;min-height:50px;padding:0 26px;border-radius:14px;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.rb:active{transform:scale(.97)}
.rb:focus-visible{outline:2px solid var(--v);outline-offset:3px}
.rb .rp{position:absolute;border-radius:50%;pointer-events:none;transform:scale(0);z-index:-1}
.solid{background:var(--v);color:#fff;box-shadow:0 10px 24px -12px var(--v)}
.solid .rp{background:rgba(255,255,255,.35)}
.ghost{background:transparent;color:var(--v);box-shadow:inset 0 0 0 1.5px var(--v)}
.ghost .rp{background:rgba(91,61,245,.16)}
.fill{background:#fff;color:#fff;box-shadow:inset 0 0 0 1.5px var(--ink)}
.fill .rp{background:#18162A}
.fill span{mix-blend-mode:difference}
.icon{width:58px;height:58px;padding:0;border-radius:50%;background:#18162A;color:#fff;display:grid;place-items:center}
.icon .rp{background:rgba(180,160,255,.45)}
.pill{border-radius:999px;background:linear-gradient(135deg,#D8336F,#5B3DF5);color:#fff}
.pill .rp{background:rgba(255,255,255,.4)}
.sw{position:relative;width:64px;height:36px;border-radius:999px;border:0;background:#CFCBE0;cursor:pointer;overflow:hidden;isolation:isolate;padding:0;transition:background .3s}
.sw[aria-checked=true]{background:var(--v)}
.sw::after{content:"";position:absolute;left:4px;top:4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.sw[aria-checked=true]::after{transform:translateX(28px)}
.sw .rp{background:rgba(255,255,255,.5)}
.sw:focus-visible{outline:2px solid var(--v);outline-offset:3px}
@media (max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.rb{padding:0 18px;font-size:14px}}
</style></head><body>
<div class="wrap">
<h1>Every press leaves a mark.</h1>
<p class="lede">Ink spreads from exactly where you pressed. From the keyboard it starts in the middle. Hold the pointer down and the ripple waits for you before it fades.</p>
<div class="grid">
 <div class="cell"><button class="rb solid">Get started</button><small>Solid</small></div>
 <div class="cell"><button class="rb ghost">Learn more</button><small>Outline</small></div>
 <div class="cell"><button class="rb fill" id="fill"><span>Hold to fill</span></button><small>Ink fill</small></div>
 <div class="cell"><button class="rb icon" aria-label="Add"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><small>Icon</small></div>
 <div class="cell"><button class="rb pill">Join the beta</button><small>Gradient pill</small></div>
 <div class="cell"><button class="sw rb" role="switch" aria-checked="false" aria-label="Notifications"></button><small>Switch</small></div>
</div>
</div>
<script>
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function ripple(b,x,y,hold){const r=b.getBoundingClientRect();const cx=x==null?r.width/2:x-r.left,cy=y==null?r.height/2:y-r.top;const R=Math.hypot(Math.max(cx,r.width-cx),Math.max(cy,r.height-cy));
 const s=document.createElement('span');s.className='rp';s.style.width=s.style.height=R*2+'px';s.style.left=cx-R+'px';s.style.top=cy-R+'px';b.append(s);
 if(reduce){s.style.transform='scale(1)';s.style.opacity=.5;setTimeout(()=>s.remove(),180);return null}
 const grow=s.animate([{transform:'scale(0)'},{transform:'scale(1)'}],{duration:b.classList.contains('fill')?900:520,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});
 const fade=()=>grow.finished.then(()=>s.animate([{opacity:1},{opacity:0}],{duration:420,fill:'forwards'}).finished).then(()=>s.remove());
 if(hold)return fade;fade();return null}
document.querySelectorAll('.rb').forEach(b=>{let release=null;
 b.addEventListener('pointerdown',e=>{if(e.button>0)return;release=ripple(b,e.clientX,e.clientY,true);});
 const up=()=>{if(release){release();release=null}};b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);
 b.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.repeat)ripple(b)});
 if(b.getAttribute('role')==='switch')b.addEventListener('click',()=>b.setAttribute('aria-checked',b.getAttribute('aria-checked')!=='true'))});
if(!reduce){const B=[...document.querySelectorAll('.rb')];let i=0;const t=setInterval(()=>{const b=B[i++];const r=b.getBoundingClientRect();ripple(b,r.left+r.width*(.25+Math.random()*.5),r.top+r.height/2);if(b.getAttribute('role')==='switch')b.setAttribute('aria-checked','true');if(i>=B.length)clearInterval(t)},260)}
</script></body></html>
