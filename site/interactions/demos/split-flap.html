<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Split-flap departure board</title>
<style>
:root{--bg:#0B0B0C;--ink:#F5F1E6;--mute:#9E998D;--flap:#1B1B1D;--flap2:#222224;--amber:#FFB938;--c:clamp(17px,2.15vw,32px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px 16px}
.wrap{width:max-content;max-width:100%}
.top{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
h1{margin:0;font:700 clamp(22px,3vw,34px)/1 system-ui;letter-spacing:.02em;text-transform:uppercase}
h1 span{color:var(--amber)}
.clock{font:600 14px/1 ui-monospace,Menlo,monospace;color:var(--amber);letter-spacing:.1em}
.board{background:#121213;border-radius:14px;padding:clamp(10px,1.6vw,20px);box-shadow:inset 0 0 0 1px #29292c,0 30px 60px -30px #000}
.hd,.row{display:flex;gap:calc(var(--c)*.7)}
.hd{font:600 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding:0 2px 10px}
.row+.row{margin-top:calc(var(--c)*.28)}
.col{display:flex;gap:3px}
.hd .col{display:block}
.cell{position:relative;width:var(--c);height:calc(var(--c)*1.42);border-radius:4px;font:700 calc(var(--c)*1.02)/calc(var(--c)*1.42) ui-monospace,Menlo,Consolas,monospace;text-align:center;color:var(--ink);perspective:240px}
.cell .h{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--flap);backface-visibility:hidden}
.cell .h span{position:absolute;left:0;right:0;height:200%;display:block}
.cell .u{top:0;border-radius:4px 4px 0 0;background:var(--flap2)}
.cell .l{bottom:0;border-radius:0 0 4px 4px}
.cell .l span{top:-100%}
.cell .fu{transform-origin:50% 100%;z-index:2}
.cell .fl{transform-origin:50% 0;z-index:2;transform:rotateX(90deg)}
.cell::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#000;z-index:3}
.st-ON .cell{color:#8DF5A6}.st-DE .cell,.st-BO .cell{color:var(--amber)}.st-CA .cell{color:#FF6B5E}
.foot{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
button{font:600 13px/1 system-ui;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid #38383c;background:transparent;color:var(--ink);cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:700px){.c-time,.c-gate{display:none!important}:root{--c:clamp(12px,4.1vw,22px)}}
</style></head><body>
<div class="wrap">
<div class="top"><h1>Departures <span>✈</span></h1><span class="clock" id="clock" aria-hidden="true">--:--</span></div>
<div class="board" aria-hidden="true"><div class="hd" id="hd"></div><div id="rows"></div></div>
<table class="vh"><caption>Departures</caption><thead><tr><th>Time</th><th>Destination</th><th>Gate</th><th>Status</th></tr></thead><tbody id="sr"></tbody></table>
<div class="foot"><button id="shuffle">Update board</button><button id="pause" aria-pressed="false">Pause updates</button></div>
</div>
<script>
const CONFIG={chars:' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:.-',cols:[['time','Time',5],['dest','Destination',10],['gate','Gate',3],['st','Status',7]],every:6000,
 flights:[['07:45','LISBON','A12','ON TIME'],['08:10','REYKJAVIK','B03','BOARDING'],['08:25','KYOTO','C21','DELAYED'],['08:40','MARRAKECH','A07','ON TIME'],['09:05','OSLO','B11','CANCEL'],['09:20','BUENOS AIRES','D02','ON TIME'],['09:35','TBILISI','C04','DELAYED'],['09:50','HOBART','A15','ON TIME'],['10:15','VALPARAISO','D09','BOARDING'],['10:30','NUUK','B01','ON TIME']]};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rowsEl=document.getElementById('rows'),hd=document.getElementById('hd');let start=0,paused=false;
const pad=(s,n)=>(s+' '.repeat(n)).slice(0,n);
CONFIG.cols.forEach(([k,t,n])=>{const d=document.createElement('div');d.className='col c-'+k;d.style.width=`calc(${n}*var(--c) + ${n-1}*3px)`;d.textContent=t;hd.append(d)});
const R=[];for(let r=0;r<6;r++){const row=document.createElement('div');row.className='row';const cells=[];CONFIG.cols.forEach(([k,,n])=>{const col=document.createElement('div');col.className='col c-'+k;for(let i=0;i<n;i++){const c=mk();col.append(c.el);cells.push(c)}row.append(col)});rowsEl.append(row);R.push({row,cells})}
function mk(){const el=document.createElement('div');el.className='cell';el.innerHTML='<div class="h u"><span> </span></div><div class="h l"><span> </span></div><div class="h u fu"><span> </span></div><div class="h l fl"><span> </span></div>';const [u,l,fu,fl]=[...el.children].map(x=>x.firstChild);return{el,u,l,fu,fl,ch:' ',q:[],busy:false}}
function setTo(c,ch,delay){if(c.target===ch)return;c.target=ch;if(reduce){c.ch=ch;[c.u,c.l,c.fu,c.fl].forEach(s=>s.textContent=ch);return}
 const A=CONFIG.chars,i0=A.indexOf(c.ch),i1=Math.max(0,A.indexOf(ch));const steps=[];let i=i0;let n=0;while(i!==i1&&n<10){i=(i+1)%A.length;steps.push(A[i]);n++}if(steps[steps.length-1]!==ch)steps.push(ch);c.q=steps;if(!c.busy)setTimeout(()=>run(c),delay)}
function run(c){if(!c.q.length){c.busy=false;return}c.busy=true;const nx=c.q.shift(),cur=c.ch;c.u.textContent=nx;c.fu.textContent=cur;c.fl.textContent=nx;c.l.textContent=cur;
 const d=c.q.length?55:110;const a=c.fu.parentNode.animate([{transform:'rotateX(0)'},{transform:'rotateX(-90deg)'}],{duration:d,easing:'ease-in'});
 a.onfinish=()=>{c.fu.textContent=nx;const b=c.fl.parentNode.animate([{transform:'rotateX(90deg)'},{transform:'rotateX(0)'}],{duration:d,easing:'ease-out',fill:'forwards'});b.onfinish=()=>{c.l.textContent=nx;c.ch=nx;b.cancel();run(c)}}}
function show(){const list=[];for(let r=0;r<6;r++)list.push(CONFIG.flights[(start+r)%CONFIG.flights.length]);
 list.forEach((f,r)=>{const s=f.map((v,k)=>pad(v,CONFIG.cols[k][2])).join('');R[r].row.className='row st-'+f[3].slice(0,2).replace(' ','');[...s].forEach((ch,i)=>setTo(R[r].cells[i],ch,r*90+i*22))});
 document.getElementById('sr').innerHTML=list.map(f=>'<tr>'+f.map(v=>`<td>${v}</td>`).join('')+'</tr>').join('')}
function tick(){if(!paused){start=(start+1)%CONFIG.flights.length;show()}}
let timer=setInterval(tick,CONFIG.every);if(reduce){paused=true}
document.getElementById('shuffle').onclick=()=>{start=(start+1)%CONFIG.flights.length;show()};
const pb=document.getElementById('pause');pb.onclick=()=>{paused=!paused;pb.setAttribute('aria-pressed',paused);pb.textContent=paused?'Resume updates':'Pause updates'};
if(reduce){pb.setAttribute('aria-pressed','true');pb.textContent='Resume updates'}
const ck=document.getElementById('clock');const clk=()=>{const d=new Date();ck.textContent=d.toTimeString().slice(0,5)};clk();setInterval(clk,10000);
show();
</script></body></html>
