<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confetti button</title>
<style>
:root{--bg:#FAFAFA;--ink:#111113;--mute:#6B6F76;--btn:#111113}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(60% 60% at 50% 40%,#ECEEF2,var(--bg));color:var(--ink);font:15px/1.5 system-ui,sans-serif;display:grid;place-items:center;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.wrap{text-align:center;position:relative}
.btn{font:700 18px/1 system-ui;color:#fff;background:var(--btn);border:0;border-radius:14px;padding:18px 30px;cursor:pointer;box-shadow:0 10px 30px -10px var(--btn);transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.94)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:4px}
p{color:var(--mute);font-size:13px;margin:18px 0 0}
</style></head><body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="wrap"><button class="btn" id="b">Mark as done</button><p id="s" role="status">Press it. Each press throws a burst from the button.</p></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),b=document.getElementById('b'),s=document.getElementById('s');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,COL=['#7C5CFF','#FF5C8A','#FFD166','#3DDC97','#4CC9F0','#fff'];
let P=[],run=false,n=0;
function fit(){const d=Math.min(2,devicePixelRatio||1);c.width=innerWidth*d;c.height=innerHeight*d;x.setTransform(d,0,0,d,0,0)}fit();addEventListener('resize',fit);
function burst(){const r=b.getBoundingClientRect(),ox=r.left+r.width/2,oy=r.top+r.height/2;
 for(let i=0;i<90;i++){const a=-Math.PI/2+(Math.random()-.5)*2.2,v=6+Math.random()*10;P.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:5+Math.random()*7,h:3+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.5,c:COL[i%COL.length],life:1})}
 if(!run){run=true;requestAnimationFrame(tick)}}
function tick(){x.clearRect(0,0,innerWidth,innerHeight);P=P.filter(p=>p.life>0&&p.y<innerHeight+30);
 for(const p of P){p.vy+=.32;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life-=.008;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.scale(1,Math.cos(p.r*2));x.globalAlpha=Math.min(1,p.life*2);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()}
 P.length?requestAnimationFrame(tick):run=false}
b.addEventListener('click',()=>{n++;s.textContent='Done '+n+(n===1?' time.':' times.')+' Nicely.';if(!reduce)burst()});
</script></body></html>
