<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cursor spotlight grid</title>
<style>
:root{--bg:#FAFAFA;--ink:#111113;--mute:#6B6F76;--card:#FFFFFF;--edge:#E6E6E8;--glow:124,140,255;--x:50%;--y:30%}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:36px 16px}
.wrap{width:min(1060px,100%)}
h1{margin:0 0 6px;font:600 clamp(28px,4vw,44px)/1.05 system-ui;letter-spacing:-.035em}
.lede{margin:0 0 26px;color:var(--mute);max-width:52ch}
.grid{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{position:relative;border-radius:18px;padding:1px;background:radial-gradient(420px circle at var(--lx) var(--ly),rgba(var(--glow),.75),rgba(var(--glow),.08) 40%,var(--edge) 60%);text-decoration:none;color:inherit;outline:none}
.card .in{position:relative;height:100%;border-radius:17px;background:var(--card);padding:22px 22px 24px;overflow:hidden;display:grid;gap:10px;align-content:start;min-height:190px}
.card .in::before{content:"";position:absolute;inset:0;background:radial-gradient(320px circle at var(--lx) var(--ly),rgba(var(--glow),.16),transparent 60%);pointer-events:none}
.card svg{width:34px;height:34px;color:#B9C1FF}
.card h2{margin:0;font:600 17px/1.25 system-ui;letter-spacing:-.01em}
.card p{margin:0;color:var(--mute);font-size:14px}
.card.wide{grid-column:span 2}
.card:focus-visible{box-shadow:0 0 0 2px #B9C1FF}
.meter{display:flex;gap:4px;align-items:flex-end;height:46px;margin-top:6px}
.meter i{flex:1;border-radius:3px;background:linear-gradient(#8C9BFF,#3A43A8)}
@media (max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:540px){.grid{grid-template-columns:1fr}.card.wide{grid-column:auto}.card .in{min-height:0}}
</style></head><body>
<div class="wrap">
<h1>One light, many surfaces.</h1>
<p class="lede">A single spotlight follows your pointer across the whole grid, catching each card's edge as it passes. Tab through to move it by keyboard.</p>
<div class="grid" id="grid"></div>
</div>
<script>
const CONFIG={cards:[['Realtime sync','Edits land everywhere in under 80 ms, even on hotel wifi.','M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4',1],['Private by default','Keys never leave the device.','M6 11V8a6 6 0 0 1 12 0v3M5 11h14v10H5zM12 15v2'],['Command bar','Everything is two keystrokes away.','M9 6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3z'],['Automations','Turn repeated clicks into one rule.','M13 2 4 14h7l-1 8 9-12h-7z'],['Version history','Scrub back through every change.','M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2'],['Insights','See what changed, who changed it and why it mattered.','M4 20V10M10 20V4M16 20v-8M22 20H2',1],['Offline first','Keep working on a plane. It merges when you land.','M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 20h.01']]};
const g=document.getElementById('grid');
CONFIG.cards.forEach(([t,p,d,wide],i)=>{const a=document.createElement('a');a.href='#';a.className='card'+(wide?' wide':'');a.innerHTML=`<div class="in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg><h2>${t}</h2><p>${p}</p>${i===5?'<div class="meter" aria-hidden="true">'+[30,52,40,70,58,88,64,96,74,82,60,90].map(h=>`<i style="height:${h}%"></i>`).join('')+'</div>':''}</div>`;a.onclick=e=>e.preventDefault();g.append(a)});
const C=[...g.children];const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let tx=innerWidth*.3,ty=innerHeight*.35,x=tx,y=ty,idle=true,raf=0,t0=performance.now();
function paint(){C.forEach(c=>{const r=c.getBoundingClientRect();c.style.setProperty('--lx',(x-r.left)+'px');c.style.setProperty('--ly',(y-r.top)+'px')})}
function loop(t){if(idle&&!reduce){const r=g.getBoundingClientRect(),k=(t-t0)/1000;tx=r.left+r.width*(.5+.42*Math.sin(k*.6));ty=r.top+r.height*(.5+.4*Math.sin(k*.9+1))}
 const e=reduce?1:.14;x+=(tx-x)*e;y+=(ty-y)*e;paint();raf=requestAnimationFrame(loop)}
function to(nx,ny){idle=false;tx=nx;ty=ny;clearTimeout(to.t);to.t=setTimeout(()=>{idle=true;t0=performance.now()},4000)}
addEventListener('pointermove',e=>to(e.clientX,e.clientY));
addEventListener('pointerdown',e=>to(e.clientX,e.clientY));
g.addEventListener('focusin',e=>{const r=e.target.getBoundingClientRect();to(r.left+r.width/2,r.top+r.height*.35)});
if(reduce){const r=g.getBoundingClientRect();tx=x=r.left+r.width*.25;ty=y=r.top+40}
requestAnimationFrame(loop);
</script></body></html>
