<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zoom-through reveal</title>
<style>
:root{--bg:#FAFAFA;--ink:#111113;--mute:#6B6F76}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
.track{height:320vh}
.pin{position:sticky;top:0;height:100vh;overflow:hidden;display:grid;place-items:center}
.frame{position:absolute;width:var(--w,30vw);aspect-ratio:var(--ar,4/5);max-width:100vw;border-radius:var(--rad,14px);overflow:hidden;will-change:width}
.frame img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(var(--s,1.2))}
.word{position:absolute;font:400 clamp(40px,11vw,150px)/.9 Georgia,serif;letter-spacing:-.04em;white-space:nowrap;will-change:transform}
.l{right:calc(50% + var(--w,30vw)/2 + 2vw)}.r{left:calc(50% + var(--w,30vw)/2 + 2vw)}
.cap{position:absolute;bottom:6vh;left:0;right:0;text-align:center;color:#fff;font-size:15px;opacity:var(--o,0);text-shadow:0 1px 10px rgba(0,0,0,.6)}
.hint{position:absolute;top:4vh;width:100%;text-align:center;color:var(--mute);font-size:13px;opacity:calc(1 - var(--o,0) * 2)}
.after{min-height:60vh;display:grid;place-items:center;padding:0 16px}.after p{font:400 clamp(20px,3vw,30px)/1.35 Georgia,serif;max-width:30ch;text-align:center}
@media (max-width:600px){.word{display:none}}
</style></head><body>
<section class="track" id="track"><div class="pin" id="pin">
<p class="hint">Scroll</p>
<span class="word l" id="l">Into</span><div class="frame" id="fr"><img src="../../assets/art/biolum.svg" alt="Bioluminescent trails on dark water"></div><span class="word r" id="r">the deep</span>
<p class="cap">Bioluminescent trails, filmed as a fifteen-second loop.</p>
</div></section>
<section class="after"><p>One image grows until it becomes the page. The words step aside to let it through.</p></section>
<script>
const tr=document.getElementById('track'),pin=document.getElementById('pin');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function u(){const r=tr.getBoundingClientRect(),p=Math.min(1,Math.max(0,-r.top/(r.height-innerHeight)));const e=reduce?(p>.5?1:0):p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const w0=Math.min(innerWidth*.3,360);const wv=w0+(innerWidth-w0)*e;pin.style.setProperty('--w',wv+'px');
const h0=w0*1.25;const hv=h0+(innerHeight-h0)*e;document.getElementById('fr').style.height=hv+'px';document.getElementById('fr').style.aspectRatio='auto';
pin.style.setProperty('--rad',(14*(1-e))+'px');pin.style.setProperty('--s',1.2-.2*e);pin.style.setProperty('--o',Math.max(0,(e-.8)*5));
document.getElementById('l').style.transform=`translateX(${-e*30}vw)`;document.getElementById('r').style.transform=`translateX(${e*30}vw)`}
addEventListener('scroll',u,{passive:true});addEventListener('resize',u);u();
</script></body></html>
