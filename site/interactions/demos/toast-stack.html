<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stacked toasts with swipe</title>
<style>
:root{--bg:#F4F4F1;--ink:#16171A;--mute:#5D6068;--card:#FFFFFF;--hair:#E3E3DE;--ok:#127A47;--err:#C0352B;--info:#2F5BD9}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;min-height:100vh;padding:clamp(28px,8vh,80px) clamp(16px,6vw,72px)}
h1{margin:0 0 8px;font:650 clamp(30px,4.4vw,50px)/1.02 system-ui;letter-spacing:-.04em;max-width:16ch}
.lede{margin:0 0 24px;color:var(--mute);max-width:54ch}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btns button{font:600 14px/1 system-ui;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--hair);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.btns button i{width:8px;height:8px;border-radius:50%}
button:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.region{position:fixed;right:clamp(12px,3vw,28px);bottom:clamp(12px,3vw,28px);width:min(380px,calc(100vw - 24px));height:0;z-index:5}
.region ol{list-style:none;margin:0;padding:0}
.t{position:absolute;right:0;bottom:0;width:100%;overflow:hidden;background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:14px 44px 14px 16px;display:grid;grid-template-columns:22px 1fr;gap:4px 12px;box-shadow:0 14px 34px -16px rgba(20,22,30,.35);touch-action:pan-y;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s,height .35s;user-select:none}
.t svg{width:22px;height:22px;grid-row:span 2;margin-top:1px}
.t b{font-weight:600;font-size:14px}
.t span{color:var(--mute);font-size:13.5px;grid-column:2}
.t .act{grid-column:2;justify-self:start;margin-top:6px;font:600 13px/1 system-ui;padding:8px 12px;border-radius:8px;border:0;background:var(--ink);color:#fff;cursor:pointer}
.t .x{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:8px;border:0;background:none;font-size:18px;line-height:1;cursor:pointer}
.t .x:hover{background:var(--bg)}
.t .bar{position:absolute;left:16px;right:16px;bottom:0;height:2px;border-radius:2px;background:var(--hair);overflow:hidden}
.t .bar::after{content:"";position:absolute;inset:0;background:currentColor;transform-origin:left;transform:scaleX(var(--left,1))}
.t.drag{transition:none}
.ok{color:var(--ok)}.err{color:var(--err)}.info{color:var(--info)}
.t>b,.t>.x{color:var(--ink)}.t span{color:var(--mute)}
.hint{margin-top:18px;color:var(--mute);font-size:13px}
@media (prefers-reduced-motion:reduce){.t{transition:opacity .2s}}
</style></head><body>
<h1>Notifications that stack, not pile up.</h1>
<p class="lede">Fire a few. They collapse into a neat stack; hover or focus it to fan them out. Swipe one sideways to dismiss it, or press Escape while one is focused. Timers pause while you are reading.</p>
<div class="btns"><button data-k="ok"><i style="background:var(--ok)"></i>Saved</button><button data-k="info"><i style="background:var(--info)"></i>New comment</button><button data-k="undo"><i style="background:var(--ink)"></i>Moved to trash</button><button data-k="err"><i style="background:var(--err)"></i>Upload failed</button></div>
<p class="hint">Up to five stay on screen; older ones leave on their own.</p>
<section class="region" id="region" aria-label="Notifications" aria-live="polite"><ol id="list"></ol></section>
<script>
const CONFIG={life:5200,max:5,gap:12,peek:14,kinds:{ok:['ok','Changes saved','Your draft is safe in the cloud.'],info:['info','Ada left a comment','“Love the second option, can we try it bigger?”'],undo:['ok','Moved to trash','“Q3 roadmap.pdf” will be deleted in 30 days.','Undo'],err:['err','Upload failed','The file is over 25 MB. Try compressing it first.','Retry']}};
const ICON={ok:'<circle cx="12" cy="12" r="10" fill="currentColor" opacity=".14"/><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',err:'<circle cx="12" cy="12" r="10" fill="currentColor" opacity=".14"/><path d="M12 7v6M12 16.5v.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',info:'<circle cx="12" cy="12" r="10" fill="currentColor" opacity=".14"/><path d="M8 9h8M8 13h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const list=document.getElementById('list'),region=document.getElementById('region');let T=[],open=false,id=0;
function add(k,keep){const [tone,title,msg,act]=CONFIG.kinds[k];const li=document.createElement('li');li.className='t';li.tabIndex=0;li.setAttribute('aria-label',title+'. '+msg);
 li.innerHTML=`<svg viewBox="0 0 24 24" class="${tone}" aria-hidden="true">${ICON[tone]}</svg><b>${title}</b><span>${msg}</span>${act?`<button class="act">${act}</button>`:''}<button class="x" aria-label="Dismiss: ${title}">×</button><div class="bar ${tone}" aria-hidden="true"></div>`;
 const o={li,left:keep?Infinity:CONFIG.life,id:++id};li.style.transform='translateY(110%)';li.style.opacity=0;list.prepend(li);T.unshift(o);
 li.querySelector('.x').onclick=()=>kill(o);const a=li.querySelector('.act');if(a)a.onclick=()=>{kill(o);if(act==='Undo')setTimeout(()=>add('ok'),250)};
 swipe(o);requestAnimationFrame(()=>requestAnimationFrame(lay));while(T.length>CONFIG.max)kill(T[T.length-1])}
function lay(){let y=0;T.forEach(o=>{if(!o.h)o.h=o.li.offsetHeight});const fh=T[0]?T[0].h:0;T.forEach((o,i)=>{const h=o.h;o.li.style.height=(open?h:fh)+'px';let tr,op=1;
  if(open){tr=`translateY(${-y}px)`;y+=h+CONFIG.gap}else{tr=`translateY(${-i*CONFIG.peek}px) scale(${1-i*.05})`;op=i>2?0:1}
  o.li.style.transform=o.dx?`translateX(${o.dx}px) `+tr:tr;o.li.style.opacity=op;o.li.style.zIndex=100-i;o.li.style.transformOrigin='center bottom';
  o.li.inert=!open&&i>0;});region.style.height=open?y+'px':'0'}
function kill(o,dir=1){if(o.dead)return;o.dead=true;T=T.filter(x=>x!==o);o.li.style.transform=`translateX(${dir*120}%)`;o.li.style.opacity=0;const wasFocused=o.li.contains(document.activeElement);setTimeout(()=>{o.li.remove();if(wasFocused&&T[0])T[0].li.focus()},reduce?0:380);if(!T.length)open=false;lay()}
function swipe(o){let sx=null,t0=0;o.li.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;sx=e.clientX;t0=performance.now();o.li.classList.add('drag');o.li.setPointerCapture(e.pointerId)});
 o.li.addEventListener('pointermove',e=>{if(sx===null)return;const d=e.clientX-sx;o.dx=d>0?d:d*.25;o.li.style.opacity=1-Math.min(.8,Math.abs(o.dx)/260);lay()});
 const end=e=>{if(sx===null)return;o.li.classList.remove('drag');const v=(o.dx||0)/(performance.now()-t0);sx=null;if((o.dx||0)>110||v>.6){kill(o,1)}else{o.dx=0;lay()}};o.li.addEventListener('pointerup',end);o.li.addEventListener('pointercancel',end);
 o.li.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Delete'){e.preventDefault();kill(o)}})}
region.addEventListener('pointerenter',()=>{open=true;lay()});region.addEventListener('pointerleave',()=>{open=false;lay()});
region.addEventListener('focusin',()=>{open=true;lay()});region.addEventListener('focusout',e=>{if(!region.contains(e.relatedTarget)){open=false;lay()}});
let last=performance.now();(function tick(t){const dt=t-last;last=t;if(!open)T.forEach(o=>{o.left-=dt;o.li.style.setProperty('--left',Math.min(1,Math.max(0,o.left/CONFIG.life)));if(o.left<=0)kill(o)});requestAnimationFrame(tick)})(last);
document.querySelectorAll('.btns button').forEach(b=>b.onclick=()=>add(b.dataset.k));
['ok','info','undo'].forEach((k,i)=>setTimeout(()=>add(k,true),300+i*350));
addEventListener('resize',lay);
</script></body></html>
