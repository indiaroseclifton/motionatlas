<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stacking toasts</title>
<style>/* Colours: --ac is the accent. The Settings block further down switches dark and light. */
:root{--bg:#0E0F13;--panel:#191B22;--ink:#F3F4F7;--mute:#9CA3B4;--line:#2A2D38;--ac:#8B7CFF}
:root[data-mode=light]{--bg:#F3F1EC;--panel:#FFFFFF;--ink:#17181C;--mute:#646978;--line:#DEDAD0}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;display:grid;place-items:center;background:var(--bg);color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}h1,h2,h3,p,figure{margin:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hint{position:fixed;left:0;right:0;bottom:16px;text-align:center;font-size:12.5px;color:var(--mute);padding:0 16px;pointer-events:none}
.nb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:17px;line-height:1}
.nb:hover{border-color:var(--ac)}
.go{min-height:46px;padding:0 22px;border-radius:12px;border:0;background:var(--ac);color:#fff;font-weight:600}
.reg{position:fixed;right:20px;width:min(340px,calc(100vw - 40px));height:0}.reg.bottom{bottom:20px}.reg.top{top:20px}
.t{position:absolute;right:0;width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:13px 12px 13px 14px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);box-shadow:0 14px 30px -14px rgba(0,0,0,.45);transition:transform .45s cubic-bezier(.3,1.35,.5,1),opacity .3s;font-size:13.5px}
.bottom .t{bottom:0;transform-origin:50% 100%}.top .t{top:0;transform-origin:50% 0}
.t .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac);font-weight:700}
.t b{display:block}.t span{color:var(--mute)}.t button{all:unset;cursor:pointer;width:26px;height:26px;display:grid;place-items:center;border-radius:6px;color:var(--mute)}.t button:hover{background:var(--line)}.t button:focus-visible{outline:2px solid var(--ac)}
.t.in{opacity:0}.bottom .t.in{transform:translateY(60px) scale(.9)!important}.top .t.in{transform:translateY(-60px) scale(.9)!important}.t.out{opacity:0!important;transform:translateX(110%)!important}
@media(prefers-reduced-motion:reduce){.t{transition:opacity .2s}}
</style>
<body>
<button class="go" id="go">Show a notification</button>
<div class="reg bottom" id="reg" role="region" aria-label="Notifications" aria-live="polite"></div>
<script type="application/json" id="settings">{"peek":12,"scale":0.05,"visible":3,"gap":10,"duration":5,"corner":14,"position":"bottom","mode":"light","accent":"#12805C"}</script>
<script>
const CONTROLS=[{g:'Deck',k:'peek',label:'Peek',min:4,max:24,step:1,unit:'px'},{k:'scale',label:'Scale step',min:0,max:.1,step:.005},{k:'visible',label:'Visible when closed',min:1,max:5,step:1},{k:'gap',label:'Gap when open',min:4,max:24,step:1,unit:'px'},{k:'corner',label:'Corner radius',min:4,max:28,step:1,unit:'px'},
 {g:'Behaviour',k:'duration',label:'Stay for',min:2,max:12,step:.5,unit:'s'},{k:'position',label:'Position',type:'select',options:['bottom','top']},{g:'Look',k:'mode',label:'Mode',type:'select',options:['light','dark']},{k:'accent',label:'Accent',type:'color'}];
/* Settings come from the JSON block above. Change a value there, or call apply() after changing S. */
const S=JSON.parse(document.getElementById('settings').textContent),calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
const theme=()=>{const r=document.documentElement;r.dataset.mode=S.mode||'dark';if(S.accent)r.style.setProperty('--ac',S.accent)};
addEventListener('message',e=>{const d=e.data;if(d&&d.atlasSet){Object.assign(S,d.atlasSet);apply()}});
if(parent!==window)parent.postMessage({atlasControls:CONTROLS,atlasValues:S},'*');
const M=[['✓','Changes saved','Your profile is up to date.'],['↑','Upload finished','brand-film.mp4, 86 MB'],['✉','Invite sent','priya@example.com will get an email.'],['↺','Moved to archive','Undo is available for a minute.'],['★','Added to favourites','Find it under Saved.']],reg=document.getElementById('reg');let n=0,open=false;
function layout(){const ts=[...reg.children].filter(t=>!t.classList.contains('out')).reverse(),dir=S.position==='top'?1:-1;let y=0;
 ts.forEach((t,k)=>{t.style.zIndex=100-k;t.style.borderRadius=S.corner+'px';if(open){t.style.transform=`translateY(${dir*y}px)`;t.style.opacity=1;y+=t.offsetHeight+S.gap}else{t.style.transform=`translateY(${dir*k*S.peek}px) scale(${1-k*S.scale})`;t.style.opacity=k<S.visible?1:0}})}
function close(t){if(t.classList.contains('out'))return;clearTimeout(t._t);t.classList.add('out');layout();setTimeout(()=>{t.remove();layout()},300)}
function arm(t){clearTimeout(t._t);t._t=setTimeout(()=>open?arm(t):close(t),S.duration*1000)}
function add(){const [ic,a,b]=M[n++%M.length],t=document.createElement('div');t.className='t in';t.innerHTML=`<span class="ic" aria-hidden="true">${ic}</span><div><b>${a}</b><span>${b}</span></div><button aria-label="Dismiss: ${a}">✕</button>`;reg.append(t);t.querySelector('button').onclick=()=>close(t);
 requestAnimationFrame(()=>{t.classList.remove('in');layout()});arm(t)}
const setOpen=o=>{open=o;layout()};reg.addEventListener('pointerenter',()=>setOpen(true));reg.addEventListener('pointerleave',()=>setOpen(reg.contains(document.activeElement)));reg.addEventListener('focusin',()=>setOpen(true));reg.addEventListener('focusout',()=>setTimeout(()=>{if(!reg.contains(document.activeElement))setOpen(false)},0));
document.getElementById('go').onclick=add;
function apply(){theme();reg.className='reg '+S.position;layout()}
apply();add();setTimeout(add,350);setTimeout(add,700);
</script>
</body>
</html>
