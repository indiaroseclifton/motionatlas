<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scroll index</title>
<style>
:root{--bg:#FAFAFA;--ink:#111113;--mute:#6B6F76;--hair:#E6E6E8}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,sans-serif}
.wrap{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:5vw;padding:0 max(16px,5vw)}
nav{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;justify-content:center;gap:4px}
nav a{display:flex;gap:12px;align-items:baseline;color:var(--mute);text-decoration:none;padding:8px 0;font-size:14px;transition:color .3s}
nav a i{font:normal 11px/1 ui-monospace,monospace;width:2.4ch}
nav a b{font-weight:500;transition:transform .35s cubic-bezier(.2,.8,.2,1);display:inline-block}
nav a.on{color:var(--ink)}nav a.on b{transform:translateX(8px)}
nav a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.bar{height:2px;background:var(--hair);margin-top:12px;position:relative}.bar span{position:absolute;inset:0;background:var(--ink);transform-origin:0 50%;transform:scaleX(var(--p,0))}
section{min-height:90vh;display:grid;align-content:center;gap:18px;padding:8vh 0;border-bottom:1px solid var(--hair)}
section img{width:min(520px,100%);aspect-ratio:4/3;object-fit:cover;border-radius:6px}
section h2{margin:0;font:400 clamp(30px,5vw,60px)/1 Georgia,serif;letter-spacing:-.02em}
section p{margin:0;max-width:52ch;color:#4A463F}
@media (max-width:640px){.wrap{grid-template-columns:1fr}nav{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;background:var(--bg);z-index:3;padding:10px 0;gap:14px;border-bottom:1px solid var(--hair)}nav a{white-space:nowrap}.bar{display:none}}
@media (prefers-reduced-motion:reduce){nav a b{transition:none}}
</style></head><body>
<div class="wrap"><nav id="nav" aria-label="Chapters"></nav><main id="main"></main></div>
<script>
const ch=[['Tide','We start at the waterline, where the light is flattest and the colours are honest.','erosion'],['Salt','Crystals on slate, sorted by size and photographed at noon.','sand'],['Ink','Every label is printed in a single blue, overprinted until it goes nearly black.','sumi'],['Glass','The shop window becomes a lens; we design for the reflection as much as the room.','soap'],['Night','After closing, the sign stays lit. One glow, one word.','biolum']];
const nav=document.getElementById('nav'),main=document.getElementById('main');
ch.forEach(([t,p,img],i)=>{nav.insertAdjacentHTML('beforeend',`<a href="#c${i}"><i>0${i+1}</i><b>${t}</b></a>`);main.insertAdjacentHTML('beforeend',`<section id="c${i}"><h2>${t}</h2><p>${p}</p><img src="../../assets/art/${img}.svg" alt="" loading="lazy"></section>`)});
nav.insertAdjacentHTML('beforeend','<div class="bar"><span id="bar"></span></div>');
const A=[...nav.querySelectorAll('a')],S=[...main.children];
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const i=S.indexOf(e.target);A.forEach((a,j)=>{a.classList.toggle('on',i===j);if(i===j)a.setAttribute('aria-current','true');else a.removeAttribute('aria-current')})}}),{rootMargin:'-45% 0px -45% 0px'});S.forEach(s=>io.observe(s));
addEventListener('scroll',()=>{const p=scrollY/(document.documentElement.scrollHeight-innerHeight);document.getElementById('bar').style.setProperty('--p',p)},{passive:true});
A.forEach(a=>a.onclick=e=>{e.preventDefault();document.querySelector(a.getAttribute('href')).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})});
</script></body></html>
