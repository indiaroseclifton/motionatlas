<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Holographic card</title>
<style>
:root{--bg:#0A0A12;--ink:#F4F4FF;--mute:#8E8EA8}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(70% 60% at 50% 30%,#1A1730,var(--bg));color:var(--ink);font:15px/1.5 system-ui,sans-serif;display:grid;place-items:center;padding:24px}
.scene{perspective:900px;text-align:center}
.card{--rx:0deg;--ry:0deg;--mx:50%;--my:50%;--o:0;position:relative;width:min(300px,72vw);aspect-ratio:5/7;border-radius:18px;border:0;padding:0;cursor:pointer;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .5s cubic-bezier(.2,.8,.2,1);background:linear-gradient(160deg,#2B2466,#0F1638 60%,#3A1456);box-shadow:0 30px 60px -30px #000,0 0 0 1px rgba(255,255,255,.12) inset;overflow:hidden;color:inherit;text-align:left;font:inherit}
.card.live{transition:none}.card:focus-visible{outline:3px solid #fff;outline-offset:6px}
.card::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,#ff5cf0 0,#5cf0ff 12%,#f0ff5c 24%,#5cff9d 36%,#ff5cf0 48%);background-size:300% 300%;background-position:var(--mx) var(--my);mix-blend-mode:color-dodge;opacity:calc(var(--o)*.55);transition:opacity .4s}
.card::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.75),transparent 45%);mix-blend-mode:overlay;opacity:var(--o);transition:opacity .4s}
.in{position:absolute;inset:0;padding:22px;display:grid;grid-template-rows:auto 1fr auto;z-index:1}
.in small{font:600 11px/1 ui-monospace,monospace;letter-spacing:.18em;opacity:.8}.in b{align-self:center;font:800 44px/1 system-ui;letter-spacing:-.03em}.in span{font-size:13px;opacity:.8}
p{color:var(--mute);font-size:13px;margin-top:24px}
</style></head><body>
<div class="scene"><button class="card" id="card" aria-label="Member card. Move over it to see the foil."><span class="in"><small>MEMBER · 0427</small><b>Atlas<br>Gold</b><span>Tilt me. The foil follows the light.</span></span></button>
<p>Pointer position drives the tilt, the rainbow foil and a glare. Arrow keys tilt it too.</p></div>
<script>
const c=document.getElementById('card'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function set(nx,ny){c.style.setProperty('--ry',(nx-.5)*(reduce?0:26)+'deg');c.style.setProperty('--rx',(.5-ny)*(reduce?0:22)+'deg');c.style.setProperty('--mx',nx*100+'%');c.style.setProperty('--my',ny*100+'%');c.style.setProperty('--o',1)}
function rest(){c.classList.remove('live');c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg');c.style.setProperty('--o',0)}
c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();c.classList.add('live');set((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)});c.addEventListener('pointerleave',rest);
let kx=.5,ky=.5;c.addEventListener('keydown',e=>{const k={ArrowLeft:[-.15,0],ArrowRight:[.15,0],ArrowUp:[0,-.15],ArrowDown:[0,.15]}[e.key];if(!k)return;e.preventDefault();kx=Math.min(1,Math.max(0,kx+k[0]));ky=Math.min(1,Math.max(0,ky+k[1]));c.classList.remove('live');set(kx,ky)});c.addEventListener('blur',()=>{kx=ky=.5;rest()});
</script></body></html>
