<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wave text</title>
<style>
:root{--bg:#FAFAFA;--ink:#111113;--mute:#6B6F76;--a:#18B49C}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;display:grid;place-items:center;text-align:center;padding:24px}
h1{margin:0;font:800 clamp(40px,11vw,128px)/1 system-ui,sans-serif;letter-spacing:-.03em;cursor:default;white-space:nowrap}
h1 span{display:inline-block;transform:translateY(calc(var(--y,0)*-1px)) scale(calc(1 + var(--y,0)*.004));color:color-mix(in srgb,var(--a) calc(var(--y,0)*2%),var(--ink));will-change:transform}
p{color:var(--mute);font-size:13px;margin-top:26px}
</style></head><body>
<div><h1 id="t" aria-label="Make waves">Make waves</h1><p>Move across the word. Letters rise under the pointer and settle back like a string being plucked.</p></div>
<script>
const t=document.getElementById('t'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
t.innerHTML=[...t.textContent].map(ch=>ch===' '?' ':'<span aria-hidden="true">'+ch+'</span>').join('');
const L=[...t.querySelectorAll('span')].map(el=>({el,y:0,v:0,goal:0}));let px=null,idle=0;
addEventListener('pointermove',e=>{px=e.clientX;idle=0});addEventListener('pointerleave',()=>px=null);document.addEventListener('pointerleave',()=>px=null);
function tick(now){idle++;L.forEach((l,i)=>{const r=l.el.getBoundingClientRect(),cx=r.left+r.width/2;
  l.goal=px!=null&&idle<240?46*Math.exp(-(((px-cx)/90)**2)):(idle>240?10*Math.max(0,Math.sin(now/600-i*.5)):0);
  l.v+=(l.goal-l.y)*.14;l.v*=.78;l.y+=l.v;l.el.style.setProperty('--y',l.y.toFixed(2))});requestAnimationFrame(tick)}
if(!reduce)requestAnimationFrame(tick);
</script></body></html>
