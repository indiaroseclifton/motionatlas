<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halo magnetic button</title>
<style>
:root{--bg:#FAFAFA;--ink:#111113;--mute:#6B6F76;--a:#111113;--b:#1EAE88}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;display:grid;place-items:center;overflow:hidden}
.zone{display:grid;place-items:center;width:min(520px,92vw);height:300px}
.btn{position:relative;font:600 17px/1 system-ui;letter-spacing:.01em;color:#fff;background:#111113;border:0;border-radius:999px;padding:22px 38px;cursor:pointer;isolation:isolate;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.btn::before{content:"";position:absolute;inset:-2px;border-radius:inherit;padding:2px;background:conic-gradient(from var(--r,0deg),var(--a),var(--b),transparent 40%,var(--a));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;z-index:-1}
.btn::after{content:"";position:absolute;inset:-30px;border-radius:inherit;background:radial-gradient(120px 80px at var(--mx,50%) var(--my,50%),rgba(180,140,255,.45),transparent 70%);filter:blur(10px);opacity:var(--glow,.35);z-index:-2;transition:opacity .3s}
.btn span{display:inline-block;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.btn:focus-visible{outline:2px solid var(--b);outline-offset:6px}
p{color:var(--mute);font-size:13px;text-align:center;margin-top:8px}
</style></head><body>
<div><div class="zone" id="zone"><button class="btn" id="btn"><span>Start a project →</span></button></div><p>Move toward the button. It leans in, and the halo follows you.</p></div>
<script>
const z=document.getElementById('zone'),b=document.getElementById('btn'),s=b.firstElementChild;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let r=0;
z.addEventListener('pointermove',e=>{const R=b.getBoundingClientRect(),cx=R.left+R.width/2,cy=R.top+R.height/2,dx=e.clientX-cx,dy=e.clientY-cy;b.style.setProperty('--mx',(e.clientX-R.left)+'px');b.style.setProperty('--my',(e.clientY-R.top)+'px');b.style.setProperty('--glow',.9);if(reduce)return;b.style.transform=`translate(${dx*.25}px,${dy*.3}px)`;s.style.transform=`translate(${dx*.08}px,${dy*.1}px)`});
z.addEventListener('pointerleave',()=>{b.style.transform='';s.style.transform='';b.style.setProperty('--glow',.35)});
(function spin(){if(!reduce){r=(r+.6)%360;b.style.setProperty('--r',r+'deg')}requestAnimationFrame(spin)})();
</script></body></html>
