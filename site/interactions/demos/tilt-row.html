<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parallax tilt row</title>
<style>
:root{--bg:#0E1013;--ink:#EEF0F3;--mute:#959CA8}
*{box-sizing:border-box}html,body{margin:0;min-height:100vh}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;display:grid;place-items:center;padding:6vh max(16px,4vw)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:clamp(14px,2.4vw,28px);width:min(1080px,100%);perspective:900px}
.card{color:inherit;text-decoration:none;position:relative;aspect-ratio:4/5;border-radius:16px;overflow:hidden;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1);background:#000;outline:none}
.card:focus-visible{box-shadow:0 0 0 2px #fff}
.card img{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.card .shine{position:absolute;inset:0;background:radial-gradient(240px 200px at var(--x,50%) var(--y,50%),rgba(255,255,255,.22),transparent 60%);opacity:0;transition:opacity .3s;mix-blend-mode:overlay}
.card:hover .shine{opacity:1}
.card h3{position:absolute;left:16px;bottom:14px;margin:0;font:500 22px/1 Georgia,serif;transform:translateZ(40px);text-shadow:0 2px 14px rgba(0,0,0,.6)}
</style></head><body>
<div class="row" id="row"></div>
<script>
const $p=window.__ixp||((k,d)=>d);
const d=[['Ferrofluid','ferro'],['Soap film','soap'],['Sand','sand'],['Biolume','biolum']];const row=document.getElementById('row');
d.forEach(([t,i])=>{const a=document.createElement('a');a.className='card';a.href='#';a.innerHTML=`<img src="../../assets/shelf/${i}.webp" alt=""><div class="shine"></div><h3>${t}</h3>`;a.onclick=e=>e.preventDefault();row.append(a)});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
row.querySelectorAll('.card').forEach(c=>{const im=c.querySelector('img');
c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;c.style.setProperty('--x',(px+.5)*100+'%');c.style.setProperty('--y',(py+.5)*100+'%');if(reduce)return;c.style.transition='transform .1s';c.style.transform=`rotateY(${px*$p('tilt',14)}deg) rotateX(${-py*$p('tilt',14)}deg)`;im.style.transform=`translate(${-px*$p('shift',18)}px,${-py*$p('shift',18)}px)`});
c.addEventListener('pointerleave',()=>{c.style.transition='';c.style.transform='';im.style.transform=''})});
</script></body></html>
