<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dial slider</title>
<style>
:root{--bg:#FAFAFA;--ink:#111113;--mute:#6B6F76;--accent:#BC5210}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:4vw;padding:4vh max(16px,6vw);overflow:hidden}
.view{position:relative;aspect-ratio:4/5;max-height:80vh;border-radius:14px;overflow:hidden;background:#000}
.view img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.06);transition:opacity .5s,transform .8s cubic-bezier(.2,.8,.2,1)}
.view img.on{opacity:1;transform:none}
.side{display:grid;gap:22px;justify-items:center}
.dial{position:relative;width:min(280px,36vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 40%,#EEF0F3,#ECEEF2);box-shadow:inset 0 2px 0 rgba(17,17,19,.06),0 20px 40px -22px rgba(0,0,0,.35),0 0 0 1px #E0E2E6;touch-action:none;cursor:grab}
.dial:focus-visible{outline:2px solid var(--accent);outline-offset:6px}
.ticks{position:absolute;inset:0}
.tick{position:absolute;left:50%;top:6px;width:2px;height:12px;margin-left:-1px;background:#5A5048;transform-origin:50% calc(min(280px,36vw)/2 - 6px)}
.tick.on{background:var(--accent);height:18px}
.knob{position:absolute;inset:22%;border-radius:50%;background:conic-gradient(from 0deg,#3A332D,#26211D,#3A332D,#26211D,#3A332D);box-shadow:0 6px 14px -4px #000,inset 0 1px 0 rgba(17,17,19,.1)}
.knob::after{content:"";position:absolute;left:50%;top:8%;width:4px;height:18%;margin-left:-2px;border-radius:2px;background:var(--accent)}
.read{text-align:center}.read b{display:block;font:500 clamp(24px,3.4vw,40px)/1.05 Georgia,serif}.read span{color:var(--mute);font-size:13px}
@media (max-width:640px){body{grid-template-columns:1fr;align-content:center}.view{max-height:46vh;justify-self:center;width:auto;height:46vh}.dial{width:200px}.tick{transform-origin:50% 94px}}
</style></head><body>
<div class="view" id="view"></div>
<div class="side">
<div class="dial" id="dial" role="slider" tabindex="0" aria-label="Choose a study" aria-valuemin="1"><div class="ticks" id="ticks"></div><div class="knob" id="knob"></div></div>
<div class="read" aria-live="polite"><b id="t"></b><span id="s"></span></div>
</div>
<script>
const d=[['Owl','Night study','owl'],['Lighthouse','Coastal light','lighthouse'],['Origami','Paper fold','origami'],['Statue','Plaster cast','statue'],['Nebula','Deep field','nebula'],['Amber','Resin study','amber'],['Marbling','Suminagashi','sumi'],['Erosion','Terrain','erosion']];
const N=d.length,SPAN=270,START=-135;const dial=document.getElementById('dial'),knob=document.getElementById('knob'),view=document.getElementById('view'),ticks=document.getElementById('ticks');
dial.setAttribute('aria-valuemax',N);
d.forEach((x,i)=>{const im=new Image();im.src=`../../assets/art/${x[2]}.svg`;im.alt=x[0];view.append(im);const t=document.createElement('i');t.className='tick';t.style.transform=`rotate(${START+i*SPAN/(N-1)}deg)`;ticks.append(t)});
const IM=[...view.children],TK=[...ticks.children];let idx=-1,ang=START;
function set(i){i=Math.max(0,Math.min(N-1,i));if(i===idx)return;idx=i;IM.forEach((m,j)=>m.classList.toggle('on',j===i));TK.forEach((t,j)=>t.classList.toggle('on',j===i));document.getElementById('t').textContent=d[i][0];document.getElementById('s').textContent=d[i][1];dial.setAttribute('aria-valuenow',i+1);dial.setAttribute('aria-valuetext',d[i][0]);}
function rot(a){ang=Math.max(START,Math.min(START+SPAN,a));knob.style.transform=`rotate(${ang}deg)`;set(Math.round((ang-START)/(SPAN/(N-1))))}
let drag=false;function pa(e){const r=dial.getBoundingClientRect();return Math.atan2(e.clientX-r.left-r.width/2,-(e.clientY-r.top-r.height/2))*180/Math.PI}
dial.addEventListener('pointerdown',e=>{drag=true;dial.setPointerCapture(e.pointerId);rot(pa(e))});dial.addEventListener('pointermove',e=>{if(drag)rot(pa(e))});
dial.addEventListener('pointerup',()=>{drag=false;rot(START+idx*SPAN/(N-1))});
dial.addEventListener('wheel',e=>{e.preventDefault();rot(START+(idx+(e.deltaY>0?1:-1))*SPAN/(N-1))},{passive:false});
dial.addEventListener('keydown',e=>{const k={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1}[e.key];if(k){e.preventDefault();rot(START+(idx+k)*SPAN/(N-1))}if(e.key==='Home')rot(START);if(e.key==='End')rot(START+SPAN)});
rot(START);
</script></body></html>
