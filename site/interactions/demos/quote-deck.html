<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swipe quote deck</title>
<style>
:root{--bg:#FAFAFA;--ink:#111113;--mute:#6B6F76;--c1:#FFFFFF;--c2:#E6E6E8;--c3:#D4D4D8}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;display:grid;place-items:center;overflow:hidden;padding:0 16px}
.stack{position:relative;width:min(440px,100%);aspect-ratio:5/4}
.q{position:absolute;inset:0;background:var(--c1);border-radius:20px;padding:clamp(20px,5vw,34px);display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 18px 36px -22px rgba(40,30,10,.55);touch-action:none;user-select:none;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s}
.q blockquote{margin:0;font:400 clamp(19px,3.4vw,26px)/1.3 Georgia,serif;letter-spacing:-.005em}
.q footer{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:13px}
.q footer img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.q footer b{color:var(--ink);display:block;font-weight:600}
.q.top{cursor:grab}.q.top:active{cursor:grabbing}
.ctl{display:flex;gap:10px;justify-content:center;margin-top:22px}
button{font:inherit;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid #C9C1B1;background:transparent;cursor:pointer;color:var(--ink)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{width:min(440px,100%)}
.hint{text-align:center;color:var(--mute);font-size:13px;margin-top:10px}
@media (prefers-reduced-motion:reduce){.q{transition:opacity .2s}}
</style></head><body>
<div class="wrap"><div class="stack" id="stack" aria-live="polite"></div>
<div class="ctl"><button id="prev">Previous</button><button id="next">Next</button></div><p class="hint">Drag the top card away, or use the buttons.</p></div>
<script>
const Q=[['They found the thing we couldn\'t say about ourselves, then made it look obvious.','Mara Quist','Owner, Saltwater Fish Co.','soap'],['The launch film did more in a week than our ads did in a quarter.','Theo Bannerman','Head of brand, Night Shift Bakery','owl'],['Every decision came with a reason we could repeat to our board.','Ines Okafor','Director, Plaster & Light','statue'],['Calm, fast and slightly obsessive about paper stock. We loved it.','Ruth Ellery','Founder, Fold Studio','origami']];
const st=document.getElementById('stack');let order=Q.map((_,i)=>i);
Q.forEach(([q,n,r,img],i)=>{const c=document.createElement('article');c.className='q';c.innerHTML=`<blockquote>“${q}”</blockquote><footer><img src="../../assets/art/${img}.svg" alt=""><div><b>${n}</b>${r}</div></footer>`;st.append(c)});
const C=[...st.children];
function lay(){order.forEach((ci,pos)=>{const c=C[ci];c.classList.toggle('top',pos===0);c.style.zIndex=10-pos;c.style.background=`var(--c${Math.min(3,pos+1)})`;c.style.transform=`translateY(${pos*14}px) scale(${1-pos*.05})`;c.style.opacity=pos>2?0:1;c.setAttribute('aria-hidden',pos!==0)})}
function next(dir=1){const c=C[order[0]];c.style.transform=`translateX(${dir*120}%) rotate(${dir*14}deg)`;c.style.opacity=0;setTimeout(()=>{order.push(order.shift());lay()},260)}
function prev(){order.unshift(order.pop());lay()}
document.getElementById('next').onclick=()=>next(1);document.getElementById('prev').onclick=prev;
let sx=0,dx=0,drag=null;
st.addEventListener('pointerdown',e=>{const c=e.target.closest('.q.top');if(!c)return;drag=c;sx=e.clientX;dx=0;c.style.transition='none';c.setPointerCapture(e.pointerId)});
st.addEventListener('pointermove',e=>{if(!drag)return;dx=e.clientX-sx;drag.style.transform=`translateX(${dx}px) rotate(${dx*.05}deg)`});
st.addEventListener('pointerup',()=>{if(!drag)return;drag.style.transition='';const c=drag;drag=null;if(Math.abs(dx)>90)next(Math.sign(dx));else lay()});
lay();
</script></body></html>
