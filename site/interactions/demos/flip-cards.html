<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D flip cards</title>
<style>
:root{--bg:#0F0E12;--ink:#F3EFE8;--mute:#A9A39A;--gold:#D9B26A}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:30px 16px}
.wrap{width:min(1100px,100%)}
header{display:flex;flex-wrap:wrap;gap:12px 30px;align-items:end;justify-content:space-between;margin-bottom:24px}
h1{margin:0;font:400 clamp(32px,4.6vw,54px)/1 Georgia,serif;letter-spacing:-.02em}
h1 em{color:var(--gold)}
header p{margin:0;color:var(--mute);max-width:44ch}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,2vw,22px);perspective:1400px}
.card{position:relative;aspect-ratio:3/4.4;border:0;padding:0;background:none;color:inherit;cursor:pointer;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.35,.45,1);text-align:left;font:inherit}
.card:focus-visible{outline:2px solid var(--gold);outline-offset:6px;border-radius:18px}
.face{position:absolute;inset:0;border-radius:18px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.front::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.75));border-radius:inherit}
.front .lab{position:absolute;left:16px;right:16px;bottom:14px;z-index:1}
.front .n{font:500 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;color:var(--gold)}
.front h2{margin:6px 0 0;font:400 clamp(20px,2vw,26px)/1.05 Georgia,serif}
.back{transform:rotateY(180deg);background:linear-gradient(160deg,#1E1B24,#121016);border:1px solid #3A3442;padding:20px;display:flex;flex-direction:column;gap:10px}
.card.y .back{transform:rotateX(180deg)}
.back .n{font:500 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;color:var(--gold)}
.back h2{margin:0;font:400 24px/1.05 Georgia,serif}
.back p{margin:0;color:#CFC9BF;font-size:14px}
.back dl{margin:auto 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px;border-top:1px solid #3A3442;padding-top:12px}
.back dt{color:var(--mute)}.back dd{margin:0}
.card:hover .front img{transform:scale(1.05)}
.foot{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}
.foot button{font:600 13px/1 system-ui;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid #3A3442;background:transparent;color:var(--ink);cursor:pointer}
.foot button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.back{padding:14px}.back p{font-size:13px}.back dl{font-size:11.5px}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.face{transition:opacity .25s}}
</style></head><body>
<div class="wrap">
<header><h1>Four <em>materials</em>, two sides each.</h1><p>Click, tap or press Enter to turn a card. It flips away from where you pressed it: left, right, top or bottom.</p></header>
<div class="grid" id="grid"></div>
<div class="foot"><button id="all">Flip all</button><button id="reset">Reset</button></div>
</div>
<script>
const CONFIG=[['I','Amber','amber','Resin that kept a forest. Warm, slow and full of trapped light.',[['Palette','Honey, umber'],['Mood','Archival'],['Use','Heritage brands']]],['II','Ferrofluid','ferro','Liquid that answers a magnet with a crown of spikes.',[['Palette','Oil, chrome'],['Mood','Uneasy'],['Use','Tech launches']]],['III','Soap film','soap','Colour made from thickness alone, gone in a breath.',[['Palette','Iridescent'],['Mood','Fragile'],['Use','Beauty, wellness']]],['IV','Sumi ink','sumi','Carbon and water, and a brush that cannot take it back.',[['Palette','Black, paper'],['Mood','Decisive'],['Use','Editorial']]]];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const g=document.getElementById('grid');
CONFIG.forEach(([n,t,img,p,dl])=>{const b=document.createElement('button');b.className='card';b.setAttribute('aria-pressed','false');b.setAttribute('aria-label',t+': show details');
 b.innerHTML=`<div class="face front"><img src="../../assets/shelf/${img}.webp" alt=""><div class="lab"><span class="n">${n}</span><h2>${t}</h2></div></div><div class="face back" aria-hidden="true"><span class="n">${n} · Material</span><h2>${t}</h2><p>${p}</p><dl>${dl.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl></div>`;
 b._r=0;b.addEventListener('click',e=>{let dir='y+';if(e.detail&&e.clientX){const r=b.getBoundingClientRect(),dx=(e.clientX-r.left)/r.width-.5,dy=(e.clientY-r.top)/r.height-.5;dir=Math.abs(dy)>Math.abs(dx)?(dy<0?'x+':'x-'):(dx<0?'y-':'y+')}flip(b,dir)});g.append(b)});
function flip(b,dir){const on=b.getAttribute('aria-pressed')!=='true';const axisX=on?dir[0]==='x':b.classList.contains('y');if(on)b.classList.toggle('y',axisX);
 if(reduce){b.style.transform=on?(axisX?'rotateX(180deg)':'rotateY(180deg)'):'';}else{b._r=on?(dir[1]==='+'?180:-180):0;b.style.transform=axisX?`rotateX(${b._r}deg)`:`rotateY(${-b._r}deg)`}
 b.setAttribute('aria-pressed',on);b.querySelector('.back').setAttribute('aria-hidden',!on);b.setAttribute('aria-label',b.querySelector('h2').textContent+(on?': details shown':': show details'))}
document.getElementById('all').onclick=()=>[...g.children].forEach((b,i)=>setTimeout(()=>{if(b.getAttribute('aria-pressed')!=='true')flip(b,'y+')},reduce?0:i*110));
document.getElementById('reset').onclick=()=>[...g.children].forEach((b,i)=>setTimeout(()=>{if(b.getAttribute('aria-pressed')==='true')flip(b,b.classList.contains('y')?'x+':'y+')},reduce?0:i*110));
</script></body></html>
