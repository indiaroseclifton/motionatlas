<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hover list with cursor image</title>
<style>
:root{--bg:#F3F1EC;--ink:#151412;--mute:#67625A;--hair:#D5D0C5}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;padding:8vh max(16px,6vw)}
p.k{font:600 11px/1 system-ui;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:0 0 18px}
ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--hair)}
li a{display:grid;grid-template-columns:3ch 1fr auto;gap:16px;align-items:baseline;padding:clamp(14px,2.4vw,22px) 0;border-bottom:1px solid var(--hair);color:inherit;text-decoration:none;transition:padding .3s cubic-bezier(.2,.8,.2,1),color .2s}
li a b{font:400 clamp(26px,5.4vw,58px)/1 Georgia,serif;letter-spacing:-.02em}
li a span{color:var(--mute);font-size:12px}
li a em{font-style:normal;color:var(--mute);font-size:13px}
ol:hover a{color:#77726A}ol:hover a:hover,a:focus-visible{color:var(--ink);padding-left:12px}
a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.peek{position:fixed;left:0;top:0;width:clamp(160px,20vw,260px);aspect-ratio:4/5;pointer-events:none;border-radius:6px;overflow:hidden;opacity:0;transform:translate(-50%,-50%) scale(.85);transition:opacity .25s,scale .25s;z-index:5;box-shadow:0 30px 50px -20px rgba(0,0,0,.45)}
.peek.on{opacity:1}
.peek img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.peek img.on{opacity:1}
@media (hover:none){.peek{display:none}}
@media (prefers-reduced-motion:reduce){li a,.peek{transition:none}}
</style></head><body>
<p class="k">Selected work · 2024–2026</p>
<ol id="list"></ol>
<div class="peek" id="peek" aria-hidden="true"></div>
<script>
const work=[['Saltwater','Fishmonger identity','soap'],['Night Shift','Bakery film series','owl'],['Plaster & Light','Gallery catalogue','statue'],['Fold','Packaging system','origami'],['Low Tide','Hotel website','lighthouse'],['Amber Hour','Distillery labels','amber']];
const list=document.getElementById('list'),peek=document.getElementById('peek');
work.forEach(([t,s,img],i)=>{const li=document.createElement('li');li.innerHTML=`<a href="#" data-i="${i}"><span>0${i+1}</span><b>${t}</b><em>${s}</em></a>`;list.append(li);const im=new Image();im.src=`../../assets/shelf/${img}.webp`;im.alt='';peek.append(im)});
const ims=[...peek.children];let tx=0,ty=0,x=0,y=0;
list.addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY});
list.addEventListener('pointerover',e=>{const a=e.target.closest('a');if(!a)return;peek.classList.add('on');ims.forEach((m,i)=>m.classList.toggle('on',i==a.dataset.i))});
list.addEventListener('pointerleave',()=>peek.classList.remove('on'));
list.addEventListener('click',e=>e.preventDefault());
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function f(){x+=(tx-x)*(reduce?1:.14);y+=(ty-y)*(reduce?1:.14);const r=reduce?0:(tx-x)*.05;peek.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%) rotate(${r}deg)`;requestAnimationFrame(f)}f();
</script></body></html>
