<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Odometer counter</title>
<style>
:root{--bg:#F5F2EA;--ink:#141414;--mute:#5F5A50;--card:#FFFDF8;--acc:#1F5EFF;--hair:#E3DDD0}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:30px 16px}
.wrap{width:min(980px,100%)}
.k{margin:0 0 10px;font:500 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.big{display:flex;align-items:flex-start;font:700 clamp(54px,12vw,168px)/1 system-ui;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin:0 0 6px;flex-wrap:nowrap;overflow:hidden}
.odo{display:inline-flex;overflow:hidden;height:1em;line-height:1}
.d{display:inline-block;height:1em;overflow:hidden;position:relative}
.d .s{display:flex;flex-direction:column;transition:transform 1.2s cubic-bezier(.2,.9,.15,1)}
.d .s span{height:1em;display:block;text-align:center}
.sep{display:inline-block;height:1em}
.cur{font-size:.5em;margin:.12em .06em 0 0;color:var(--mute);font-weight:600}
.lede{margin:0 0 22px;color:var(--mute);max-width:56ch}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:34px}
button,input{font:600 14px/1 system-ui;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--hair);background:var(--card);color:var(--ink)}
button{cursor:pointer}
button.p{background:var(--ink);color:#fff;border-color:var(--ink)}
input{width:160px;font-variant-numeric:tabular-nums;font-weight:500}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:18px}
.stat .v{font:650 clamp(30px,4vw,44px)/1 system-ui;letter-spacing:-.03em;font-variant-numeric:tabular-nums;display:flex}
.stat p{margin:8px 0 0;color:var(--mute);font-size:13px}
.up{color:#0B7A43}
@media (max-width:640px){.stats{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.d .s{transition:none}}
</style></head><body>
<div class="wrap">
<p class="k">Raised for the coastline fund</p>
<div class="big" id="big"></div>
<p class="lede">Digits roll like a mechanical counter. When a number carries, every wheel it touches turns, so you can feel how far it went.</p>
<div class="ctl"><button class="p" id="add1">+ €1</button><button id="add250">+ €250</button><button id="rand">Big donation</button><label><span style="position:absolute;left:-9999px">Set amount in euros</span><input id="inp" inputmode="numeric" placeholder="Type an amount"></label><button id="set">Set</button></div>
<div class="stats"><div class="stat"><div class="v" id="s1"></div><p>Donors this month</p></div><div class="stat"><div class="v" id="s2"></div><p>Kilometres of coast cleaned</p></div><div class="stat"><div class="v" id="s3"></div><p>Volunteers on the water today</p></div></div>
<p id="live" role="status" style="position:absolute;left:-9999px"></p>
</div>
<script>
const $p=window.__ixp||((k,d)=>d);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function odometer(host,{prefix='',group=true}={}){host.innerHTML='';if(prefix){const c=document.createElement('span');c.className='cur';c.textContent=prefix;host.append(c)}const o=document.createElement('span');o.className='odo';o.setAttribute('aria-hidden','true');host.append(o);let wheels=[],val=null;
 function build(str){o.innerHTML='';wheels=[];[...str].forEach((ch,i)=>{if(/\d/.test(ch)){const d=document.createElement('span');d.className='d';const s=document.createElement('span');s.className='s';for(let r=0;r<3;r++)for(let k=0;k<10;k++){const n=document.createElement('span');n.textContent=k;s.append(n)}d.append(s);o.append(d);wheels.push({s,pos:10})}else{const sp=document.createElement('span');sp.className='sep';sp.textContent=ch;o.append(sp)}})}
 function set(n){const str=group?n.toLocaleString('en-GB'):String(n);const old=val;if(val===null||String(old).length!==String(n).length||(group&&old.toLocaleString('en-GB').length!==str.length)){build(str);wheels.forEach(w=>{w.s.style.transition='none';w.s.style.transform=`translateY(-${10}em)`})}
  const digits=str.replace(/\D/g,'');const oldDigits=old===null?digits.replace(/\d/g,'0'):String(old).padStart(digits.length,'0');const up=old===null||n>=old;
  void o.offsetWidth;wheels.forEach((w,i)=>{const a=+oldDigits[i],b=+digits[i];let delta=(b-a+10)%10;if(!up)delta=delta-10;if(delta===-10)delta=0;
   const carry=Math.floor(Math.abs(n-(old??0))/Math.pow(10,digits.length-1-i));if(carry>=10&&delta===0)delta=up?10:-10;
   const start=10+a,end=start+delta;w.s.style.transition='none';w.s.style.transform=`translateY(-${start}em)`;void w.s.offsetWidth;w.s.style.transition=reduce?'none':'';w.s.style.transitionDelay=reduce?'0s':(i*40)+'ms';w.s.style.transform=`translateY(-${end}em)`});val=n}
 return{set,get:()=>val}}
const big=odometer(document.getElementById('big'),{prefix:'€'}),live=document.getElementById('live');
const s1=odometer(document.getElementById('s1')),s2=odometer(document.getElementById('s2')),s3=odometer(document.getElementById('s3'));
let total=Math.round($p('total',1284906));big.set(1000000);s1.set(0);s2.set(0);s3.set(0);
setTimeout(()=>{big.set(total);s1.set(4812);s2.set(387);s3.set(96)},350);
function go(n,say=true){total=Math.max(0,Math.min(99999999,Math.round(n)));big.set(total);if(say)live.textContent='Total now €'+total.toLocaleString('en-GB')}
document.getElementById('add1').onclick=()=>{go(total+1);s1.set(s1.get()+1)};
document.getElementById('add250').onclick=()=>{go(total+250);s1.set(s1.get()+1)};
document.getElementById('rand').onclick=()=>{go(total+Math.round(5000+Math.random()*90000));s1.set(s1.get()+1);s3.set(80+Math.round(Math.random()*40))};
const inp=document.getElementById('inp');const setv=()=>{const v=parseInt(inp.value.replace(/\D/g,''),10);if(!isNaN(v))go(v)};document.getElementById('set').onclick=setv;inp.addEventListener('keydown',e=>{if(e.key==='Enter')setv()});
</script></body></html>
