<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flowing line mesh</title>
<style>
:root{--bg:#FAFAFA;--ink:#111113;--mute:#6B6F76}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
.copy{position:relative;z-index:2;height:100%;display:grid;place-content:center;text-align:center;padding:0 16px;pointer-events:none}
.copy h1{margin:0;font:400 clamp(32px,6vw,72px)/1 Georgia,serif;letter-spacing:-.02em}
.copy p{color:var(--mute);margin:.8em auto 0;max-width:40ch}
</style></head><body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="copy"><h1>Quiet, constant motion.</h1><p>Sixty lines bend through a noise field. The pointer pulls them like a magnet under silk.</p></div>
<script>
const $p=window.__ixp||((k,d)=>d);
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,d;function sz(){d=Math.min(2,devicePixelRatio||1);W=c.width=innerWidth*d;H=c.height=innerHeight*d}sz();addEventListener('resize',sz);
let mx=-1e4,my=-1e4,tmx=mx,tmy=my;addEventListener('pointermove',e=>{tmx=e.clientX*d;tmy=e.clientY*d});addEventListener('pointerleave',()=>{tmx=tmy=-1e4});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function n(x,y,t){return Math.sin(x*1.7+t)*.5+Math.sin(y*2.3-t*.8+x)*.35+Math.sin((x+y)*3.1+t*.6)*.15}
let t=0;function f(){t+=reduce?0:.006;mx+=(tmx-mx)*.08;my+=(tmy-my)*.08;if(window.__IXP&&__IXP.tr){x.save();x.globalCompositeOperation='destination-out';x.fillStyle='rgba(0,0,0,.35)';x.fillRect(0,0,W,H);x.restore()}else{x.fillStyle='rgba(250,250,250,.35)';x.fillRect(0,0,W,H)}
const L=Math.round($p('l',60));for(let i=0;i<L;i++){const y0=H*(.12+.76*i/(L-1));x.beginPath();for(let k=0;k<=80;k++){const px=W*k/80;let py=y0+n(k/80*3,i/L*2,t)*H*.06;const dx=px-mx,dy=py-my,dist=Math.hypot(dx,dy),R=180*d;if(dist<R){py+=(dy/dist||0)*(R-dist)*.45}k?x.lineTo(px,py):x.moveTo(px,py)}
const hue=$p('hue',200)+i*1.6;x.strokeStyle=`hsla(${hue},70%,${40+i%3*6}%,${.25+.35*Math.sin(i/L*Math.PI)})`;x.lineWidth=d;x.stroke()}requestAnimationFrame(f)}f();
</script></body></html>
