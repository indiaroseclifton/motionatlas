<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animated progress steps</title>
<style>
:root{--bg:#FFFFFF;--ink:#101828;--mute:#667085;--a:#12B76A;--line:#E4E7EC}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;display:grid;place-items:center;padding:24px}
.card{width:min(560px,100%)}
ol{list-style:none;margin:0 0 26px;padding:0;display:flex}
li{flex:1;position:relative;display:grid;justify-items:center;gap:8px;font-size:13px;color:var(--mute);text-align:center}
li::before{content:'';position:absolute;top:17px;right:50%;width:100%;height:3px;background:var(--line)}
li::after{content:'';position:absolute;top:17px;right:50%;width:100%;height:3px;background:var(--a);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.3,.8,.3,1)}
li:first-child::before,li:first-child::after{display:none}
li.done::after,li.now::after{transform:scaleX(1)}
.dot{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;background:#fff;border:3px solid var(--line);display:grid;place-items:center;font-weight:700;transition:.3s .25s}
li.now .dot{border-color:var(--a);color:var(--ink);box-shadow:0 0 0 6px color-mix(in srgb,var(--a) 18%,transparent)}
li.done .dot{background:var(--a);border-color:var(--a);color:transparent}
.dot svg{position:absolute;width:18px;height:18px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s .4s}
li.done .dot svg{stroke-dashoffset:0}
li.now,li.done{color:var(--ink);font-weight:600}
.panel{border:1px solid var(--line);border-radius:14px;padding:20px;min-height:104px}
.panel h2{margin:0 0 4px;font-size:18px}.panel p{margin:0;color:var(--mute)}
.panel>div{animation:in .4s cubic-bezier(.2,.8,.2,1)}@keyframes in{from{opacity:0;transform:translateX(14px)}}
.row{display:flex;justify-content:space-between;margin-top:16px}
button{font:600 14px system-ui;border-radius:10px;padding:10px 16px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
button.p{background:var(--ink);border-color:var(--ink);color:#fff}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:3px solid var(--a);outline-offset:2px}
@media(prefers-reduced-motion:reduce){li::after,.dot,.dot svg{transition:none}.panel>div{animation:none}}
</style></head><body>
<div class="card"><ol id="steps" aria-label="Progress"></ol>
<div class="panel" id="panel" aria-live="polite"></div>
<div class="row"><button id="back">Back</button><button class="p" id="next">Continue</button></div></div>
<script>
const S=[['Cart','Two items, ready to go.'],['Delivery','Tomorrow, between 9 and 12.'],['Payment','Card ending 4242.'],['Done','Order placed. A receipt is on its way.']];
const ol=document.getElementById('steps'),panel=document.getElementById('panel'),back=document.getElementById('back'),next=document.getElementById('next');let i=0;
ol.innerHTML=S.map((s,k)=>'<li><span class="dot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'+(k+1)+'</span>'+s[0]+'</li>').join('');
function paint(){[...ol.children].forEach((li,k)=>{li.className=k<i?'done':k===i?'now':'';k===i?li.setAttribute('aria-current','step'):li.removeAttribute('aria-current')});if(i===S.length-1)ol.lastChild.className='done';
 panel.innerHTML='<div><h2>'+S[i][0]+'</h2><p>'+S[i][1]+'</p></div>';back.disabled=i===0;next.textContent=i===S.length-1?'Start again':i===S.length-2?'Place order':'Continue'}
next.onclick=()=>{i=i===S.length-1?0:i+1;paint()};back.onclick=()=>{i=Math.max(0,i-1);paint()};paint();
</script></body></html>
