<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D image ring</title>
<style>/* Colours: --ac is the accent. The Settings block further down switches dark and light. */
:root{--bg:#0E0F13;--panel:#191B22;--ink:#F3F4F7;--mute:#9CA3B4;--line:#2A2D38;--ac:#8B7CFF}
:root[data-mode=light]{--bg:#F3F1EC;--panel:#FFFFFF;--ink:#17181C;--mute:#646978;--line:#DEDAD0}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;display:grid;place-items:center;background:var(--bg);color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}h1,h2,h3,p,figure{margin:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hint{position:fixed;left:0;right:0;bottom:16px;text-align:center;font-size:12.5px;color:var(--mute);padding:0 16px;pointer-events:none}
.nb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:17px;line-height:1}
.nb:hover{border-color:var(--ac)}
.scene{width:100%;height:min(70vh,480px);perspective:var(--p);display:grid;place-items:center;touch-action:pan-y;cursor:grab;user-select:none}.scene:active{cursor:grabbing}
.ring{position:relative;width:var(--w);aspect-ratio:3/4;transform-style:preserve-3d;will-change:transform}
.c{position:absolute;inset:0;border-radius:var(--r);overflow:hidden;background:var(--panel);backface-visibility:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.c img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.cap{position:fixed;left:0;right:0;bottom:20px;text-align:center}.cap h2{font-size:18px}.cap p{color:var(--mute);font-size:13px}
</style>
<body>
<div class="scene" id="stage" tabindex="0" role="group" aria-roledescription="carousel" aria-label="Image ring. Use the arrow keys to turn it."><div class="ring" id="ring"></div></div>
<div class="cap" aria-live="polite"><h2 id="t"></h2><p>Drag to spin · arrow keys step</p></div>
<script type="application/json" id="settings">{"count":9,"radius":330,"size":170,"perspective":1100,"tilt":-8,"speed":0.25,"corner":16,"autoplay":true,"mode":"dark","accent":"#8B7CFF"}</script>
<script>
const CONTROLS=[{g:'Ring',k:'count',label:'Cards',min:5,max:9,step:1},{k:'radius',label:'Radius',min:180,max:560,step:5,unit:'px'},{k:'tilt',label:'Tilt',min:-30,max:30,step:1,unit:'°'},{k:'perspective',label:'Perspective',min:500,max:2400,step:50,unit:'px'},
 {g:'Cards',k:'size',label:'Card width',min:100,max:260,step:2,unit:'px'},{k:'corner',label:'Corner radius',min:0,max:40,step:1,unit:'px'},
 {g:'Behaviour',k:'autoplay',label:'Drift',type:'toggle'},{k:'speed',label:'Drift speed',min:.05,max:1,step:.05},{g:'Look',k:'mode',label:'Mode',type:'select',options:['dark','light']},{k:'accent',label:'Accent',type:'color'}];
/* Settings come from the JSON block above. Change a value there, or call apply() after changing S. */
const S=JSON.parse(document.getElementById('settings').textContent),calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
const theme=()=>{const r=document.documentElement;r.dataset.mode=S.mode||'dark';if(S.accent)r.style.setProperty('--ac',S.accent)};
addEventListener('message',e=>{const d=e.data;if(d&&d.atlasSet){Object.assign(S,d.atlasSet);apply()}});
if(parent!==window)parent.postMessage({atlasControls:CONTROLS,atlasValues:S},'*');
/* Carousel engine: drag, arrow keys, click a card. n() is the item count, draw(pos) places the cards. */
const IMG=n=>'../../assets/shelf/'+n+'.webp';
const ITEMS=[['amber','Amber resin','Warm, slow, translucent'],['biolum','Night water','Light that answers touch'],['bloom','Pigment bloom','Colour let loose in water'],['origami','Folded paper','Sharp planes, soft shadow'],['nebula','Deep field','Dust, gas and distance'],['sumi','Floating ink','One breath, one line'],['threads','Light threads','Fine lines under tension'],['owl','Carved owl','Grain as feather'],['sand','Sand drawing','Patterns from vibration']];
function carousel(stage,n,draw,o={}){let pos=0,target=0,drag=null,raf=0;
 const wrap=v=>o.loop?v:Math.max(0,Math.min(n()-1,v)),mod=v=>((v%n())+n())%n();
 function frame(){pos+=(target-pos)*(calm?1:.14);if(Math.abs(target-pos)<.002)pos=target;draw(pos);raf=pos===target?0:requestAnimationFrame(frame)}
 const kick=()=>{if(!raf)raf=requestAnimationFrame(frame)};
 const go=t=>{target=wrap(t);o.onChange&&o.onChange(mod(Math.round(target)));kick()};
 stage.addEventListener('pointerdown',e=>{if(e.target.closest('button,a'))return;drag={x:e.clientX,t:target,m:0};stage.setPointerCapture(e.pointerId)});
 stage.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;drag.m=Math.max(drag.m,Math.abs(dx));target=wrap(drag.t-dx/(o.step?o.step():170));kick()});
 const up=e=>{if(!drag)return;const m=drag.m;drag=null;if(m<6){const c=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-i]');if(c){const t=Math.round(target),i=+c.dataset.i;let d=i-mod(t);if(o.loop){if(d>n()/2)d-=n();if(d<-n()/2)d+=n()}return go(t+d)}}go(Math.round(target))};
 stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
 stage.addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowRight'){e.preventDefault();go(Math.round(target)+1)}else if(k==='ArrowLeft'){e.preventDefault();go(Math.round(target)-1)}else if(k==='Home'){e.preventDefault();go(0)}else if(k==='End'){e.preventDefault();go(n()-1)}});
 let hold=false,timer=0;['pointerenter','focusin'].forEach(t=>stage.addEventListener(t,()=>hold=true));['pointerleave','focusout'].forEach(t=>stage.addEventListener(t,()=>hold=false));
 const api={go,next:()=>go(Math.round(target)+1),prev:()=>go(Math.round(target)-1),redraw:()=>draw(pos),mod,auto(ms){clearInterval(timer);if(ms&&!calm)timer=setInterval(()=>{if(!hold&&!drag){if(!o.loop&&Math.round(target)>=n()-1)go(0);else api.next()}},ms)}};return api}
/* distance of card i from the centre, wrapped for looping carousels */
const dist=(i,pos,n,loop)=>{let d=i-pos;if(loop){d=((d%n)+n)%n;if(d>n/2)d-=n}return d};
const stage=document.getElementById('stage'),ring=document.getElementById('ring');let cards=[],drift=0,idle=true,last=0;
function draw(pos){const n=S.count,step=360/n,rot=-(pos+drift)*step;ring.style.transform=`rotateX(${S.tilt}deg) rotateY(${rot.toFixed(2)}deg)`;
 cards.forEach((c,i)=>{let a=((i*step+rot)%360+540)%360-180;c.style.opacity=(.25+.75*Math.max(0,Math.cos(a*Math.PI/180))).toFixed(2)})}
const car=carousel(stage,()=>S.count,draw,{loop:true,step:()=>S.size*.8,onChange:i=>document.getElementById('t').textContent=ITEMS[i][1]});
function apply(){theme();const n=S.count;stage.style.setProperty('--p',S.perspective+'px');ring.style.setProperty('--w',S.size+'px');ring.style.setProperty('--r',S.corner+'px');
 ring.innerHTML=ITEMS.slice(0,n).map(([f,t],i)=>`<figure class="c" data-i="${i}" style="transform:rotateY(${i*360/n}deg) translateZ(${S.radius}px)"><img src="${IMG(f)}" alt="${t}" draggable="false"></figure>`).join('');cards=[...ring.children];car.redraw()}
['pointerenter','focusin','pointerdown'].forEach(t=>stage.addEventListener(t,()=>idle=false));['pointerleave','focusout'].forEach(t=>stage.addEventListener(t,()=>idle=true));
function spin(t){if(S.autoplay&&idle&&!calm){drift+=(t-last)/1000*S.speed;car.redraw()}last=t;requestAnimationFrame(spin)}
apply();car.go(0);requestAnimationFrame(spin);
</script>
</body>
</html>
