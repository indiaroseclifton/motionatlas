<!--META {"o":20,"t":"Trip and boarding pass app","cat":"Mobile apps","tone":"light","added":"2026-11","d":"A phone-sized travel app: the day of a trip as a timeline with a live countdown, a boarding pass shaped like a ticket with a barcode, and a packing list that keeps score.","how":"The journey is a list of timed steps; the next one is found by comparing each time with the clock, which also drives the countdown. The ticket's notches are two circles cut into its sides and the barcode is drawn from the booking reference, so a different reference gives different bars. The packing list is an array of ticks with a progress bar.","use":"Airline, rail and event ticket apps, travel itineraries, delivery and appointment trackers, anything with a pass to show at a gate.","p":"Build a mobile trip app as one HTML file with no libraries for a travel app called Passage, shown inside a phone frame on wide screens and full width on phones. Bottom tab bar with Trip, Pass and Packing (role=tablist, arrow keys). Trip: a photograph header with the destination and dates over it, a card that says how long until boarding (a countdown that ticks, based on a fixed demo clock that advances in real time), then the day as a vertical timeline: each step has a time, an icon in a circle, a title and a detail line; past steps are ticked and dimmed, the next one is marked Next. Pass: a boarding pass shaped like a ticket, with the airline and flight on a dark inverted top part, origin and destination codes in very large type joined by a line with a plane, a grid of passenger, date, gate, seat, group and boarding time, then a perforated line with a notch cut into each side and a barcode drawn from the booking reference, with the reference beneath; under it an Add to wallet button and a Brighten screen toggle. Packing: a progress bar with a count, and a checklist grouped into Documents, Clothes and Bits, with an input to add your own item. Colours are CSS variables with a dark theme."}-->
<style>/*CORE*/
/*SHELLCSS inv*/
body{display:grid;place-items:center;padding:16px;background:var(--soft)}
.ph{position:relative;width:min(400px,100%);height:min(840px,calc(100vh - 32px));border-radius:40px;background:var(--bg);box-shadow:0 0 0 9px var(--panel),0 0 0 10px var(--line),0 30px 60px -30px rgba(16,24,40,.5);display:flex;flex-direction:column;overflow:hidden}
.scr{flex:1;overflow:auto;scrollbar-width:none}.pd{padding:22px 18px}
.tb{display:flex;padding:6px 8px 12px;border-top:1px solid var(--line);flex:none;background:var(--panel)}.tb button{flex:1;display:grid;justify-items:center;gap:3px;padding:7px 0;border:0;background:none;color:var(--mute);font-size:11px;font-weight:600;border-radius:12px}.tb button[aria-selected=true]{color:var(--ink)}
.hero{position:relative;height:230px;color:#fff;background:#222}.hero img{width:100%;height:100%;object-fit:cover;display:block}.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.7))}
.hero div{position:absolute;left:18px;right:18px;bottom:40px;z-index:1}.hero h1{font-size:30px;letter-spacing:-.02em;line-height:1.1}.hero p{opacity:.9;font-size:13.5px}
.next{position:relative;z-index:2;margin:-28px 14px 0;padding:14px 16px;display:flex;align-items:center;gap:14px}.next b{font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:block;line-height:1.15}.next small{color:var(--mute);font-size:12.5px}
.tl{list-style:none;margin:0;padding:18px 18px 22px}.tl li{display:grid;grid-template-columns:44px 34px 1fr;gap:10px;position:relative;padding-bottom:18px}.tl li:last-child{padding-bottom:0}
.tl time{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;padding-top:7px}.tl .ico{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--panel);border:1px solid var(--line);z-index:1}.tl .ico .ic{width:16px;height:16px}
.tl li:not(:last-child)::before{content:"";position:absolute;left:70px;top:34px;bottom:0;width:2px;background:var(--line)}
.tl b{display:flex;align-items:center;gap:7px;padding-top:6px}.tl small{color:var(--mute);font-size:12.5px;display:block}.tl li.past{opacity:.55}.tl li.past .ico{background:var(--ok-soft);border-color:transparent;color:var(--ok)}.tl li.now .ico{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.tk{border-radius:22px;background:var(--panel);box-shadow:var(--sh);border:1px solid var(--line);overflow:hidden}
.tk .hd{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-weight:700}.tk .hd span{display:inline-flex;align-items:center;gap:8px}
.rt{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:20px 18px 6px}.rt b{font-size:44px;letter-spacing:-.03em;line-height:1}.rt small{display:block;color:var(--mute);font-size:12.5px;margin-top:4px}
.fl{position:relative;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 11px)}.fl .ic{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24px;height:24px;background:var(--panel);padding:2px;color:var(--mute)}
.gd{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;padding:16px 18px 18px}.gd small{display:block;color:var(--mute);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.gd b{font-size:16px;font-variant-numeric:tabular-nums}.gd .w{grid-column:span 2}
.perf{position:relative;height:0;border-top:2px dashed var(--line);margin:0 18px}.perf::before,.perf::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}.perf::before{left:-31px}.perf::after{right:-31px}
.bc{padding:18px 18px 14px;text-align:center}.bc svg{display:block;width:100%;height:64px}.bc small{display:block;margin-top:8px;font:600 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.3em;color:var(--mute)}
.ph.bright .tk{background:#fff;color:#141824;border-color:#fff}.ph.bright .tk .gd small,.ph.bright .tk .rt small,.ph.bright .bc small{color:#5F677B}.ph.bright .fl .ic{background:#fff}.ph.bright .bc svg{color:#000}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.acts .btn{min-height:46px}
.prog{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin:10px 0 4px}.prog i{display:block;height:100%;border-radius:4px;background:var(--ok);transition:width .3s}
.grp{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:18px 0 2px}
.pk{list-style:none;margin:0;padding:0}.pk label{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.pk input{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:0;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none}.pk input:checked{background:var(--ok);border-color:var(--ok)}.pk input:checked::after{content:"";width:9px;height:5px;border:solid #fff;border-width:0 0 2px 2px;transform:rotate(-45deg) translateY(-1px)}.pk input:checked+span{color:var(--mute);text-decoration:line-through}
.addf{display:flex;gap:8px;margin-top:16px}.addf .in{flex:1;min-height:42px}.addf .btn{min-height:42px}
@media(max-width:440px){body{padding:0}.ph{width:100%;height:100vh;border-radius:0;box-shadow:none}}
</style>
<body>
<div class="ph" id="ph"><main class="scr" id="scr" role="tabpanel" tabindex="-1"></main><nav class="tb" role="tablist" aria-label="Sections" id="tb"></nav></div>
<script>/*BASEJS*/
/* DATA. Times are minutes after midnight on the day of travel. The demo clock starts at 07:22 and then runs in real time. Photo is CC0, from the atlas photo library. */
const REF='K7QM2X',BOARD=8*60+15,STEPS=[[6*60+40,'check','Taxi to the airport','Picked up from 3B Lark Rise · £24.60'],[7*60+10,'bag','Bag drop','Desk 41, Terminal 2 · 1 bag, 19 kg'],[7*60+45,'shield','Security','Usually 15 minutes at this hour'],[BOARD,'plane','Boarding at gate B14','Group 2 · gate closes 08:40'],[8*60+55,'send','Depart Manchester','Aurel Air AU 418 · 2 h 10 min'],[12*60+5,'pin','Arrive Innsbruck','Local time, one hour ahead'],[15*60,'bed','Check in, Hotel Seeblick','4 nights · breakfast included']];
const ICO={check:`<!--IC check-->`,bag:`<!--IC bag-->`,shield:`<!--IC shield-->`,plane:`<!--IC plane-->`,send:`<!--IC send-->`,pin:`<!--IC pin-->`,bed:`<!--IC bed-->`};
let PACK=[['Documents','Passport',1],['Documents','Travel insurance letter',1],['Documents','Euros, about €150',0],['Clothes','Walking boots',1],['Clothes','Waterproof jacket',1],['Clothes','Warm layers, three',0],['Clothes','Swimming things',0],['Bits','Phone charger and adaptor',1],['Bits','Sunglasses',0],['Bits','Book for the flight',0]].map(([g,n,d])=>({g,n,d:!!d}));
const TABS=[['Trip',`<!--IC map-->`],['Pass',`<!--IC tag-->`],['Packing',`<!--IC list-->`]],T0=Date.now();
let tab=0,bright=false;
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'),clock=()=>7*60+22+(Date.now()-T0)/60000;
const left=()=>{const s=Math.max(0,Math.round((BOARD-clock())*60));return s>=3600?Math.floor(s/3600)+' h '+Math.floor(s%3600/60)+' min':Math.floor(s/60)+' min '+String(s%60).padStart(2,'0')+' s'};
$('#tb').innerHTML=TABS.map(([n,i],k)=>`<button role="tab" id="t${k}" aria-selected="${!k}" tabindex="${k?-1:0}">${i}${n}</button>`).join('');const tabs=$$('#tb button');
function go(k,focus){tab=k;tabs.forEach((b,i)=>{b.setAttribute('aria-selected',i===k);b.tabIndex=i===k?0:-1});$('#scr').setAttribute('aria-labelledby','t'+k);draw();$('#scr').scrollTop=0;if(focus)tabs[k].focus()}
tabs.forEach((b,i)=>b.onclick=()=>go(i));$('#tb').onkeydown=e=>{const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(d){e.preventDefault();go((tab+d+3)%3,true)}};
/* The barcode: each character of the reference becomes a run of bars, so it is repeatable but not a real, scannable code. */
function bars(){let x=0,h='';[...(REF+REF+'AU418')].forEach(ch=>{const c=ch.charCodeAt(0);[c%4+1,(c>>2)%3+1,(c>>4)%4+1,(c>>1)%3+1].forEach((w,i)=>{if(i%2===0)h+=`<rect x="${x}" width="${w}" height="64"/>`;x+=w})});return `<svg viewBox="0 0 ${x} 64" preserveAspectRatio="none" fill="currentColor" role="img" aria-label="Barcode for booking ${REF}">${h}</svg>`}
function draw(){const s=$('#scr'),now=clock(),nx=STEPS.findIndex(x=>x[0]>now);$('#ph').classList.toggle('bright',bright&&tab===1);
 if(tab===0)s.innerHTML=`<div class="hero"><img src="../../assets/photos/nature-mountain-lake-640.webp" alt="A mountain lake with autumn trees"><div><p>Friday 13 to Tuesday 17 November</p><h1>Innsbruck, four nights</h1></div></div>
  <div class="card next"><span class="av" style="width:44px;height:44px"><!--IC clock--></span><div><small>Boarding at gate B14 in</small><b id="cd" role="timer">${left()}</b></div><button class="btn pri sp" id="topass">Pass</button></div>
  <ol class="tl">${STEPS.map(([t,ic,n,d],i)=>`<li class="${i<nx?'past':i===nx?'now':''}"><time>${hm(t)}</time><span class="ico">${i<nx?ICO.check:ICO[ic]}</span><div><b>${n}${i===nx?'<span class="badge ac">Next</span>':''}${i<nx?'<span class="sr"> done</span>':''}</b><small>${d}</small></div></li>`).join('')}</ol>`;
 else if(tab===1)s.innerHTML=`<div class="pd"><div class="tk"><div class="hd inv"><span><!--IC plane-->Aurel Air</span><span>AU 418</span></div>
  <div class="rt"><div><b>MAN</b><small>Manchester T2</small></div><div class="fl"><!--IC plane--></div><div style="text-align:right"><b>INN</b><small>Innsbruck</small></div></div>
  <div class="gd"><div class="w"><small>Passenger</small><b>Amara Khan</b></div><div><small>Date</small><b>13 Nov</b></div><div><small>Boarding</small><b>${hm(BOARD)}</b></div><div><small>Gate</small><b>B14</b></div><div><small>Seat</small><b>14A</b></div><div><small>Departs</small><b>08:55</b></div><div><small>Group</small><b>2</b></div><div><small>Class</small><b>Economy</b></div></div>
  <div class="perf"></div><div class="bc">${bars()}<small>${REF}</small></div></div>
  <div class="acts"><button class="btn pri" id="wal"><!--IC card-->Add to wallet</button><button class="btn" id="bri" aria-pressed="${bright}"><!--IC spark-->${bright?'Normal screen':'Brighten screen'}</button></div><p class="mute" style="font-size:12.5px;text-align:center;margin-top:12px">Boarding closes 15 minutes before departure. Have your passport open at the photo page.</p></div>`;
 else{const done=PACK.filter(x=>x.d).length;s.innerHTML=`<div class="pd"><h1 style="font-size:26px">Packing</h1><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${PACK.length}" aria-valuenow="${done}" aria-label="Packed"><i style="width:${done/PACK.length*100}%"></i></div><p class="mute" id="pc">${done} of ${PACK.length} packed${done===PACK.length?'. Ready to go.':''}</p>
  ${[...new Set(PACK.map(x=>x.g))].map(g=>`<h2 class="grp">${g}</h2><ul class="pk">${PACK.map((x,i)=>x.g===g?`<li><label><input type="checkbox" data-i="${i}" ${x.d?'checked':''}><span>${esc(x.n)}</span></label></li>`:'').join('')}</ul>`).join('')}
  <form class="addf" id="af"><label class="sr" for="ni">Add an item</label><input class="in" id="ni" placeholder="Add an item" autocomplete="off"><button class="btn">Add</button></form></div>`}}
$('#scr').addEventListener('click',e=>{const id=e.target.closest('button')?.id;if(id==='topass')go(1,true);else if(id==='wal')toast('Pass added to your wallet');else if(id==='bri'){bright=!bright;draw();$('#bri').focus()}});
$('#scr').addEventListener('change',e=>{const i=e.target.dataset.i;if(i==null)return;PACK[i].d=e.target.checked;const done=PACK.filter(x=>x.d).length;$('.prog i').style.width=done/PACK.length*100+'%';$('.prog').setAttribute('aria-valuenow',done);$('#pc').textContent=done+' of '+PACK.length+' packed'+(done===PACK.length?'. Ready to go.':'')});
$('#scr').addEventListener('submit',e=>{e.preventDefault();const v=$('#ni').value.trim();if(!v)return;PACK.push({g:'Bits',n:v,d:false});draw();$('#ni').focus();toast('Added to Bits')});
setInterval(()=>{const c=$('#cd');if(c)c.textContent=left()},1000);
go(1);
</script>
</body>
