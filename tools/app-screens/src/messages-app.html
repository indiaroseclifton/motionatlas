<!--META {"o":16,"t":"Messaging app","cat":"Mobile apps","tone":"light","added":"2026-11","d":"A phone-sized chat app: a group conversation with bubbles, a photo, a poll you can vote in, reactions, a typing indicator and replies that arrive after you send, plus the list of chats with unread counts.","how":"Each chat is an array of messages and the thread is drawn from it. Sending pushes your message, shows the typing dots, then pushes a reply after a short wait. The poll stores who voted for what, so the bars and counts are worked out, and the unread badge on the list is the sum over chats.","use":"Messaging and community apps, in-app support chat, marketplace buyer and seller threads, team chat on a phone.","p":"Build a mobile messaging app as one HTML file with no libraries for an app called Chime, shown inside a phone frame on wide screens and full width on phones. Two views. Chats: a title with a new-message button, a search field that filters, and a list of conversations (avatar or stacked avatars for groups, name, last message, time and an unread count badge) and the total unread beside the title. Thread (open on load, for a group called Sunday roast): a header with a back button showing the unread total, the group name and members, and call buttons; then the messages with day separators: incoming bubbles on the left with the sender's name in their own colour and their initials, your bubbles on the right in the accent colour with a delivered tick, a photo message with a caption, and a poll card whose options are buttons showing a bar, the count and who voted, where voting or changing your vote updates it. Each incoming bubble has a small heart button that toggles a reaction count. A composer with an attach button, a growing text field and Send; after sending, show Priya is typing with animated dots, then add a reply. Opening a chat clears its unread count. Colours are CSS variables with a dark theme."}-->
<style>/*CORE*/
body{display:grid;place-items:center;padding:16px;background:var(--soft)}
.ph{position:relative;width:min(400px,100%);height:min(840px,calc(100vh - 32px));border-radius:40px;background:var(--bg);box-shadow:0 0 0 9px var(--panel),0 0 0 10px var(--line),0 30px 60px -30px rgba(16,24,40,.5);display:flex;flex-direction:column;overflow:hidden}
.hd{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}.hd h1{font-size:16px;line-height:1.2}.hd small{color:var(--mute);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk{display:inline-flex;align-items:center;gap:2px;min-height:36px;padding:0 8px 0 2px;border:0;background:none;border-radius:99px;color:var(--ac);font-weight:700}.bk:hover{background:var(--soft)}.bk b{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--ac);color:var(--ac-ink);font-size:11.5px;line-height:20px}
.stk{display:flex;flex:none}.stk .av{width:30px;height:30px;font-size:10.5px;box-shadow:0 0 0 2px var(--panel)}.stk .av+.av{margin-left:-12px}
.u0{background:var(--ac-soft);color:var(--ac)}.u1{background:var(--ok-soft);color:var(--ok)}.u2{background:var(--warn-soft);color:var(--warn)}.u3{background:var(--bad-soft);color:var(--bad)}.u4{background:var(--soft);color:var(--mute)}
.n1{color:var(--ok)}.n2{color:var(--warn)}.n3{color:var(--bad)}
.log{flex:1;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:4px;scrollbar-width:none}
.day{align-self:center;margin:8px 0;padding:3px 11px;border-radius:99px;background:var(--soft);color:var(--mute);font-size:11.5px;font-weight:600}
.m{display:grid;grid-template-columns:28px minmax(0,auto);gap:0 8px;max-width:86%;align-self:flex-start;align-items:end;margin-top:6px}.m .av{width:28px;height:28px;font-size:10px;grid-row:1/3}
.bub{position:relative;padding:8px 12px 9px;border-radius:18px 18px 18px 5px;background:var(--panel);border:1px solid var(--line);line-height:1.45}.bub .who{display:block;font-size:12.5px;font-weight:700;margin-bottom:1px}
.m.me{grid-template-columns:minmax(0,auto);align-self:flex-end;justify-items:end}.m.me .bub{background:var(--ac);border-color:var(--ac);color:var(--ac-ink);border-radius:18px 18px 5px 18px}
.meta{grid-column:-2/-1;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute);padding:2px 4px 0}.meta .ic{width:13px;height:13px}
.lk{display:inline-flex;align-items:center;gap:3px;min-height:22px;padding:0 6px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--mute);font-size:11px;font-weight:700}.lk .ic{width:12px;height:12px}.lk[aria-pressed=true]{color:var(--bad);border-color:var(--bad)}.lk[aria-pressed=true] .ic{fill:currentColor}.lk:hover{border-color:var(--mute)}
.bub.pic{padding:4px 4px 8px;width:236px}.bub.pic img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px 14px 6px 6px}.bub.pic .who,.bub.pic p{padding:6px 8px 0}
.poll{width:248px;display:grid;gap:7px}.poll b.q{font-size:14.5px}.poll button{position:relative;display:flex;align-items:center;gap:8px;min-height:40px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:none;overflow:hidden;text-align:left;font-weight:600}
.poll button i{position:absolute;inset:0 auto 0 0;background:var(--ac-soft);transition:width .35s cubic-bezier(.2,.8,.2,1);z-index:0}.poll button>*:not(i){position:relative}.poll button[aria-pressed=true]{border-color:var(--ac)}.poll button span{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--mute);font-weight:500;font-size:12.5px}.poll small{color:var(--mute);font-size:12px}
.typ{align-self:flex-start;display:flex;align-items:center;gap:8px;margin:8px 0 0 36px;color:var(--mute);font-size:12.5px}.dots{display:inline-flex;gap:3px;padding:9px 11px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}.dots i{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:dt 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes dt{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.cmp{display:flex;align-items:flex-end;gap:8px;padding:8px 10px 14px;background:var(--panel);border-top:1px solid var(--line);flex:none}.cmp textarea{flex:1;min-width:0;min-height:40px;max-height:110px;resize:none;border:1px solid var(--line);border-radius:20px;background:var(--bg);padding:9px 14px;line-height:1.4}.cmp textarea:focus{outline:0;border-color:var(--ac)}
.rd{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);flex:none}.rd.pri{background:var(--ac);color:var(--ac-ink)}.rd:disabled{opacity:.45}.rd:hover:not(:disabled){filter:brightness(.95)}
.lst{flex:1;overflow:auto;scrollbar-width:none}.lst .top{padding:20px 16px 10px;display:grid;gap:12px}.lst h1{font-size:28px;letter-spacing:-.02em}.lst .in{width:100%;border-radius:99px;min-height:40px;padding-inline:16px}
.ch{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;border:0;background:none;text-align:left}.ch:hover{background:var(--soft)}.ch .av{width:46px;height:46px;font-size:15px}.ch .stk .av{width:32px;height:32px;font-size:11px;box-shadow:0 0 0 2px var(--bg)}.ch .stk{width:46px}
.ch span.t{flex:1;min-width:0}.ch b{display:block}.ch small{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.ch.un small{color:var(--ink);font-weight:600}
.ch .r{display:grid;justify-items:end;gap:4px;font-size:11.5px;color:var(--mute);flex:none}.ch .r i{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--ac);color:var(--ac-ink);font-style:normal;font-weight:700;line-height:20px;text-align:center}
@media(max-width:440px){body{padding:0}.ph{width:100%;height:100vh;border-radius:0;box-shadow:none}}
</style>
<body>
<div class="ph" id="ph"></div>
<script>/*BASEJS*/
/* DATA. People are numbered: 0 is you. A message is [person, time, text] with optional extras in a fourth slot. Photo is CC0, from the atlas photo library. */
const WHO=['You','Priya','Tom','Maya','Mum','Kenji','Lena'],INI=['AK','PN','TB','MO','M','KW','LF'];
const CHATS=[
 {n:'Sunday roast',g:[1,2,3],un:2,m:[['d','Yesterday'],[1,'18:02','Are we still on for Sunday? Mum is asking how many chairs to find.'],[2,'18:10','Yes from me. I can bring a pudding.',{likes:1}],[0,'18:24','In. I will sort the veg and a bottle of something red.'],['d','Today'],[3,'09:31','Booked the long table at the Canal Street place as a back-up, in case the oven misbehaves again.',{img:'cafe-coffee-in-montreal'}],[1,'09:40','',{poll:1}],[1,'09:41','Vote please, Amara.']]},
 {n:'Tom Becker',p:2,un:2,m:[['d','Today'],[2,'09:10','Morning. Did the client sign off the quote?'],[2,'09:12','Sent you the invoice template either way.']]},
 {n:'Mum',p:4,un:0,m:[['d','Yesterday'],[4,'17:45','Call me when you finish work x'],[0,'19:02','Just leaving now. Ten minutes.']]},
 {n:'Kenji Watanabe',p:5,un:0,m:[['d','Tuesday'],[0,'20:15','What time is the train on Friday?'],[5,'20:21','08:10 from platform 4. I have the tickets.']]},
 {n:'Flat 3B',g:[6,5],un:1,m:[['d','Monday'],[6,'21:30','Bins go out tonight. Recycling this week.']]}];
const POLL={q:'What time shall we eat?',o:[['1 o’clock',[1,2]],['2 o’clock',[3]]]},REPLIES=['Perfect, thank you.','Noted. I will tell Mum.','Lovely. See you Sunday then.','Can you bring the big roasting tin as well?'];
let view='thread',cur=0,typing=false,rep=0,q='';
const total=()=>CHATS.reduce((a,c)=>a+c.un,0),av=(p,c='')=>`<span class="av u${p%5} ${c}">${INI[p]}</span>`,last=c=>{const m=c.m[c.m.length-1];return (m[0]===0?'You: ':c.g&&m[0]?WHO[m[0]]+': ':'')+(m[2]||'Poll: '+POLL.q)};
function poll(){const all=POLL.o.reduce((a,o)=>a+o[1].length,0);return `<div class="poll"><b class="q">${POLL.q}</b>${POLL.o.map(([l,v],i)=>`<button data-p="${i}" aria-pressed="${v.includes(0)}"><i style="width:${all?v.length/all*100:0}%"></i><b>${l}</b><span>${v.length} · ${v.map(p=>WHO[p]).join(', ')||'no votes'}</span></button>`).join('')}<small>${all} of 4 have voted${POLL.o.some(o=>o[1].includes(0))?'. Tap the other time to change yours.':''}</small></div>`}
function thread(keep){const c=CHATS[cur],t=total()-c.un;c.un=0;
 $('#ph').innerHTML=`<header class="hd"><button class="bk" id="back" aria-label="Back to chats${t?', '+t+' unread':''}"><!--IC left-->${t?`<b>${t}</b>`:''}</button>${c.g?`<span class="stk">${c.g.slice(0,2).map(p=>av(p)).join('')}</span>`:av(c.p)}<div style="flex:1;min-width:0"><h1>${c.n}</h1><small>${c.g?c.g.map(p=>WHO[p]).join(', ')+' and you':'Active 5 minutes ago'}</small></div><button class="rd" aria-label="Voice call"><!--IC phone--></button><button class="rd" aria-label="Video call"><!--IC video--></button></header>
 <div class="log" id="log" role="log" aria-label="Messages">${c.m.map((m,i)=>m[0]==='d'?`<span class="day">${m[1]}</span>`:m[0]===0?`<div class="m me"><div class="bub">${esc(m[2])}</div><span class="meta">${m[1]} <!--IC check--></span></div>`:`<div class="m">${av(m[0])}<div class="bub ${m[3]?.img?'pic':''}">${m[3]?.img?`<img src="../../assets/photos/${m[3].img}-640.webp" alt="A long wooden café table with two cups">`:''}${c.g?`<span class="who n${m[0]%4}">${WHO[m[0]]}</span>`:''}${m[3]?.poll?poll():`<p>${esc(m[2])}</p>`}</div><span class="meta">${m[1]}${m[3]?.poll?'':`<button class="lk" data-l="${i}" aria-pressed="${!!m[3]?.mine}" aria-label="Like"><!--IC heart-->${(m[3]?.likes||0)+(m[3]?.mine?1:0)||''}</button>`}</span></div>`).join('')}${typing?`<div class="typ" role="status"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>${c.g?'Priya':c.n.split(' ')[0]} is typing</div>`:''}</div>
 <form class="cmp" id="cmp"><button class="rd" type="button" aria-label="Attach"><!--IC plus--></button><label class="sr" for="tx">Message</label><textarea id="tx" rows="1" placeholder="Message"></textarea><button class="rd pri" id="snd" aria-label="Send" disabled><!--IC send--></button></form>`;
 const L=$('#log');if(!keep)L.scrollTop=L.scrollHeight}
function chats(){const L=CHATS.map((c,i)=>[c,i]).filter(([c])=>!q||(c.n+' '+last(c)).toLowerCase().includes(q));
 $('#ph').innerHTML=`<div class="lst"><div class="top"><div class="row"><h1>Chats</h1>${total()?`<span class="badge ac">${total()} unread</span>`:''}<span class="sp"></span><button class="rd" aria-label="New message"><!--IC edit--></button></div><label class="sr" for="q">Search chats</label><input class="in" id="q" type="search" placeholder="Search" value="${esc(q)}"></div><div id="rows">${L.map(([c,i])=>`<button class="ch ${c.un?'un':''}" data-c="${i}">${c.g?`<span class="stk">${c.g.slice(0,2).map(p=>av(p)).join('')}</span>`:av(c.p)}<span class="t"><b>${c.n}</b><small>${esc(last(c))}</small></span><span class="r">${c.m[c.m.length-1][1]}${c.un?`<i aria-label="${c.un} unread">${c.un}</i>`:''}</span></button>`).join('')||'<p class="mute" style="padding:30px;text-align:center">No chats match.</p>'}</div></div>`}
const draw=keep=>view==='thread'?thread(keep):chats();
$('#ph').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const c=CHATS[cur];
 if(b.id==='back'){view='chats';typing=false;draw();$(`.ch[data-c="${cur}"]`)?.focus()}
 else if(b.dataset.c){cur=+b.dataset.c;view='thread';draw();$('#tx').focus()}
 else if(b.dataset.p){const k=+b.dataset.p,had=POLL.o[k][1].includes(0);POLL.o.forEach(o=>o[1]=o[1].filter(p=>p!==0));if(!had)POLL.o[k][1].push(0);const y=$('#log').scrollTop;thread(true);$('#log').scrollTop=y;$(`[data-p="${k}"]`).focus();toast(had?'Vote removed':'You voted for '+POLL.o[k][0])}
 else if(b.dataset.l){const m=c.m[b.dataset.l];m[3]={...m[3],mine:!m[3]?.mine};const y=$('#log').scrollTop;thread(true);$('#log').scrollTop=y;$(`[data-l="${b.dataset.l}"]`).focus()}});
$('#ph').addEventListener('input',e=>{if(e.target.id==='tx'){$('#snd').disabled=!e.target.value.trim();e.target.style.height='auto';e.target.style.height=Math.min(110,e.target.scrollHeight+2)+'px'}else if(e.target.id==='q'){q=e.target.value.trim().toLowerCase();chats();const i=$('#q');i.focus();i.setSelectionRange(i.value.length,i.value.length)}});
$('#ph').addEventListener('keydown',e=>{if(e.target.id==='tx'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#cmp').requestSubmit()}});
$('#ph').addEventListener('submit',e=>{e.preventDefault();const v=$('#tx').value.trim();if(!v)return;const c=CHATS[cur],at=cur;if(c.m[c.m.length-1][1]!=='Now'&&!c.m.some(m=>m[0]==='d'&&m[1]==='Today'))c.m.push(['d','Today']);c.m.push([0,'Now',v]);typing=true;draw();$('#tx').focus();
 setTimeout(()=>{typing=false;c.m.push([c.g?1:c.p,'Now',REPLIES[rep++%REPLIES.length]]);if(view==='thread'&&cur===at){const had=document.activeElement?.id==='tx',val=$('#tx').value;draw();$('#tx').value=val;$('#snd').disabled=!val.trim();if(had)$('#tx').focus()}else{c.un++;draw()}},1900)});
draw();
</script>
</body>
