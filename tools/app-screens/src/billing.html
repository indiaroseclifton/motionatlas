<!--META {"o":35,"t":"Billing and usage","cat":"Account & admin","tone":"light","d":"A billing page: the current plan with a plan switcher, usage meters that warn as they fill, the payment method and a table of invoices to download.","how":"Plans are an array; choosing one opens a confirmation panel that states the new price and what changes before anything is applied. Usage bars compute their width and colour from used and limit, and say the numbers in text. Invoices are rows with a status badge.","use":"SaaS account areas, subscription settings, admin consoles, developer platforms with metered usage.","p":"Build a billing and usage screen as one HTML file with no libraries, inside an app shell. Sections: a Current plan card (name, price, renewal date, Change plan button); three plan cards (Starter, Team, Business) with features and a Monthly / Yearly switch that changes prices, the current one marked; choosing another opens an inline confirmation with the price difference and Confirm and Cancel buttons, announced with role=status; Usage this period with four meters (seats, storage, API calls, automation runs) showing used of limit as text and a bar that turns amber above 75 percent and red above 90 percent, each with role=progressbar; a Payment method card with brand, last four digits, expiry and Update; and an Invoices table (date, number, amount, status badge, Download). Keep all values in data objects and re-render on change."}-->
<style>/*BASE*/
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.pl{display:grid;gap:8px;align-content:start}.pl[data-on=true]{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}.pl b.p{font-size:26px;letter-spacing:-.02em}.pl ul{list-style:none;margin:0;padding:0;font-size:13px;color:var(--mute);display:grid;gap:4px}.pl li::before{content:"✓ ";color:var(--ok)}
.use{display:grid;gap:14px}.m label{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600}.m label span{color:var(--mute);font-weight:400}
.tr{height:8px;border-radius:4px;background:var(--soft);margin-top:6px;overflow:hidden}.tr i{display:block;height:100%;border-radius:4px;background:var(--ac)}.tr i.w{background:var(--warn)}.tr i.b{background:var(--bad)}
.cf{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r);background:var(--ac-soft);margin-bottom:14px}
.cc{display:flex;align-items:center;gap:12px}.cc i{width:46px;height:30px;border-radius:6px;background:linear-gradient(135deg,#1e3a8a,#2563eb);display:block}
@media(max-width:900px){.two{grid-template-columns:1fr}}
</style>
<body>
<!--SHELL Billing|Search invoices-->
<div class="head"><div><h1>Billing</h1><p>Plan, usage and invoices for Northwind.</p></div><span class="sp"></span><div class="seg" role="group" aria-label="Billing period" id="per"><button aria-pressed="true">Monthly</button><button aria-pressed="false">Yearly</button></div></div>
<div class="cf" id="cf" role="status" hidden></div>
<section class="plans" id="plans" aria-label="Plans"></section>
<div class="two"><section class="card pad"><h2 style="margin-bottom:14px">Usage this period</h2><div class="use" id="use"></div></section>
<section class="card pad"><h2 style="margin-bottom:12px">Payment method</h2><div class="cc"><i></i><div><b>Visa ending 4242</b><div class="mute" style="font-size:13px">Expires 08 / 2028</div></div><span class="sp"></span><button class="btn" id="upd">Update</button></div><p class="mute" style="font-size:13px;margin-top:14px" id="renew"></p></section></div>
<section class="card"><div class="pad" style="padding-bottom:6px"><h2>Invoices</h2></div><div class="scroll"><table><thead><tr><th>Date</th><th>Number</th><th>Amount</th><th>Status</th><th><span class="sr">Download</span></th></tr></thead><tbody id="inv"></tbody></table></div></section>
<!--/SHELL-->
<script>/*BASEJS*/
const PLANS=[['Starter',19,['3 seats','10 GB storage','Email support']],['Team',79,['10 seats','100 GB storage','Automation','Priority support']],['Business',249,['Unlimited seats','1 TB storage','SSO and audit log','Dedicated manager']]],USE=[['Seats',8,10,''],['Storage',62,100,' GB'],['API calls',93400,100000,''],['Automation runs',1180,2500,'']];
let cur=1,yearly=false,pick=null;const price=p=>yearly?Math.round(p*10):p,per=()=>yearly?'year':'month',nf=n=>n.toLocaleString('en-GB');
function render(){$('#plans').innerHTML=PLANS.map(([n,p,f],i)=>`<article class="card pad pl" data-on="${i===cur}"><div class="row"><h2>${n}</h2>${i===cur?'<span class="badge ac">Current</span>':''}</div><div><b class="p num">£${nf(price(p))}</b> <span class="mute">per ${per()}</span></div><ul>${f.map(x=>`<li>${x}</li>`).join('')}</ul>${i===cur?'':`<button class="btn ${i>cur?'pri':''}" data-p="${i}">${i>cur?'Upgrade':'Downgrade'} to ${n}</button>`}</article>`).join('');
 $('#use').innerHTML=USE.map(([n,u,l,s])=>{const pc=u/l*100,k=pc>90?'b':pc>75?'w':'';return `<div class="m"><label id="u${n[0]}">${n}<span class="num">${nf(u)}${s} of ${nf(l)}${s}${k==='b'?' · nearly full':''}</span></label><div class="tr" role="progressbar" aria-labelledby="u${n[0]}" aria-valuemin="0" aria-valuemax="${l}" aria-valuenow="${u}"><i class="${k}" style="width:${pc}%"></i></div></div>`}).join('');
 $('#renew').textContent=`${PLANS[cur][0]} renews on 1 December 2026 for £${nf(price(PLANS[cur][1]))}.`;
 const c=$('#cf');c.hidden=pick==null;if(pick!=null){const d=price(PLANS[pick][1])-price(PLANS[cur][1]);c.innerHTML=`<span><b>Switch to ${PLANS[pick][0]}?</b> You will pay £${nf(Math.abs(d))} ${d>0?'more':'less'} per ${per()}, starting today.</span><span class="sp"></span><button class="btn" id="no">Cancel</button><button class="btn pri" id="yes">Confirm change</button>`;$('#no').onclick=()=>{pick=null;render()};$('#yes').onclick=()=>{cur=pick;pick=null;render();toast('Plan changed to '+PLANS[cur][0])}}}
$('#plans').onclick=e=>{const b=e.target.closest('[data-p]');if(b){pick=+b.dataset.p;render();$('#yes').focus()}};
$$('#per button').forEach((b,i)=>b.onclick=()=>{yearly=!!i;$$('#per button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
$('#inv').innerHTML=[['1 Nov 2026','INV-2041',79,'Paid'],['1 Oct 2026','INV-1987',79,'Paid'],['1 Sep 2026','INV-1930',79,'Paid'],['1 Aug 2026','INV-1876',19,'Refunded'],['1 Jul 2026','INV-1822',19,'Paid']].map(([d,n,a,s])=>`<tr><td>${d}</td><td class="num">${n}</td><td class="num">£${a}.00</td><td><span class="badge ${s==='Paid'?'ok':'warn'}"><i></i>${s}</span></td><td style="text-align:right"><button class="btn ghost" aria-label="Download ${n}">PDF ↓</button></td></tr>`).join('');
$('#inv').onclick=e=>{if(e.target.closest('button'))toast('Invoice downloaded')};$('#upd').onclick=()=>toast('Card form would open here');render();
</script>
</body>
