<!--META {"o":8,"t":"Recipe app","cat":"Mobile apps","tone":"light","added":"2026-11","d":"A phone-sized cooking app: a recipe with a full-width photograph, servings that rescale every quantity, ingredients you tick off, steps with their own countdown timers, and a shopping list that fills from what you have not got.","how":"Quantities are stored for one serving and multiplied when drawn, with small rules for halves and plurals. Ticked ingredients are a set; whatever is not in it can be sent to the shopping list, which is another array shown on its own tab. Each step timer is a countdown that writes into its own button.","use":"Recipe and meal-planning apps, grocery lists, how-to guides with timed steps, any checklist that scales with a quantity.","p":"Build a mobile recipe app as one HTML file with no libraries for an app called Larder, shown inside a phone frame on wide screens and full width on phones. Bottom tab bar with Recipes, Cook and Shopping (role=tablist, arrow keys); Shopping shows a count badge. Cook (the default) is one recipe: a photograph across the top with round Back and Save buttons over it, then on a sheet that overlaps the photo the title, a line of facts (time, difficulty, rating), a Serves stepper from 1 to 8, and an Ingredients / Method switch. Ingredients are checkboxes with the quantity on the right; quantities rescale with the servings (grams and millilitres rounded to 5, halves written as fractions, plurals handled); ticked rows are struck through, and a button adds every unticked ingredient to the shopping list. Method is a numbered list; steps that need it have a timer button that counts down in place, can be stopped, and announces when it finishes. Recipes: a list of cards with a photo, title, time and a saved heart, opening that recipe. Shopping: the collected items as checkboxes grouped under the recipe name, with Clear ticked. Colours are CSS variables with a dark theme."}-->
<style>/*CORE*/
body{display:grid;place-items:center;padding:16px;background:var(--ac-soft)}
.ph{position:relative;width:min(400px,100%);height:min(840px,calc(100vh - 32px));border-radius:40px;background:var(--panel);box-shadow:0 0 0 9px var(--panel),0 0 0 10px var(--line),0 30px 60px -30px rgba(16,24,40,.5);display:flex;flex-direction:column;overflow:hidden}
.scr{flex:1;overflow:auto;scrollbar-width:none}.pd{padding:22px 20px}
.tb{display:flex;padding:6px 8px 12px;border-top:1px solid var(--line);flex:none;background:var(--panel)}.tb button{position:relative;flex:1;display:grid;justify-items:center;gap:3px;padding:7px 0;border:0;background:none;color:var(--mute);font-size:11px;font-weight:600;border-radius:12px}.tb button[aria-selected=true]{color:var(--ink)}
.tb i{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--ac);color:var(--ac-ink);font-style:normal;font-size:11px;line-height:18px;font-weight:700}
.hero{position:relative;height:300px;background:var(--soft)}.hero img{width:100%;height:100%;object-fit:cover;display:block}
.rb{position:absolute;top:16px;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.94);color:#141824;box-shadow:0 2px 8px rgba(0,0,0,.2)}.rb:hover{transform:scale(1.06)}.rb[aria-pressed=true]{color:var(--bad)}.rb[aria-pressed=true] .ic{fill:currentColor}
.sheet{position:relative;margin-top:-28px;border-radius:28px 28px 0 0;background:var(--panel);padding:22px 20px 24px}
.ph h1{font-size:25px;line-height:1.15;letter-spacing:-.02em}
.facts{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:13px;margin:8px 0 16px}.facts span{display:inline-flex;align-items:center;gap:5px}.facts .ic{width:15px;height:15px}
.srv{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 16px;border-radius:var(--r);background:var(--soft);margin-bottom:14px;font-weight:600}
.stp{display:inline-flex;align-items:center;gap:4px}.stp button{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel)}.stp button:disabled{opacity:.4}.stp b{min-width:28px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.ph .seg{display:flex}.ph .seg button{flex:1;min-height:36px}
.ing{list-style:none;margin:10px 0 14px;padding:0}.ing label{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.ing li:last-child label{border:0}
.ing input,.shop input{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:0;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}.ing input:checked,.shop input:checked{background:var(--ok);border-color:var(--ok)}.ing input:checked::after,.shop input:checked::after{content:"";width:9px;height:5px;border:solid #fff;border-width:0 0 2px 2px;transform:rotate(-45deg) translateY(-1px)}
.ing b{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}.ing input:checked~span,.ing input:checked~b,.shop input:checked~span{color:var(--mute);text-decoration:line-through}
.mth{list-style:none;margin:14px 0 0;padding:0;counter-reset:s;display:grid;gap:16px}.mth li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:12px;line-height:1.55}.mth li::before{content:counter(s);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ac-soft);color:var(--ac);font-weight:700;font-size:13px}
.tmr{display:inline-flex;align-items:center;gap:7px;margin-top:8px;min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}.tmr.run{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}.tmr.end{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}.tmr .ic{width:16px;height:16px}
.rc{display:grid;gap:14px;margin-top:16px}.rc button{position:relative;display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:center;text-align:left;padding:0;border:0;background:none;border-radius:var(--r)}.rc img{width:112px;height:92px;object-fit:cover;border-radius:var(--r);display:block;background:var(--soft)}.rc b{display:block;font-size:15.5px;line-height:1.3}.rc small{color:var(--mute);font-size:12.5px}.rc button:hover b{text-decoration:underline}
.shop{list-style:none;margin:8px 0 0;padding:0}.shop label{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}.shop b{margin-left:auto;color:var(--mute);font-weight:500;white-space:nowrap}
.empty{margin-top:60px;text-align:center;color:var(--mute);display:grid;gap:8px;justify-items:center}.empty .ic{width:34px;height:34px}
@media(max-width:440px){body{padding:0}.ph{width:100%;height:100vh;border-radius:0;box-shadow:none}}
</style>
<body>
<div class="ph"><main class="scr" id="scr" role="tabpanel" tabindex="-1"></main><nav class="tb" role="tablist" aria-label="Sections" id="tb"></nav></div>
<script>/*BASEJS*/
/* DATA. Quantities are for ONE serving: [amount, unit, name, plural]. A null amount means "to taste". Photos are CC0, from the atlas photo library. */
const PH='../../assets/photos/',RECIPES=[
 {t:'Gnocchi with basil pesto',img:'food-gluten-free-gnocchi',min:25,lvl:'Easy',r:4.8,saved:true,base:2,ing:[[250,'g','potato gnocchi'],[25,'g','basil leaves'],[15,'g','pine nuts'],[20,'g','parmesan, finely grated'],[.5,'','small garlic clove','small garlic cloves'],[40,'ml','olive oil'],[.25,'','lemon, juiced','lemons, juiced'],[null,'','salt and black pepper']],
  steps:[['Toast the pine nuts in a dry frying pan over a medium heat, shaking now and then, until golden.',180],['Blitz the basil, pine nuts, garlic and parmesan with the oil until almost smooth. Season, then sharpen with the lemon juice.',0],['Boil the gnocchi in well-salted water. They are ready when they float.',120],['Drain, keeping a cupful of the water. Toss the gnocchi with the pesto, loosening it with a splash of the water, and serve with more parmesan.',0]]},
 {t:'Fresh tagliatelle with brown butter',img:'food-handmade-pasta-noodles',min:50,lvl:'Takes practice',r:4.6,saved:false,base:2,ing:[[100,'g','pasta flour'],[1,'','egg','eggs'],[30,'g','butter'],[3,'','sage leaf','sage leaves'],[null,'','salt']],steps:[['Mix the flour and eggs to a dough, knead until smooth, then wrap and rest it.',1800],['Roll thin, fold loosely and cut into ribbons.',0],['Boil the pasta in salted water.',150],['Brown the butter with the sage, toss the pasta through it and serve at once.',0]]},
 {t:'Overnight white loaf',img:'bakery-fresh-bread-and-butter',min:35,lvl:'Easy, but slow',r:4.9,saved:true,base:8,ing:[[60,'g','strong white flour'],[45,'ml','water'],[1,'g','salt'],[.5,'g','dried yeast']],steps:[['Stir everything together, cover and leave on the worktop overnight.',0],['Shape into a round and prove while the oven heats to 230°C with a lidded pot inside.',2700],['Bake in the pot with the lid on, then take the lid off to brown.',1800]]},
 {t:'Weekend croissants',img:'food-annie-spratt-2016-02-14',min:90,lvl:'A project',r:4.7,saved:false,base:6,ing:[[80,'g','strong white flour'],[45,'g','cold butter'],[40,'ml','milk'],[8,'g','sugar'],[1,'g','dried yeast']],steps:[['Make the dough and chill it.',3600],['Fold the butter in with three turns, chilling between each.',1800],['Cut, shape and prove until wobbly.',5400],['Bake at 200°C until deep gold.',1080]]}];
const TABS=[['Recipes',`<!--IC book-->`],['Cook',`<!--IC timer-->`],['Shopping',`<!--IC bag-->`]];
let tab=1,cur=0,serves=2,view='Ingredients',have=new Set([4,7]),shop=[],timers={};
const frac=n=>{const w=Math.floor(n),f=n-w,g=f>.87?[w+1,'']:f>.62?[w,'¾']:f>.37?[w,'½']:f>.12?[w,'¼']:[w,''];return (g[0]||'')+g[1]||'¼'};
function qty([a,u,n,pl],k){if(a==null)return ['',n];const v=a*k;if(u==='g'||u==='ml'){const r=v>=20?Math.round(v/5)*5:Math.max(1,Math.round(v));return [r+' '+u,n]}return [frac(v),v>1.12&&pl?pl:n]}
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0'),nice=s=>s>=3600?(s/3600).toFixed(s%3600?1:0)+' hr':s/60+' min';
const pending=()=>shop.filter(x=>!x.done).length;
function bar(){$('#tb').innerHTML=TABS.map(([n,i],k)=>`<button role="tab" id="t${k}" aria-selected="${k===tab}" tabindex="${k===tab?0:-1}">${i}${n}${k===2&&pending()?`<i aria-label="${pending()} to buy">${pending()}</i>`:''}</button>`).join('')}
function go(k,focus){tab=k;$('#scr').setAttribute('aria-labelledby','t'+k);draw();$('#scr').scrollTop=0;if(focus)$('#t'+k).focus()}
$('#tb').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.id.slice(1))};$('#tb').onkeydown=e=>{const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(d){e.preventDefault();go((tab+d+3)%3,true)}};
function draw(){bar();const R=RECIPES[cur],s=$('#scr'),k=serves;
 if(tab===0)s.innerHTML=`<div class="pd"><h1>Recipes</h1><p class="mute">Four for this week. Two are saved.</p><div class="rc">${RECIPES.map((r,i)=>`<button data-r="${i}"><img src="${PH+r.img}-640.webp" alt="" loading="lazy"><span><b>${r.t}</b><small>${r.min} min · ${r.lvl}${r.saved?' · Saved':''}</small></span></button>`).join('')}</div></div>`;
 else if(tab===1){const missing=R.ing.filter((x,i)=>!have.has(i)).length;
  s.innerHTML=`<div class="hero"><img src="${PH+R.img}-640.webp" alt="${R.t}"><button class="rb" style="left:16px" id="back" aria-label="All recipes"><!--IC left--></button><button class="rb" style="right:16px" id="save" aria-pressed="${R.saved}" aria-label="Save recipe"><!--IC heart--></button></div>
  <div class="sheet"><h1>${R.t}</h1><div class="facts"><span><!--IC clock-->${R.min} min</span><span><!--IC flag-->${R.lvl}</span><span><!--IC star-->${R.r} from ${[1204,318,2051,642][cur].toLocaleString('en-GB')} cooks</span></div>
  <div class="srv"><span id="sl">Serves</span><span class="stp" role="group" aria-labelledby="sl"><button data-s="-1" ${k<=1?'disabled':''} aria-label="One fewer"><!--IC minus--></button><b aria-live="polite">${k}</b><button data-s="1" ${k>=8?'disabled':''} aria-label="One more"><!--IC plus--></button></span></div>
  <div class="seg" role="group" aria-label="Show">${['Ingredients','Method'].map(v=>`<button data-v="${v}" aria-pressed="${v===view}">${v}</button>`).join('')}</div>
  ${view==='Ingredients'?`<ul class="ing">${R.ing.map((x,i)=>{const [q,n]=qty(x,k);return `<li><label><input type="checkbox" data-i="${i}" ${have.has(i)?'checked':''}><span>${n[0].toUpperCase()+n.slice(1)}</span><b>${q}</b></label></li>`}).join('')}</ul><button class="btn pri" id="add" style="width:100%;min-height:46px" ${missing?'':'disabled'}>${missing?'Add '+missing+' to the shopping list':'You have everything'}</button>`
  :`<ol class="mth">${R.steps.map(([t,sec],i)=>{const tm=timers[cur+'-'+i];return `<li><div>${t}${sec?`<br><button class="tmr ${tm?(tm.left?'run':'end'):''}" data-t="${i}" aria-live="off"><!--IC timer--><span>${tm?(tm.left?mmss(tm.left)+' · stop':'Done'):'Start '+nice(sec)+' timer'}</span></button>`:''}</div></li>`}).join('')}</ol>`}</div>`}
 else s.innerHTML=`<div class="pd"><div class="row"><h1>Shopping</h1><span class="sp"></span>${shop.some(x=>x.done)?'<button class="btn" id="clr">Clear ticked</button>':''}</div>${shop.length?`<p class="mute">${pending()} to buy, for ${[...new Set(shop.map(x=>x.r))].join(' and ')}.</p><ul class="shop">${shop.map((x,i)=>`<li><label><input type="checkbox" data-b="${i}" ${x.done?'checked':''}><span>${x.n}</span><b>${x.q}</b></label></li>`).join('')}</ul>`:`<div class="empty"><!--IC bag--><b>Nothing to buy</b><span>Open a recipe and add what you are missing.</span><button class="btn" id="toc">Go to the recipe</button></div>`}</div>`}
$('#scr').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const R=RECIPES[cur];
 if(b.dataset.r){cur=+b.dataset.r;serves=RECIPES[cur].base;have=new Set();view='Ingredients';go(1)}else if(b.id==='back')go(0);else if(b.id==='toc')go(1)
 else if(b.id==='save'){R.saved=!R.saved;draw();$('#save').focus();toast(R.saved?'Saved to your recipes':'Removed from saved')}
 else if(b.dataset.s){serves+=+b.dataset.s;draw();($(`[data-s="${b.dataset.s}"]:not(:disabled)`)||$('.stp button:not(:disabled)')).focus()}
 else if(b.dataset.v){view=b.dataset.v;draw();$(`[data-v="${view}"]`).focus()}
 else if(b.id==='add'){let n=0;R.ing.forEach((x,i)=>{if(have.has(i))return;const [q,nm]=qty(x,serves),name=nm[0].toUpperCase()+nm.slice(1);if(!shop.find(y=>y.n===name&&y.r===R.t)){shop.push({n:name,q,r:R.t,done:false});n++}});bar();toast(n?n+' added to the shopping list':'Those are already on the list')}
 else if(b.dataset.t!=null){const id=cur+'-'+b.dataset.t,sec=R.steps[b.dataset.t][1];if(timers[id]){delete timers[id]}else timers[id]={left:sec};draw();$(`[data-t="${b.dataset.t}"]`).focus()}
 else if(b.id==='clr'){shop=shop.filter(x=>!x.done);draw()}});
$('#scr').addEventListener('change',e=>{const t=e.target;if(t.dataset.i!=null){t.checked?have.add(+t.dataset.i):have.delete(+t.dataset.i);const m=RECIPES[cur].ing.length-have.size,a=$('#add');a.disabled=!m;a.textContent=m?'Add '+m+' to the shopping list':'You have everything'}else if(t.dataset.b!=null){shop[t.dataset.b].done=t.checked;draw();$(`[data-b="${t.dataset.b}"]`)?.focus()}});
/* Step timers count down once a second and write straight into their own button. */
setInterval(()=>{Object.entries(timers).forEach(([id,t])=>{if(!t.left)return;t.left--;const [r,i]=id.split('-'),b=tab===1&&view==='Method'&&+r===cur&&$(`[data-t="${i}"]`);if(b){b.lastChild.textContent=t.left?mmss(t.left)+' · stop':'Done';if(!t.left)b.className='tmr end'}if(!t.left)toast('Timer finished: step '+(+i+1))})},1000);
go(1);
</script>
</body>
