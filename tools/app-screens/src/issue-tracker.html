<!--META {"o":12,"t":"Issue list with a command palette","cat":"Work & projects","tone":"light","added":"2026-11","d":"A dense issue tracker driven from the keyboard: a grouped list with priority, status and labels, and a command palette that searches issues and runs actions such as change status, assign, filter or create.","how":"Issues are one array and the list is grouped from it on every change. The palette is a filtered list of commands; some open a second step (pick a status, a person, a label) that edits the selected issue. Arrow keys move a highlighted row in both the list and the palette, so nothing needs the mouse.","use":"Issue and task trackers, admin tools for expert users, any product where a command menu is the fastest way around.","p":"Build an issue tracker with a command palette as one HTML file with no libraries for a product called Linea. Dense and quiet: 13px text, 36px rows, almost no chrome. Header: a small logo, a breadcrumb, a wide button that reads Search or run a command with a Ctrl K hint, a theme switch and an avatar. A second row has Active / All tabs with counts, a removable label filter chip and a New issue button. The list is grouped by status (In progress, In review, Todo, Done) with collapsible group headings and counts; each row shows a priority icon (bars, or a red mark for urgent), a monospace id, a status ring drawn in SVG, the title, a label badge, the assignee's initials and a date. One row is selected at a time (click, or J and K and the arrow keys). A footer bar lists the shortcuts. The palette opens with Ctrl or Cmd K or the slash key: an input, then results in groups (Actions, Issues, Go to) filtered as you type, moved through with the arrow keys and run with Enter. Actions: Create issue (asks for a title), Change status, Assign to, Set priority and Filter by label (each opens a second list of options for the selected issue), Switch theme and Copy link. Escape steps back, then closes. Single-key shortcuts C, S, A, P and F open the matching step. Colours are CSS variables with a dark theme."}-->
<style>/*CORE*/
body{display:flex;flex-direction:column;font-size:13px;background:var(--panel)}
.hd{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:46px;border-bottom:1px solid var(--line);flex:none}
.mk{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--ac);color:var(--ac-ink);font-weight:800;font-size:13px;flex:none}
.cr{display:flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}.cr span{color:var(--mute);font-weight:500}
.kb{flex:0 1 420px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:30px;padding:0 10px;border:1px solid var(--line);border-radius:var(--rb);background:var(--bg);color:var(--mute);text-align:left;min-width:0}.kb:hover{border-color:var(--mute)}.kb span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kb .ic{width:15px;height:15px}
kbd{font:600 11px/1 var(--font);padding:3px 5px;border-radius:5px;border:1px solid var(--line);background:var(--panel);color:var(--mute);white-space:nowrap}
.tb{display:flex;align-items:center;gap:6px;padding:0 14px;min-height:42px;border-bottom:1px solid var(--line);flex:none}
.tab{border:0;background:none;min-height:42px;padding:0 8px;color:var(--mute);font-weight:600;box-shadow:inset 0 -2px 0 transparent}.tab[aria-selected=true]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ac)}.tab b{font-weight:500;color:var(--mute);margin-left:5px}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:26px;padding:0 4px 0 9px;border:1px dashed var(--line);border-radius:99px;font-size:12px}.chip button{display:grid;place-items:center;width:20px;height:20px;border:0;border-radius:50%;background:none;color:var(--mute)}.chip button:hover{background:var(--soft)}.chip .ic{width:13px;height:13px}
.tb .btn{min-height:28px;font-size:12.5px;padding:0 10px}
.ls{flex:1;min-height:0;overflow:auto;outline:0}
.gh{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;width:100%;min-height:34px;padding:0 14px;border:0;border-bottom:1px solid var(--line);background:var(--bg);font-weight:600;text-align:left}.gh:hover{background:var(--soft)}.gh span{color:var(--mute);font-weight:500}.gh .ic{width:14px;height:14px;color:var(--mute);transition:transform .15s}.gh[aria-expanded=false] .ic.ch{transform:rotate(-90deg)}
.rw{display:grid;grid-template-columns:18px 64px 18px minmax(0,1fr) auto 24px 52px;gap:10px;align-items:center;min-height:36px;padding:0 14px;border-bottom:1px solid var(--line);cursor:default}
.rw:hover{background:var(--bg)}.rw[aria-selected=true]{background:var(--ac-soft);box-shadow:inset 2px 0 0 var(--ac)}
.rw .id{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mute)}.rw .ti{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}.rw.dn .ti{color:var(--mute)}
.rw .av{width:22px;height:22px;font-size:9.5px}.rw .av.no{background:none;border:1px dashed var(--line);color:var(--mute)}.rw time{color:var(--mute);font-size:12px;text-align:right;white-space:nowrap}.rw .badge{font-size:11px;padding:1px 7px}
.pi{width:16px;height:16px}.pi rect{fill:var(--line)}.pi .f{fill:var(--mute)}.pi.u rect{fill:var(--bad)}
.si{width:16px;height:16px}
.ft{display:flex;align-items:center;gap:14px;padding:0 14px;min-height:32px;border-top:1px solid var(--line);color:var(--mute);font-size:12px;flex:none;white-space:nowrap;overflow:hidden}.ft b{color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:600}
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,12,20,.32);display:grid;justify-items:center;align-content:start;padding:13vh 14px 0}
.pal{width:min(620px,100%);border-radius:calc(var(--r) + 2px);background:var(--panel);border:1px solid var(--line);box-shadow:0 30px 70px -20px rgba(0,0,0,.5);overflow:hidden}
.pin{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line)}.pin input{flex:1;min-width:0;border:0;outline:0;background:none;min-height:50px;font-size:15px}.pin .ic{color:var(--mute)}.pin .badge{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.res{max-height:min(380px,52vh);overflow:auto;padding:6px}.res h3{padding:8px 10px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.op{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 10px;border-radius:var(--rb);cursor:pointer}.op[aria-selected=true]{background:var(--ac-soft)}.op .ic{width:16px;height:16px;color:var(--mute)}.op .id{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mute)}.op span.t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.op small{color:var(--mute)}
.pf{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);color:var(--mute);font-size:12px}
@media(max-width:760px){.cr span,.ft span:nth-child(n+3),.kb kbd{display:none}.rw{grid-template-columns:18px 18px minmax(0,1fr) 24px;gap:8px}.rw .id,.rw time,.rw .badge{display:none}.scrim{padding-top:8vh}}
</style>
<body>
<header class="hd"><span class="mk" aria-hidden="true">L</span><div class="cr">Linea<span>/ Web app / Issues</span></div>
 <button class="kb" id="kb" aria-haspopup="dialog"><!--IC search--><span>Search or run a command</span><kbd>Ctrl K</kbd></button>
 <button class="btn sq ghost" id="theme" aria-pressed="false" aria-label="Switch to dark theme" style="min-height:30px;width:30px"><!--IC moon--></button><span class="av" style="width:26px;height:26px;font-size:10.5px" aria-label="Your account">AK</span></header>
<div class="tb"><div role="tablist" aria-label="View" id="tabs"></div><span id="chip"></span><span class="sp"></span><span class="mute" id="n"></span><button class="btn pri" id="newb"><!--IC plus-->New issue</button></div>
<main class="ls" id="ls" role="listbox" aria-label="Issues" tabindex="0"></main>
<footer class="ft"><span id="sel"></span><span><b>J</b> <b>K</b> move</span><span><b>S</b> status</span><span><b>A</b> assign</span><span><b>P</b> priority</span><span><b>F</b> filter</span><span><b>C</b> create</span></footer>
<div class="scrim" id="scrim" hidden><div class="pal" role="dialog" aria-modal="true" aria-label="Command palette"><div class="pin"><!--IC search--><span class="badge" id="ctx" hidden></span><input id="pq" role="combobox" aria-expanded="true" aria-controls="res" aria-autocomplete="list" placeholder="Search issues or type a command" autocomplete="off" spellcheck="false"></div><div class="res" id="res" role="listbox"></div><div class="pf"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>Enter</kbd> run</span><span><kbd>Esc</kbd> back</span></div></div></div>
<script>/*BASEJS*/
/* DATA: [id, priority 0 urgent to 3 low, title, label, assignee, date, status] */
const STATUS=['In progress','In review','Todo','Done'],PRI=['Urgent','High','Medium','Low'],LABELS=['Bug','Feature','Polish'],PEOPLE=['Amara Khan','Priya Nair','Tom Becker','Maya Okafor','Kenji Watanabe'];
let ISSUES=[[231,0,'Checkout total ignores the discount on a second visit','Bug','Priya Nair','12 Nov',0],[228,1,'Keyboard moves for board cards','Feature','Amara Khan','11 Nov',0],[224,2,'Invoices as PDF: page breaks inside long tables','Bug','Tom Becker','10 Nov',0],[219,2,'New onboarding: workspace name step','Feature','Maya Okafor','9 Nov',0],[226,1,'Session expires while an upload is still running','Bug','Kenji Watanabe','11 Nov',1],[221,3,'Tidy the empty states on the reports page','Polish','Amara Khan','10 Nov',1],[233,1,'Timeline zoom jumps when a phase is folded','Bug','','12 Nov',2],[232,2,'Saved filters on the customers table','Feature','Priya Nair','12 Nov',2],[230,2,'Export the audit log as CSV','Feature','Tom Becker','11 Nov',2],[229,3,'Dark theme: chart gridlines are too bright','Polish','','11 Nov',2],[227,3,'Rename ‘Projects’ to ‘Boards’ in the menu','Polish','Maya Okafor','10 Nov',2],[225,2,'Mobile inbox: swipe to archive','Feature','Kenji Watanabe','6 Nov',3],[223,2,'Receipts: write dates as 12 November, with no ‘th’','Bug','Amara Khan','5 Nov',3],[220,3,'Return focus to the opener when a sheet closes','Bug','Tom Becker','4 Nov',3]].map(([n,p,t,l,a,d,s])=>({n,p,t,l,a,d,s}));
let view='Active',label='',sel=231,closed=new Set(),nextId=234;
const ini=n=>n.split(' ').map(w=>w[0]).join('');
const pri=p=>p===0?'<svg class="pi u" viewBox="0 0 16 16" role="img" aria-label="Urgent"><rect x="1" y="1" width="14" height="14" rx="3.500"/><path d="M8 4.200v5M8 11.400v.4" stroke="#fff" stroke-width="1.800" stroke-linecap="round"/></svg>':`<svg class="pi" viewBox="0 0 16 16" role="img" aria-label="${PRI[p]} priority"><rect class="f" x="1.500" y="10" width="3" height="5" rx="1"/><rect class="${p<3?'f':''}" x="6.500" y="6" width="3" height="9" rx="1"/><rect class="${p<2?'f':''}" x="11.500" y="2" width="3" height="13" rx="1"/></svg>`;
/* Status ring: a circle that fills by a quarter, a half, three quarters or a tick. */
const ring=s=>{const c=['var(--warn)','var(--ac)','var(--mute)','var(--ok)'][s],f=[.5,.75,0,1][s];return `<svg class="si" viewBox="0 0 16 16" role="img" aria-label="${STATUS[s]}"><circle cx="8" cy="8" r="6.200" fill="none" stroke="${c}" stroke-width="1.600" ${s===2?'stroke-dasharray="2.400 2.400"':''}/>${s===3?`<circle cx="8" cy="8" r="6.200" fill="${c}"/><path d="m5 8.200 2.100 2.100L11 6.200" fill="none" stroke="var(--panel)" stroke-width="1.700" stroke-linecap="round" stroke-linejoin="round"/>`:f?`<circle cx="8" cy="8" r="2" fill="none" stroke="${c}" stroke-width="4" stroke-dasharray="${f*12.566} 12.566" transform="rotate(-90 8 8)"/>`:''}</svg>`};
const visible=()=>ISSUES.filter(i=>(view==='All'||i.s!==3)&&(!label||i.l===label));
const order=()=>STATUS.flatMap((_,s)=>closed.has(s)?[]:visible().filter(i=>i.s===s));
function draw(keep){const V=visible();
 $('#tabs').innerHTML=[['Active',ISSUES.filter(i=>i.s!==3).length],['All',ISSUES.length]].map(([v,n])=>`<button class="tab" role="tab" aria-selected="${v===view}" data-v="${v}">${v}<b>${n}</b></button>`).join('');
 $('#chip').innerHTML=label?`<span class="chip">Label: <b>${label}</b><button aria-label="Clear the label filter"><!--IC x--></button></span>`:'';$('#n').textContent=V.length+' issues';
 if(!order().find(i=>i.n===sel))sel=order()[0]?.n;
 $('#ls').innerHTML=STATUS.map((st,s)=>{const L=V.filter(i=>i.s===s);if(!L.length)return'';const open=!closed.has(s);return `<button class="gh" aria-expanded="${open}" data-g="${s}" tabindex="-1"><svg class="ic ch" viewBox="0 0 24 24" aria-hidden="true"><path d="m5.500 9.500 6.500 6.500 6.500-6.500"/></svg>${ring(s)}${st}<span>${L.length}</span></button>`+(open?L.map(i=>`<div class="rw ${i.s===3?'dn':''}" role="option" aria-selected="${i.n===sel}" data-n="${i.n}" id="i${i.n}">${pri(i.p)}<span class="id">WEB-${i.n}</span>${ring(i.s)}<span class="ti">${esc(i.t)}</span><span class="badge ${i.l==='Bug'?'bad':i.l==='Feature'?'ac':''}">${i.l}</span>${i.a?`<span class="av" title="${i.a}">${ini(i.a)}</span>`:'<span class="av no" title="Unassigned">?</span>'}<time>${i.d}</time></div>`).join(''):'')}).join('')||'<p class="mute" style="padding:40px;text-align:center">No issues match this view.</p>';
 const cur=ISSUES.find(i=>i.n===sel);$('#sel').innerHTML=cur?`<b>WEB-${cur.n}</b> selected`:'Nothing selected';$('#ls').setAttribute('aria-activedescendant',cur?'i'+cur.n:'');if(keep)$('#i'+sel)?.scrollIntoView({block:'nearest'})}
const move=d=>{const o=order(),i=o.findIndex(x=>x.n===sel);if(o[i+d]){sel=o[i+d].n;draw(true)}};
$('#ls').onclick=e=>{const g=e.target.closest('.gh'),r=e.target.closest('.rw');if(g){const s=+g.dataset.g;closed.has(s)?closed.delete(s):closed.add(s);draw()}else if(r){sel=+r.dataset.n;draw()}};
$('#tabs').onclick=e=>{const b=e.target.closest('.tab');if(b){view=b.dataset.v;draw();$(`.tab[data-v="${view}"]`).focus()}};
$('#chip').onclick=e=>{if(e.target.closest('button')){label='';draw();toast('Filter cleared')}};
/* PALETTE. mode is '' for the top level, or the name of a second step. */
const scrim=$('#scrim'),pq=$('#pq');let mode='',hi=0,items=[],last=null;
const ACTIONS=[['Create issue','plus','C','create'],['Change status','swap','S','status'],['Assign to','user','A','assign'],['Set priority','flag','P','priority'],['Filter by label','filter','F','label'],['Switch theme','moon','','theme'],['Copy link to the selected issue','link','','copy']];
const ICO={plus:`<!--IC plus-->`,swap:`<!--IC swap-->`,user:`<!--IC user-->`,flag:`<!--IC flag-->`,filter:`<!--IC filter-->`,moon:`<!--IC moon-->`,link:`<!--IC link-->`,right:`<!--IC right-->`};
function build(){const q=pq.value.trim().toLowerCase(),cur=ISSUES.find(i=>i.n===sel),has=t=>t.toLowerCase().includes(q);items=[];
 if(mode==='create')items=[{g:'New issue',t:q?'Create “'+pq.value.trim()+'” in Todo':'Type a title, then press Enter',ic:'plus',run:()=>{const t=pq.value.trim();if(!t)return true;ISSUES.push({n:nextId,p:2,t,l:'Feature',a:'Amara Khan',d:'12 Nov',s:2});sel=nextId++;closed.delete(2);toast('WEB-'+sel+' created')}}];
 else if(mode==='status')items=STATUS.filter(has).map(s=>({g:'Status',t:s,pre:ring(STATUS.indexOf(s)),cur:cur.s===STATUS.indexOf(s),run:()=>{cur.s=STATUS.indexOf(s);if(s==='Done'&&view==='Active')toast('WEB-'+cur.n+' done. It is under All.');else toast('WEB-'+cur.n+' moved to '+s)}}));
 else if(mode==='assign')items=[...PEOPLE,'No one'].filter(has).map(p=>({g:'Assignee',t:p,pre:p==='No one'?'<span class="av no" style="width:22px;height:22px">?</span>':`<span class="av" style="width:22px;height:22px;font-size:9.500px">${ini(p)}</span>`,cur:cur.a===(p==='No one'?'':p),run:()=>{cur.a=p==='No one'?'':p;toast('WEB-'+cur.n+(cur.a?' assigned to '+p.split(' ')[0]:' unassigned'))}}));
 else if(mode==='priority')items=PRI.filter(has).map((p,k)=>({g:'Priority',t:p,pre:pri(PRI.indexOf(p)),cur:cur.p===PRI.indexOf(p),run:()=>{cur.p=PRI.indexOf(p);toast('WEB-'+cur.n+' set to '+p.toLowerCase())}}));
 else if(mode==='label')items=LABELS.filter(has).map(l=>({g:'Label',t:l,ic:'filter',cur:label===l,run:()=>{label=l;toast('Showing '+l.toLowerCase()+' issues')}}));
 else{items=ACTIONS.filter(a=>has(a[0])).map(a=>({g:'Actions',t:a[0],ic:a[1],k:a[2],sub:!['theme','copy'].includes(a[3]),run:()=>{if(a[3]==='theme'){setTheme(root.dataset.theme!=='dark');return}if(a[3]==='copy'){toast('Link to WEB-'+sel+' copied');return}step(a[3]);return true}}));
  if(q)items.push(...ISSUES.filter(i=>has(i.t)||('web-'+i.n).includes(q)).slice(0,6).map(i=>({g:'Issues',t:i.t,pre:ring(i.s),id:'WEB-'+i.n,run:()=>{if(i.s===3)view='All';label='';closed.delete(i.s);sel=i.n}})));
  items.push(...['Active','All'].filter(v=>has('go to '+v)).map(v=>({g:'Go to',t:v+' issues',ic:'right',run:()=>{view=v}})))}
 hi=Math.min(hi,Math.max(0,items.length-1));let g='';
 $('#res').innerHTML=items.map((it,i)=>(it.g!==g?`<h3>${g=it.g}</h3>`:'')+`<div class="op" role="option" id="o${i}" aria-selected="${i===hi}" data-i="${i}">${it.pre||ICO[it.ic]}${it.id?`<span class="id">${it.id}</span>`:''}<span class="t">${esc(it.t)}</span>${it.cur?'<small>Current</small>':''}${it.k?`<kbd>${it.k}</kbd>`:''}${it.sub?ICO.right:''}</div>`).join('')||'<p class="mute" style="padding:22px;text-align:center">Nothing matches. Try another word.</p>';
 pq.setAttribute('aria-activedescendant',items.length?'o'+hi:'');$('#o'+hi)?.scrollIntoView({block:'nearest'})}
function step(m){const cur=ISSUES.find(i=>i.n===sel);if(!cur&&['status','assign','priority'].includes(m)){toast('Select an issue first');return}mode=m;hi=0;pq.value='';const c=$('#ctx');c.hidden=!['status','assign','priority'].includes(m);c.textContent=cur?'WEB-'+cur.n:'';
 pq.placeholder={create:'Title of the new issue',status:'Change status to…',assign:'Assign to…',priority:'Set priority to…',label:'Show only this label…'}[m]||'Search issues or type a command';build()}
function openPal(m,quiet){if(scrim.hidden){last=document.activeElement;scrim.hidden=false}step(m||'');if(!quiet)pq.focus()}
function closePal(){scrim.hidden=true;mode='';last&&last.focus&&last.focus()}
function run(i){const it=items[i];if(!it)return;const stay=it.run();draw(true);if(stay)return;closePal();$('#ls').focus()}
pq.oninput=()=>{hi=0;build()};
pq.onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();hi=(hi+1)%Math.max(1,items.length);build()}else if(e.key==='ArrowUp'){e.preventDefault();hi=(hi-1+items.length)%Math.max(1,items.length);build()}else if(e.key==='Enter'){e.preventDefault();run(hi)}
 else if(e.key==='Escape'||(e.key==='Backspace'&&!pq.value&&mode)){e.preventDefault();e.stopPropagation();mode?step(''):closePal()}};
$('#res').onclick=e=>{const o=e.target.closest('.op');if(o){run(+o.dataset.i);if(!scrim.hidden)pq.focus()}};$('#res').onpointermove=e=>{const o=e.target.closest('.op');if(o&&+o.dataset.i!==hi){hi=+o.dataset.i;$$('.op').forEach((x,i)=>x.setAttribute('aria-selected',i===hi))}};
scrim.onpointerdown=e=>{if(e.target===scrim)closePal()};$('#kb').onclick=()=>openPal();$('#newb').onclick=()=>openPal('create');
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();scrim.hidden?openPal():closePal();return}
 if(!scrim.hidden||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const k=e.key.toLowerCase();
 if(k==='/'){e.preventDefault();openPal()}else if(k==='j'||e.key==='ArrowDown'){e.preventDefault();move(1)}else if(k==='k'||e.key==='ArrowUp'){e.preventDefault();move(-1)}
 else{const m={c:'create',s:'status',a:'assign',p:'priority',f:'label'}[k];if(m){e.preventDefault();openPal(m)}}});
if(/Mac|iPhone|iPad/.test(navigator.platform))$('#kb kbd').textContent='⌘K';
draw();
/* The palette starts open so the screen explains itself. Inside a preview frame it does not take the keyboard. */
openPal('',self!==top);
</script>
</body>
