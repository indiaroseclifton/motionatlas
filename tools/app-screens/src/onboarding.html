<!--META {"o":12,"t":"Onboarding wizard","cat":"Account & admin","tone":"light","d":"A four-step set-up flow: choose what you are here for, name the workspace, invite teammates, then a summary. Progress shows at the top and every step can be skipped or revisited.","how":"The steps are sections shown one at a time; a single index decides which is visible, how far the progress bar has filled and what the buttons say. Answers live in one object, and the last step is drawn from it. Moving on places focus on the new step's heading so screen readers follow.","use":"First-run experiences, account set-up, product tours with input, checkout-style flows, surveys.","p":"Build an onboarding wizard as one HTML file with no libraries. A centred card with a progress bar and a Step n of 4 label. Step 1: What brings you here? as a group of large selectable cards (role=radio in a radiogroup, arrow keys move). Step 2: workspace name (required, live preview of the URL slug) and team size as segmented choices. Step 3: invite teammates: an email input that adds chips on Enter or comma, each removable, with validation. Step 4: a summary list of the answers with Edit links back to each step, and a Finish button that shows a success state with a drawn tick. Back and Continue buttons; Skip for now on optional steps; Continue is disabled until required fields are valid. Keep answers in one object, render the summary from it, and move focus to each step's heading on change. Slide steps in the direction of travel; no slide under prefers-reduced-motion. Include a theme toggle."}-->
<style>/*BASE*/
body{display:grid;place-items:center;padding:20px}
.wz{width:min(560px,100%);padding:26px}
.pg{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin:10px 0 22px}.pg i{display:block;height:100%;background:var(--ac);border-radius:3px;transition:width .35s}
.st{display:grid;gap:16px;animation:in .3s both}@keyframes in{from{opacity:0;transform:translateX(calc(var(--dir,1)*24px))}}
.st h1{outline:0}.st p{color:var(--mute)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:4px}.opt b{font-size:14.5px}.opt span{font-size:12.5px;color:var(--mute)}
.opt[aria-checked=true]{border-color:var(--ac);background:var(--ac-soft)}.opt:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.f{display:grid;gap:6px}.f label,.lab{font-weight:600;font-size:13px}.f .in{width:100%;min-height:42px}.slug{font-size:12.5px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border:1px solid var(--line);border-radius:10px;min-height:46px;align-items:center}.chips:focus-within{border-color:var(--ac)}
.chips input{flex:1;min-width:140px;border:0;outline:0;background:none;min-height:30px}.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 10px;border-radius:99px;background:var(--soft);font-size:13px}.chip button{all:unset;cursor:pointer;width:20px;height:20px;display:grid;place-items:center;border-radius:50%}.chip button:hover{background:var(--line)}.chip button:focus-visible{outline:2px solid var(--ac)}
.sum{list-style:none;margin:0;padding:0}.sum li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.sum small{display:block;color:var(--mute)}.sum button{all:unset;cursor:pointer;margin-left:auto;font-weight:600;font-size:13px;text-decoration:underline}.sum button:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.nav{display:flex;gap:10px;margin-top:24px}.ok{display:grid;justify-items:center;gap:12px;text-align:center;padding:20px 0}.ok svg{width:56px;height:56px;stroke:var(--ok);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.ok path{stroke-dasharray:30;stroke-dashoffset:30;animation:tk .5s .2s forwards}@keyframes tk{to{stroke-dashoffset:0}}
@media(max-width:480px){.opts{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.st{animation:none}.pg i{transition:none}.ok path{animation:none;stroke-dashoffset:0}}
</style>
<body>
<main class="card wz"><div class="row"><div class="logo" style="padding:0"><span><!--IC bolt--></span>Northwind</div><span class="sp"></span><span class="mute num" id="lab" style="font-size:13px"></span><button class="btn sq ghost" id="theme" aria-pressed="false" aria-label="Switch to dark theme"><!--IC moon--></button></div>
<div class="pg" role="progressbar" aria-label="Set-up progress" aria-valuemin="0" aria-valuemax="4" id="pg"><i></i></div>
<div id="step"></div>
<div class="nav" id="nav"><button class="btn" id="back">Back</button><span class="sp"></span><button class="btn ghost" id="skip">Skip for now</button><button class="btn pri" id="next">Continue</button></div></main>
<script>/*BASEJS*/
const A={goal:'',name:'',size:'2 to 10',invites:[]},GOALS=[['Run projects','Plan work and track progress'],['Share files','Keep assets in one place'],['Talk to customers','Inbox, replies and follow-ups'],['Just exploring','Show me around']],SIZES=['Just me','2 to 10','11 to 50','51+'];let i=0;
const slug=n=>n.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'your-team',okEmail=v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v);
const STEPS=[()=>`<h1 tabindex="-1">What brings you here?</h1><p>We will set things up to match. You can change this later.</p><div class="opts" role="radiogroup" aria-label="Your main goal">${GOALS.map(([t,s])=>`<button class="opt" role="radio" aria-checked="${A.goal===t}" tabindex="${A.goal===t||(!A.goal&&t===GOALS[0][0])?0:-1}"><b>${t}</b><span>${s}</span></button>`).join('')}</div>`,
 ()=>`<h1 tabindex="-1">Name your workspace</h1><p>This is what teammates will see.</p><div class="f"><label for="wn">Workspace name</label><input class="in" id="wn" value="${esc(A.name)}" placeholder="Acme Studio" autocomplete="organization"><span class="slug">northwind.app/<b id="sl">${slug(A.name)}</b></span></div><div><span class="lab" id="tsl">Team size</span><div class="seg" role="group" aria-labelledby="tsl" style="margin-top:6px;flex-wrap:wrap">${SIZES.map(s=>`<button aria-pressed="${A.size===s}">${s}</button>`).join('')}</div></div>`,
 ()=>`<h1 tabindex="-1">Invite your team</h1><p>Type an email and press Enter. This step is optional.</p><div class="f"><label for="iv">Email addresses</label><div class="chips" id="chips">${A.invites.map((e,k)=>`<span class="chip">${esc(e)}<button aria-label="Remove ${esc(e)}" data-k="${k}">✕</button></span>`).join('')}<input id="iv" type="email" placeholder="name@company.com" aria-describedby="ive"></div><span id="ive" role="alert" style="color:var(--bad);font-size:12.5px"></span></div>`,
 ()=>`<h1 tabindex="-1">Ready when you are</h1><p>Check the details, then finish.</p><ul class="sum"><li><span>Goal<small>${esc(A.goal||'Not chosen')}</small></span><button data-go="0">Edit</button></li><li><span>Workspace<small>${esc(A.name)} · northwind.app/${slug(A.name)} · ${A.size}</small></span><button data-go="1">Edit</button></li><li><span>Invites<small>${A.invites.length?A.invites.map(esc).join(', '):'Nobody yet'}</small></span><button data-go="2">Edit</button></li></ul>`];
function valid(){return i===0?!!A.goal:i===1?A.name.trim().length>1:true}
function show(dir){const s=$('#step');s.innerHTML=`<section class="st" style="--dir:${dir||1}">${STEPS[i]()}</section>`;$('#lab').textContent='Step '+(i+1)+' of 4';$('#pg').setAttribute('aria-valuenow',i+1);$('#pg i').style.width=(i+1)*25+'%';$('#back').hidden=i===0;$('#skip').hidden=i!==2&&i!==0;$('#next').textContent=i===3?'Finish':'Continue';$('#next').disabled=!valid();if(dir)$('#step h1').focus()}
function go(n,dir){i=Math.max(0,Math.min(3,n));show(dir)}
$('#next').onclick=()=>{if(i===2)addInvite();if(i===3){$('#step').innerHTML=`<div class="ok" role="status"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.5 3.5L17 9"/></svg><h1>${esc(A.name)} is ready</h1><p class="mute">We have sent ${A.invites.length} invite${A.invites.length===1?'':'s'}. Taking you to your workspace.</p></div>`;$('#nav').hidden=true;$('#lab').textContent='Done';return}go(i+1,1)};
$('#back').onclick=()=>go(i-1,-1);$('#skip').onclick=()=>go(i+1,1);
function addInvite(){const el=$('#iv');if(!el)return true;const v=el.value.trim().replace(/,$/,'');if(!v)return true;if(!okEmail(v)){$('#ive').textContent='Enter a full email address.';return false}if(!A.invites.includes(v))A.invites.push(v);show();$('#iv').focus();return true}
$('#step').addEventListener('click',e=>{const o=e.target.closest('.opt');if(o){A.goal=o.querySelector('b').textContent;show();$('.opt[aria-checked=true]').focus();return}const sg=e.target.closest('.seg button');if(sg){A.size=sg.textContent;$$('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===sg));return}const rm=e.target.closest('.chip button');if(rm){A.invites.splice(+rm.dataset.k,1);show();$('#iv').focus();return}const g=e.target.closest('[data-go]');if(g)go(+g.dataset.go,-1)});
$('#step').addEventListener('input',e=>{if(e.target.id==='wn'){A.name=e.target.value;$('#sl').textContent=slug(A.name);$('#next').disabled=!valid()}else if(e.target.id==='iv')$('#ive').textContent=''});
$('#step').addEventListener('keydown',e=>{if(e.target.id==='iv'&&(e.key==='Enter'||e.key===',')){e.preventDefault();addInvite()}else if(e.target.id==='iv'&&e.key==='Backspace'&&!e.target.value&&A.invites.length){A.invites.pop();show();$('#iv').focus()}else if(e.target.id==='wn'&&e.key==='Enter'&&valid()){e.preventDefault();go(i+1,1)}
 const o=e.target.closest('.opt');if(o){const os=$$('.opt'),k=os.indexOf(o),d={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key];if(d){e.preventDefault();const n=os[(k+d+os.length)%os.length];A.goal=n.querySelector('b').textContent;show();$('.opt[aria-checked=true]').focus()}}});
show();
</script>
</body>
