<!--META {"o":4,"t":"Support inbox","cat":"Communication","tone":"light","added":"2026-11","d":"A help desk in four columns: an icon rail, a queue with reply-time warnings, the conversation with replies and private notes, and the customer's details and orders.","how":"Conversations are one array. The queue, the counts on the filter and the thread are all drawn from it, so sending a reply, adding a note or changing the status updates every column at once. Saved replies are a small menu that writes into the reply box.","use":"Customer support and help desk tools, shared team inboxes, live chat consoles, moderation queues.","p":"Build a support inbox as one HTML file with no libraries for a help desk called Relay. Keep it dense: 13px text and tight rows. Four columns: (1) a 56px icon rail on a dark inverted surface with the logo, five icon links with tooltips, a theme switch and the agent's avatar; (2) a 300px queue with a heading, an Open / Waiting / Closed filter showing counts, a search field and a list (role=listbox, arrow keys) where each row has the customer's initials, name, time, subject, a one-line preview, a channel label and a reply-due badge that turns amber then red; (3) the conversation: subject, a status select, an Assign to me button, then customer messages on the left, agent replies on the right in the accent colour and private notes on an amber tint with a label, and a composer with a Reply / Note switch, a Saved replies menu that inserts text, and Send; (4) a 280px customer panel with contact details, lifetime figures, recent orders with status badges and earlier conversations. Sending a reply or changing the status must update the queue and its counts. Under 1200px hide the customer panel; under 860px show the queue first and open a conversation full width with a Back button. Colours are CSS variables with a dark theme."}-->
<style>/*CORE*/
/*SHELLCSS inv*/
/*SHELLCSS rail*/
body{font-size:13px}
.desk{display:grid;grid-template-columns:56px 300px minmax(0,1fr) 284px;height:100%}.desk>*{min-height:0;min-width:0}
.q{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel)}
.qh{padding:12px 12px 10px;display:grid;gap:9px;border-bottom:1px solid var(--line)}.qh h1{font-size:16px}.qh .seg{display:flex}.qh .seg button{flex:1;padding:0 6px;font-size:12.5px}.qh .seg b{font-weight:600;opacity:.6;margin-left:4px}
.qh .in{width:100%;min-height:32px}
.ql{flex:1;overflow:auto}.it{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:1px 9px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.it:hover{background:var(--bg)}.it[aria-selected=true]{background:var(--ac-soft)}.it:focus-visible{outline-offset:-2px}
.it .av{grid-row:1/3}.it b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it time{font-size:11.5px;color:var(--mute)}
.it .s{grid-column:2/4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .p{grid-column:2/4;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.it .m{grid-column:2/4;display:flex;gap:6px;margin-top:5px;align-items:center}.it .badge{font-size:11px;padding:1px 7px}.it.un b::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ac);margin-left:6px}
.th{display:flex;flex-direction:column;background:var(--bg)}
.thh{display:flex;align-items:center;gap:8px;padding:9px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}.thh h2{font-size:15px;flex:1;min-width:160px}.thh .in,.thh .btn{min-height:32px}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.mg{max-width:min(560px,82%);display:grid;gap:3px}.mg p{padding:9px 12px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);line-height:1.5}.mg small{color:var(--mute);font-size:11.5px;padding:0 4px}
.mg.a{align-self:flex-end;justify-items:end}.mg.a p{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.mg.n{align-self:stretch;max-width:none}.mg.n p{background:var(--warn-soft);border-color:transparent;border-left:3px solid var(--warn)}.mg.n small{color:var(--warn);font-weight:600}.mg.n small:last-child{color:var(--mute);font-weight:400}
.att{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--line);border-radius:var(--rb);background:var(--panel);font-size:12px;justify-self:start}.att .ic{width:14px;height:14px}
.daysep{align-self:center;font-size:11.5px;color:var(--mute);padding:2px 10px;border-radius:99px;background:var(--soft)}
.cmp{margin:0 16px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--sh)}.cmp.note{background:var(--warn-soft);border-color:var(--warn)}.cmp:focus-within{border-color:var(--ac)}
.cmp textarea{display:block;width:100%;border:0;outline:0;background:none;resize:none;min-height:66px;padding:10px 12px;line-height:1.5}
.cmp .row{padding:6px 8px;border-top:1px solid var(--line);gap:6px;position:relative}.cmp .seg button{min-height:26px;font-size:12px}.cmp .btn{min-height:30px;font-size:12.5px}
.menu{position:absolute;bottom:42px;left:8px;width:270px;padding:5px;z-index:5}.menu button{display:grid;width:100%;text-align:left;border:0;background:none;border-radius:var(--rb);padding:7px 9px;gap:1px}.menu button:hover,.menu button:focus-visible{background:var(--soft)}.menu small{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cu{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px 14px;display:grid;gap:16px;align-content:start}
.cu h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin-bottom:7px}.cu dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px}.cu dt{color:var(--mute)}.cu dd{margin:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r);text-align:center}.stat div{padding:8px 2px}.stat div+div{border-left:1px solid var(--line)}.stat b{display:block;font-size:15px}.stat span{font-size:11.5px;color:var(--mute)}
.ord{list-style:none;margin:0;padding:0}.ord li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}.ord li:last-child{border:0}.ord small{display:block;color:var(--mute);font-size:11.5px}
#back{display:none}
@media(max-width:1200px){.desk{grid-template-columns:56px 280px minmax(0,1fr)}.cu{display:none}}
@media(max-width:860px){.desk{grid-template-columns:48px minmax(0,1fr)}.desk:not(.open) .th,.desk.open .q{display:none}#back{display:inline-flex}}
</style>
<body>
<div class="desk" id="desk">
<nav class="rail inv" aria-label="Main"><a class="lg" href="#" aria-label="Relay home" title="Relay"><!--IC headset--></a><a href="#" aria-current="page" aria-label="Inbox" title="Inbox"><!--IC inbox--><i></i></a><a href="#" aria-label="Customers" title="Customers"><!--IC users--></a><a href="#" aria-label="Help centre" title="Help centre"><!--IC book--></a><a href="#" aria-label="Reports" title="Reports"><!--IC chart--></a><a href="#" aria-label="Settings" title="Settings"><!--IC gear--></a><span style="margin-top:auto"></span><button id="theme" aria-pressed="false" aria-label="Switch to dark theme"><!--IC moon--></button><span class="av" aria-label="Your account">AK</span></nav>
<section class="q" aria-label="Queue"><div class="qh"><div class="row"><h1>Inbox</h1><span class="sp"></span><span class="badge ok"><i></i>Online</span></div><div class="seg" role="group" aria-label="Status" id="flt"></div><label class="sr" for="q">Search conversations</label><input class="in" id="q" type="search" placeholder="Search name or subject"></div><div class="ql" role="listbox" aria-label="Conversations" id="list" tabindex="-1"></div></section>
<section class="th" aria-label="Conversation" id="th"></section>
<aside class="cu" aria-label="Customer" id="cu"></aside></div>
<script>/*BASEJS*/
/* DATA. due is minutes until a reply is owed (null when none is). Messages: who is c (customer), a (agent) or n (private note). */
const C=[
 {n:'Hannah Whitfield',s:'Order arrived with a cracked lid',ch:'Chat',st:'Open',due:12,t:'10:11',un:1,city:'Leeds',since:'March 2024',orders:6,spend:412,m:[['c','10:02','Hi, my order #4812 arrived this morning and the lid of the casserole dish is cracked. The box looked fine from the outside.'],['c','10:03','I have photos if that helps.','IMG_2231.jpg'],['a','10:06','Sorry about that, Hannah. That is not how it should arrive. Could you send the photos over? I will get a replacement lid out today.'],['c','10:11','Sent. Do I need to post the broken one back?'],['n','10:12','Warehouse has 14 lids in stock (CR-2210-L). No return needed for breakages under £20.','Tom Becker']],o:[['#4812','Casserole dish, moss','£64.00','Delivered'],['#4377','Linen throw, oat','£68.00','Delivered'],['#4102','Beeswax candle set','£24.00','Refunded']],prev:['Where is my parcel? · August','Gift wrapping question · May']},
 {n:'Marta Kowalska',s:'Refund not showing yet',ch:'Email',st:'Open',due:35,t:'09:48',un:1,city:'Bristol',since:'June 2025',orders:2,spend:131,m:[['c','09:48','Hello, I returned the oak serving board on 2 November and the tracking says you received it on the 5th. The refund of £42 still has not reached my account. Can you check please?']],o:[['#4630','Oak serving board','£42.00','Refunded'],['#4588','Stoneware mug, moss × 4','£72.00','Delivered']],prev:['Returns label request · 1 November']},
 {n:'Daniel Osei',s:'Change delivery address',ch:'Email',st:'Open',due:100,t:'09:20',un:0,city:'London',since:'November 2026',orders:1,spend:89,m:[['c','09:20','I ordered the Arc table lamp last night (#4819) but used my old address by mistake. Could it go to 14 Calder Row, London E8 instead? It has not shipped yet as far as I can see.'],['a','09:31','Morning Daniel. I have put a hold on the parcel while I change it. Can you confirm the postcode for Calder Row?']],o:[['#4819','Arc table lamp','£89.00','Processing']],prev:[]},
 {n:'Chloe Bennett',s:'Discount code not working',ch:'Chat',st:'Open',due:140,t:'08:57',un:0,city:'Cardiff',since:'January 2025',orders:4,spend:203,m:[['c','08:55','The code AUTUMN15 says it has expired but the email I got yesterday says it runs until Sunday?'],['a','08:57','You are right, the email is correct and the code was switched off early by mistake. It is working again now. Sorry for the trouble.']],o:[['#4790','Wool cushion, rust × 2','£78.00','Delivered'],['#4511','Glass carafe','£29.00','Delivered']],prev:['Size of the large bowl · September']},
 {n:'Yusuf Demir',s:'Do you ship to Ireland?',ch:'Chat',st:'Waiting',due:null,t:'Yesterday',un:0,city:'Dublin',since:'New customer',orders:0,spend:0,m:[['c','16:40','Hi, do you deliver to Dublin and roughly how much is it?'],['a','16:44','We do. Delivery to Ireland is a flat £9.50 and takes three to five working days. Duties are included at checkout, so there is nothing to pay on the doorstep.'],['a','16:45','Shall I send you a link to the basket you were building?']],o:[],prev:[]},
 {n:'Rhys Morgan',s:'Wrong colour sent',ch:'Email',st:'Waiting',due:null,t:'Yesterday',un:0,city:'Swansea',since:'April 2023',orders:9,spend:655,m:[['c','14:10','I ordered the linen apron in ink and received it in oat. Order #4771.'],['a','14:32','Sorry about that, Rhys. I have sent a prepaid label to this address. The ink apron will go out as soon as the courier scans your return.']],o:[['#4771','Linen apron, ink','£36.00','Exchange'],['#4605','Brass candle holder','£27.00','Delivered'],['#4420','Cotton napkins, set of 4','£22.00','Delivered']],prev:['Trade discount enquiry · July','Late delivery · February']},
 {n:'Ingrid Solberg',s:'Thank you for the quick fix',ch:'Email',st:'Closed',due:null,t:'Mon',un:0,city:'Edinburgh',since:'October 2024',orders:3,spend:176,m:[['c','11:05','The replacement carafe arrived today, in one piece this time. Thank you for sorting it so quickly.'],['a','11:20','That is great to hear, Ingrid. Enjoy it.']],o:[['#4701','Glass carafe','£29.00','Delivered'],['#4688','Glass carafe','£29.00','Replaced']],prev:['Carafe arrived chipped · last week']}];
C.forEach((c,i)=>{c.id=i;c.me=i<4});C[0].un=0;
const SAVED=[['Ask for photos','Could you send a photo of the item and the packaging? It helps us put it right with the courier.'],['Replacement on its way','I have arranged a replacement and it will leave our warehouse today. You do not need to send the damaged one back.'],['Refund timing','Refunds take three to five working days to show once we have processed them. I can see yours was sent on our side.'],['Anything else?','Is there anything else I can help with today?']];
const ST=['Open','Waiting','Closed'],KIND={Delivered:'ok',Processing:'',Refunded:'warn',Exchange:'warn',Replaced:''};
let flt='Open',sel=0,mode='Reply',draft='';
const ini=n=>n.split(' ').map(w=>w[0]).join(''),dueTxt=d=>d<60?d+' min':Math.floor(d/60)+' h '+(d%60?d%60+' min':'');
const shown=()=>{const q=$('#q').value.trim().toLowerCase();return C.filter(c=>c.st===flt&&(!q||(c.n+' '+c.s).toLowerCase().includes(q)))};
function queue(focus){$('#flt').innerHTML=ST.map(s=>`<button aria-pressed="${s===flt}" data-s="${s}">${s}<b>${C.filter(c=>c.st===s).length}</b></button>`).join('');
 const L=shown();$('#list').innerHTML=L.map(c=>`<div class="it ${c.un?'un':''}" role="option" tabindex="${c.id===sel?0:-1}" aria-selected="${c.id===sel}" data-id="${c.id}"><span class="av">${ini(c.n)}</span><b>${c.n}${c.un?'<span class="sr"> unread</span>':''}</b><time>${c.t}</time><span class="s">${c.s}</span><span class="p">${esc(c.m[c.m.length-1][2])}</span><span class="m"><span class="badge">${c.ch}</span>${c.due!=null?`<span class="badge ${c.due<=15?'bad':c.due<=45?'warn':''}"><!--IC clock-->Reply due in ${dueTxt(c.due)}</span>`:c.st==='Waiting'?'<span class="badge">Waiting on customer</span>':'<span class="badge ok">Solved</span>'}</span></div>`).join('')||`<p class="mute" style="padding:28px 16px;text-align:center">No ${flt.toLowerCase()} conversations${$('#q').value?' match that search':''}.</p>`;
 if(focus)$(`#list [data-id="${sel}"]`)?.focus()}
function thread(){const c=C[sel];if(!c){$('#th').innerHTML='<p class="mute" style="margin:auto">Nothing selected.</p>';$('#cu').innerHTML='';return}
 $('#th').innerHTML=`<header class="thh"><button class="btn sq" id="back" aria-label="Back to the queue"><!--IC left--></button><h2>${c.s}</h2><label class="sr" for="st">Status</label><select class="in" id="st">${ST.map(s=>`<option ${s===c.st?'selected':''}>${s}</option>`).join('')}</select><button class="btn" id="asg" aria-pressed="${c.me}">${c.me?'<!--IC check-->Assigned to you':'Assign to me'}</button></header>
 <div class="msgs" id="msgs" role="log" aria-label="Messages"><span class="daysep">${c.t.includes(':')?'Today, Thursday 12 November':c.t==='Yesterday'?'Yesterday':'Monday 9 November'}</span>${c.m.map(([w,t,x,a])=>`<div class="mg ${w}">${w==='n'?`<small>Private note · ${a||'Amara Khan'}</small>`:''}<p>${esc(x)}</p>${w==='c'&&a?`<span class="att"><!--IC image-->${a}</span>`:''}<small>${w==='c'?c.n.split(' ')[0]:w==='a'?'You':''} ${w==='n'?'':'· '}${t}</small></div>`).join('')}</div>
 <form class="cmp ${mode==='Note'?'note':''}" id="cmp"><label class="sr" for="tx">${mode==='Note'?'Private note':'Reply to '+c.n}</label><textarea id="tx" placeholder="${mode==='Note'?'Add a note only your team can see…':'Reply to '+c.n.split(' ')[0]+'…'}">${esc(draft)}</textarea><div class="row"><div class="seg" role="group" aria-label="Message type">${['Reply','Note'].map(m=>`<button type="button" data-m="${m}" aria-pressed="${m===mode}">${m}</button>`).join('')}</div><button class="btn ghost" type="button" id="sv" aria-haspopup="menu" aria-expanded="false"><!--IC bolt-->Saved replies</button><div class="card menu" id="menu" role="menu" hidden>${SAVED.map(([n,x],i)=>`<button type="button" role="menuitem" data-i="${i}"><b>${n}</b><small>${x}</small></button>`).join('')}</div><span class="sp"></span><button class="btn pri">${mode==='Note'?'Add note':'Send'}</button></div></form>`;
 const m=$('#msgs');m.scrollTop=m.scrollHeight;
 $('#cu').innerHTML=`<div style="text-align:center;display:grid;justify-items:center;gap:4px"><span class="av" style="width:52px;height:52px;font-size:17px">${ini(c.n)}</span><b style="font-size:15px">${c.n}</b><span class="mute">${c.city} · local time 10:${c.id*3+14}</span></div>
 <div class="stat"><div><b class="num">${c.orders}</b><span>Orders</span></div><div><b class="num">£${c.spend}</b><span>Spent</span></div><div><b class="num">${c.prev.length+1}</b><span>Chats</span></div></div>
 <section><h3>Details</h3><dl><dt>Email</dt><dd>${c.n.toLowerCase().replace(' ','.')}@example.com</dd><dt>Customer since</dt><dd>${c.since}</dd><dt>Channel</dt><dd>${c.ch}</dd><dt>Assignee</dt><dd>${c.me?'Amara Khan':'Unassigned'}</dd></dl></section>
 <section><h3>Recent orders</h3>${c.o.length?`<ul class="ord">${c.o.map(o=>`<li><span><b class="num">${o[0]}</b> · ${o[2]}<small>${o[1]}</small></span><span class="sp badge ${KIND[o[3]]}">${o[3]}</span></li>`).join('')}</ul>`:'<p class="mute">No orders yet.</p>'}</section>
 <section><h3>Earlier conversations</h3>${c.prev.length?c.prev.map(p=>`<p style="padding:3px 0">${p}</p>`).join(''):'<p class="mute">This is the first one.</p>'}</section>`}
function open(id,focus){sel=id;C[id].un=0;draft='';mode='Reply';$('#desk').classList.add('open');queue(focus);thread()}
$('#flt').onclick=e=>{const b=e.target.closest('button');if(!b)return;flt=b.dataset.s;const L=shown();sel=L[0]?L[0].id:-1;$('#desk').classList.remove('open');queue();thread();$(`#flt [data-s="${flt}"]`).focus()};
$('#q').oninput=()=>queue();
$('#list').onclick=e=>{const o=e.target.closest('.it');if(o)open(+o.dataset.id,true)};
$('#list').onkeydown=e=>{const L=shown(),i=L.findIndex(c=>c.id===sel),d=e.key==='ArrowDown'?1:e.key==='ArrowUp'?-1:0;if(d&&L[i+d]){e.preventDefault();open(L[i+d].id,true)}};
$('#th').addEventListener('click',e=>{const c=C[sel],b=e.target.closest('button');if(!b||!c)return;const menu=$('#menu');
 if(b.id==='back'){$('#desk').classList.remove('open');queue(true)}
 else if(b.id==='asg'){c.me=!c.me;draft=$('#tx').value;thread();$('#asg').focus();toast(c.me?'Assigned to you':'Unassigned')}
 else if(b.dataset.m){mode=b.dataset.m;draft=$('#tx').value;thread();$('#tx').focus()}
 else if(b.id==='sv'){menu.hidden=!menu.hidden;b.setAttribute('aria-expanded',!menu.hidden);if(!menu.hidden)menu.firstChild.focus()}
 else if(b.dataset.i){const t=$('#tx');t.value=(t.value?t.value.trimEnd()+' ':'')+SAVED[b.dataset.i][1];menu.hidden=true;$('#sv').setAttribute('aria-expanded',false);t.focus()}});
$('#th').addEventListener('change',e=>{if(e.target.id!=='st')return;const c=C[sel];c.st=e.target.value;c.due=c.st==='Open'?60:null;flt=c.st;queue();thread();toast('Moved to '+c.st)});
$('#th').addEventListener('submit',e=>{e.preventDefault();const c=C[sel],t=$('#tx').value.trim();if(!t)return;c.m.push([mode==='Note'?'n':'a','10:14',t]);if(mode==='Reply'&&c.st==='Open'){c.due=null;c.st='Waiting';toast('Reply sent. Waiting on '+c.n.split(' ')[0])}else toast(mode==='Note'?'Note added':'Reply sent');draft='';const was=flt;if(c.st!==was&&mode==='Reply')flt=c.st;mode='Reply';queue();thread()});
addEventListener('keydown',e=>{const m=$('#menu');if(e.key==='Escape'&&m&&!m.hidden){m.hidden=true;$('#sv').setAttribute('aria-expanded',false);$('#sv').focus()}});
queue();thread();
</script>
</body>
