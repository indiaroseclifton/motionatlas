<!--META {"o":5,"t":"Kanban board","cat":"Work & projects","tone":"light","d":"A project board with four columns. Drag cards between them, or move them with the keyboard, add a card inline and watch the column counts update.","how":"Cards live in one array with a column field; the board is re-rendered from it after every change. Dragging uses the native drag events with a drop indicator. Every card also has a Move menu and Alt + arrow shortcuts, so the board works without a pointer, and each move is announced.","use":"Task trackers, sales pipelines, hiring, content calendars, support queues.","p":"Build a kanban board as one HTML file with no libraries, inside an app shell (sidebar, top bar, content). Four columns (Backlog, In progress, Review, Done), each a labelled region with a count and an Add card button that reveals an inline input. Cards show a title, a coloured tag, a priority badge, a due date, an assignee avatar and a comment count. Support native drag and drop between and within columns with a visible drop line. For keyboards: each card is focusable; Alt + Left/Right moves it between columns and Alt + Up/Down reorders it; a Move to select on each card does the same. Announce every move in an aria-live region (\"Moved Title to Review, position 2 of 4\"). Keep cards in one array and re-render after each change, restoring focus to the moved card. Columns scroll horizontally on small screens."}-->
<style>/*BASE*/
.board{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:14px;align-items:start;overflow-x:auto;padding-bottom:10px}
.col{background:var(--soft);border-radius:var(--r);padding:10px;min-height:120px}.col.over{outline:2px dashed var(--ac);outline-offset:-2px}
.col header{display:flex;align-items:center;gap:8px;padding:4px 6px 10px}.col header b{font-size:13.5px}.col header span{font-size:12px;color:var(--mute);background:var(--panel);border-radius:99px;padding:0 8px}
.cards{list-style:none;margin:0;padding:0;display:grid;gap:8px;min-height:10px}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;box-shadow:0 1px 2px rgba(16,24,40,.05);cursor:grab;display:grid;gap:8px}.kc.drag{opacity:.4}.kc.line{box-shadow:0 -3px 0 var(--ac)}
.kc h3{font-weight:600;line-height:1.35}.kc .meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);white-space:nowrap}.kc .av{width:24px;height:24px;font-size:10px}
.kc select{margin-left:auto;font-size:12px;border:1px solid var(--line);border-radius:7px;background:var(--panel);min-height:26px;max-width:92px}
.tag{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:5px}
.addf{display:flex;gap:6px;margin-top:8px}.addf input{flex:1}
.addb{width:100%;margin-top:8px;justify-content:flex-start;color:var(--mute)}
</style>
<body>
<!--SHELL Projects|Search cards-->
<div class="head"><div><h1>Website relaunch</h1><p>Sprint 14 · 3 to 14 November</p></div><span class="sp"></span><span class="mute" style="font-size:12.5px">Drag a card, or focus it and press Alt + arrow keys</span></div>
<div class="board" id="board"></div><p class="sr" aria-live="assertive" id="say"></p>
<!--/SHELL-->
<script>/*BASEJS*/
const COLS=['Backlog','In progress','Review','Done'],TAG={Design:['#EDE9FE','#5B21B6'],Build:['#DBEAFE','#1E40AF'],Content:['#FEF3C7','#92400E'],QA:['#DCFCE7','#166534']};
let CARDS=[['Audit the current sitemap','Content','Low','12 Nov','MO',2,0],['Write the pricing page copy','Content','High','13 Nov','PN',5,0],['Dark theme tokens','Design','Medium','14 Nov','TR',1,0],['Checkout flow prototype','Design','High','11 Nov','MO',8,1],['Build the nav menu','Build','Medium','12 Nov','TR',3,1],['Image pipeline','Build','Low','14 Nov','AK',0,1],['Home page hero','Design','High','10 Nov','PN',4,2],['Form validation','Build','Medium','11 Nov','AK',2,2],['Analytics events','QA','Low','7 Nov','TR',1,3],['Brand tokens','Design','Medium','5 Nov','MO',6,3]].map(([t,tag,pri,due,who,com,col],id)=>({id,t,tag,pri,due,who,com,col}));
let nid=CARDS.length,dragId=null;const PRI={High:'bad',Medium:'warn',Low:''};
const say=t=>{$('#say').textContent='';requestAnimationFrame(()=>$('#say').textContent=t)};
function render(focusId){$('#board').innerHTML=COLS.map((c,i)=>{const list=CARDS.filter(k=>k.col===i);return `<section class="col" data-col="${i}" aria-labelledby="c${i}"><header><b id="c${i}">${c}</b><span>${list.length}</span></header><ul class="cards">${list.map(k=>`<li class="kc" draggable="true" tabindex="0" data-id="${k.id}" aria-label="${esc(k.t)}, ${k.pri} priority, due ${k.due}"><div class="row"><span class="tag" style="background:${TAG[k.tag][0]};color:${TAG[k.tag][1]}">${k.tag}</span><span class="badge ${PRI[k.pri]}">${k.pri}</span><select aria-label="Move ${esc(k.t)} to">${COLS.map((n,j)=>`<option value="${j}" ${j===i?'selected':''}>${n}</option>`).join('')}</select></div><h3>${esc(k.t)}</h3><div class="meta"><span>Due ${k.due}</span><span>·</span><span>${k.com} comments</span><span class="av sp">${k.who}</span></div></li>`).join('')}</ul><button class="btn ghost addb" data-add="${i}">+ Add card</button></section>`}).join('');
 if(focusId!=null)$(`.kc[data-id="${focusId}"]`)?.focus()}
function move(id,col,before){const k=CARDS.find(x=>x.id===id);CARDS=CARDS.filter(x=>x!==k);k.col=col;const at=before==null?-1:CARDS.findIndex(x=>x.id===before);at<0?CARDS.push(k):CARDS.splice(at,0,k);render(id);const list=CARDS.filter(x=>x.col===col);say(`Moved ${k.t} to ${COLS[col]}, position ${list.indexOf(k)+1} of ${list.length}`)}
const B=$('#board');
B.addEventListener('dragstart',e=>{const c=e.target.closest('.kc');if(!c)return;dragId=+c.dataset.id;c.classList.add('drag');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)});
B.addEventListener('dragend',()=>{dragId=null;$$('.drag,.line,.over').forEach(x=>x.classList.remove('drag','line','over'))});
B.addEventListener('dragover',e=>{const col=e.target.closest('.col');if(!col||dragId==null)return;e.preventDefault();$$('.line,.over').forEach(x=>x.classList.remove('line','over'));const c=e.target.closest('.kc');c&&+c.dataset.id!==dragId?c.classList.add('line'):col.classList.add('over')});
B.addEventListener('drop',e=>{const col=e.target.closest('.col');if(!col||dragId==null)return;e.preventDefault();const c=e.target.closest('.kc');move(dragId,+col.dataset.col,c&&+c.dataset.id!==dragId?+c.dataset.id:null)});
B.addEventListener('change',e=>{if(e.target.matches('.kc select'))move(+e.target.closest('.kc').dataset.id,+e.target.value)});
B.addEventListener('keydown',e=>{const c=e.target.closest('.kc');if(!c||!e.altKey||e.target!==c)return;const k=CARDS.find(x=>x.id===+c.dataset.id),list=CARDS.filter(x=>x.col===k.col),i=list.indexOf(k);
 if(e.key==='ArrowRight'&&k.col<3){e.preventDefault();move(k.id,k.col+1)}else if(e.key==='ArrowLeft'&&k.col>0){e.preventDefault();move(k.id,k.col-1)}else if(e.key==='ArrowUp'&&i>0){e.preventDefault();move(k.id,k.col,list[i-1].id)}else if(e.key==='ArrowDown'&&i<list.length-1){e.preventDefault();move(k.id,k.col,list[i+2]?.id)}});
B.addEventListener('click',e=>{const b=e.target.closest('[data-add]');if(!b)return;const col=+b.dataset.add;b.outerHTML=`<form class="addf" data-col="${col}"><input class="in" aria-label="Card title" placeholder="Card title" required><button class="btn pri">Add</button></form>`;$(`form[data-col="${col}"] input`).focus()});
B.addEventListener('submit',e=>{e.preventDefault();const f=e.target,t=f.querySelector('input').value.trim();if(!t)return;const k={id:nid++,t,tag:'Build',pri:'Medium',due:'14 Nov',who:'AK',com:0,col:+f.dataset.col};CARDS.push(k);render(k.id);say('Added '+t+' to '+COLS[k.col])});
B.addEventListener('focusout',e=>{const f=e.target.closest('.addf');if(f&&!f.contains(e.relatedTarget)&&!f.querySelector('input').value)setTimeout(()=>render(),0)});
render();
</script>
</body>
