<!--META {"o":14,"t":"Quarterly report","cat":"Dashboards","tone":"light","added":"2026-11","d":"A report laid out like printed pages: a headline finding, four figures with their change, a labelled line chart, revenue by plan as stacked bars with a table, a retention grid and notes. Switch the quarter, or print it.","how":"Each quarter is one data object. The headline, figures, both charts and both tables are written from it, and the totals in the table are added up in code so they always match the bars. A print stylesheet hides the toolbar and breaks the pages cleanly.","use":"Board and investor updates, client reports, monthly summaries, anything read on paper or as a PDF rather than watched live.","p":"Build a quarterly customer report as one HTML file with no libraries for an analytics product called Meridian. It should read like a printed document, not a dashboard: a soft grey desk, and white pages up to 880px wide with wide margins, a serif headline and thin rules instead of cards. A slim toolbar above the pages has the logo, a breadcrumb, a quarter select, a theme switch, Print (window.print) and Download PDF. Page 1: an eyebrow line with the period, a large headline stating the main finding, a standfirst paragraph, a row of four figures separated by rules (active customers, new sign-ups, customers lost, revenue), each with a change against the previous quarter in words, then Figure 1: an SVG line chart of active customers over twelve months with the quarter shaded, the first and last points labelled directly and a caption; then two columns of short text, What changed and What we will do next. Page 2: Figure 2, revenue by plan as three stacked horizontal bars (one per month) with a legend, beside a table of the same numbers with a total row computed in code; Figure 3, a retention grid where each cell is tinted by its percentage; and numbered notes on method. Each page ends with a footer line and page number. Changing the quarter rewrites everything from one data object. Add print styles: no toolbar, no shadows, one sheet per page. Colours are CSS variables with a dark theme."}-->
<style>/*CORE*/
body{display:flex;flex-direction:column;background:var(--soft)}
.bar{display:flex;align-items:center;gap:8px;padding:0 16px;min-height:52px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.mk{display:grid;place-items:center;width:26px;height:26px;border-radius:var(--rb);background:var(--ac);color:var(--ac-ink)}.mk .ic{width:16px;height:16px}
.cr{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cr span{color:var(--mute);font-weight:500}
.desk{flex:1;min-height:0;overflow:auto;padding:28px 16px 48px}
.sheet{position:relative;width:min(880px,100%);margin:0 auto 26px;padding:64px 76px 84px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh);border-radius:2px}
.eye{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:flex;gap:10px;align-items:center}.eye::before{content:"";width:28px;height:2px;background:var(--ac)}
.sheet h1{font:600 42px/1.08 Georgia,"Iowan Old Style","Times New Roman",serif;letter-spacing:-.02em;margin:18px 0 16px;max-width:17em;text-wrap:balance}
.stand{font:19px/1.55 Georgia,"Iowan Old Style",serif;color:var(--mute);max-width:36em}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:36px 0 34px;border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.figs div{padding:16px 16px 18px 0}.figs div+div{padding-left:16px;border-left:1px solid var(--line)}.figs span{display:block;font-size:12.5px;color:var(--mute)}
.big{display:block;font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.figs small{font-size:12.5px;font-weight:600}.up{color:var(--ok)}.dn{color:var(--bad)}
figure{margin:0}figcaption{font-size:12.5px;color:var(--mute);margin-top:10px;max-width:60em}figcaption b{color:var(--ink)}
.sheet h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;padding-bottom:8px;border-bottom:1px solid var(--ink);margin-bottom:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:38px}.cols ul{margin:0;padding-left:18px;display:grid;gap:9px;line-height:1.55}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:start;margin-bottom:44px}
.bars{display:grid;gap:14px;margin-top:6px}.bars .r{display:grid;grid-template-columns:34px minmax(0,1fr) 52px;gap:10px;align-items:center;font-size:13px}.bars .r b{text-align:right;font-variant-numeric:tabular-nums}
.stk{display:flex;height:34px;gap:2px}.stk i{display:grid;place-items:center;min-width:0;font-style:normal;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;overflow:hidden}
.k0{background:var(--ac);color:var(--ac-ink)}.k1{background:var(--mute);color:var(--panel)}.k2{background:var(--line);color:var(--ink)}
.leg{display:flex;gap:16px;font-size:12.5px;color:var(--mute);margin-top:14px;flex-wrap:wrap}.leg i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
.sheet table{font-size:13px;font-variant-numeric:tabular-nums}.sheet th,.sheet td{padding:8px 0 8px 12px;text-align:right}.sheet th:first-child,.sheet td:first-child{text-align:left;padding-left:0}
.sheet thead th{border-bottom:1px solid var(--ink);color:var(--ink)}.sheet tfoot td{border-top:1px solid var(--ink);border-bottom:0;font-weight:700}
.heat td{padding:0 0 3px 3px;border:0}.heat td span{position:relative;z-index:0;display:block;padding:9px 0;text-align:center;font-weight:600}.heat td span::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--ac);opacity:var(--o)}.heat td span.hi{color:var(--ac-ink)}.heat td.e{background:none}.heat th{border:0;padding:6px 0 6px 3px;text-align:center}.heat td:first-child{padding:0 10px 3px 0;white-space:nowrap}
.notes{margin:40px 0 0;padding:14px 0 0 18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute);display:grid;gap:5px;line-height:1.5}
.foot{position:absolute;left:76px;right:76px;bottom:30px;display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);letter-spacing:.04em}
@media(max-width:760px){.desk{padding:12px 8px 30px}.sheet{padding:34px 22px 70px}.sheet h1{font-size:30px}.stand{font-size:17px}.figs{grid-template-columns:1fr 1fr}.figs div:nth-child(3){padding-left:0;border-left:0}.figs div:nth-child(n+3){border-top:1px solid var(--line)}.big{font-size:27px}.cols,.split{grid-template-columns:1fr;gap:26px}.foot{left:22px;right:22px}.cr span,.bar .btn span{display:none}.heat td span{font-size:11.5px}}
@media print{body{background:none;display:block}.bar{display:none}.desk{overflow:visible;padding:0}.sheet{box-shadow:none;border:0;width:auto;margin:0;break-after:page;padding:14mm 12mm 22mm}}
</style>
<body>
<header class="bar"><span class="mk"><!--IC chart--></span><div class="cr">Meridian <span>/ Reports / Customers</span></div><span class="sp"></span>
 <label class="sr" for="per">Quarter</label><select class="in" id="per"><option value="q3">Q3 2026, July to September</option><option value="q2">Q2 2026, April to June</option></select>
 <button class="btn sq ghost" id="theme" aria-pressed="false" aria-label="Switch to dark theme"><!--IC moon--></button>
 <button class="btn" id="print"><!--IC print--><span>Print</span></button><button class="btn pri" id="pdf"><!--IC download--><span>Download PDF</span></button></header>
<main class="desk" id="desk" aria-live="polite"></main>
<script>/*BASEJS*/
/* DATA: one object per quarter. Revenue is in thousands of pounds, by plan (Starter, Team, Business) for each month. */
const SERIES=[3790,3830,3880,3910,3980,4020,4105,4190,4260,4340,4430,4535,4610,4702,4812],SM=['Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep'];
const Q={
 q3:{name:'Q3 2026',span:'July to September 2026',end:14,head:'Retention held while new sign-ups slowed',stand:'We finished September with 4,812 paying customers, 277 more than in June. Fewer people joined than in the spring, but far fewer left, and those who stayed moved to larger plans.',
  start:4535,joined:742,lost:465,prev:{active:4535,joined:819,lost:544,rev:1155},months:['Jul','Aug','Sep'],rev:[[62,214,136],[63,223,142],[64,231,149]],
  cohorts:[['April',86,79,74,71,69],['May',87,80,76,73],['June',88,82,78],['July',89,84],['August',90]],
  changed:['The summer price change cut sign-ups to the Starter plan by about a tenth, as expected.','Losses fell to 465 from 544. The new onboarding checklist went live on 6 July and first-month retention has risen each month since.','Business plan revenue grew 12% as 31 Team accounts upgraded for single sign-on.'],
  next:['Bring back a 14-day Starter trial in October and measure sign-ups against this quarter.','Extend the onboarding checklist to invited team members, who still drop off fastest.','Publish annual pricing for Business so upgrades are not held up by a quote.']},
 q2:{name:'Q2 2026',span:'April to June 2026',end:11,head:'Sign-ups rose and the Team plan carried revenue',stand:'We finished June with 4,535 paying customers, 275 more than in March. A strong April for sign-ups was offset by the highest losses of the year, most of them accounts that never invited a second person.',
  start:4260,joined:819,lost:544,prev:{active:4260,joined:780,lost:526,rev:1062},months:['Apr','May','Jun'],rev:[[58,192,122],[59,199,127],[61,206,131]],
  cohorts:[['January',83,75,70,67,65],['February',84,76,71,68],['March',84,77,72],['April',86,79],['May',87]],
  changed:['The spring campaign brought 819 sign-ups, 39 more than last quarter, at a lower cost per customer.','We lost 544 customers. Two thirds were single-seat accounts in their first sixty days.','Team plan revenue grew 9% and now makes up just over half of the total.'],
  next:['Ship an onboarding checklist in July aimed at getting a second person invited in week one.','Review Starter pricing: it brings volume but little revenue and most of the losses.','Start reporting retention by first-month cohort, as in Figure 3.']}};
const nf=n=>n.toLocaleString('en-GB'),pc=(a,b)=>{const d=(a-b)/b*100;return [Math.abs(d).toFixed(1)+'%',d>=0]},sum=a=>a.reduce((x,y)=>x+y,0),PLANS=['Starter','Team','Business'];
function line(q){const d=SERIES.slice(q.end-11,q.end+1),lab=SM.slice(q.end-11,q.end+1),W=728,H=250,L=8,R=64,T=22,B=30,mn=3600,mx=5000,x=i=>L+i*(W-L-R)/11,y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
 const p=d.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join('');let g=`<rect x="${x(8.5)}" y="${T}" width="${x(11)-x(8.5)+10}" height="${H-T-B}" fill="var(--soft)"/><text x="${x(8.5)+8}" y="${T+16}" font-size="11" font-weight="700" fill="var(--mute)" letter-spacing=".08em">${q.name.toUpperCase()}</text>`;
 [4000,4500,5000].forEach(v=>g+=`<line x1="${L}" x2="${W-R+10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${W}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--mute)">${nf(v)}</text>`);
 lab.forEach((m,i)=>g+=`<text x="${x(i)}" y="${H-8}" text-anchor="${i?'middle':'start'}" font-size="11" fill="var(--mute)">${m}</text>`);
 g+=`<line x1="${L}" x2="${W-R+10}" y1="${H-B}" y2="${H-B}" stroke="var(--ink)"/><path d="${p}" fill="none" stroke="var(--ac)" stroke-width="2.400" stroke-linejoin="round" stroke-linecap="round"/>`;
 [0,8,11].forEach(i=>g+=`<circle cx="${x(i)}" cy="${y(d[i])}" r="4" fill="var(--panel)" stroke="var(--ac)" stroke-width="2.400"/><text x="${x(i)+(i===11?-2:0)}" y="${y(d[i])-11}" text-anchor="${i?'end':'start'}" font-size="12.500" font-weight="700" fill="var(--ink)">${nf(d[i])}</text>`);
 return `<svg viewBox="0 0 ${W} ${H}" style="display:block;width:100%;height:auto" role="img" aria-label="Active customers by month, from ${nf(d[0])} in ${lab[0]} to ${nf(d[11])} in ${lab[11]}">${g}</svg>`}
function draw(){const q=Q[$('#per').value],end=q.start+q.joined-q.lost,tot=q.rev.map(sum),rev=sum(tot),byPlan=PLANS.map((_,k)=>sum(q.rev.map(m=>m[k]))),mx=Math.max(...tot);
 const F=[['Active customers',nf(end),pc(end,q.prev.active),1],['New sign-ups',nf(q.joined),pc(q.joined,q.prev.joined),1],['Customers lost',nf(q.lost),pc(q.lost,q.prev.lost),0],['Revenue','£'+nf(rev)+'k',pc(rev,q.prev.rev),1]];
 const foot=n=>`<div class="foot"><span>Meridian · Customer report · ${q.name}</span><span>Page ${n} of 2</span></div>`;
 $('#desk').innerHTML=`<article class="sheet"><p class="eye">Quarterly report · ${q.span}</p><h1>${q.head}</h1><p class="stand">${q.stand}</p>
 <div class="figs">${F.map(([n,v,[d,up],good])=>`<div><span>${n}</span><b class="big">${v}</b><small class="${up===!!good?'up':'dn'}">${up?'Up':'Down'} ${d}</small><span>on last quarter</span></div>`).join('')}</div>
 <figure>${line(q)}<figcaption><b>Figure 1.</b> Paying customers at the end of each month. ${nf(q.start)} at the start of the quarter, plus ${nf(q.joined)} who joined, less ${nf(q.lost)} who left, gives ${nf(end)}.</figcaption></figure>
 <div class="cols"><section><h2>What changed</h2><ul>${q.changed.map(t=>`<li>${t}</li>`).join('')}</ul></section><section><h2>What we will do next</h2><ul>${q.next.map(t=>`<li>${t}</li>`).join('')}</ul></section></div>${foot(1)}</article>
 <article class="sheet"><div class="split"><figure><h2>Revenue by plan</h2><div class="bars" role="img" aria-label="Revenue by plan for each month, also given in the table">${q.rev.map((m,i)=>`<div class="r"><span>${q.months[i]}</span><div class="stk" style="width:${tot[i]/mx*100}%">${m.map((v,k)=>`<i class="k${k}" style="flex:${v}">${v}</i>`).join('')}</div><b>£${tot[i]}k</b></div>`).join('')}</div><div class="leg">${PLANS.map((p,k)=>`<span><i class="k${k}"></i>${p}</span>`).join('')}</div><figcaption><b>Figure 2.</b> Monthly revenue in thousands of pounds, split by plan.</figcaption></figure>
 <table><thead><tr><th>£ thousand</th>${q.months.map(m=>`<th>${m}</th>`).join('')}<th>Quarter</th></tr></thead><tbody>${PLANS.map((p,k)=>`<tr><td>${p}</td>${q.rev.map(m=>`<td>${m[k]}</td>`).join('')}<td><b>${byPlan[k]}</b></td></tr>`).join('')}</tbody><tfoot><tr><td>Total</td>${tot.map(t=>`<td>${t}</td>`).join('')}<td>${nf(rev)}</td></tr></tfoot></table></div>
 <figure><h2>Customers still paying, by the month they joined</h2><table class="heat"><thead><tr><th></th>${[1,2,3,4,5,6].map(n=>`<th>Month ${n}</th>`).join('')}</tr></thead><tbody>${q.cohorts.map(([m,...v])=>`<tr><td>${m}</td>${[100,...v].map(p=>`<td><span class="${p>=82?'hi':''}" style="--o:${(.08+(p-62)/38*.92).toFixed(2)}">${p}%</span></td>`).join('')}${Array.from({length:5-v.length},()=>'<td class="e"></td>').join('')}</tr>`).join('')}</tbody></table><figcaption><b>Figure 3.</b> Share of each month’s new customers who were still paying one to five months later. A stronger tint is better.</figcaption></figure>
 <ol class="notes"><li>A paying customer is an account with a successful charge in the month. Trials and paused accounts are left out.</li><li>Revenue is recognised in the month it is charged and excludes VAT and refunds.</li><li>Changes compare this quarter with the one before it, not with the same quarter last year.</li></ol>${foot(2)}</article>`;
 document.title='Customer report, '+q.name}
$('#per').onchange=()=>{draw();$('#desk').scrollTop=0;toast('Showing '+Q[$('#per').value].name)};
$('#print').onclick=()=>window.print();$('#pdf').onclick=()=>toast('Preparing customer-report-'+$('#per').value+'-2026.pdf');
draw();
</script>
</body>
