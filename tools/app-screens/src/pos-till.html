<!--META {"o":13,"t":"Point of sale till","cat":"Mobile apps","tone":"light","added":"2026-11","d":"A tablet till for a bakery counter: big photo tiles by category, an order ticket with quantity steppers, a loyalty discount, VAT worked out, and card or cash payment with change.","how":"The order is a map of product to quantity. Tapping a tile adds one, and the ticket, the badge on each tile and the totals are all drawn from that map. The cash sheet takes the amount handed over and shows the change before it lets you finish the sale.","use":"Shop and café tills, kiosk and self-order screens, market stalls, ticket desks, any touch screen that builds a basket.","p":"Build a point of sale till as one HTML file with no libraries, shown inside a landscape tablet frame (1180 by 820) on wide screens and full width on a real tablet. Touch-sized targets throughout. Top bar: the shop name and till number, a clock, an Online badge, a theme switch and the member of staff. Left: a row of category pills (All, Coffee, Pastries, Bread, Lunch) and a grid of product tiles, each a photograph with the name and price beneath and a count badge once it is in the order; tapping a tile adds one. Right (360px): the order ticket with an order number, an Eat in / Take away switch, lines with minus and plus steppers and line totals, an empty state, a Loyalty 10% switch, then subtotal, discount, VAT included (a sixth of the total) and the total in large type, with Card and Cash buttons. Card shows a short waiting state then a paid receipt. Cash opens a sheet with quick amounts (exact, the next £5, £10, £20) that shows the change due and a Take payment button. After payment show Paid with the change and a New order button that clears the ticket and moves the order number on. Under 760px the ticket sits below the products. Colours are CSS variables with a dark theme."}-->
<style>/*CORE*/
body{display:grid;place-items:center;padding:16px;background:var(--soft);font-size:15px}
.tab{position:relative;width:min(1180px,100%);height:min(820px,calc(100vh - 32px));display:grid;grid-template-rows:auto minmax(0,1fr);border-radius:30px;background:var(--bg);border:1px solid var(--line);box-shadow:0 0 0 10px var(--panel),0 0 0 11px var(--line),0 30px 60px -30px rgba(16,24,40,.45);overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line)}.top h1{font-size:16px}.top small{color:var(--mute);font-size:13px}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 364px;min-height:0}
.shop{display:flex;flex-direction:column;min-height:0}
.cats{display:flex;gap:8px;padding:14px 18px 12px;overflow-x:auto;scrollbar-width:none;flex:none}.cats button{min-height:44px;padding:0 18px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-weight:600;white-space:nowrap}.cats button:hover{background:var(--soft)}.cats button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.grid{flex:1;overflow:auto;padding:2px 18px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start;grid-auto-rows:max-content}
.it{position:relative;display:grid;grid-template-rows:auto auto;text-align:left;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden;transition:transform .1s}.it:hover{border-color:var(--mute)}.it:active{transform:scale(.97)}
.it img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--soft)}.it span{display:flex;justify-content:space-between;gap:8px;padding:9px 11px 10px;font-weight:600;font-size:14px;line-height:1.25}.it span b{font-variant-numeric:tabular-nums;color:var(--mute);font-weight:600}
.it i{position:absolute;top:8px;right:8px;display:grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border-radius:99px;background:var(--ac);color:var(--ac-ink);font-style:normal;font-weight:700;font-size:14px;box-shadow:0 0 0 2px var(--panel)}
.tk{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--line)}
.tkh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}.tkh h2{font-size:16px}.tkh .seg button{min-height:34px}
.lines{flex:1;overflow:auto;list-style:none;margin:0;padding:4px 16px}.lines li{display:grid;grid-template-columns:minmax(0,1fr) auto 62px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.lines small{display:block;color:var(--mute);font-size:12.5px}.lines b.t{text-align:right;font-variant-numeric:tabular-nums}
.stp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px}.stp button{display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:50%;background:none}.stp button:hover{background:var(--soft)}.stp b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.empty{margin:auto;text-align:center;color:var(--mute);padding:30px;display:grid;justify-items:center;gap:8px}.empty .ic{width:30px;height:30px}
.sum{padding:12px 16px 16px;border-top:1px solid var(--line);display:grid;gap:7px}.sum div{display:flex;justify-content:space-between;align-items:center;font-variant-numeric:tabular-nums}.sum .mute{font-size:13.5px}
.sum .tot{font-size:26px;font-weight:700;letter-spacing:-.02em;padding-top:8px;border-top:1px solid var(--line);margin-top:3px}
.sw{all:unset;box-sizing:border-box;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}.sw[aria-checked=true]{background:var(--ok)}.sw[aria-checked=true]::after{transform:translateX(18px)}.sw:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.sum .pay{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}.pay .btn{min-height:56px;font-size:16px;border-radius:var(--r)}
.sheet{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(10,12,20,.45);padding:16px}.sheet>div{width:min(420px,100%);padding:22px;display:grid;gap:14px;text-align:center}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick button{min-height:52px;border-radius:var(--rb);border:1px solid var(--line);background:var(--panel);font-weight:700;font-variant-numeric:tabular-nums}.quick button[aria-pressed=true]{border-color:var(--ac);background:var(--ac-soft);color:var(--ac)}
.chg{font-size:40px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.done{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto}.done .ic{width:32px;height:32px;stroke-width:2.4}
.spin{width:44px;height:44px;margin:0 auto;border-radius:50%;border:4px solid var(--soft);border-top-color:var(--ac);animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(1turn)}}
@media(max-width:1200px){body{padding:0}.tab{width:100%;height:100vh;border-radius:0;border:0;box-shadow:none}}
@media(max-width:760px){body{display:block}.tab{height:auto;min-height:100vh;grid-template-rows:auto auto;overflow:visible}.lay{grid-template-columns:minmax(0,1fr)}.shop,.tk{min-width:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible;padding-inline:12px}.cats{padding-inline:12px}.tk{border-left:0;border-top:1px solid var(--line)}.lines{overflow:visible}.top small,.top .who{display:none}}
</style>
<body>
<div class="tab">
<header class="top"><div><h1>Crumb &amp; Co.</h1><small>Till 2 · Northern Quarter</small></div><span class="sp"></span><b class="num" id="clock" aria-label="Time"></b><span class="badge ok"><i></i>Online</span>
 <button class="btn sq ghost" id="theme" aria-pressed="false" aria-label="Switch to dark theme"><!--IC moon--></button><span class="row who"><span class="av">MO</span><span>Maya</span></span></header>
<div class="lay"><section class="shop" aria-label="Products"><div class="cats" role="group" aria-label="Category" id="cats"></div><div class="grid" id="grid"></div></section>
<aside class="tk" aria-label="Order"><div class="tkh"><h2 id="ono"></h2><span class="sp"></span><div class="seg" role="group" aria-label="Where" id="where"><button aria-pressed="true">Eat in</button><button aria-pressed="false">Take away</button></div></div>
 <ul class="lines" id="lines" aria-live="polite"></ul>
 <div class="sum" id="sum"></div></aside></div>
<div class="sheet" id="sheet" hidden><div class="card" role="dialog" aria-modal="true" aria-labelledby="sh" id="sd" tabindex="-1"></div></div></div>
<script>/*BASEJS*/
/* DATA: [name, price, category, photo]. Photos are CC0, from the atlas photo library. */
const PH='../../assets/photos/',ITEMS=[['Flat white',3.4,'Coffee','drink-blue-coffee-cup'],['Cappuccino',3.6,'Coffee','drink-frothy-coffee-in-a-green-cup'],['Latte',3.6,'Coffee','drink-black-coffee-cup'],['Black coffee',2.8,'Coffee','drink-minimalist-black-coffee'],['Pot of tea',3,'Coffee','cafe-copper-tea-kettles'],['Croissant',2.9,'Pastries','food-alisa-anton-2016-03-12'],['Pain au chocolat',3.2,'Pastries','bakery-mink-mingle-2017'],['Iced doughnut',2.7,'Pastries','bakery-sweet-tooth'],['Seeded tin loaf',4.2,'Bread','bakery-fresh-rustic-bread'],['Country loaf',4.8,'Bread','bakery-loaves-of-bread'],['White bloomer',3.6,'Bread','bakery-fresh-bread-and-butter'],['Farmhouse loaf',3.9,'Bread','food-bread-on-the-table'],['Fresh tagliatelle',7.5,'Lunch','food-handmade-pasta-noodles'],['Gnocchi with pesto',8.2,'Lunch','food-gluten-free-gnocchi']];
const CATS=['All','Coffee','Pastries','Bread','Lunch'],gbp=n=>'£'+n.toFixed(2);
let cat='All',order=new Map([[0,2],[5,1],[9,1]]),loyal=false,no=147,paid=null;
function grid(){$('#cats').innerHTML=CATS.map(c=>`<button aria-pressed="${c===cat}">${c}</button>`).join('');
 $('#grid').innerHTML=ITEMS.map((it,i)=>cat==='All'||it[2]===cat?`<button class="it" data-i="${i}" aria-label="Add ${it[0]}, ${gbp(it[1])}${order.get(i)?', '+order.get(i)+' in the order':''}"><img src="${PH+it[3]}-640.webp" alt="" loading="lazy"><span>${it[0]}<b>${gbp(it[1])}</b></span>${order.get(i)?`<i>${order.get(i)}</i>`:''}</button>`:'').join('')}
const totals=()=>{const sub=[...order].reduce((a,[i,q])=>a+ITEMS[i][1]*q,0),disc=loyal?Math.round(sub*10)/100:0,tot=sub-disc;return {sub,disc,tot,vat:tot/6,n:[...order.values()].reduce((a,b)=>a+b,0)}};
function ticket(){const t=totals();$('#ono').textContent='Order '+String(no).padStart(4,'0');
 $('#lines').innerHTML=[...order].map(([i,q])=>`<li><span><b>${ITEMS[i][0]}</b><small>${gbp(ITEMS[i][1])} each</small></span><span class="stp"><button data-d="-1" data-i="${i}" aria-label="One fewer ${ITEMS[i][0]}"><!--IC minus--></button><b aria-label="Quantity">${q}</b><button data-d="1" data-i="${i}" aria-label="One more ${ITEMS[i][0]}"><!--IC plus--></button></span><b class="t">${gbp(ITEMS[i][1]*q)}</b></li>`).join('')||'<li class="empty" style="display:grid;border:0"><!--IC bag--><span>Nothing here yet.<br>Tap a product to add it.</span></li>';
 $('#sum').innerHTML=`<div><span id="ll">Loyalty card, 10% off</span><button class="sw" role="switch" aria-checked="${loyal}" aria-labelledby="ll" id="loyal"></button></div><div class="mute"><span>Subtotal, ${t.n} item${t.n===1?'':'s'}</span><span>${gbp(t.sub)}</span></div>${loyal?`<div class="mute"><span>Loyalty discount</span><span>−${gbp(t.disc)}</span></div>`:''}<div class="mute"><span>Includes VAT at 20%</span><span>${gbp(t.vat)}</span></div><div class="tot"><span>Total</span><span>${gbp(t.tot)}</span></div><div class="pay"><button class="btn" id="cash" ${t.n?'':'disabled'}>Cash</button><button class="btn pri" id="card" ${t.n?'':'disabled'}><!--IC card-->Card</button></div>`}
const draw=()=>{grid();ticket()};
$('#cats').onclick=e=>{const b=e.target.closest('button');if(b){cat=b.textContent;grid();$$('#cats button').find(x=>x.textContent===cat).focus()}};
$('#grid').onclick=e=>{const b=e.target.closest('.it');if(!b)return;const i=+b.dataset.i;order.set(i,(order.get(i)||0)+1);draw();$(`.it[data-i="${i}"]`).focus()};
$('#lines').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;const i=+b.dataset.i,q=order.get(i)+ +b.dataset.d;q>0?order.set(i,q):order.delete(i);draw();$(`#lines [data-i="${i}"][data-d="${b.dataset.d}"]`)?.focus()};
$('#where').onclick=e=>{const b=e.target.closest('button');if(b)$$('#where button').forEach(x=>x.setAttribute('aria-pressed',x===b))};
/* Payment */
const sheet=$('#sheet'),sd=$('#sd');let given=0;
const show=h=>{sd.innerHTML=h;sheet.hidden=false;(sd.querySelector('[autofocus]')||sd).focus()},hide=()=>{sheet.hidden=true};
function receipt(how,change){const t=totals();show(`<div class="done"><!--IC check--></div><h2 id="sh" style="font-size:22px">Paid ${gbp(t.tot)} by ${how}</h2>${change?`<p class="mute">Change due</p><div class="chg">${gbp(change)}</div>`:'<p class="mute">Approved. Hand over the receipt if they want one.</p>'}<div class="row" style="justify-content:center"><button class="btn" id="rc"><!--IC print-->Print receipt</button><button class="btn pri" id="nw" autofocus>New order</button></div>`)}
function cash(){const t=totals().tot,up=n=>Math.ceil(t/n)*n,opts=[...new Set([t,up(5),up(10),up(20)])];if(!given)given=opts[1]||t;
 show(`<h2 id="sh" style="font-size:20px">Cash payment</h2><p class="mute">Total ${gbp(t)}. How much were you handed?</p><div class="quick" role="group" aria-label="Amount handed over">${opts.map(o=>`<button data-g="${o}" aria-pressed="${o===given}">${o===t?'Exact':gbp(o)}</button>`).join('')}</div><p class="mute">Change due</p><div class="chg" aria-live="polite">${gbp(given-t)}</div><div class="row" style="justify-content:center"><button class="btn" data-x>Cancel</button><button class="btn pri" id="take" autofocus>Take payment</button></div>`)}
$('#sum').onclick=e=>{const id=e.target.closest('button')?.id;if(id==='loyal'){loyal=!loyal;ticket();$('#loyal').focus()}else if(id==='cash'){given=0;cash()}
 else if(id==='card'){show(`<div class="spin" role="img" aria-label="Waiting"></div><h2 id="sh" style="font-size:20px">Present card</h2><p class="mute">Waiting for the customer to tap, ${gbp(totals().tot)}.</p><div><button class="btn" data-x>Cancel</button></div>`);clearTimeout(cash.t);cash.t=setTimeout(()=>{if(!sheet.hidden)receipt('card',0)},1600)}};
sd.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.g){given=+b.dataset.g;cash()}else if(b.id==='take')receipt('cash',given-totals().tot)
 else if(b.id==='rc')toast('Receipt sent to the printer')
 else if(b.id==='nw'){order.clear();loyal=false;no++;hide();draw();toast('Order '+String(no-1).padStart(4,'0')+' closed')}
 else if('x' in b.dataset){clearTimeout(cash.t);hide();$('#card')?.focus()}};
addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheet.hidden&&!$('#nw')){clearTimeout(cash.t);hide()}});
const tick=()=>$('#clock').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});tick();setInterval(tick,20000);
draw();
</script>
</body>
