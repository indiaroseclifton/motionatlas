<!--META {"o":10,"t":"Video call","cat":"Communication","tone":"light","added":"2026-11","d":"A meeting screen with no app chrome: a shared screen with a strip of people, or an even grid, a ring on whoever is speaking, working mic, camera, hand and layout controls, and a chat and people panel.","how":"People are an array with mic, camera and hand flags; the tiles, the people list and the count are drawn from it. A timer picks the next person who is not muted as the speaker. Each control flips a flag and redraws, so muting yourself shows on your tile and in the list at once.","use":"Meeting and webinar products, telehealth and tutoring, live support, any screen built around video tiles.","p":"Build a video call screen as one HTML file with no libraries for a meeting product called Huddle. No sidebar or navigation: the whole window is a dark stage in both themes. Top row: the meeting title, a running timer, a REC badge, then a Speaker / Grid layout switch, a people count and a theme switch. Stage: in Speaker layout a large tile showing a shared screen (draw a simple slide with HTML and CSS) and a column of smaller tiles; in Grid layout six equal tiles. A tile shows the person's initials in a tinted circle (no photos), a name label with a muted-mic icon when muted, a raised-hand badge, and a green ring with small moving level bars while that person speaks. Bottom: a centred control bar with Mic, Camera, Share, Raise hand, Chat and a red Leave button; toggles use aria-pressed and turn red when off. A 320px side panel with Chat and People tabs: chat messages with a field that adds yours, and a people list with mic state and a Mute all button. Leaving shows a short summary with Rejoin. Every few seconds move the speaker to another unmuted person. Under 860px the panel covers the stage and the strip runs sideways. Colours are CSS variables."}-->
<style>/*CORE*/
body{--st:var(--ink);--sf:var(--bg);background:var(--st);color:var(--sf)}html[data-theme=dark] body{--st:var(--bg);--sf:var(--ink)}
.call{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;height:100%;padding:12px 14px 14px}
.hd{grid-column:1/-1;display:flex;align-items:center;gap:10px;min-height:38px}.hd h1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hd .t{font-variant-numeric:tabular-nums;opacity:.7}
.rec{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.06em;background:var(--bad);color:#fff}.rec i{width:7px;height:7px;border-radius:50%;background:#fff;animation:pl 1.6s infinite}@keyframes pl{50%{opacity:.3}}
.gb{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 12px;border:0;border-radius:var(--rb);background:rgba(127,127,127,.24);color:inherit;font-weight:600;font-size:13px}.gb:hover{background:rgba(127,127,127,.38)}.gb.sq{width:36px;padding:0;justify-content:center}
.hd .seg{background:rgba(127,127,127,.24)}.hd .seg button{color:inherit;opacity:.7}.hd .seg button[aria-pressed=true]{background:var(--sf);color:var(--st);opacity:1}
.tiles{min-height:0;min-width:0;display:grid;gap:10px}.tiles.lgr{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(0,1fr)}
.tiles.lsp{grid-template-columns:minmax(0,1fr) 210px}.strip{display:grid;gap:10px;grid-auto-rows:minmax(0,1fr);min-height:0}
.tile{position:relative;display:grid;place-items:center;min-height:0;border-radius:var(--r);background:rgba(127,127,127,.2);overflow:hidden;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .2s}
.tile.on{box-shadow:inset 0 0 0 3px var(--ok)}
.face{display:grid;place-items:center;width:clamp(44px,34%,112px);aspect-ratio:1;border-radius:50%;font-weight:700;font-size:clamp(15px,2.4vw,34px);background:var(--c1);color:var(--c2)}
.p0{--c1:var(--ac-soft);--c2:var(--ac)}.p1{--c1:var(--ok-soft);--c2:var(--ok)}.p2{--c1:var(--warn-soft);--c2:var(--warn)}.p3{--c1:var(--bad-soft);--c2:var(--bad)}.p4{--c1:var(--soft);--c2:var(--mute)}.p5{--c1:var(--panel);--c2:var(--ink)}
.nm{position:absolute;left:8px;bottom:8px;display:inline-flex;align-items:center;gap:6px;max-width:calc(100% - 16px);padding:3px 9px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff;font-size:12.5px;font-weight:600;white-space:nowrap}.nm .ic{width:14px;height:14px;color:#FF8B80}
.nm span{overflow:hidden;text-overflow:ellipsis}.lv{display:inline-flex;align-items:flex-end;gap:2px;height:12px}.lv i{width:3px;border-radius:2px;background:#4ADE9B;animation:lv .7s ease-in-out infinite alternate}.lv i:nth-child(2){animation-delay:.2s}.lv i:nth-child(3){animation-delay:.4s}@keyframes lv{from{height:3px}to{height:12px}}
.hand{position:absolute;right:8px;top:8px;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--warn-soft);color:var(--warn)}
.off{position:absolute;right:8px;bottom:8px;font-size:11.5px;opacity:.7}
.slide{width:100%;height:100%;display:grid;grid-template-rows:auto 1fr;gap:3%;padding:4.5% 5%;background:var(--panel);color:var(--ink);text-align:left}
.slide h2{font-size:clamp(18px,2.5vw,36px);letter-spacing:-.02em;line-height:1.1}.slide p{color:var(--mute);font-size:clamp(12px,1.1vw,16px);margin-top:.4em}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3%;min-height:0}.cols div{display:grid;gap:8px;align-content:start;padding:4% 5%;border-radius:var(--r);background:var(--bg);border:1px solid var(--line);font-size:clamp(11px,1vw,14.5px);min-height:0;overflow:hidden}
.cols h3{font-size:inherit;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}.cols span{display:block;padding:.55em .8em;border-radius:var(--rb);background:var(--panel);border:1px solid var(--line);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cols span.d{border-left:3px solid var(--ok)}.cols span.a{border-left:3px solid var(--ac)}
.ctl{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.cb{display:grid;justify-items:center;gap:3px;min-width:64px;padding:8px 10px 6px;border:0;border-radius:var(--r);background:rgba(127,127,127,.24);color:inherit;font-size:11.5px;font-weight:600}.cb:hover{background:rgba(127,127,127,.38)}
.cb.x{background:var(--bad);color:#fff}.cb.x:hover{filter:brightness(1.1);background:var(--bad)}.cb.h[aria-pressed=true],.cb.c[aria-pressed=true]{background:var(--sf);color:var(--st)}
.cb.leave{background:var(--bad);color:#fff;min-width:84px}.cb.leave:hover{filter:brightness(1.1);background:var(--bad)}
body :focus-visible{outline-color:var(--sf)}
.side{width:320px;display:flex;flex-direction:column;min-height:0;border-radius:var(--r);background:var(--panel);color:var(--ink);border:1px solid var(--line);overflow:hidden}.side :focus-visible{outline-color:var(--ac)}
.side header{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--line)}.side .seg{flex:1}.side .seg button{flex:1}
.sb{flex:1;overflow:auto;padding:12px;display:grid;gap:12px;align-content:start}
.cm{display:grid;grid-template-columns:28px 1fr;gap:2px 9px;font-size:13px}.cm .av{grid-row:1/3;width:28px;height:28px;font-size:10.5px}.cm small{color:var(--mute);font-weight:400;margin-left:6px}.cm.me p{background:var(--ac-soft);padding:6px 9px;border-radius:var(--rb);justify-self:start}
.side form{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}.side form .in{flex:1}
.pl{display:flex;align-items:center;gap:10px}.pl small{display:block;color:var(--mute);font-size:12px}.pl .ic{margin-left:auto;color:var(--mute)}.pl .ic.m{color:var(--bad)}
.left{grid-column:1/-1;grid-row:1/-1;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center}.left h1{font-size:26px}.left p{opacity:.7}.left .gb{background:var(--sf);color:var(--st)}
@media(max-width:860px){.call{padding:10px;gap:10px}.side{position:fixed;inset:10px;width:auto;z-index:5}.tiles.lsp{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 96px}.strip{grid-auto-flow:column;grid-auto-columns:120px;overflow-x:auto;scrollbar-width:none}.tiles.lgr{grid-template-columns:repeat(2,minmax(0,1fr))}.rec,.hd .seg{display:none}.cb{min-width:52px;padding-inline:6px}.cb.s{display:none}}
</style>
<body>
<div class="call" id="call">
<header class="hd"><h1>Weekly product review</h1><span class="t num" id="clock" role="timer" aria-label="Call length">24:18</span><span class="rec"><i></i>REC</span><span class="sp"></span>
 <div class="seg" role="group" aria-label="Layout"><button data-l="sp" aria-pressed="true">Speaker</button><button data-l="gr" aria-pressed="false">Grid</button></div>
 <button class="gb" id="ppl" aria-label="Show people"><!--IC users--><span id="pn" class="num">6</span></button><button class="gb sq" id="theme" aria-pressed="false" aria-label="Switch to dark theme"><!--IC moon--></button></header>
<main class="tiles lsp" id="tiles" aria-label="People in the call"></main>
<aside class="side" id="side" aria-label="Chat and people" hidden></aside>
<footer class="ctl" role="toolbar" aria-label="Call controls" id="ctl"></footer></div>
<script>/*BASEJS*/
/* DATA: mic and cam are on or off; share marks the person presenting. */
const P=[{n:'Amara Khan',me:1,mic:1,cam:1},{n:'Priya Nair',mic:1,cam:1},{n:'Tom Becker',mic:0,cam:1},{n:'Maya Okafor',mic:1,cam:1},{n:'Kenji Watanabe',mic:0,cam:0},{n:'Lena Fischer',mic:1,cam:1,share:1}];
let CHAT=[['Tom Becker','24:02','Slides are in the team folder if anyone wants to follow along.'],['Maya Okafor','24:10','Can we come back to the billing item at the end?'],['Priya Nair','24:15','Yes, I have kept ten minutes for it.']];
let layout='sp',speaker=5,hand=false,panel='',secs=24*60+18,gone=false;
const ini=n=>n.split(' ').map(w=>w[0]).join(''),first=n=>n.split(' ')[0];
const tile=(p,i,main)=>`<div class="tile ${i===speaker&&p.mic?'on':''}" data-i="${i}">${main&&p.share?SLIDE:`<span class="face p${i}">${ini(p.n)}</span>`}<span class="nm">${p.mic?(i===speaker?'<span class="lv" aria-hidden="true"><i></i><i></i><i></i></span>':''):'<!--IC mic-->'}<span>${p.me?'You':p.n}${main&&p.share?' is presenting':''}${p.mic?'':'<span class="sr">, muted</span>'}</span></span>${p.me&&hand?'<span class="hand" role="img" aria-label="Hand raised"><!--IC hand--></span>':''}${!p.cam&&!(main&&p.share)?'<span class="off">Camera off</span>':''}</div>`;
const SLIDE=`<div class="slide"><div><h2>Roadmap, January to March</h2><p>Product review · 12 November 2026</p></div><div class="cols"><div><h3>Now</h3><span class="d">Boards: keyboard moves</span><span class="d">Invoices as PDF</span><span class="a">New onboarding</span></div><div><h3>Next</h3><span class="a">Timeline zoom</span><span>Saved filters</span><span>Mobile inbox</span></div><div><h3>Later</h3><span>Public API, version 2</span><span>Audit log export</span></div></div></div>`;
function tiles(){if(gone)return;const t=$('#tiles');t.className='tiles l'+layout;const pres=P.findIndex(p=>p.share);
 t.innerHTML=layout==='sp'?tile(P[pres],pres,true)+'<div class="strip">'+P.map((p,i)=>i===pres?'':tile(p,i)).join('')+'</div>':P.map((p,i)=>tile(p,i)).join('')}
function draw(){if(gone)return;tiles();const me=P[0];$('#ctl').innerHTML=[['mic',me.mic?'Mute':'Unmute','mic',me.mic?'':'x',!me.mic],['cam',me.cam?'Stop video':'Start video','video',me.cam?'':'x',!me.cam],['share','Share','screen','s',false],['hand',hand?'Lower hand':'Raise hand','hand','h',hand],['chat','Chat','chat','c',panel==='Chat']].map(([id,l,ic,c,on])=>`<button class="cb ${c}" data-a="${id}" aria-pressed="${on}">${ICON[ic]}${l}</button>`).join('')+'<button class="cb leave" data-a="leave"><!--IC phone-->Leave</button>';
 $('#pn').textContent=P.length;side()}
const ICON={mic:`<!--IC mic-->`,video:`<!--IC video-->`,screen:`<!--IC screen-->`,hand:`<!--IC hand-->`,chat:`<!--IC chat-->`};
function side(){const s=$('#side');s.hidden=!panel;if(!panel)return;
 s.innerHTML=`<header><div class="seg" role="tablist" aria-label="Panel">${['Chat','People'].map(x=>`<button role="tab" aria-selected="${x===panel}" data-p="${x}">${x}${x==='People'?' ('+P.length+')':''}</button>`).join('')}</div><button class="btn sq ghost" data-p="" aria-label="Close panel"><!--IC x--></button></header>`+(panel==='Chat'?`<div class="sb" id="sb" role="log" aria-label="Chat">${CHAT.map(([n,t,x])=>`<div class="cm ${n==='You'?'me':''}"><span class="av">${n==='You'?'AK':ini(n)}</span><b>${n}<small>${t}</small></b><p>${esc(x)}</p></div>`).join('')}</div><form id="cf"><label class="sr" for="ci">Message everyone</label><input class="in" id="ci" placeholder="Message everyone" autocomplete="off"><button class="btn pri sq" aria-label="Send"><!--IC send--></button></form>`:`<div class="sb">${P.map((p,i)=>`<div class="pl"><span class="av">${ini(p.n)}</span><span><b>${p.n}${p.me?' (you)':''}</b><small>${p.share?'Presenting':i===0?'Host':p.cam?'In the call':'Camera off'}</small></span><svg class="ic ${p.mic?'':'m'}" viewBox="0 0 24 24" role="img" aria-label="${p.mic?'Mic on':'Muted'}"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.500 6.500 0 0 0 13 0M12 17.500V21${p.mic?'':'M4 4l16 16'}"/></svg></div>`).join('')}<button class="btn" id="mall">Mute everyone else</button></div>`);
 const b=$('#sb');if(b)b.scrollTop=b.scrollHeight}
const clock=()=>String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');
$('#ctl').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,me=P[0];
 if(a==='mic'){me.mic=1-me.mic;toast(me.mic?'Your microphone is on':'You are muted')}else if(a==='cam'){me.cam=1-me.cam;toast(me.cam?'Camera on':'Camera off')}
 else if(a==='hand'){hand=!hand;toast(hand?'Hand raised':'Hand lowered')}else if(a==='chat')panel=panel==='Chat'?'':'Chat';
 else if(a==='share'){toast('Lena is presenting. Ask her to stop before you share.');return}
 else if(a==='leave'){gone=true;const n=clock();$('#call').innerHTML=`<div class="left"><h1>You left the call</h1><p>Weekly product review · ${n} · 6 people</p><button class="gb" id="rejoin">Rejoin</button></div>`;$('#rejoin').focus();$('#rejoin').onclick=()=>location.reload();return}
 draw();$(`[data-a="${a}"]`)?.focus()};
$$('.hd .seg button').forEach(b=>b.onclick=()=>{layout=b.dataset.l;$$('.hd .seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});
$('#ppl').onclick=()=>{panel=panel==='People'?'':'People';draw()};
$('#side').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b){panel=b.dataset.p;draw();panel?$(`#side [data-p="${panel}"]`).focus():$('#ppl').focus()}else if(e.target.id==='mall'){P.forEach(p=>{if(!p.me)p.mic=0});draw();toast('Everyone else is muted')}});
$('#side').addEventListener('submit',e=>{e.preventDefault();const v=$('#ci').value.trim();if(!v)return;CHAT.push(['You',clock(),v]);side();$('#ci').focus()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&panel){panel='';draw();$('#ppl').focus()}});
/* The speaker moves to another unmuted person every few seconds; the clock counts real seconds. */
setInterval(()=>{if(gone)return;secs++;$('#clock').textContent=clock();if(secs%4===0){const live=P.map((p,i)=>p.mic?i:-1).filter(i=>i>=0&&i!==speaker);if(live.length){speaker=live[Math.floor(Math.random()*live.length)];$$('.tile').forEach(t=>{const i=+t.dataset.i,on=i===speaker&&P[i].mic;if(t.classList.contains('on')!==on)tiles()})}}},1000);
draw();
</script>
</body>
