<!--META {"o":29,"t":"Fitness tracker app","cat":"Mobile apps","tone":"light","d":"A phone-sized fitness app with three tabs: activity rings that fill as you log, a water counter and weekly steps; workouts with a running timer you can pause; and progress with a chart and personal bests.","how":"The rings are SVG circles whose dash length is the share of each goal, with a transition so they sweep when a number changes. The workout timer counts real seconds and fills a ring; finishing a workout adds its minutes and calories to today, so the first tab changes too.","use":"Health and fitness apps, habit trackers, wellbeing and step challenges, any goal-progress screen on a phone.","p":"Build a mobile fitness tracker as one HTML file with no libraries, shown inside a phone frame on wide screens and full width on phones. Bottom tab bar with Today, Workouts and Progress (role=tablist, arrow keys). Today: the date, three concentric SVG activity rings (move calories, exercise minutes, stand hours) with a legend of value against goal, a weekly steps bar chart with today highlighted, and a water tracker of eight glasses you tap to fill. Workouts: a list of four workouts with duration and intensity; choosing one opens a timer view with a large mm:ss readout inside a progress ring, Pause or Resume, and Finish, which adds the minutes and calories to today's totals and returns to the list with a confirmation. Progress: a Week / Month switch over a line of active minutes drawn as an SVG path, and a list of personal bests. Rings animate with a stroke-dasharray transition. Colours are CSS variables with a dark theme."}-->
<style>/*BASE*/
body{display:grid;place-items:center;padding:16px}
.ph{position:relative;width:min(390px,100%);height:min(800px,calc(100vh - 32px));border-radius:36px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden}
.scr{flex:1;overflow:auto;padding:22px 18px}
.tb{display:flex;border-top:1px solid var(--line);padding:6px 6px 10px}.tb button{flex:1;border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--mute);border-radius:10px}.tb button span{font-size:17px;line-height:1.1}.tb button[aria-selected=true]{color:var(--ink)}
.rings{display:flex;align-items:center;gap:18px;margin:18px 0}.rings svg{flex:none}.rings circle{transition:stroke-dasharray .8s cubic-bezier(.2,.8,.2,1)}
.leg{list-style:none;margin:0;padding:0;display:grid;gap:10px;flex:1}.leg li{display:grid;grid-template-columns:10px 1fr;gap:2px 8px;align-items:center;font-size:13px}.leg i{width:10px;height:10px;border-radius:50%}.leg b{grid-column:2;font-size:17px;letter-spacing:-.01em}
.blk{background:var(--soft);border-radius:18px;padding:14px;margin-top:12px}.blk h2{margin-bottom:10px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:92px}.bars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%;font-size:11px;color:var(--mute)}.bars i{width:100%;flex:none;border-radius:6px;background:var(--line)}.bars .on i{background:var(--ac)}.bars .on{color:var(--ink);font-weight:700}
.h2o{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.h2o button{aspect-ratio:.72;border:1.5px solid #3B82F6;border-radius:4px 4px 9px 9px;background:none;padding:0;position:relative;overflow:hidden}.h2o button::after{content:"";position:absolute;inset:100% 0 0;background:#3B82F6;transition:inset .3s}.h2o button[aria-pressed=true]::after{inset:22% 0 0}
.wo{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}.wo button{width:100%;display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:12px}.wo button:hover{background:var(--soft)}.wo .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:20px;background:var(--c);color:#fff}.wo small{display:block;color:var(--mute);font-size:12px}
.run{display:grid;justify-items:center;gap:16px;text-align:center;padding-top:8px}.run .time{font-size:52px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}.run circle{transition:stroke-dasharray 1s linear}
.run .btn{min-height:46px;min-width:120px;border-radius:99px}
.pb{list-style:none;margin:0;padding:0}.pb li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.pb li:last-child{border:0}.pb b{margin-left:auto}
</style>
<body>
<div class="ph"><main class="scr" id="scr" role="tabpanel" tabindex="-1"></main><nav class="tb" role="tablist" aria-label="Sections" id="tb"></nav></div>
<script>/*BASEJS*/
/* DATA */
const TABS=[['Today','◎'],['Workouts','▶'],['Progress','↗']];
const GOAL={move:520,ex:30,stand:12},RING=[['move','Move','#E4572E','kcal'],['ex','Exercise','#12A150','min'],['stand','Stand','#3B82F6','hrs']];
const day={move:318,ex:14,stand:7,water:3},STEPS=[['M',6200],['T',9100],['W',7400],['T',11200],['F',4850]],DAYS=['M','T','W','T','F','S','S'];
const WORKOUTS=[['Morning run','🏃',25,'Moderate',260,'#E4572E'],['Strength, upper body','🏋',30,'Hard',240,'#7C3AED'],['Yoga flow','🧘',20,'Easy',90,'#12A150'],['Bike intervals','🚴',15,'Hard',180,'#2563EB']];
const TREND={Week:[22,35,18,41,14,0,0],Month:[26,31,24,38,29,34,22,41,36,28,33,45]},BEST=[['Fastest 5 km','24:18'],['Longest run','14.2 km'],['Most steps in a day','18,430'],['Longest streak','21 days']];
let tab=0,range='Week',run=null;
$('#tb').innerHTML=TABS.map(([n,i],k)=>`<button role="tab" id="t${k}" aria-selected="${!k}" tabindex="${k?-1:0}"><span aria-hidden="true">${i}</span>${n}</button>`).join('');
const tabs=$$('#tb button');
function go(k,focus){tab=k;tabs.forEach((b,i)=>{b.setAttribute('aria-selected',i===k);b.tabIndex=i===k?0:-1});$('#scr').setAttribute('aria-labelledby','t'+k);draw();$('#scr').scrollTop=0;if(focus)tabs[k].focus()}
tabs.forEach((b,i)=>b.onclick=()=>go(i));
$('#tb').onkeydown=e=>{const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(d){e.preventDefault();go((tab+d+TABS.length)%TABS.length,true)}};
const ringSvg=()=>`<svg width="150" height="150" viewBox="0 0 150 150" role="img" aria-label="Activity rings: ${RING.map(r=>r[1]+' '+Math.round(day[r[0]]/GOAL[r[0]]*100)+'%').join(', ')}">${RING.map((r,i)=>{const rad=64-i*17,c=2*Math.PI*rad;return `<circle cx="75" cy="75" r="${rad}" fill="none" stroke="${r[2]}" stroke-width="13" opacity=".18"/><circle class="rg" data-c="${c}" data-p="${Math.min(1,day[r[0]]/GOAL[r[0]])}" cx="75" cy="75" r="${rad}" fill="none" stroke="${r[2]}" stroke-width="13" stroke-linecap="round" stroke-dasharray="0 ${c}" transform="rotate(-90 75 75)"/>`}).join('')}</svg>`;
const sweep=()=>requestAnimationFrame(()=>requestAnimationFrame(()=>$$('.rg').forEach(c=>c.setAttribute('stroke-dasharray',c.dataset.c*c.dataset.p+' '+c.dataset.c))));
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function draw(){const s=$('#scr');
 if(tab===0){const steps=[...STEPS,['S',null],['S',null]],mx=12000;
  s.innerHTML=`<p class="mute">Friday 13 November</p><h1 style="font-size:26px">Today</h1><div class="rings">${ringSvg()}<ul class="leg">${RING.map(r=>`<li><i style="background:${r[2]}"></i>${r[1]}<b class="num">${day[r[0]]}<span class="mute" style="font-size:13px;font-weight:500"> / ${GOAL[r[0]]} ${r[3]}</span></b></li>`).join('')}</ul></div>
  <section class="blk"><div class="row"><h2>Steps this week</h2><b class="sp num">${STEPS[4][1].toLocaleString('en-GB')}</b></div><div class="bars" role="img" aria-label="Steps: ${STEPS.map((d,i)=>['Monday','Tuesday','Wednesday','Thursday','Friday'][i]+' '+d[1]).join(', ')}">${steps.map((d,i)=>`<div class="${i===4?'on':''}"><i style="height:${d[1]?Math.max(8,d[1]/mx*100):4}%"></i>${d[0]}</div>`).join('')}</div></section>
  <section class="blk"><div class="row"><h2>Water</h2><b class="sp num" id="wn" aria-live="polite"></b></div><div class="h2o" id="h2o">${Array.from({length:8},(_,i)=>`<button aria-pressed="${i<day.water}" aria-label="Glass ${i+1}"></button>`).join('')}</div></section>`;
  const wn=()=>$('#wn').textContent=day.water+' of 8 glasses';wn();
  $('#h2o').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=$$('#h2o button').indexOf(b);day.water=i+1===day.water?i:i+1;$$('#h2o button').forEach((x,k)=>x.setAttribute('aria-pressed',k<day.water));wn()};
  sweep()}
 else if(tab===1&&!run){s.innerHTML=`<h1 style="font-size:26px">Workouts</h1><p class="mute">Pick one to start the timer.</p><ul class="wo">${WORKOUTS.map((w,i)=>`<li><button data-w="${i}"><span class="ico" style="--c:${w[5]}" aria-hidden="true">${w[1]}</span><span><b>${w[0]}</b><small>${w[2]} min · ${w[3]} · about ${w[4]} kcal</small></span><span aria-hidden="true">›</span></button></li>`).join('')}</ul>`;
  $('.wo').onclick=e=>{const b=e.target.closest('button');if(b){run={w:WORKOUTS[b.dataset.w],t:0,on:true};draw();$('#pause').focus()}}}
 else if(tab===1){const w=run.w,c=2*Math.PI*92,total=w[2]*60;
  s.innerHTML=`<div class="run"><div><p class="mute">Now</p><h1>${w[0]}</h1></div><div style="position:relative"><svg width="220" height="220" viewBox="0 0 220 220" aria-hidden="true"><circle cx="110" cy="110" r="92" fill="none" stroke="var(--soft)" stroke-width="12"/><circle id="arc" cx="110" cy="110" r="92" fill="none" stroke="${w[5]}" stroke-width="12" stroke-linecap="round" transform="rotate(-90 110 110)" stroke-dasharray="${c*run.t/total} ${c}"/></svg><div style="position:absolute;inset:0;display:grid;place-content:center"><div class="time" id="time" role="timer">${mmss(run.t)}</div><span class="mute">of ${w[2]}:00</span></div></div><p class="mute num" id="burn"></p><div class="row"><button class="btn" id="pause" aria-pressed="${!run.on}">${run.on?'Pause':'Resume'}</button><button class="btn pri" id="done">Finish</button></div></div>`;
  const burn=()=>$('#burn').textContent=Math.round(w[4]*run.t/total)+' kcal burned so far';burn();
  $('#pause').onclick=()=>{run.on=!run.on;draw();$('#pause').focus()};
  $('#done').onclick=()=>{const min=Math.max(1,Math.round(run.t/60));day.ex+=min;day.move+=Math.round(w[4]*run.t/total);const n=w[0];run=null;go(0);toast(n+' saved: '+min+' min added to today')}}
 else{const d=TREND[range],W=318,H=120,mx=Math.max(...d)*1.15,x=i=>8+i*(W-16)/(d.length-1),y=v=>H-8-v/mx*(H-16),p=d.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join('');
  s.innerHTML=`<h1 style="font-size:26px">Progress</h1><div class="row" style="margin:12px 0"><div class="seg" role="group" aria-label="Range">${['Week','Month'].map(r=>`<button aria-pressed="${r===range}">${r}</button>`).join('')}</div><span class="sp mute">Active minutes</span></div>
  <section class="blk"><svg viewBox="0 0 ${W} ${H}" style="display:block;width:100%" role="img" aria-label="Active minutes per ${range==='Week'?'day':'few days'}: ${d.join(', ')}"><path d="${p}L${x(d.length-1)} ${H}L${x(0)} ${H}Z" fill="#12A150" opacity=".14"/><path d="${p}" fill="none" stroke="#12A150" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"/>${d.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(--panel)" stroke="#12A150" stroke-width="2"/>`).join('')}</svg><div class="row" style="margin-top:8px"><span class="mute">Average</span><b class="sp num">${Math.round(d.reduce((a,b)=>a+b)/d.length)} min a day</b></div></section>
  <section class="blk"><h2>Personal bests</h2><ul class="pb">${BEST.map(b=>`<li>${b[0]}<b class="num">${b[1]}</b></li>`).join('')}</ul></section>`;
  $$('.seg button').forEach(b=>b.onclick=()=>{range=b.textContent;draw();$$('.seg button').find(x=>x.textContent===range).focus()})}
}
/* One timer for the whole app: it only counts while a workout is running. */
setInterval(()=>{if(!run||!run.on)return;const total=run.w[2]*60;run.t=Math.min(total,run.t+1);if(tab===1){const c=2*Math.PI*92;$('#time').textContent=mmss(run.t);$('#arc').setAttribute('stroke-dasharray',c*run.t/total+' '+c);$('#burn').textContent=Math.round(run.w[4]*run.t/total)+' kcal burned so far'}if(run.t>=total)run.on=false},1000);
go(0);
</script>
</body>
