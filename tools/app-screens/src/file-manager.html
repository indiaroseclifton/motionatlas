<!--META {"o":27,"t":"File manager","cat":"Tables & lists","tone":"light","d":"Folders and files in a grid or a list, with breadcrumbs, multi-select, a details panel and a storage meter.","how":"The tree is a nested object and the current folder is a path array, so breadcrumbs and Back are the same data. One render draws either the grid or the list from the folder's children. Selection is a set of names; one selected item fills the details panel.","use":"Cloud storage, document management, media libraries, asset pickers, admin tools.","p":"Build a file manager screen as one HTML file with no libraries, inside an app shell. Toolbar: breadcrumbs from the current path, a Grid / List switch, sort by name, date or size, and New folder and Upload buttons. Content shows the current folder's children: folders first, then files with a type icon tile (colour by kind: image, video, document, sheet, archive), name, size and modified date. Double-click or Enter opens a folder; single click selects (Ctrl or Shift for multiple) and shows a details panel on the right with a preview tile, kind, size, modified, owner and Share, Download and Delete buttons; a selection bar shows the count. Delete removes selected items with an undo toast. A storage card shows a segmented bar by kind and how much is used. Keep the tree as nested objects and render from state {path, view, sort, selected}. Details panel drops below on small screens."}-->
<style>/*BASE*/
.fm{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:600}.crumbs button{all:unset;cursor:pointer;color:var(--mute)}.crumbs button:hover{color:var(--ink)}.crumbs button:focus-visible{outline:2px solid var(--ac);outline-offset:3px;border-radius:4px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:14px}
.it{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:8px;padding:10px;border-radius:12px;border:1px solid transparent}.it:hover{background:var(--soft)}.it[aria-selected=true]{background:var(--ac-soft);border-color:var(--ac)}.it:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.th{aspect-ratio:4/3;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:.06em;color:#fff;background:var(--k)}
.it b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it small{color:var(--mute);font-size:12px}
.l .it{grid-template-columns:44px minmax(0,1fr) 90px 110px;align-items:center;gap:12px;padding:8px 12px;border-radius:0;border:0;border-bottom:1px solid var(--line);width:100%}.l .th{aspect-ratio:1;width:36px;font-size:9px}.l{padding:0;display:block}
.det .th{aspect-ratio:16/10;margin-bottom:12px;font-size:16px}.det dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0;font-size:13px}.det dt{color:var(--mute)}.det dd{margin:0;text-align:right}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft);margin:10px 0}.bar i{display:block}
@media(max-width:900px){.fm{grid-template-columns:1fr}.l .it{grid-template-columns:44px minmax(0,1fr) 80px}.l .it small:last-child{display:none}}
</style>
<body>
<!--SHELL Files|Search files-->
<div class="head"><nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav><span class="sp"></span><div class="seg" role="group" aria-label="View"><button data-v="g" aria-pressed="true">Grid</button><button data-v="l" aria-pressed="false">List</button></div><label class="sr" for="sort">Sort by</label><select class="in" id="sort"><option value="name">Name</option><option value="date">Modified</option><option value="size">Size</option></select><button class="btn" id="nf">New folder</button><button class="btn pri" id="upl">Upload</button></div>
<div class="fm"><section class="card" style="overflow:hidden"><div id="list" role="listbox" aria-label="Files" aria-multiselectable="true"></div><div class="pad mute" id="selbar" style="border-top:1px solid var(--line);font-size:13px" role="status"></div></section>
<aside><div class="card pad det" id="det"></div><div class="card pad" style="margin-top:12px"><h3>Storage</h3><div class="bar" role="img" aria-label="62 of 100 gigabytes used"><i style="width:28%;background:#2563EB"></i><i style="width:19%;background:#E4572E"></i><i style="width:11%;background:#12805C"></i><i style="width:4%;background:#F2B705"></i></div><p class="mute" style="font-size:13px">62 GB of 100 GB used</p></div></aside></div>
<!--/SHELL-->
<script>/*BASEJS*/
const K={folder:['#18181B','DIR'],image:['#2563EB','IMG'],video:['#E4572E','VID'],doc:['#12805C','DOC'],sheet:['#0F9D58','XLS'],zip:['#8A6D3B','ZIP']};
const F=(n,k,s,d)=>({n,k,s,d}),D=(n,c)=>({n,k:'folder',c,d:Math.max(...c.map(x=>x.d))});
const TREE=D('All files',[D('Brand',[F('logo-primary.svg','image',.02,9),F('logo-mono.svg','image',.02,9),F('guidelines.pdf','doc',4.1,6),D('Photography',[F('hero-01.jpg','image',6.2,5),F('hero-02.jpg','image',5.8,5),F('team.jpg','image',3.9,4)])]),D('Launch film',[F('brand-film-v3.mp4','video',860,10),F('cutdown-15s.mp4','video',42,10),F('subtitles.zip','zip',.3,8)]),D('Finance',[F('budget-2026.xlsx','sheet',1.2,3),F('forecast.xlsx','sheet',.9,2)]),F('Pricing page copy.docx','doc',.4,11),F('Roadmap Q1.pdf','doc',2.3,7),F('homepage-wire.png','image',1.7,10),F('export.zip','zip',128,1)]);
const st={path:[],view:'g',sort:'name',sel:new Set()},size=s=>s==null?'':s>=1000?(s/1000).toFixed(1)+' GB':s>=1?s.toFixed(1)+' MB':Math.round(s*1000)+' KB',date=d=>d+' Nov 2026';
const cur=()=>st.path.reduce((f,n)=>f.c.find(x=>x.n===n),TREE),total=f=>f.k==='folder'?f.c.reduce((a,x)=>a+total(x),0):f.s;
function render(focus){const f=cur(),items=[...f.c].sort((a,b)=>(b.k==='folder')-(a.k==='folder')||(st.sort==='name'?a.n.localeCompare(b.n):st.sort==='date'?b.d-a.d:total(b)-total(a)));
 $('#crumbs').innerHTML=['All files',...st.path].map((n,i,a)=>i<a.length-1?`<button data-i="${i}">${esc(n)}</button><span class="mute">/</span>`:`<span aria-current="page">${esc(n)}</span>`).join('');
 const L=$('#list');L.className=st.view==='g'?'g':'l';L.innerHTML=items.map(x=>`<button class="it" role="option" aria-selected="${st.sel.has(x.n)}" data-n="${esc(x.n)}"><span class="th" style="--k:${K[x.k][0]}">${K[x.k][1]}</span><b>${esc(x.n)}</b><small>${x.k==='folder'?x.c.length+' items':size(x.s)}</small>${st.view==='l'?`<small>${date(x.d)}</small>`:''}</button>`).join('')||'<p class="pad mute">This folder is empty.</p>';
 $('#selbar').textContent=st.sel.size?st.sel.size+' selected':items.length+' items · '+size(total(f));
 const one=st.sel.size===1?f.c.find(x=>st.sel.has(x.n)):null;$('#det').innerHTML=one?`<div class="th" style="--k:${K[one.k][0]}">${K[one.k][1]}</div><h2 style="word-break:break-word">${esc(one.n)}</h2><dl><dt>Kind</dt><dd>${one.k==='folder'?'Folder':one.k[0].toUpperCase()+one.k.slice(1)}</dd><dt>Size</dt><dd>${size(total(one))}</dd><dt>Modified</dt><dd>${date(one.d)}</dd><dt>Owner</dt><dd>Amara Khan</dd></dl><div class="row" style="flex-wrap:wrap"><button class="btn pri" data-a="Link copied">Share</button><button class="btn" data-a="Download started">Download</button><button class="btn" data-a="del">Delete</button></div>`:`<p class="mute">${st.sel.size>1?st.sel.size+' items selected. <button class="btn" data-a="del" style="margin-top:10px">Delete all</button>':'Select a file to see its details. Double-click a folder to open it.'}</p>`;
 if(focus)$(`.it[data-n="${CSS.escape(focus)}"]`)?.focus()}
function open(n){const x=cur().c.find(y=>y.n===n);if(x&&x.k==='folder'){st.path.push(n);st.sel.clear();render()}}
$('#list').addEventListener('click',e=>{const b=e.target.closest('.it');if(!b)return;const n=b.dataset.n;if(e.ctrlKey||e.metaKey||e.shiftKey){st.sel.has(n)?st.sel.delete(n):st.sel.add(n)}else{st.sel=new Set([n])}render(n)});
$('#list').addEventListener('dblclick',e=>{const b=e.target.closest('.it');if(b)open(b.dataset.n)});
$('#list').addEventListener('keydown',e=>{const b=e.target.closest('.it');if(!b)return;if(e.key==='Enter'){e.preventDefault();open(b.dataset.n)}else{const its=$$('.it'),i=its.indexOf(b),d={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key];if(d&&its[i+d]){e.preventDefault();its[i+d].focus()}}});
$('#crumbs').onclick=e=>{const b=e.target.closest('button');if(b){st.path=st.path.slice(0,+b.dataset.i);st.sel.clear();render()}};
$('#det').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;if(b.dataset.a==='del'){const f=cur(),n=st.sel.size;f.c=f.c.filter(x=>!st.sel.has(x.n));st.sel.clear();render();toast(n+' item'+(n>1?'s':'')+' deleted')}else toast(b.dataset.a)};
$$('.seg button').forEach(b=>b.onclick=()=>{st.view=b.dataset.v;$$('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});$('#sort').onchange=e=>{st.sort=e.target.value;render()};
$('#nf').onclick=()=>{let n='New folder',i=2;while(cur().c.find(x=>x.n===n))n='New folder '+i++;cur().c.push({n,k:'folder',c:[],d:11});st.sel=new Set([n]);render(n)};$('#upl').onclick=()=>toast('Upload dialog would open here');
render();
</script>
</body>
