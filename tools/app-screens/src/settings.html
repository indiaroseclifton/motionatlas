<!--META {"o":28,"t":"Settings","cat":"Account & admin","tone":"light","d":"An account settings area with tabbed sections: profile form with validation, notification switches, team members with roles, and a danger zone that asks you to type to confirm.","how":"The sections are real tabs with arrow-key movement. The form tracks whether anything changed and only then shows a sticky Save bar. Switches are buttons with role=switch. Deleting needs the workspace name typed exactly before the button enables.","use":"Account pages, workspace admin, preferences, team management.","p":"Build a settings screen as one HTML file with no libraries, under a slim bar with the logo, a Back to workspace link, a theme switch and the avatar; the settings sit in a centred column up to 960px wide. A vertical tablist (Profile, Notifications, Team, Danger zone) on the left of the content, becoming a horizontal scroller on small screens, with Left/Right/Up/Down arrow keys moving between tabs. Profile: avatar with Change button, name, email (validated on blur with an inline error linked by aria-describedby), role select, bio textarea with a character count, and time zone. Notifications: a table of events against Email and Push, each cell a role=switch button. Team: a list of members with avatar, email, a role select and Remove, plus an Invite by email row. Danger zone: a bordered red card where the Delete workspace button enables only after typing the workspace name. Show a sticky bar with Discard and Save changes only when something has changed; saving shows a status message."}-->
<style>/*BASE*/
.set{display:grid;grid-template-columns:200px minmax(0,1fr);gap:22px;max-width:920px}
[role=tablist]{display:flex;flex-direction:column;gap:2px}[role=tab]{text-align:left;border:0;background:none;min-height:36px;padding:0 12px;border-radius:9px;color:var(--mute);font-weight:500}[role=tab][aria-selected=true]{background:var(--ac-soft);color:var(--ac);font-weight:600}
.f{display:grid;gap:6px;margin-bottom:16px}.f label,.lab{font-weight:600;font-size:13px}.f .in,.f textarea,.f select{width:100%}.f textarea{padding:9px 11px;min-height:84px;resize:vertical;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.f .err{color:var(--bad);font-size:12.5px}.in[aria-invalid=true]{border-color:var(--bad)}.hint{color:var(--mute);font-size:12.5px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px}
.sw{all:unset;box-sizing:border-box;width:40px;height:24px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;display:inline-block}.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}.sw[aria-checked=true]{background:var(--ac)}.sw[aria-checked=true]::after{transform:translateX(16px)}.sw:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.mem{list-style:none;margin:0;padding:0}.mem li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.mem small{display:block;color:var(--mute)}
.danger{border:1px solid var(--bad);border-radius:var(--r);padding:16px;display:grid;gap:10px}.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.save{position:sticky;bottom:0;margin-top:18px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r);background:var(--ink);color:var(--bg)}.save .btn{border-color:transparent}
@media(max-width:760px){.set{grid-template-columns:1fr}[role=tablist]{flex-direction:row;overflow:auto}[role=tab]{white-space:nowrap}}
</style>
<body>
<!--SHELL {"kind": "bare", "brand": "Northwind", "icon": "bolt", "back": "Back to workspace", "wrap": true}-->
<div class="head"><div><h1>Settings</h1><p>Manage your profile, alerts and workspace.</p></div></div>
<div class="set"><div role="tablist" aria-label="Settings sections" aria-orientation="vertical" id="tabs"></div>
<div><section role="tabpanel" id="p0" aria-labelledby="t0" class="card pad"><div class="row" style="margin-bottom:18px"><span class="av" style="width:56px;height:56px;font-size:18px">AK</span><div><b>Profile photo</b><div class="hint">PNG or JPG, up to 2 MB</div></div><span class="sp"></span><button class="btn">Change</button></div>
 <form id="prof" novalidate><div class="g2"><div class="f"><label for="nm">Full name</label><input class="in" id="nm" value="Amara Khan" autocomplete="name"></div><div class="f"><label for="em">Email</label><input class="in" id="em" type="email" value="amara@northwind.app" autocomplete="email" aria-describedby="eme"><span class="err" id="eme" role="alert"></span></div>
 <div class="f"><label for="rl">Role</label><select class="in" id="rl"><option>Product designer</option><option>Engineer</option><option>Founder</option><option>Marketing</option></select></div><div class="f"><label for="tz">Time zone</label><select class="in" id="tz"><option>London (GMT)</option><option>Berlin (CET)</option><option>New York (EST)</option><option>Singapore (SGT)</option></select></div></div>
 <div class="f"><label for="bio">Bio</label><textarea id="bio" maxlength="160" aria-describedby="bc">Designs the things people click on. Likes tidy tables.</textarea><span class="hint" id="bc"></span></div></form></section>
<section role="tabpanel" id="p1" aria-labelledby="t1" class="card" hidden><div class="scroll"><table><thead><tr><th>Tell me when</th><th>Email</th><th>Push</th></tr></thead><tbody id="noti"></tbody></table></div></section>
<section role="tabpanel" id="p2" aria-labelledby="t2" class="card pad" hidden><form class="row" id="inv" style="margin-bottom:8px"><label class="sr" for="ie">Email to invite</label><input class="in" id="ie" type="email" placeholder="name@company.com" style="flex:1" required><button class="btn pri">Send invite</button></form><ul class="mem" id="mem"></ul></section>
<section role="tabpanel" id="p3" aria-labelledby="t3" hidden><div class="danger"><h2>Delete this workspace</h2><p class="mute">This removes every project, file and member for good. It cannot be undone.</p><div class="f" style="margin:0"><label for="cf">Type <b>northwind</b> to confirm</label><input class="in" id="cf" autocomplete="off" style="max-width:260px"></div><div><button class="btn bad" id="del" disabled>Delete workspace</button></div></div></section>
<div class="save" id="save" hidden><span role="status">You have unsaved changes</span><span class="sp"></span><button class="btn ghost" id="disc" style="color:inherit">Discard</button><button class="btn pri" id="sv">Save changes</button></div></div></div>
<!--/SHELL-->
<script>/*BASEJS*/
const TABS=['Profile','Notifications','Team','Danger zone'];
$('#tabs').innerHTML=TABS.map((t,i)=>`<button role="tab" id="t${i}" aria-controls="p${i}" aria-selected="${!i}" tabindex="${i?-1:0}">${t}</button>`).join('');
const tabs=$$('[role=tab]');function pick(i,f){tabs.forEach((t,k)=>{t.setAttribute('aria-selected',k===i);t.tabIndex=k===i?0:-1;$('#p'+k).hidden=k!==i});if(f)tabs[i].focus()}
tabs.forEach((t,i)=>{t.onclick=()=>pick(i);t.onkeydown=e=>{const d={ArrowDown:1,ArrowRight:1,ArrowUp:-1,ArrowLeft:-1}[e.key];if(d){e.preventDefault();pick((i+d+4)%4,true)}}});
const dirty=()=>{$('#save').hidden=false};let snap=null;
const fields=$$('#prof input,#prof select,#prof textarea');const take=()=>fields.map(f=>f.value);snap=take();
fields.forEach(f=>f.addEventListener('input',()=>{$('#save').hidden=take().join('|')===snap.join('|')&&!swDirty}));
const bio=$('#bio'),bc=()=>$('#bc').textContent=bio.value.length+' of 160 characters';bio.addEventListener('input',bc);bc();
const em=$('#em');function checkEmail(){const ok=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em.value);em.setAttribute('aria-invalid',!ok);$('#eme').textContent=ok?'':'Enter an email address like name@company.com';return ok}em.addEventListener('blur',checkEmail);
let swDirty=false;const EV=[['Someone mentions me',1,1],['A task is assigned to me',1,1],['A project I follow changes',1,0],['Weekly summary',1,0],['Product news',0,0]];
$('#noti').innerHTML=EV.map(([n,e,p],i)=>`<tr><td id="n${i}">${n}</td><td><button class="sw" role="switch" aria-checked="${!!e}" aria-labelledby="n${i}" aria-label="${n}, email"></button></td><td><button class="sw" role="switch" aria-checked="${!!p}" aria-label="${n}, push"></button></td></tr>`).join('');
$('#noti').onclick=e=>{const s=e.target.closest('.sw');if(s){s.setAttribute('aria-checked',s.getAttribute('aria-checked')!=='true');swDirty=true;dirty()}};
let MEM=[['Amara Khan','amara@northwind.app','Owner'],['Tomás Reyes','tomas@northwind.app','Admin'],['Priya Nair','priya@northwind.app','Member'],['Maya Okafor','maya@northwind.app','Member']];
function mem(){$('#mem').innerHTML=MEM.map(([n,e,r],i)=>`<li><span class="av">${n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}</span><span style="flex:1;min-width:150px"><b>${esc(n)}</b><small>${esc(e)}</small></span>${r==='Owner'?'<span class="badge ac">Owner</span>':`<select class="in" aria-label="Role for ${esc(n)}"><option ${r==='Admin'?'selected':''}>Admin</option><option ${r==='Member'?'selected':''}>Member</option><option>Viewer</option></select><button class="btn ghost" data-rm="${i}" aria-label="Remove ${esc(n)}">Remove</button>`}</li>`).join('')}mem();
$('#mem').onclick=e=>{const b=e.target.closest('[data-rm]');if(b){const [n]=MEM.splice(+b.dataset.rm,1);mem();toast('Removed '+n[0])}};
$('#inv').onsubmit=e=>{e.preventDefault();const v=$('#ie').value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){toast('Enter a valid email address');return}MEM.push([v.split('@')[0],v,'Member']);$('#ie').value='';mem();toast('Invite sent to '+v)};
$('#cf').oninput=e=>$('#del').disabled=e.target.value.trim().toLowerCase()!=='northwind';$('#del').onclick=()=>toast('Workspace would be deleted here');
$('#sv').onclick=()=>{if(!checkEmail()){pick(0);em.focus();return}snap=take();swDirty=false;$('#save').hidden=true;toast('Settings saved')};
$('#disc').onclick=()=>{fields.forEach((f,i)=>f.value=snap[i]);bc();checkEmail();swDirty=false;$('#save').hidden=true;toast('Changes discarded')};
</script>
</body>
