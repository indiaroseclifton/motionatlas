<!--META {"o":2,"t":"Podcast player app","cat":"Mobile apps","tone":"light","added":"2026-11","d":"A phone-sized podcast player on a dark stage: large cover art, a scrubber you can drag, skip back and forward, playback speed, chapters you can jump to, a queue you can reorder and a library of shows to follow.","how":"One timer moves the position forward while playing, scaled by the speed. The scrubber, the time labels and the highlighted chapter all read that one number, so dragging the bar or tapping a chapter only has to set it. The queue is an array; moving an episode swaps two items and redraws.","use":"Podcast, music and audiobook apps, meditation and language-lesson players, any phone screen built around playback.","p":"Build a mobile podcast player as one HTML file with no libraries for an app called Earshot, shown inside a phone frame on wide screens and full width on phones. The app is dark in both themes. Bottom tab bar with Player, Queue and Library (role=tablist, arrow keys). Player: a small header with the show name, large square cover art (a photograph) with a soft shadow, the episode title and show, a scrubber (input type=range) with elapsed and remaining time, a row of controls (back 15 seconds, play or pause as the large round button, forward 30 seconds), a second row with a speed button that cycles 1x, 1.25x, 1.5x and 2x, a sleep timer toggle and a share button, then a Chapters list with start times where the current chapter is marked and tapping one jumps to it. Playback is simulated with a timer that respects the speed. Queue: Now playing, then Up next as a list with cover thumbnails, durations and up and down buttons to reorder; tapping an episode plays it. Library: a two-column grid of followed shows with cover, name, a new-episodes count and a Following toggle. Show a mini player above the tab bar on the Queue and Library tabs. Colours are CSS variables."}-->
<style>/*CORE*/
body{display:grid;place-items:center;padding:16px;background:var(--soft)}
.ph{--st:var(--ink);--sf:var(--bg);position:relative;width:min(400px,100%);height:min(840px,calc(100vh - 32px));border-radius:40px;background:var(--st);color:var(--sf);box-shadow:0 0 0 9px var(--panel),0 0 0 10px var(--line),0 30px 60px -30px rgba(16,24,40,.55);display:flex;flex-direction:column;overflow:hidden}
html[data-theme=dark] .ph{--st:var(--panel);--sf:var(--ink)}
.ph :focus-visible{outline-color:var(--sf)}.dim{opacity:.66}
.scr{flex:1;overflow:auto;padding:20px 22px 16px;scrollbar-width:none}
.tb{display:flex;padding:6px 8px 12px;border-top:1px solid rgba(127,127,127,.3);flex:none}.tb button{flex:1;display:grid;justify-items:center;gap:3px;padding:7px 0;border:0;background:none;color:inherit;opacity:.55;font-size:11px;font-weight:600;border-radius:12px}.tb button[aria-selected=true]{opacity:1}
.hd{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.gb{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:rgba(127,127,127,.24);color:inherit;flex:none}.gb:hover{background:rgba(127,127,127,.4)}
.cov{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:calc(var(--r) + 8px);margin:18px 0 20px;box-shadow:0 24px 40px -20px rgba(0,0,0,.7);background:rgba(127,127,127,.2)}
.ph h1{font-size:21px;line-height:1.25}
input[type=range]{width:100%;margin:18px 0 4px;accent-color:currentColor;height:22px}
.tm{display:flex;justify-content:space-between;font-size:12px;font-variant-numeric:tabular-nums;opacity:.7}
.ctl{display:flex;align-items:center;justify-content:center;gap:22px;margin:12px 0 14px}.ctl .sk{position:relative;width:52px;height:52px;background:none}.ctl .sk:hover{background:rgba(127,127,127,.24)}.ctl .sk .ic{width:30px;height:30px}.ctl .sk b{position:absolute;font-size:9.5px;top:21px}
.play{display:grid;place-items:center;width:72px;height:72px;border-radius:50%;border:0;background:var(--sf);color:var(--st)}.play:hover{transform:scale(1.04)}.play .ic{width:30px;height:30px;fill:currentColor}
.opt{display:flex;justify-content:space-between;gap:8px}.chipb{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 13px;border-radius:99px;border:0;background:rgba(127,127,127,.24);color:inherit;font-weight:700;font-size:13px}.chipb:hover{background:rgba(127,127,127,.4)}.chipb[aria-pressed=true]{background:var(--sf);color:var(--st)}.chipb .ic{width:16px;height:16px}
.sec{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.6;margin:22px 0 6px}
.ls{list-style:none;margin:0;padding:0}.ls li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(127,127,127,.25)}.ls li:last-child{border:0}
.ls .go{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:none;color:inherit;text-align:left;padding:0;border-radius:8px}.ls .go b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ls small{display:block;opacity:.66;font-size:12.5px}
.ls time{font-variant-numeric:tabular-nums;font-size:13px;opacity:.8;flex:none;min-width:40px}.ls li.cur time,.ls li.cur b{color:var(--ok)}html:not([data-theme=dark]) .ls li.cur time,html:not([data-theme=dark]) .ls li.cur b{color:#4ADE9B}
.ls img,.mini img{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;background:rgba(127,127,127,.2)}
.ord{display:grid;flex:none}.ord button{display:grid;place-items:center;width:32px;height:24px;border:0;background:none;color:inherit;opacity:.6;border-radius:6px}.ord button:hover:not(:disabled){opacity:1;background:rgba(127,127,127,.3)}.ord button:disabled{opacity:.2}.ord .ic{width:16px;height:16px}
.shows{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;margin-top:14px}.shows img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--r);background:rgba(127,127,127,.2)}.shows b{display:block;margin-top:8px}.shows small{opacity:.66;font-size:12.5px;display:block;margin-bottom:8px}
.mini{display:flex;align-items:center;gap:12px;margin:0 10px 8px;padding:8px;border-radius:18px;background:rgba(127,127,127,.24);flex:none}.mini .go{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:none;color:inherit;text-align:left;padding:0}.mini b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}.mini small{opacity:.66;font-size:12px}
@media(max-width:440px){body{padding:0}.ph{width:100%;height:100vh;border-radius:0;box-shadow:none}}
</style>
<body>
<div class="ph"><main class="scr" id="scr" role="tabpanel" tabindex="-1"></main><div id="mini"></div><nav class="tb" role="tablist" aria-label="Sections" id="tb"></nav></div>
<script>/*BASEJS*/
/* DATA. Covers are CC0 photographs from the atlas photo library. Lengths are in seconds. */
const PH='../../assets/photos/',SHOWS=[['Signal & Noise','podcast-blue-condenser-microphone',2,'How the web is built, weekly'],['The Long Play','podcast-jonathan-velasquez-2016',1,'Stories behind the records'],['Small Hours','podcast-ben-koorengevel-2017-03-17',0,'Fiction for late at night'],['Counter Talk','podcast-microphone',3,'People who feed us'],['Field Notes','podcast-kai-oberh-user-2016-02-26',1,'Short walks, recorded'],['Brass Tacks','podcast-elegant-steel-microphone',0,'Small business, plainly']].map(([n,img,fresh,d])=>({n,img,fresh,d,on:true}));
let QUEUE=[{s:0,t:'Why the web got heavy',no:148,len:2530,ch:[[0,'Cold open'],[135,'The two-megabyte home page'],[880,'What a framework costs'],[1625,'A lighter way to build'],[2310,'Listener post']]},{s:1,t:'The summer of the 12-inch single',no:61,len:3482,ch:[[0,'Side one'],[1700,'Side two']]},{s:2,t:'The night ferry',no:12,len:1905,ch:[[0,'The night ferry']]},{s:3,t:'A baker’s four o’clock start',no:87,len:2180,ch:[[0,'Before dawn'],[1100,'The first bake']]},{s:4,t:'Listening for owls',no:33,len:1448,ch:[[0,'Dusk'],[700,'The wood']]}];
const TABS=[['Player',`<!--IC play-->`],['Queue',`<!--IC list-->`],['Library',`<!--IC grid-->`]],SPEEDS=[1,1.25,1.5,2];
let tab=0,pos=1044,playing=false,speed=0,sleep=false;
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},now=()=>QUEUE[0],img=e=>PH+SHOWS[e.s].img+'-640.webp',chap=()=>{const c=now().ch;let k=0;c.forEach((x,i)=>{if(pos>=x[0])k=i});return k};
$('#tb').innerHTML=TABS.map(([n,i],k)=>`<button role="tab" id="t${k}" aria-selected="${!k}" tabindex="${k?-1:0}">${i}${n}</button>`).join('');const tabs=$$('#tb button');
function go(k,focus){tab=k;tabs.forEach((b,i)=>{b.setAttribute('aria-selected',i===k);b.tabIndex=i===k?0:-1});$('#scr').setAttribute('aria-labelledby','t'+k);draw();$('#scr').scrollTop=0;if(focus)tabs[k].focus()}
tabs.forEach((b,i)=>b.onclick=()=>go(i));$('#tb').onkeydown=e=>{const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(d){e.preventDefault();go((tab+d+3)%3,true)}};
const PLAY=()=>playing?'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>':'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7Z"/></svg>';
function draw(){const e=now(),sh=SHOWS[e.s],s=$('#scr');
 if(tab===0)s.innerHTML=`<div class="hd"><span class="dim">Now playing</span><span>${sh.n}</span></div><img class="cov" src="${img(e)}" alt="Cover of ${sh.n}"><h1>${e.t}</h1><p class="dim">${sh.n} · Episode ${e.no}</p>
  <label class="sr" for="bar">Position</label><input type="range" id="bar" min="0" max="${e.len}" step="1" value="${pos}" aria-valuetext="${mmss(pos)} of ${mmss(e.len)}"><div class="tm"><span id="el">${mmss(pos)}</span><span id="re">−${mmss(e.len-pos)}</span></div>
  <div class="ctl"><button class="gb sk" data-j="-15" aria-label="Back 15 seconds"><!--IC prev--></button><button class="play" id="pp" aria-label="${playing?'Pause':'Play'}">${PLAY()}</button><button class="gb sk" data-j="30" aria-label="Forward 30 seconds"><!--IC next--></button></div>
  <div class="opt"><button class="chipb" id="spd" aria-label="Playback speed, ${SPEEDS[speed]} times">${SPEEDS[speed]}×</button><button class="chipb" id="slp" aria-pressed="${sleep}"><!--IC moon-->${sleep?'Stops in 30 min':'Sleep timer'}</button><button class="chipb" id="shr" aria-label="Share"><!--IC share--></button></div>
  <h2 class="sec">Chapters</h2><ul class="ls" id="chs">${e.ch.map((c,i)=>`<li class="${i===chap()?'cur':''}"><button class="go" data-t="${c[0]}"><time>${mmss(c[0])}</time><b>${c[1]}</b></button></li>`).join('')}</ul>`;
 else if(tab===1)s.innerHTML=`<h1 style="font-size:26px">Queue</h1><p class="dim">${QUEUE.length} episodes · ${Math.round(QUEUE.reduce((a,x)=>a+x.len,-pos)/60)} minutes left</p><h2 class="sec">Now playing</h2><ul class="ls"><li class="cur"><img src="${img(e)}" alt=""><span style="min-width:0;flex:1"><b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.t}</b><small>${sh.n} · ${mmss(e.len-pos)} left</small></span></li></ul><h2 class="sec">Up next</h2><ul class="ls" id="q">${QUEUE.slice(1).map((x,i)=>`<li><button class="go" data-q="${i+1}" aria-label="Play ${x.t}"><img src="${img(x)}" alt=""><span style="min-width:0"><b>${x.t}</b><small>${SHOWS[x.s].n} · ${Math.round(x.len/60)} min</small></span></button><span class="ord"><button data-m="${i+1}" data-d="-1" ${i?'':'disabled'} aria-label="Move ${x.t} up"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m5.500 14.500 6.500-6.500 6.500 6.500"/></svg></button><button data-m="${i+1}" data-d="1" ${i<QUEUE.length-2?'':'disabled'} aria-label="Move ${x.t} down"><!--IC down--></button></span></li>`).join('')}</ul>`;
 else s.innerHTML=`<h1 style="font-size:26px">Library</h1><p class="dim">${SHOWS.filter(x=>x.on).length} shows followed · ${SHOWS.reduce((a,x)=>a+(x.on?x.fresh:0),0)} new episodes</p><div class="shows">${SHOWS.map((x,i)=>`<div><img src="${PH+x.img}-640.webp" alt="" loading="lazy"><b>${x.n}</b><small>${x.d}${x.fresh&&x.on?' · '+x.fresh+' new':''}</small><button class="chipb" data-f="${i}" aria-pressed="${x.on}">${x.on?'<!--IC check-->Following':'Follow'}</button></div>`).join('')}</div>`;
 $('#mini').innerHTML=tab?`<div class="mini"><button class="go" id="open" aria-label="Open the player"><img src="${img(e)}" alt=""><span style="min-width:0"><b>${e.t}</b><small id="ml">${mmss(e.len-pos)} left</small></span></button><button class="gb" id="pp2" aria-label="${playing?'Pause':'Play'}">${PLAY()}</button></div>`:''}
function seek(v){pos=Math.max(0,Math.min(now().len,v));if(tab===0){const b=$('#bar');b.value=pos;b.setAttribute('aria-valuetext',mmss(pos)+' of '+mmss(now().len));$('#el').textContent=mmss(pos);$('#re').textContent='−'+mmss(now().len-pos);$$('#chs li').forEach((li,i)=>li.classList.toggle('cur',i===chap()))}else if($('#ml'))$('#ml').textContent=mmss(now().len-pos)+' left'}
const toggle=id=>{playing=!playing;draw();$(id)?.focus()};
$('#scr').addEventListener('input',e=>{if(e.target.id==='bar')seek(+e.target.value)});
$('#scr').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id==='pp')toggle('#pp');else if(b.dataset.j)seek(pos+ +b.dataset.j);else if(b.dataset.t!=null){seek(+b.dataset.t);if(!playing)toggle('#pp')}
 else if(b.id==='spd'){speed=(speed+1)%4;draw();$('#spd').focus()}else if(b.id==='slp'){sleep=!sleep;draw();$('#slp').focus();toast(sleep?'Playback will stop in 30 minutes':'Sleep timer off')}else if(b.id==='shr')toast('Link copied at '+mmss(pos))
 else if(b.dataset.q){const [x]=QUEUE.splice(+b.dataset.q,1);QUEUE.unshift(x);pos=0;playing=true;go(0);toast('Playing '+x.t)}
 else if(b.dataset.m){const i=+b.dataset.m,j=i+ +b.dataset.d;[QUEUE[i],QUEUE[j]]=[QUEUE[j],QUEUE[i]];draw();($(`[data-m="${j}"][data-d="${b.dataset.d}"]:not(:disabled)`)||$(`[data-m="${j}"]:not(:disabled)`))?.focus()}
 else if(b.dataset.f){const x=SHOWS[b.dataset.f];x.on=!x.on;draw();$(`[data-f="${b.dataset.f}"]`).focus();toast(x.on?'Following '+x.n:'Unfollowed '+x.n)}});
$('#mini').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;b.id==='open'?go(0,true):toggle('#pp2')});
/* One timer: while playing, the position moves on by the speed each second and the next episode starts at the end. */
setInterval(()=>{if(!playing)return;if(pos+SPEEDS[speed]>=now().len){if(QUEUE.length>1){QUEUE.push(QUEUE.shift());pos=0;draw()}else{playing=false;draw()}}else seek(pos+SPEEDS[speed])},1000);
go(0);
</script>
</body>
