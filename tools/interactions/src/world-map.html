<!--META {"o": 0.18, "t": "World map with arcs", "cat": "Signal & data", "tone": "light", "added": "2026-11-14", "uses": [], "d": "A world map made of dots. Lines fly between twelve cities, a small ring pulses where each one lands, and a caption names the route that just left.", "how": "The land is a small grid of characters, one per four degrees, drawn as dots. Each city is placed from its latitude and longitude. A route is a single curve between two cities; only a moving stretch of it is drawn, so it reads as something travelling.", "use": "Shipping, payments and network products, status and coverage pages, an about page for a spread-out team, a hero for anything global.", "p": "Build a dotted world map with flying arcs in one HTML file with no libraries and no image files. Embed a coarse land mask as 35 strings of 90 characters (one character per 4 degrees, from 84 north to 56 south, # for land) and draw every land cell as a small dot on a full-page canvas, using an equirectangular projection: x from longitude, y from latitude. Keep about twelve real cities with their latitude and longitude and mark each with an accent dot. Keep N arcs in flight at once. An arc is a quadratic curve between two random cities that are at least 2,500 km apart and do not cross the date line; its control point sits off the middle of the chord, at right angles to it on the upper side, by an arc height setting. Draw only the stretch between a tail position and a head position that both ease from 0 to 1, the tail starting later, with the stroke fading toward the tail and a small dot on the head. When the head lands, start a ring at the city that grows and fades. Above the map put a short heading and a caption showing the newest route as Lisbon to Tokyo plus the great-circle distance in km, and a Pause button. Optionally label the cities (all of them on wide screens, only the busy ones on narrow screens). On a phone, where there is room under the map, list the few routes before the current one with their distances. Paint the dots once to an offscreen canvas and redraw only the arcs each frame. Cap device pixel ratio at 2 and rebuild on resize. Settings: dot size, arc speed, arcs at once, arc height, city labels, accent, light or dark. Reduced motion: draw the map with a few complete, still arcs."}-->
<style>/*BASE*/
/*UI*/
canvas{position:fixed;inset:0;width:100%;height:100%}
.top{position:fixed;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:clamp(14px,3.6vh,34px) clamp(16px,4vw,44px) 0}
.top h1{font-size:clamp(20px,3.2vw,34px);line-height:1.12;letter-spacing:-.025em;margin:2px 0 8px}
.cap{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.cap i{width:8px;height:8px;border-radius:50%;background:var(--ac);flex:none}
.cap .km{font-weight:400;color:var(--mute)}
.log{position:fixed;left:16px;right:16px;font-size:13.5px;font-variant-numeric:tabular-nums}
.log li{display:flex;align-items:center;justify-content:space-between;height:34px;border-top:1px solid var(--line)}.log span{color:var(--mute)}
</style>
<body>
<canvas id="c" role="img" aria-label="A dotted world map. Lines fly between twelve cities, one route after another."></canvas>
<header class="top" id="top"><div><p class="k">Live routes</p><h1>Twelve cities, one network.</h1><p class="cap"><i></i><span id="route">Lisbon to Tokyo</span><span class="km" id="km"></span></p></div><button class="btn" id="pp">Pause</button></header>
<ol class="log" id="log" aria-label="Earlier routes" hidden></ol>
<script type="application/json" id="settings">{"dot":46,"speed":1,"count":3,"height":24,"labels":true,"mode":"light","accent":"#2563EB"}</script>
<script>
const CONTROLS=[{g:'Map',k:'dot',label:'Dot size',min:20,max:95,step:1,unit:'%'},{k:'labels',label:'City labels',type:'toggle'},{g:'Arcs',k:'speed',label:'Speed',min:.3,max:3,step:.1},{k:'count',label:'Arcs at once',min:1,max:8,step:1},{k:'height',label:'Arc height',min:0,max:60,step:1,unit:'%'},{g:'Look',k:'mode',label:'Mode',type:'select',options:['light','dark']},{k:'accent',label:'Accent',type:'color'}];
/*TUNER*/
/* The land, one character for every 4 degrees: 90 columns from 180 west to 180 east, 35 rows from 84 north down to 56 south. # is land. */
const LAND=[
".........................####.#########...................................................",
"......................#######.##########........###.......................................",
"..............#.....#####.....##########...................#......########................",
"....##########..###.....####...########...........###.....##..###########################.",
"##.#####################..###...####...##.......##########################################",
"....##################....###...###...........###########################################.",
".....##....###########...####...............#..##..#############################....##....",
"............###################...........#.#..#################################....#.....",
"..............##################............#####################################.........",
"..............###############...............####################################..........",
"..............#############................###..####.####.####################..##........",
"..............############.................##...#.#.#######################.#..#..........",
"...............###########.................#####......#####################..##...........",
"................#########.................##################################..............",
".................####...#................############.####.################...............",
"..................###....#...............#############.#####..############.#..............",
"...................####....#.............#############.####....###..####...#..............",
"......................##.................##############.#......##....###...#..............",
"........................#.####...........#################......#......#...##.............",
".........................######...........###############.............#...#...............",
".........................#######...............#########.............##.###...............",
".........................#########.............########...............#.##.#..##..........",
".........................###########............#######................###.....###........",
".........................###########............#######...................................",
"..........................#########.............#######..#...................##.#.........",
"...........................########.............######..##.................#######........",
"...........................########.............######..#................##########.......",
"...........................######................####....................##########.......",
"...........................######................####.....................#########.......",
"...........................#####..................##......................##..#####.......",
"...........................####.................................................##......#.",
"..........................###....................................................#......#.",
"..........................###..........................................................#..",
"..........................##..............................................................",
"...........................#.............................................................."
];
const TOP=84,BOT=-56,COLS=LAND[0].length,ROWS=LAND.length;
/* Name, latitude, longitude. Add your own places here. */
const CITY=[['Lisbon',38.72,-9.14],['London',51.51,-.13],['New York',40.71,-74.01],['San Francisco',37.77,-122.42],['São Paulo',-23.55,-46.63],['Lagos',6.52,3.38],['Nairobi',-1.29,36.82],['Dubai',25.2,55.27],['Mumbai',19.08,72.88],['Singapore',1.35,103.82],['Tokyo',35.68,139.69],['Sydney',-33.87,151.21]];
const cv=document.getElementById('c'),x=cv.getContext('2d'),dots=document.createElement('canvas'),head=document.getElementById('top'),routeEl=document.getElementById('route'),kmEl=document.getElementById('km'),pp=document.getElementById('pp'),log=document.getElementById('log');
let d=1,W=0,H=0,mx=0,my=0,mw=0,mh=0,ac='#2563EB',line='#2563EB',ink='#111',mute='#777',bg='#fff',arcs=[],rings=[],clock=0,last=0,playing=!calm,first=true,past=[[2,1],[4,5],[7,9],[8,11],[5,6],[0,10]],logRows=0;
/* Equirectangular map: longitude runs straight across, latitude straight down. */
const xy=i=>[mx+(CITY[i][2]+180)/360*mw,my+(TOP-CITY[i][1])/(TOP-BOT)*mh];
/* Great-circle distance in km, for the caption and for how long a flight takes. */
const km=(a,b)=>{const R=Math.PI/180,[,la,lo]=CITY[a],[,lb,lob]=CITY[b],h=Math.sin((lb-la)*R/2)**2+Math.cos(la*R)*Math.cos(lb*R)*Math.sin((lob-lo)*R/2)**2;return 12742*Math.asin(Math.sqrt(h))};
/* Blend two hex colours. In dark mode the arcs are lightened a little so they stand out. */
const mix=(a,b,t)=>{const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),A=p(a),B=p(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t))+')'};
const far=(a,b)=>(Math.round(km(a,b)/10)*10).toLocaleString('en')+' km',name=(a,b)=>CITY[a][0]+' to '+CITY[b][0];
/* On a phone there is room under the map, so the routes before the current one are listed there. */
const list=()=>{log.innerHTML=past.slice(1,1+logRows).map(([a,b])=>`<li>${name(a,b)}<span>${far(a,b)}</span></li>`).join('')};
const ease=t=>t<.5?2*t*t:1-(2-2*t)**2/2;
function build(){d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=dots.width=W*d;cv.height=dots.height=H*d;
 const cs=getComputedStyle(document.documentElement),v=n=>cs.getPropertyValue(n).trim();ac=v('--ac');ink=v('--ink');mute=v('--mute');bg=v('--bg');line=S.mode==='dark'&&/^#\w{6}$/.test(ac)?mix(ac,'#ffffff',.4):ac;
 /* Fit the map under the heading. */
 const pad=W<560?12:Math.min(44,W*.04),y0=head.getBoundingClientRect().bottom+12,aw=W-pad*2,ah=Math.max(60,H-y0-14),ratio=360/(TOP-BOT);
 mw=Math.min(aw,ah*ratio);mh=mw/ratio;mx=(W-mw)/2;logRows=W<560?Math.min(5,Math.floor((ah-mh-30)/34)):0;if(logRows<2)logRows=0;
 my=y0+(ah-mh-(logRows?20+logRows*34:0))*(logRows?.3:.4);log.hidden=!logRows;log.style.top=my+mh+20+'px';list();
 /* The dots never change, so paint them once on a spare canvas and reuse that picture every frame. */
 const g=dots.getContext('2d'),cell=mw/COLS,r=Math.max(.55,cell*S.dot/200);g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,W,H);g.fillStyle=mute;g.globalAlpha=.42;g.beginPath();
 for(let j=0;j<ROWS;j++)for(let i=0;i<COLS;i++)if(LAND[j][i]==='#'){const px=mx+(i+.5)*cell,py=my+(j+.5)*cell;g.moveTo(px+r,py);g.arc(px,py,r,0,7)}g.fill()}
/* Two cities that are a fair way apart, do not cross the date line and were not linked a moment ago. */
function pick(){if(first){first=false;return[0,10]}for(let n=0;n<60;n++){const a=Math.random()*CITY.length|0,b=Math.random()*CITY.length|0;
 if(a!==b&&Math.abs(CITY[a][2]-CITY[b][2])<150&&km(a,b)>2500&&!past.slice(0,4).some(q=>(q[0]===a&&q[1]===b)||(q[0]===b&&q[1]===a)))return[a,b]}return[1,7]}
const launch=at=>{const[a,b]=pick();return{a,b,t0:at,dur:1000+km(a,b)/7,said:false,hit:false}};
/* The curve between two cities. The control point is pushed off the middle of the straight line, at right angles, on the upper side. */
function curve(a,b){const A=xy(a),B=xy(b),dx=B[0]-A[0],dy=B[1]-A[1],len=Math.hypot(dx,dy)||1;let nx=-dy/len,ny=dx/len;if(ny>0){nx=-nx;ny=-ny}
 const lift=len*S.height/50,C=[(A[0]+B[0])/2+nx*lift,(A[1]+B[1])/2+ny*lift];return t=>{const u=1-t;return[u*u*A[0]+2*u*t*C[0]+t*t*B[0],u*u*A[1]+2*u*t*C[1]+t*t*B[1]]}}
/* Draw the part of a curve between tail and head, fainter toward the tail. */
function stroke(at,tail,head,alpha){const n=Math.max(2,Math.ceil((head-tail)*40));x.lineWidth=2;x.lineCap='round';x.strokeStyle=line;let p=at(tail);
 for(let i=1;i<=n;i++){const q=at(tail+(head-tail)*i/n);x.globalAlpha=alpha*(.15+.85*(i/n)**1.3);x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(q[0],q[1]);x.stroke();p=q}x.globalAlpha=1}
function draw(){x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,W,H);x.drawImage(dots,0,0,W,H);const busy=new Set();
 if(calm){/* Reduced motion: a few whole arcs, standing still. */for(const[a,b]of[[0,10],[2,1],[4,5],[7,9],[8,11]]){stroke(curve(a,b),0,1,.75);busy.add(a).add(b)}}
 else{arcs.length=Math.min(arcs.length,S.count);for(let i=0;i<S.count;i++){let q=arcs[i];
   /* A finished arc is replaced by a new one after a short gap. The first ones leave one after another. */
   if(!q)q=arcs[i]=launch(clock+i*900);else if(clock>q.t0+q.dur*1.5)q=arcs[i]=launch(clock+Math.random()*500);
   const u=(clock-q.t0)/q.dur;if(u<0)continue;
   if(!q.said){q.said=true;routeEl.textContent=name(q.a,q.b);kmEl.textContent=far(q.a,q.b);past.unshift([q.a,q.b]);past.length=6;list()}
   const at=curve(q.a,q.b),head=ease(Math.min(1,u)),tail=ease(Math.max(0,Math.min(1,(u-.45)/1.05*1)));busy.add(q.a).add(q.b);
   if(head>tail)stroke(at,tail,head,1);
   if(u<1){const p=at(head);x.fillStyle=line;x.globalAlpha=.22;x.beginPath();x.arc(p[0],p[1],7,0,7);x.fill();x.globalAlpha=1;x.beginPath();x.arc(p[0],p[1],3,0,7);x.fill()}
   else if(!q.hit){q.hit=true;rings.push({i:q.b,t:clock})}}
  /* A ring where each arc lands: it grows and fades. */
  rings=rings.filter(r=>clock-r.t<1100);for(const r of rings){const k=(clock-r.t)/1100,p=xy(r.i);busy.add(r.i);x.strokeStyle=line;x.lineWidth=1.5;x.globalAlpha=(1-k)*.8;x.beginPath();x.arc(p[0],p[1],4+k*16,0,7);x.stroke();x.globalAlpha=(1-k)*.16;x.fillStyle=line;x.beginPath();x.arc(p[0],p[1],4+k*16,0,7);x.fill();x.globalAlpha=1}}
 /* City markers, then their names. On a narrow map only the busy cities are named. */
 CITY.forEach((c,i)=>{const p=xy(i);x.fillStyle=bg;x.beginPath();x.arc(p[0],p[1],5,0,7);x.fill();x.fillStyle=line;x.beginPath();x.arc(p[0],p[1],3,0,7);x.fill()});
 if(S.labels){const wide=mw>860;x.font='600 '+(wide?12:11)+'px Inter,ui-sans-serif,system-ui,sans-serif';x.textBaseline='middle';x.lineJoin='round';x.lineWidth=4;x.strokeStyle=bg;
  CITY.forEach((c,i)=>{if(!wide&&!busy.has(i))return;const p=xy(i),left=p[0]+10+x.measureText(c[0]).width>W-6;x.textAlign=left?'right':'left';const tx=p[0]+(left?-9:9);x.strokeText(c[0],tx,p[1]);x.fillStyle=busy.has(i)?ink:mute;x.fillText(c[0],tx,p[1])})}}
function frame(now){const dt=Math.min(50,now-last);last=now;if(playing)clock+=dt*S.speed;draw();requestAnimationFrame(frame)}
pp.onclick=()=>{playing=!playing;pp.textContent=playing?'Pause':'Play'};
addEventListener('resize',()=>{build();if(calm)draw()});
function apply(){theme();build();if(calm)draw()}
kmEl.textContent=far(0,10);pp.hidden=calm;
apply();if(!calm)requestAnimationFrame(t=>{last=t;frame(t)});
</script>
</body>
