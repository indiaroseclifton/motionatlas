<!--META {"o":3,"t":"Spotlight carousel","cat":"Carousels","tone":"light","uses":["L49"],"d":"One card stands in the light with its caption; its neighbours shrink, blur and dim behind it. Tune the falloff with sliders.","how":"Cards sit in a row and overlap. A card's distance from the centre drives four things at once: how far it slides, how small it gets, how much blur it takes and how dark it goes. Only the centre card shows its text.","use":"Featured stories, testimonials with portraits, film or album pickers, case studies.","p":"Build a spotlight carousel in one HTML file with no libraries. Cards (image, title, line, small button) are absolutely placed in a row; for distance d from the current float position: x = d * (card width * overlap + gap), scale = 1 - min(|d|,2) * shrink, filter blur(min(|d|,2) * blur px) brightness(1 - min(|d|,2) * dim), z-index falls with |d|. The centre card's caption fades in; others hide theirs. Position eases to an integer target. Drag, arrow keys, click a side card to centre it, previous and next buttons and dots. Announce the centre card in a polite live region. Settings: card width, overlap, gap, shrink, blur, dim, corner radius, autoplay, accent, light or dark."}-->
<style>/*BASE*/
.stage{position:relative;width:100%;height:min(70vh,460px);touch-action:pan-y;cursor:grab;user-select:none}.stage:active{cursor:grabbing}
.c{position:absolute;left:50%;top:46%;width:var(--w);aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;background:var(--panel);box-shadow:0 24px 50px -22px rgba(0,0,0,.6);will-change:transform,filter}
.c figcaption{position:absolute;inset:auto 0 0 0;padding:44px 16px 16px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.78));display:grid;gap:4px;justify-items:start;opacity:0;transition:opacity .3s}
.c.on figcaption{opacity:1}.c b{font-size:17px}.c span{font-size:12.5px;opacity:.85}.c em{font-style:normal;font-size:12px;font-weight:600;margin-top:6px;padding:5px 11px;border-radius:99px;background:var(--ac);color:#fff}
.row{position:fixed;left:0;right:0;bottom:20px;display:flex;justify-content:center;align-items:center;gap:14px}.dots{display:flex;gap:6px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:.2s}.dots i.on{width:18px;border-radius:3px;background:var(--ac)}
</style>
<body>
<div class="stage" id="stage" tabindex="0" role="group" aria-roledescription="carousel" aria-label="Featured studies. Use the arrow keys."></div>
<p class="sr" aria-live="polite" id="live"></p>
<div class="row"><button class="nb" id="prev" aria-label="Previous">‹</button><div class="dots" id="dots" aria-hidden="true"></div><button class="nb" id="next" aria-label="Next">›</button></div>
<script type="application/json" id="settings">{"size":230,"overlap":0.62,"gap":10,"shrink":0.16,"blur":2.5,"dim":0.28,"corner":20,"autoplay":false,"mode":"light","accent":"#E4572E"}</script>
<script>
const CONTROLS=[{g:'Cards',k:'size',label:'Card width',min:140,max:340,step:2,unit:'px'},{k:'corner',label:'Corner radius',min:0,max:48,step:1,unit:'px'},{g:'Spacing',k:'overlap',label:'Overlap',min:.3,max:1.05,step:.01},{k:'gap',label:'Gap',min:0,max:60,step:1,unit:'px'},
 {g:'Falloff',k:'shrink',label:'Shrink',min:0,max:.3,step:.01},{k:'blur',label:'Blur',min:0,max:8,step:.5,unit:'px'},{k:'dim',label:'Dim',min:0,max:.45,step:.01},{g:'Behaviour',k:'autoplay',label:'Autoplay',type:'toggle'},{g:'Look',k:'mode',label:'Mode',type:'select',options:['light','dark']},{k:'accent',label:'Accent',type:'color'}];
/*TUNER*/
/*CAROUSEL*/
const stage=document.getElementById('stage');let cards=[];
function draw(pos){const n=ITEMS.length;cards.forEach((c,i)=>{const d=dist(i,pos,n,true),ad=Math.min(Math.abs(d),2);
 c.style.transform=`translate(-50%,-50%) translateX(${(d*(S.size*S.overlap+S.gap)).toFixed(1)}px) scale(${(1-ad*S.shrink).toFixed(3)})`;c.style.filter=`blur(${(ad*S.blur).toFixed(1)}px) brightness(${(1-ad*S.dim).toFixed(2)})`;
 c.style.zIndex=100-Math.round(Math.abs(d)*10);c.style.opacity=Math.abs(d)>3.4?0:1;c.classList.toggle('on',Math.abs(d)<.5)})}
const car=carousel(stage,()=>ITEMS.length,draw,{loop:true,step:()=>S.size*S.overlap+S.gap,onChange:i=>{document.getElementById('live').textContent=ITEMS[i][0]+'. '+ITEMS[i][1];[...document.getElementById('dots').children].forEach((d,k)=>d.classList.toggle('on',k===i))}});
function apply(){theme();stage.style.setProperty('--w',S.size+'px');stage.style.setProperty('--r',S.corner+'px');car.redraw();car.auto(S.autoplay?2800:0)}
stage.innerHTML=ITEMS.map(([t,s],i)=>`<figure class="c" data-i="${i}"><i class="art" style="background:${art(i)}"></i><figcaption><b>${t}</b><span>${s}</span><em>View study</em></figcaption></figure>`).join('');cards=[...stage.children];
document.getElementById('dots').innerHTML=ITEMS.map(()=>'<i></i>').join('');document.getElementById('prev').onclick=car.prev;document.getElementById('next').onclick=car.next;
apply();car.go(0);
</script>
</body>
