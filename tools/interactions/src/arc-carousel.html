<!--META {"o":1,"t":"Arc focus carousel","cat":"Carousels","tone":"light","uses":["L08","L49"],"d":"Cards ride an arc and the one at the top comes into focus. Drag, use the arrows or click a card; every dimension has a slider.","how":"Each card's distance from the centre becomes an angle on a circle: sine gives its x, one minus cosine gives its drop, and the same angle tilts it. The position eases toward a whole number, so a drag always settles on a card.","use":"Product pickers, team pages, feature tours, portfolios, onboarding.","p":"Build an arc carousel in one HTML file with no libraries. Nine cards (image, title, one line) are placed on a circle of radius R: for a card at distance d from the current position, angle a = d * spacing degrees, x = sin(a) * R, y = (1 - cos(a)) * R, rotation = a * tilt, scale = 1 - |d| * shrink, hidden beyond a visible count. The position is a float that eases toward an integer target every frame. Drag horizontally to move, release to snap; Left and Right arrows, Home and End work when the stage has focus; clicking a side card centres it. Show the focused card's title and line below, in a polite live region, with previous and next buttons and dots. Optional autoplay that pauses on hover and focus. Expose radius, spacing, card size, tilt, shrink, corner radius, visible count, arc direction, autoplay, accent and light or dark as settings. Respect prefers-reduced-motion by snapping without easing."}-->
<style>/*BASE*/
.stage{position:relative;width:100%;height:min(74vh,520px);touch-action:pan-y;cursor:grab;user-select:none;outline-offset:-4px}.stage:active{cursor:grabbing}
.c{position:absolute;left:50%;top:var(--top);width:var(--w);aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;background:var(--panel);box-shadow:0 18px 40px -18px rgba(0,0,0,.55);will-change:transform}
.cap{position:fixed;left:0;right:0;bottom:22px;display:grid;justify-items:center;gap:8px;text-align:center;padding:0 16px}
.cap h2{font-size:20px;letter-spacing:-.01em}.cap p{color:var(--mute);font-size:13.5px}
.row{display:flex;align-items:center;gap:14px}.dots{display:flex;gap:6px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:.2s}.dots i.on{width:18px;border-radius:3px;background:var(--ac)}
</style>
<body>
<div class="stage" id="stage" tabindex="0" role="group" aria-roledescription="carousel" aria-label="Material studies. Use the arrow keys."></div>
<div class="cap"><div aria-live="polite"><h2 id="t"></h2><p id="s"></p></div><div class="row"><button class="nb" id="prev" aria-label="Previous">‹</button><div class="dots" id="dots" aria-hidden="true"></div><button class="nb" id="next" aria-label="Next">›</button></div></div>
<script type="application/json" id="settings">{"radius":620,"spacing":17,"size":190,"tilt":1,"shrink":0.12,"corner":22,"visible":3,"up":false,"autoplay":false,"mode":"light","accent":"#B4531A"}</script>
<script>
const CONTROLS=[{g:'Arc',k:'radius',label:'Radius',min:260,max:1200,step:10,unit:'px'},{k:'spacing',label:'Spacing',min:8,max:34,step:1,unit:'°'},{k:'tilt',label:'Card tilt',min:0,max:1.5,step:.05},{k:'up',label:'Arc upward',type:'toggle'},
 {g:'Cards',k:'size',label:'Card width',min:110,max:300,step:2,unit:'px'},{k:'shrink',label:'Shrink at sides',min:0,max:.3,step:.01},{k:'corner',label:'Corner radius',min:0,max:60,step:1,unit:'px'},{k:'visible',label:'Cards each side',min:1,max:4,step:1},
 {g:'Behaviour',k:'autoplay',label:'Autoplay',type:'toggle'},{g:'Look',k:'mode',label:'Mode',type:'select',options:['light','dark']},{k:'accent',label:'Accent',type:'color'}];
/*TUNER*/
/*CAROUSEL*/
const stage=document.getElementById('stage');let cards=[];
function draw(pos){const n=ITEMS.length,R=S.radius,dir=S.up?-1:1;cards.forEach((c,i)=>{const d=dist(i,pos,n,true),ad=Math.abs(d),a=d*S.spacing*Math.PI/180;
 c.style.transform=`translate(-50%,-50%) translate(${(Math.sin(a)*R).toFixed(1)}px,${(dir*(1-Math.cos(a))*R).toFixed(1)}px) rotate(${(dir*d*S.spacing*S.tilt).toFixed(2)}deg) scale(${Math.max(.3,1-ad*S.shrink).toFixed(3)})`;
 c.style.opacity=ad>S.visible+.6?0:1;c.style.zIndex=100-Math.round(ad*10);c.style.pointerEvents=ad>S.visible+.6?'none':''})}
const car=carousel(stage,()=>ITEMS.length,draw,{loop:true,step:()=>S.size*.9,onChange:i=>{document.getElementById('t').textContent=ITEMS[i][0];document.getElementById('s').textContent=ITEMS[i][1];[...document.getElementById('dots').children].forEach((d,k)=>d.classList.toggle('on',k===i))}});
function apply(){theme();stage.style.setProperty('--w',S.size+'px');stage.style.setProperty('--r',S.corner+'px');stage.style.setProperty('--top',S.up?'62%':'40%');car.redraw();car.auto(S.autoplay?2600:0)}
stage.innerHTML=ITEMS.map(([t],i)=>`<figure class="c" data-i="${i}" aria-label="${t}"><i class="art" style="background:${art(i)}"></i></figure>`).join('');cards=[...stage.children];
document.getElementById('dots').innerHTML=ITEMS.map(()=>'<i></i>').join('');document.getElementById('prev').onclick=car.prev;document.getElementById('next').onclick=car.next;
apply();car.go(0);
</script>
</body>
