<!--META {"o": 0.24, "t": "Page preloader", "cat": "Feedback", "tone": "light", "added": "2026-11-14", "uses": [], "d": "A dark curtain covers the page while a large counter runs from 0 to 100 above a thin progress line. Then the curtain lifts, splits or opens as a circle, and the page underneath settles into place.", "how": "One timer drives everything. The first part of it turns into the counter and the line. The last part turns into a number from 0 to 1 that is written into the curtain's clip-path, so the curtain is cut away rather than moved.", "use": "Portfolio and studio home pages, campaign and launch pages, the first load of a heavy 3D or video page. Not for ordinary pages that load quickly.", "p": "Build a page preloader in one HTML file with no libraries and no images. Underneath is a simple hero: a brand name and three links on top, then a kicker, headline, one line of text, a primary link and a Play again button beside a rounded picture drawn with CSS gradients. On top is a fixed full-screen curtain in the ink colour with the brand and the word Loading in its top corners, a very large counter with tabular figures at the bottom left and a 2px progress line in the accent colour under it. With requestAnimationFrame run one timeline: over the count duration move progress from 0 to 1 in three surges (t minus a small sine wave) and write it into the counter and the line; pause briefly; then over the curtain duration ease a value r from 0 to 1 and write it into the curtain's clip-path: inset(0 0 r% 0) for lift, a polygon of two halves moving apart for split, or a path with an even-odd circular hole growing from the centre for circle. The counter fades and slides up as the curtain starts and the hero's parts rise in one after another. While loading, the hero is inert; afterwards the curtain is hidden. Play again replays it and returns focus to the button. Settings: count duration, curtain duration, curtain style, easing, counter size, accent, light or dark. Reduced motion: no curtain at all, the hero is there from the start."}-->
<style>/*BASE*/
/*UI*/
.hero{position:fixed;inset:0;overflow:auto;display:grid;grid-template-rows:auto 1fr;padding:clamp(12px,2.4vw,24px) clamp(20px,5vw,64px) clamp(20px,4vw,40px)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px}.nav,.mid{max-width:1080px;width:100%;margin:0 auto}
.brand{font-size:16px;letter-spacing:-.01em}
.links{display:flex}.links a{display:inline-flex;align-items:center;min-height:40px;padding:0 10px;color:var(--mute);font-size:14px;font-weight:500;text-decoration:none}.links a:hover{color:var(--ink)}
.mid{display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:5vw}
.txt{display:grid;gap:14px;justify-items:start}
.txt h1{font-size:clamp(30px,5.4vw,68px);line-height:1;letter-spacing:-.04em}
.txt .sub{color:var(--mute);font-size:clamp(15px,1.5vw,17px);max-width:40ch}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.note{font-size:13px;color:var(--mute)}
.pic{justify-self:end;width:100%;max-width:400px;aspect-ratio:4/5;max-height:66vh;border-radius:24px;border:1px solid var(--line)}
/* The parts of the hero wait a little lower and rise in, one after another, once the curtain starts to open. */
.rise{transition:opacity .7s,transform .9s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--n)*70ms)}
.hero.wait .rise{opacity:0;transform:translateY(22px);transition:none}
/* The curtain. It is never moved: its clip-path is rewritten every frame, which cuts it away. */
.veil{position:fixed;inset:0;z-index:5;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(18px,3.4vw,40px) clamp(20px,5vw,64px);background:var(--ink);color:var(--bg)}
.vtop{display:flex;justify-content:space-between;font-size:14px;font-weight:600}.vtop span:last-child{opacity:.72;font-weight:500}
.vin{grid-row:3;display:grid;gap:clamp(10px,2vw,22px)}
.num{font-size:clamp(64px,calc(var(--cs,22)*1vw),min(340px,52vh));font-weight:600;line-height:.8;letter-spacing:-.06em;font-variant-numeric:tabular-nums;margin-left:-.04em}
.track{display:block;height:2px;background:color-mix(in srgb,var(--bg) 22%,transparent)}
.track i{display:block;height:100%;background:var(--ac);transform-origin:0 50%;transform:scaleX(0)}
@media(max-width:700px){.mid{grid-template-columns:1fr;gap:22px;align-content:center}.pic{justify-self:stretch;max-width:none;aspect-ratio:auto;height:24vh;order:-1}}
@media(prefers-reduced-motion:reduce){.veil{display:none}.rise{transition:none}}
</style>
<body>
<main class="hero" id="hero"><nav class="nav rise" style="--n:0" aria-label="Main"><b class="brand">Northlight</b><span class="links"><a href="#">Work</a><a href="#">Studio</a><a href="#">Contact</a></span></nav>
<div class="mid"><div class="txt"><p class="k rise" style="--n:1">Design studio, Lisbon</p><h1 class="rise" style="--n:2">Quiet pages for loud ideas.</h1><p class="sub rise" style="--n:3">Identity, websites and motion for people who would rather be clear than clever.</p><div class="row rise" style="--n:4"><a class="btn pri" href="#">See the work</a><button class="btn" id="again">Play again</button></div><p class="note" id="note" hidden>Reduced motion is on, so the preloader is skipped.</p></div>
<div class="pic rise" id="pic" style="--n:3" aria-hidden="true"></div></div></main>
<div class="veil" id="veil" aria-hidden="true"><div class="vtop"><span>Northlight</span><span>Loading</span></div><div class="vin" id="vin"><span class="num" id="num">0</span><span class="track"><i id="fill"></i></span></div></div>
<p class="sr" role="status" id="say"></p>
<script type="application/json" id="settings">{"duration":2200,"lift":900,"style":"lift","ease":"smooth","size":22,"mode":"light","accent":"#2563EB"}</script>
<script>
const CONTROLS=[{g:'Counter',k:'duration',label:'Count duration',min:800,max:3200,step:50,unit:'ms'},{k:'size',label:'Counter size',min:10,max:34,step:1,unit:'vw'},{g:'Curtain',k:'style',label:'Style',type:'select',options:['lift','split','circle']},{k:'lift',label:'Curtain duration',min:400,max:1400,step:50,unit:'ms'},{k:'ease',label:'Easing',type:'select',options:['smooth','in-out','linear']},{g:'Look',k:'mode',label:'Mode',type:'select',options:['light','dark']},{k:'accent',label:'Accent',type:'color'}];
/*TUNER*/
const framed=parent!==window;
/*FLATART*/
const $=id=>document.getElementById(id),hero=$('hero'),veil=$('veil'),vin=$('vin'),num=$('num'),fill=$('fill'),again=$('again'),say=$('say');
$('pic').style.backgroundImage=art(3);
const clamp=v=>Math.min(1,Math.max(0,v)),HOLD=180;
const EASE={smooth:t=>1-Math.pow(1-t,3),'in-out':t=>t<.5?16*t**5:1-Math.pow(2-2*t,5)/2,linear:t=>t};
/* What is left of the curtain when it is r (0 to 1) of the way open. */
function cut(r){
 if(S.style==='split'){const a=50-50*r,b=50+50*r;return `polygon(0 0,${a}% 0,${a}% 100%,0 100%,0 0,100% 0,100% 100%,${b}% 100%,${b}% 0,100% 0)`}
 /* A very large rectangle with a round hole in the middle. "evenodd" is what makes the circle a hole. */
 if(S.style==='circle'){const w=veil.offsetWidth,h=veil.offsetHeight,R=r*Math.hypot(w,h)/2+.01;return `path(evenodd,"M-9999 -9999H99999V99999H-9999ZM${w/2-R} ${h/2}a${R} ${R} 0 1 0 ${2*R} 0a${R} ${R} 0 1 0 ${-2*R} 0Z")`}
 return `inset(0 0 ${r*100}% 0)`}
const clip=v=>veil.style.clipPath=veil.style.webkitClipPath=v;
let run=0,busy=false;
/* One clock runs the whole thing: first the count, then a short pause, then the curtain. */
function play(byUser){if(calm)return;const id=++run,t0=performance.now();busy=true;veil.hidden=false;hero.inert=true;hero.classList.add('wait');clip('none');vin.style.opacity=1;vin.style.transform='';say.textContent='Loading';
 (function frame(now){if(id!==run)return;const t=now-t0,a=clamp(t/S.duration),p=a-Math.sin(a*6*Math.PI)/(6*Math.PI)*.9; /* p climbs in three surges, like real loading */
  num.textContent=Math.round(p*100);fill.style.transform=`scaleX(${p})`;
  const b=clamp((t-S.duration-HOLD)/S.lift);
  if(b>0){const out=clamp(b*3.5);clip(cut((EASE[S.ease]||EASE.smooth)(b)));vin.style.opacity=1-out;vin.style.transform=`translateY(${-28*out}px)`;hero.classList.remove('wait')}
  if(b<1)requestAnimationFrame(frame);else{veil.hidden=true;hero.inert=false;busy=false;say.textContent='Page ready';if(byUser)again.focus({preventScroll:true})}})(t0)}
again.onclick=()=>play(true);
/* Changing a setting replays the preloader a moment later, so you can see what it did. */
let sig='',timer=0;
function apply(){theme();veil.style.setProperty('--cs',S.size);const now=[S.duration,S.lift,S.style,S.ease,S.size].join();
 if(sig&&sig!==now){clearTimeout(timer);timer=setTimeout(()=>play(),350)}sig=now}
apply();
/* With reduced motion there is no curtain at all: the page is simply there. */
if(calm){veil.hidden=true;again.hidden=true;$('note').hidden=false}else play();
/* In a preview frame it replays by itself until you touch it. Delete this block in your own page. */
if(framed&&!calm){let stop=false;['pointerdown','keydown','wheel'].forEach(e=>addEventListener(e,()=>stop=true,{once:true,passive:true}));const iv=setInterval(()=>{if(stop)clearInterval(iv);else if(!busy)play()},2600)}
</script>
</body>
