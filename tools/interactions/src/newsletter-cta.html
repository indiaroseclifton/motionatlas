<!--META {"o":26,"t":"Morphing sign-up","cat":"Sections","tone":"light","uses":["L13","L49"],"d":"A newsletter call to action where the button does the talking: it swallows the field, spins while it sends, then opens into a thank-you with a drawn tick.","how":"The form is one pill. Submitting adds a state class: the input's width animates to nothing so the button appears to grow across, a spinner replaces the label, and a second state swaps in the confirmation. A bad address shakes the pill and explains why in text.","use":"Newsletter and waiting-list sign-ups, footers, launch pages, lead capture in apps.","p":"Build a morphing newsletter sign-up in one HTML file with no libraries. A section with a small label, a headline, a line of copy and a pill-shaped form containing an email input (with a real label for screen readers) and a submit button, over a soft gradient glow. On submit validate the address: if invalid, shake the pill, set aria-invalid and show an error message linked with aria-describedby. If valid, add a sending state: the input collapses to zero width with a spring so the button fills the pill, its label is replaced by a spinner; after a second switch to a done state: the pill turns the accent colour, shows a drawn tick and a thank-you line that includes the address, announced with role=status; offer a small link to use another address, which resets. Settings: pill width, height, corner radius, morph speed, bounce, glow strength, accent, light or dark. Reduced motion: cross-fade only."}-->
<style>/*BASE*/
.sec{position:relative;display:grid;gap:14px;justify-items:center;text-align:center;padding:30px 20px;max-width:640px}
.sec::before{content:"";position:absolute;inset:-20% -10%;background:radial-gradient(50% 50% at 50% 60%,color-mix(in srgb,var(--ac) calc(var(--gl)*100%),transparent),transparent 70%);filter:blur(40px);z-index:-1}
.k{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}h1{font-size:clamp(30px,6vw,52px);line-height:1.02;letter-spacing:-.03em}.sub{color:var(--mute);max-width:44ch}
.pill{display:flex;align-items:center;width:var(--w);max-width:100%;height:var(--h);padding:5px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);margin-top:8px;transition:background .3s,border-color .3s}
.pill:focus-within{border-color:var(--ac)}.pill input{flex:1 1 auto;min-width:0;width:100%;height:100%;border:0;background:none;outline:0;color:inherit;font:inherit;font-size:16px;padding:0 16px;transition:flex-grow var(--t) var(--e),padding var(--t) var(--e),opacity .2s}
.pill button{flex:0 0 auto;height:100%;padding:0 22px;border:0;border-radius:calc(var(--r) - 5px);background:var(--ac);color:#fff;font-weight:700;white-space:nowrap;display:grid;place-items:center;transition:flex-grow var(--t) var(--e)}
.pill.busy input,.pill.ok input{flex:0 0 0;width:0;padding:0;opacity:0}.pill.busy button,.pill.ok button{flex:1 1 auto}
.pill.bad{animation:shake .4s;border-color:#E5484D}@keyframes shake{20%,60%{translate:-7px 0}40%,80%{translate:7px 0}}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .7s linear infinite}@keyframes sp{to{rotate:1turn}}
.tick{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;animation:tk .35s .1s forwards;vertical-align:-5px;margin-right:6px}@keyframes tk{to{stroke-dashoffset:0}}
#msg{min-height:22px;font-size:13.5px}#msg.err{color:#FF7B7F}#msg button{all:unset;cursor:pointer;color:var(--ac);font-weight:600;margin-left:6px}#msg button:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:4px}
@media(prefers-reduced-motion:reduce){.pill.bad,.spin{animation:none}.pill input,.pill button{transition:none}}
</style>
<body>
<section class="sec"><span class="k">The Friday letter</span><h1>One good idea, every week.</h1><p class="sub">Design notes, a tool worth trying and nothing else. Read by 12,400 people who make things.</p>
<form class="pill" id="f" novalidate><label class="sr" for="em">Email address</label><input id="em" type="email" placeholder="you@example.com" autocomplete="email" aria-describedby="msg"><button id="b">Subscribe</button></form><p id="msg" role="status"></p></section>

<script>

const f=document.getElementById('f'),em=document.getElementById('em'),b=document.getElementById('b'),msg=document.getElementById('msg');let st='idle';
function reset(){st='idle';f.className='pill';b.innerHTML='Subscribe';b.disabled=false;em.disabled=false;em.value='';msg.className='';msg.textContent=''}
function send(v){st='busy';f.classList.add('busy');b.innerHTML='<span class="spin" role="img" aria-label="Sending"></span>';b.disabled=true;em.disabled=true;msg.className='';msg.textContent='';
 setTimeout(()=>{st='ok';f.classList.replace('busy','ok');b.innerHTML='<span><svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>You are in</span>';msg.innerHTML='Check <b></b> for a confirmation.<button type="button" id="again">Use another address</button>';msg.querySelector('b').textContent=v;document.getElementById('again').onclick=()=>{reset();em.focus()}},calm?200:1300)}
f.addEventListener('submit',e=>{e.preventDefault();if(st!=='idle')return;const v=em.value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){em.setAttribute('aria-invalid','true');msg.className='err';msg.textContent='Enter an email address like name@example.com.';f.classList.remove('bad');void f.offsetWidth;f.classList.add('bad');em.focus();return}em.removeAttribute('aria-invalid');send(v)});

apply();if(parent!==window&&!calm){const play=()=>{if(st!=='idle'||document.activeElement===em||f.matches(':hover'))return;const t='maya@fernhill.studio';let i=0;const k=setInterval(()=>{em.value=t.slice(0,++i);if(i>=t.length){clearInterval(k);setTimeout(()=>send(t),350);setTimeout(reset,4600)}},55)};setTimeout(play,900);setInterval(play,8000)}
