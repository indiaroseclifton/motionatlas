<!--META {"o":37,"t":"Product revolver","cat":"Carousels","tone":"light","uses":["L49","L13"],"d":"Products sit around a large wheel that dips below the page. Turn it and the next one swings up to the top, where its name, price and button change with it.","how":"The items are spread evenly around a circle whose centre is far below the stage, so only the top arc shows. Turning is one number: every item's angle is its slot minus that number. A spring carries the wheel to the chosen slot and each item counter-rotates to stay upright.","use":"Product pickers and configurators, flavour or colour ranges, plan selectors, featured collections.","p":"Build a product revolver section in one HTML file with no libraries. Eight product discs (gradient artwork with a letter mark) are placed on a circle of a given radius whose centre sits below the visible stage: for item i and float position p, angle = (i - p) * 360 / N - 90 degrees, x = cos(angle) * radius, y = sin(angle) * radius + radius. The top item is the selection: scale it up, and fade and shrink the others with angular distance. Position follows an integer target with a spring (stiffness and damping settings) so the wheel overshoots slightly. Drag horizontally to turn, Left and Right arrows step, clicking an item selects it, previous and next buttons. Above or below the wheel show the selected product's name, a short line, a price and an Add to bag button, updated with a quick cross-fade and announced in a polite live region. Settings: wheel radius, item size, selected scale, spring stiffness, damping, show the wheel rim, accent, light or dark. Reduced motion: no spring."}-->
<style>/*BASE*/
.wrap{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr;justify-items:center;overflow:hidden}
.info{display:grid;gap:6px;justify-items:center;text-align:center;padding:34px 20px 0;transition:opacity .15s}.info.sw{opacity:0}
.info small{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}.info h1{font-size:clamp(28px,5vw,46px);letter-spacing:-.03em;line-height:1}.info p{color:var(--mute)}
.buy{display:flex;gap:12px;align-items:center;margin-top:8px}.buy b{font-size:20px}.buy button{min-height:42px;padding:0 20px;border-radius:99px;border:0;background:var(--ac);color:var(--bg);font-weight:700}
.stage{position:relative;width:100%;touch-action:pan-y;cursor:grab;user-select:none;outline-offset:-4px}.stage:active{cursor:grabbing}
.rim{position:absolute;left:50%;top:var(--top);width:calc(var(--rad)*2);height:calc(var(--rad)*2);margin-left:calc(var(--rad)*-1);border-radius:50%;border:1px dashed var(--line)}
.it{position:absolute;left:50%;top:var(--top);width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);border-radius:50%;overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:800;font-size:calc(var(--s)*.3);will-change:transform;box-shadow:0 18px 30px -16px rgba(0,0,0,.5)}
.it span{position:relative}
.nav{position:fixed;left:0;right:0;bottom:18px;display:flex;justify-content:center;gap:12px}
</style>
<body>
<div class="wrap"><div class="info" id="info" aria-live="polite"><small id="k"></small><h1 id="t"></h1><p id="s"></p><div class="buy"><b id="pr"></b><button>Add to bag</button></div></div>
<div class="stage" id="stage" tabindex="0" role="group" aria-roledescription="carousel" aria-label="Product wheel. Drag or use the arrow keys."><div class="rim" id="rim"></div></div></div>
<div class="nav"><button class="nb" id="prev" aria-label="Previous product">‹</button><button class="nb" id="next" aria-label="Next product">›</button></div>
<script type="application/json" id="settings">{"radius":420,"size":120,"scale":1.45,"stiffness":0.12,"damping":0.78,"rim":true,"mode":"light","accent":"#111111"}</script>
<script>
const CONTROLS=[{g:'Wheel',k:'radius',label:'Radius',min:220,max:800,step:10,unit:'px'},{k:'rim',label:'Show rim',type:'toggle'},{g:'Items',k:'size',label:'Item size',min:70,max:180,step:2,unit:'px'},{k:'scale',label:'Selected scale',min:1,max:2,step:.05,unit:'×'},
 {g:'Spring',k:'stiffness',label:'Stiffness',min:.03,max:.3,step:.01},{k:'damping',label:'Damping',min:.5,max:.92,step:.01},{g:'Look',k:'mode',label:'Mode',type:'select',options:['light','dark']},{k:'accent',label:'Accent',type:'color'}];
/*TUNER*/
/*ART*/
const D=[['Ember','Smoked orange, cedar','£24'],['Lagoon','Sea salt, mint','£24'],['Blush','Rose, pink pepper','£26'],['Dune','Oat, vanilla','£22'],['Tide','Blue tea, lime','£24'],['Glacier','White peach, ice','£26'],['Moss','Matcha, pear','£24'],['Nectar','Honey, apricot','£22']],N=D.length,stage=document.getElementById('stage'),info=document.getElementById('info');
stage.insertAdjacentHTML('beforeend',D.map(([t],i)=>`<div class="it" data-i="${i}"><i class="art" style="background:${art(i)}"></i><span>${t[0]}</span></div>`).join(''));const IT=[...stage.querySelectorAll('.it')];
let pos=0,vel=0,target=0,drag=null,shown=-1;const mod=v=>((v%N)+N)%N;
function label(){const i=mod(Math.round(target));if(i===shown)return;shown=i;info.classList.add('sw');setTimeout(()=>{document.getElementById('k').textContent='Flavour '+(i+1)+' of '+N;document.getElementById('t').textContent=D[i][0];document.getElementById('s').textContent=D[i][1];document.getElementById('pr').textContent=D[i][2];info.classList.remove('sw')},calm?0:150)}
function draw(){IT.forEach((el,i)=>{let d=((i-pos)%N+N)%N;if(d>N/2)d-=N;const a=(d*360/N-90)*Math.PI/180,ad=Math.abs(d),sc=ad<1?1+(S.scale-1)*(1-ad):1-Math.min(.35,(ad-1)*.12);
 el.style.transform=`translate(${(Math.cos(a)*S.radius).toFixed(1)}px,${(Math.sin(a)*S.radius+S.radius).toFixed(1)}px) scale(${sc.toFixed(3)})`;el.style.opacity=ad>N/2-.6?0:Math.max(.3,1-ad*.22).toFixed(2);el.style.zIndex=100-Math.round(ad*10)})}
function tick(){if(!drag){if(calm){pos=target;vel=0}else{vel=(vel+(target-pos)*S.stiffness)*S.damping;pos+=vel}}draw();requestAnimationFrame(tick)}
const go=t=>{target=t;label()};
stage.addEventListener('pointerdown',e=>{drag={x:e.clientX,p:pos,m:0};stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;drag.m=Math.max(drag.m,Math.abs(dx));pos=drag.p-dx/(S.size*1.3);target=pos});
const up=e=>{if(!drag)return;const m=drag.m;drag=null;if(m<6){const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.it');if(el){let d=+el.dataset.i-mod(Math.round(pos));if(d>N/2)d-=N;if(d<-N/2)d+=N;return go(Math.round(pos)+d)}}go(Math.round(pos))};
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('keydown',e=>{const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(d){e.preventDefault();go(Math.round(target)+d)}});
document.getElementById('prev').onclick=()=>go(Math.round(target)-1);document.getElementById('next').onclick=()=>go(Math.round(target)+1);
function apply(){theme();const s=stage.style;s.setProperty('--rad',S.radius+'px');s.setProperty('--s',S.size+'px');s.setProperty('--top',(S.size*S.scale/2+26)+'px');document.getElementById('rim').hidden=!S.rim}
apply();label();requestAnimationFrame(tick);if(parent!==window&&!calm)setInterval(()=>{if(!stage.matches(':hover')&&!drag)go(Math.round(target)+1)},2000);
</script>
</body>
