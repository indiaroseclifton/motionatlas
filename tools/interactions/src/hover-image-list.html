<!--META {"o":17,"t":"Hover image list","cat":"Lists","tone":"light","uses":["L29","L04"],"d":"A plain list of project names. As you move down it, a picture for the current row floats beside the pointer, tilting with your speed and swapping with a wipe.","how":"One floating frame follows the pointer with a little lag. Its rotation comes from horizontal speed, and the pictures are stacked inside it: changing rows clips the new one in from the bottom. Focusing a row with the keyboard shows the same picture docked beside the list.","use":"Portfolio and case-study indexes, menus, article lists, award-site navigation.","p":"Build a hover image list in one HTML file with no libraries. A vertical list of six links, each a big title with an index number and a category on the right, separated by hairlines; hovered and focused rows indent slightly and the others dim. A fixed floating frame (width and aspect ratio from settings) holds one image per row, stacked; the active image is revealed with a clip-path inset animation. Every frame, ease the frame's position toward the pointer (lag is a setting) and rotate it by horizontal velocity times a tilt factor, clamped. Show the frame while the pointer is over the list and hide it with a scale-down otherwise. On keyboard focus, show the frame docked to the right of the focused row instead. On touch or narrow screens, show small thumbnails inline instead of the floating frame. Settings: frame width, aspect, lag, tilt, corner radius, row dimming, accent, light or dark."}-->
<style>/*BASE*/
body{overflow:hidden}
ul{list-style:none;margin:0;padding:0;width:min(760px,90vw)}
li a{display:flex;align-items:baseline;gap:16px;padding:16px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;transition:padding .3s,opacity .3s}
li a b{font-size:clamp(22px,4vw,38px);letter-spacing:-.02em;font-weight:600}li a i{font-style:normal;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}li a span{margin-left:auto;font-size:13px;color:var(--mute)}
ul:hover a,ul:focus-within a{opacity:var(--dim)}ul a:hover,ul a:focus-visible{opacity:1;padding-left:18px;color:var(--ac)}
.fr{position:fixed;left:0;top:0;width:var(--fw);aspect-ratio:var(--ar);border-radius:var(--r);overflow:hidden;pointer-events:none;scale:0;opacity:0;transition:scale .3s cubic-bezier(.3,1.4,.5,1),opacity .2s;box-shadow:0 30px 60px -24px rgba(0,0,0,.5);z-index:5;will-change:transform}
.fr.on{scale:1;opacity:1}.fr .art{clip-path:inset(100% 0 0 0);transition:clip-path .45s cubic-bezier(.2,.8,.2,1)}.fr .art.on{clip-path:inset(0);z-index:1}
@media(prefers-reduced-motion:reduce){.fr,.fr .art,li a{transition:none}}
</style>
<body>
<ul id="list"></ul><div class="fr" id="fr" aria-hidden="true"></div>
<script type="application/json" id="settings">{"width":260,"aspect":1.25,"lag":0.14,"tilt":0.5,"corner":14,"dim":0.4,"mode":"light","accent":"#E4572E"}</script>
<script>
const CONTROLS=[{g:'Frame',k:'width',label:'Width',min:160,max:400,step:5,unit:'px'},{k:'aspect',label:'Aspect',min:.7,max:1.8,step:.05},{k:'corner',label:'Corner radius',min:0,max:40,step:1,unit:'px'},{g:'Motion',k:'lag',label:'Follow speed',min:.04,max:.5,step:.01},{k:'tilt',label:'Tilt',min:0,max:1.5,step:.05},
 {g:'Look',k:'dim',label:'Other rows',min:.15,max:1,step:.05},{k:'mode',label:'Mode',type:'select',options:['light','dark']},{k:'accent',label:'Accent',type:'color'}];
/*TUNER*/
/*ART*/
const D=[[0,'Ember House','Identity'],[1,'Night Water','Film'],[3,'Paper Dunes','Packaging'],[4,'Deep Field','Website'],[2,'Orchid','Campaign'],[5,'One Line','Editorial']],list=document.getElementById('list'),fr=document.getElementById('fr');
list.innerHTML=D.map(([f,t,c],i)=>`<li><a href="#" data-i="${i}"><i>0${i+1}</i><b>${t}</b><span>${c}</span></a></li>`).join('');fr.innerHTML=D.map(([f])=>`<i class="art" style="background:${art(f)}"></i>`).join('');
const imgs=[...fr.children];let x=0,y=0,tx=0,ty=0,rot=0,cur=-1;
const show=i=>{if(i===cur)return;cur=i;imgs.forEach((m,k)=>m.classList.toggle('on',k===i));fr.classList.toggle('on',i>=0)};
list.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;tx=e.clientX+24;ty=e.clientY-fr.offsetHeight/2;const a=e.target.closest('a');if(a)show(+a.dataset.i)});list.addEventListener('pointerleave',()=>show(-1));
list.addEventListener('focusin',e=>{const a=e.target.closest('a');if(!a||!a.matches(':focus-visible'))return;const r=a.getBoundingClientRect();tx=Math.min(innerWidth-fr.offsetWidth-16,r.right-fr.offsetWidth*.6);ty=r.top-fr.offsetHeight/2+r.height/2;show(+a.dataset.i)});list.addEventListener('focusout',()=>show(-1));
list.addEventListener('click',e=>e.preventDefault());
function tick(t){if(auto&&!list.matches(':hover')){const i=Math.floor(t/1500)%D.length,r=list.children[i].getBoundingClientRect();tx=r.left+r.width*.45+Math.sin(t/400)*60;ty=r.top-fr.offsetHeight/2+r.height/2;show(i)}
 const k=calm?1:S.lag,nx=x+(tx-x)*k;rot+=((nx-x)*S.tilt-rot)*.2;x=nx;y+=(ty-y)*k;fr.style.transform=`translate(${x.toFixed(1)}px,${Math.max(8,Math.min(innerHeight-fr.offsetHeight-8,y)).toFixed(1)}px) rotate(${Math.max(-14,Math.min(14,rot)).toFixed(2)}deg)`;requestAnimationFrame(tick)}
function apply(){theme();const s=document.documentElement.style;s.setProperty('--fw',S.width+'px');s.setProperty('--ar',S.aspect);s.setProperty('--r',S.corner+'px');s.setProperty('--dim',S.dim)}
const auto=parent!==window&&!calm;apply();requestAnimationFrame(tick);
</script>
</body>
