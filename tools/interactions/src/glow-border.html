<!--META {"o":11,"t":"Glowing border cards","cat":"Cards","tone":"light","uses":["L10"],"d":"Cards whose edge lights up where the pointer is nearest, with a soft glow that spills between neighbours. Or let the light circle on its own.","how":"One pointer listener writes the pointer position into each card as custom properties. The border is a radial gradient centred there and masked so only the edge shows; a blurred copy underneath makes the glow. In orbit mode a conic gradient rotates instead.","use":"Feature grids, pricing cards, bento layouts, dashboards, integrations lists.","p":"Build a grid of glowing-border cards in one HTML file with no libraries. Six cards in a responsive grid. On pointermove over the grid, set --x and --y on every card to the pointer position relative to that card. Each card has a ::before that paints radial-gradient(size at var(--x) var(--y), accent, transparent) and is masked to the border area only (mask-composite exclude with a padding equal to the border width), plus a ::after with the same gradient, blurred, at low opacity for the spill. Fade both in while the pointer is over the grid. An Orbit setting replaces the pointer with a rotating conic-gradient using an animated @property angle. Keyboard focus lights the focused card fully. Settings: glow size, border width, blur, intensity, corner radius, orbit on or off, orbit speed, accent, second colour. Reduced motion: orbit stops."}-->
<style>/*BASE*/
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:min(900px,92vw)}
.k{position:relative;border-radius:var(--r);background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);padding:20px;min-height:150px;display:grid;align-content:space-between;gap:16px;isolation:isolate;outline-offset:4px}
.k::before,.k::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(var(--size) circle at var(--x,50%) var(--y,50%),var(--ac),var(--ac2) 40%,transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.k::before{padding:var(--bw);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.k::after{z-index:-1;filter:blur(var(--blur));inset:-2px}
.grid.on .k::before{opacity:1}.grid.on .k::after{opacity:var(--int)}
.k:focus-visible::before{opacity:1;background:var(--ac)}
.orbit .k::before,.orbit .k::after{background:conic-gradient(from var(--a),transparent 0 55%,var(--ac2),var(--ac),transparent 95%);animation:spin var(--spd) linear infinite}.orbit .k::before{opacity:1}.orbit .k::after{opacity:var(--int)}
@keyframes spin{to{--a:360deg}}
.k b{font-size:15px}.k p{font-size:13px;color:var(--mute);margin-top:4px}.k i{font-style:normal;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac);font-size:17px}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:420px){.grid{grid-template-columns:1fr}.k{min-height:0}}
@media(prefers-reduced-motion:reduce){.orbit .k::before,.orbit .k::after{animation:none}}
</style>
<body>
<div class="grid" id="grid"></div>
<script type="application/json" id="settings">{"size":280,"border":1.5,"blur":22,"intensity":0.3,"corner":18,"orbit":false,"speed":4,"mode":"light","accent":"#2563EB","accent2":"#06B6D4"}</script>
<script>
const CONTROLS=[{g:'Glow',k:'size',label:'Glow size',min:120,max:600,step:10,unit:'px'},{k:'border',label:'Border width',min:1,max:5,step:.5,unit:'px'},{k:'blur',label:'Spill blur',min:0,max:60,step:1,unit:'px'},{k:'intensity',label:'Spill strength',min:0,max:.8,step:.02},{k:'corner',label:'Corner radius',min:0,max:36,step:1,unit:'px'},
 {g:'Orbit',k:'orbit',label:'Circle on its own',type:'toggle'},{k:'speed',label:'Lap time',min:1.5,max:10,step:.5,unit:'s'},{g:'Look',k:'mode',label:'Mode',type:'select',options:['light','dark']},{k:'accent',label:'Colour one',type:'color'},{k:'accent2',label:'Colour two',type:'color'}];
/*TUNER*/
const D=[['⚡','Instant sync','Changes land on every device in under a second.'],['◈','Version history','Go back to any moment, by day or by edit.'],['☍','Shared links','Send a view-only page with one click.'],['◔','Usage insights','See what your team opens most.'],['⚙','Automation','Rules that file, tag and remind for you.'],['✦','AI drafts','A first version in your own voice.']],grid=document.getElementById('grid');
grid.innerHTML=D.map(([i,t,s])=>`<article class="k" tabindex="0"><i aria-hidden="true">${i}</i><div><b>${t}</b><p>${s}</p></div></article>`).join('');
grid.addEventListener('pointermove',e=>{grid.classList.add('on');for(const k of grid.children){const r=k.getBoundingClientRect();k.style.setProperty('--x',(e.clientX-r.left)+'px');k.style.setProperty('--y',(e.clientY-r.top)+'px')}});
grid.addEventListener('pointerleave',()=>grid.classList.remove('on'));
function apply(){theme();const s=grid.style;s.setProperty('--size',S.size+'px');s.setProperty('--bw',S.border+'px');s.setProperty('--blur',S.blur+'px');s.setProperty('--int',S.intensity);s.setProperty('--r',S.corner+'px');s.setProperty('--spd',S.speed+'s');s.setProperty('--ac2',S.accent2);grid.classList.toggle('orbit',!!S.orbit)}
apply();if(parent!==window){grid.classList.add('on');let t=0;const demo=()=>{if(grid.matches(':hover'))return;t+=.02;const r=grid.getBoundingClientRect(),x=r.left+r.width*(.5+.4*Math.cos(t)),y=r.top+r.height*(.5+.35*Math.sin(t*1.3));for(const k of grid.children){const b=k.getBoundingClientRect();k.style.setProperty('--x',(x-b.left)+'px');k.style.setProperty('--y',(y-b.top)+'px')}};if(!calm)setInterval(demo,30)}
</script>
</body>
