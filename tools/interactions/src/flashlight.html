<!--META {"o": 0.03, "t": "Flashlight reveal", "cat": "Type", "tone": "light", "added": "2026-11-14", "uses": ["L10", "L04"], "d": "The pointer is a round window onto a second headline hidden under the first. Press to widen the beam.", "how": "Two full-page layers are stacked. The top one has a circular CSS mask whose centre follows the pointer with a little lag, so only a disc of it shows.", "use": "Before and after stories, hero sections with a second message, spoilers, case studies that show what is under the surface.", "p": "Build a flashlight reveal in one HTML file with no libraries. Two full-viewport layers with the same layout sit on top of each other: the base layer has a kicker, a very large headline and one line of text in ink on the page background; the top layer has different words on the accent colour with a faint grid. Mask the top layer with radial-gradient(circle R at X Y, black, black to a soft edge, transparent) and update X and Y every frame so they ease toward the pointer (follow speed setting). Pressing the pointer grows the radius by 1.7 times. When the pointer is still for two seconds the light drifts on a slow figure-of-eight. A Reveal all button grows the circle to cover the page and back, and the hidden words are also provided as screen-reader text. Pick black or white text on the accent automatically from its brightness. Settings: light size, soft edge, follow speed, grid on or off, accent, light or dark. Reduced motion: the light jumps to the pointer and does not drift."}-->
<style>/*BASE*/
/*UI*/
.stage{position:fixed;inset:0;cursor:crosshair;touch-action:none}
.layer{position:absolute;inset:0;display:grid;align-content:center;justify-items:start;gap:14px;padding:0 max(24px,9vw)}
.layer h1{font-size:clamp(34px,7.4vw,104px);line-height:.98;letter-spacing:-.035em;font-weight:700}
.layer .sub{font-size:clamp(15px,1.6vw,18px);color:var(--mute);max-width:40ch}
.under{background-color:var(--ac);color:var(--on,#fff);-webkit-mask-image:radial-gradient(circle calc(var(--r,150)*1px) at var(--x,50%) var(--y,50%),#000 0,#000 calc(100% - var(--soft,18)*1%),transparent 100%);mask-image:radial-gradient(circle calc(var(--r,150)*1px) at var(--x,50%) var(--y,50%),#000 0,#000 calc(100% - var(--soft,18)*1%),transparent 100%)}
.under .k,.under .sub{color:inherit;opacity:.82}
.under.grid{background-image:linear-gradient(color-mix(in srgb,var(--on,#fff) 13%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--on,#fff) 13%,transparent) 1px,transparent 1px);background-size:36px 36px}
.all{position:fixed;right:16px;bottom:16px;z-index:2}
</style>
<body>
<main class="stage" id="stage">
<div class="layer"><p class="k">What ships</p><h1>Looks effortless<br>on the surface.</h1><p class="sub">Move the light around. Press to widen it.</p></div>
<div class="layer under" id="under" aria-hidden="true"><p class="k">What it took</p><h1>Forty-one drafts<br>underneath.</h1><p class="sub">Every margin was argued over.</p></div>
</main>
<p class="sr">Underneath: Forty-one drafts. Every margin was argued over.</p>
<button class="btn all" id="all">Reveal all</button>
<script type="application/json" id="settings">{"radius":150,"soft":18,"follow":0.16,"grid":true,"mode":"light","accent":"#2563EB"}</script>
<script>
const CONTROLS=[{g:'Light',k:'radius',label:'Size',min:60,max:340,step:5,unit:'px'},{k:'soft',label:'Soft edge',min:0,max:70,step:1,unit:'%'},{k:'follow',label:'Follow speed',min:.04,max:1,step:.01},{k:'grid',label:'Grid on the hidden layer',type:'toggle'},{g:'Look',k:'mode',label:'Mode',type:'select',options:['light','dark']},{k:'accent',label:'Accent',type:'color'}];
/*TUNER*/
const framed=parent!==window;
/* Picks black or white text for whatever accent you choose. */
const on=h=>{const n=parseInt(h.slice(1),16);return(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255>.62?'#111113':'#fff'};
/* Two layers sit on top of each other. The top one is masked to a circle that follows the pointer. */
const stage=document.getElementById('stage'),under=document.getElementById('under'),all=document.getElementById('all');
let tx=innerWidth/2,ty=innerHeight/2,x=tx,y=ty,r=0,down=false,open=false,idle=999;
stage.addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY;idle=0});
stage.addEventListener('pointerdown',e=>{down=true;tx=e.clientX;ty=e.clientY;idle=0});addEventListener('pointerup',()=>down=false);addEventListener('pointercancel',()=>down=false);
all.onclick=()=>{open=!open;all.textContent=open?'Hide again':'Reveal all'};
function tick(t){idle++;if(idle>120&&!calm){tx=innerWidth*(.5+.34*Math.sin(t/1700));ty=innerHeight*(.5+.26*Math.sin(t/1100+1))}
 const f=calm?1:S.follow;x+=(tx-x)*f;y+=(ty-y)*f;const goal=open?Math.hypot(innerWidth,innerHeight)*1.1:S.radius*(down?1.7:1);r+=(goal-r)*(calm?1:.14);
 under.style.setProperty('--x',x+'px');under.style.setProperty('--y',y+'px');under.style.setProperty('--r',r);requestAnimationFrame(tick)}
function apply(){theme();under.style.setProperty('--soft',S.soft);under.classList.toggle('grid',!!S.grid);under.style.setProperty('--on',on(S.accent||'#2563EB'))}
apply();requestAnimationFrame(tick);
</script>
</body>
