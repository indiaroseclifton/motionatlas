<!--META {"o":35,"t":"Riffle stack","cat":"Cards","tone":"light","uses":["L08","L49"],"d":"Covers standing in a row like records in a crate. Run along them and each one tips forward to show its face while its neighbours lean aside.","how":"Every cover is turned almost edge-on in 3D and overlaps the next. The one under the pointer or focus rotates to face you and lifts; covers either side are pushed apart by an amount that falls off with distance. All of it is three custom properties and a spring curve.","use":"Record, book and film collections, case-study shelves, product ranges, archive and blog indexes.","p":"Build a riffle stack in one HTML file with no libraries. Ten cover buttons (gradient artwork, title, year) stand in a row inside a perspective container, each rotated on the Y axis by a rest angle so they overlap like records in a crate, spaced by a spacing setting. The active cover (hover, focus or click) rotates to 0 degrees, translates toward the viewer and lifts; covers to its left and right are shifted away by spread / distance. Transitions use a springy cubic-bezier. Left and Right arrows move the active cover; Enter or click pins it and shows its details in a caption with aria-live. Leaving the row returns to the pinned cover. Settings: cover size, rest angle, spacing, spread, lift, perspective, speed, corner radius, light or dark. Reduced motion: no rotation, active cover is outlined."}-->
<style>/*BASE*/
.row{position:relative;height:calc(var(--s) + 90px);width:100%;perspective:var(--p);perspective-origin:50% 40%;outline-offset:-4px}
.k{position:absolute;left:50%;top:40px;width:var(--s);height:var(--s);margin-left:calc(var(--s)/-2);border:0;padding:0;border-radius:var(--r);overflow:hidden;color:#fff;text-align:left;transform:translateX(var(--x)) translateZ(var(--z,0px)) translateY(var(--y,0px)) rotateY(var(--a));transition:transform var(--t) cubic-bezier(.3,1.35,.5,1);box-shadow:-10px 14px 30px -14px rgba(0,0,0,.5);background:#222}
.k b{position:absolute;left:14px;bottom:30px;font-size:17px}.k small{position:absolute;left:14px;bottom:12px;font-size:12px;opacity:.85}
.cap{position:fixed;left:0;right:0;bottom:22px;text-align:center;font-size:13.5px;color:var(--mute)}.cap b{color:var(--ink)}
@media(prefers-reduced-motion:reduce){.k{transition:none}}
</style>
<body>
<div class="row" id="row" role="group" aria-label="Collection. Arrow keys move along the covers."></div>
<p class="cap" aria-live="polite" id="cap"></p>
<script type="application/json" id="settings">{"size":220,"angle":62,"spacing":54,"spread":120,"lift":18,"perspective":1100,"speed":520,"corner":10,"mode":"light","accent":"#111111"}</script>
<script>
const CONTROLS=[{g:'Covers',k:'size',label:'Cover size',min:130,max:320,step:2,unit:'px'},{k:'corner',label:'Corner radius',min:0,max:30,step:1,unit:'px'},{g:'Crate',k:'angle',label:'Rest angle',min:20,max:80,step:1,unit:'°'},{k:'spacing',label:'Spacing',min:24,max:120,step:1,unit:'px'},{k:'perspective',label:'Perspective',min:500,max:2400,step:50,unit:'px'},
 {g:'Motion',k:'spread',label:'Spread',min:0,max:260,step:5,unit:'px'},{k:'lift',label:'Lift',min:0,max:60,step:1,unit:'px'},{k:'speed',label:'Speed',min:200,max:1000,step:10,unit:'ms'},{g:'Look',k:'mode',label:'Mode',type:'select',options:['light','dark']}];
/*TUNER*/
/*ART*/
const D=[['Ember','2026'],['Lagoon','2025'],['Blush','2025'],['Dune','2024'],['Tide','2024'],['Glacier','2023'],['Moss','2023'],['Nectar','2022'],['Dusk','2022'],['Ember II','2021']],row=document.getElementById('row'),cap=document.getElementById('cap');
row.innerHTML=D.map(([t,y],i)=>`<button class="k" data-i="${i}" aria-pressed="false"><i class="art" style="background:${art(i)}"></i><b>${t}</b><small>${y}</small></button>`).join('');const K=[...row.children];let on=4,pin=4;
function lay(){const n=K.length;K.forEach((k,i)=>{const d=i-on,ad=Math.abs(d),s=Math.sign(d);k.style.setProperty('--x',((i-(n-1)/2)*S.spacing+(d?s*S.spread/Math.max(1,ad*.9):0))+'px');k.style.setProperty('--a',(d===0||calm?0:S.angle)+'deg');k.style.setProperty('--z',(d===0?90:-ad*6)+'px');k.style.setProperty('--y',(d===0?-S.lift:0)+'px');k.style.zIndex=d===0?100:50-ad;k.style.outline=calm&&d===0?'3px solid var(--ink)':''})}
function set(i,p){on=Math.max(0,Math.min(K.length-1,i));if(p){pin=on;K.forEach((k,j)=>k.setAttribute('aria-pressed',j===on));cap.innerHTML='<b></b> · '+D[on][1]+' · selected';cap.firstChild.textContent=D[on][0]}lay()}
row.addEventListener('pointerover',e=>{const k=e.target.closest('.k');if(k)set(+k.dataset.i)});row.addEventListener('pointerleave',()=>set(pin));row.addEventListener('focusin',e=>{const k=e.target.closest('.k');if(k)set(+k.dataset.i)});
row.addEventListener('click',e=>{const k=e.target.closest('.k');if(k)set(+k.dataset.i,true)});
row.addEventListener('keydown',e=>{const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(d){e.preventDefault();const i=Math.max(0,Math.min(K.length-1,on+d));K[i].focus()}});
function apply(){theme();const s=row.style;s.setProperty('--s',`min(${S.size}px,50vw)`);s.setProperty('--p',S.perspective+'px');s.setProperty('--t',S.speed+'ms');s.setProperty('--r',S.corner+'px');lay()}
apply();set(4,true);if(parent!==window&&!calm){let i=0;setInterval(()=>{if(!row.matches(':hover')&&!row.contains(document.activeElement))set(i++%K.length)},1100)}
</script>
</body>
