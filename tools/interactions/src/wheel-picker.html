<!--META {"o":25,"t":"Wheel picker","cat":"Controls","tone":"light","uses":["L08","L19"],"d":"Three scrolling drums for picking a time, as on a phone. Values snap into the centre band, curve away above and below, and fade toward the edges.","how":"Each drum is a normal scrolling list with scroll snapping, so touch flicks and the mouse wheel feel native. On every scroll frame each row's distance from the centre is turned into a rotation, a shrink and a fade, which fakes the cylinder. The centred row is the value.","use":"Time and date pickers, quantity and size selectors, timers and alarms, any short list on touch screens.","p":"Build a wheel picker in one HTML file with no libraries. Three columns (hours 1 to 12, minutes in steps of five, AM or PM), each a vertically scrolling list with scroll-snap-type: y mandatory, hidden scrollbars and top and bottom padding so the first and last rows can reach the centre. A highlight band marks the centre row. On scroll (requestAnimationFrame throttled), for each row compute d = (row centre - column centre) / row height and set transform: perspective rotateX(-d * curve deg) scale(1 - |d| * shrink) and opacity 1 - |d| * fade. The selected index is round(scrollTop / row height). Each column is role=listbox with a label, tabindex 0 and aria-activedescendant; Up and Down arrows step one row, Page Up and Down three, Home and End jump; clicking a row scrolls it to the centre. Show the chosen time in a large readout with aria-live. Settings: row height, visible rows, curve, shrink, fade, band radius, accent, light or dark."}-->
<style>/*BASE*/
.card{display:grid;gap:18px;justify-items:center;padding:26px 24px;border-radius:26px;background:var(--panel);border:1px solid var(--line);width:min(340px,92vw)}
.out{font-size:38px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.out small{font-size:16px;color:var(--mute);font-weight:600;margin-left:6px}
.wh{position:relative;display:flex;gap:4px;width:100%;height:calc(var(--rh)*var(--rows));-webkit-mask:linear-gradient(transparent,#000 22%,#000 78%,transparent);mask:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
.band{position:absolute;left:0;right:0;top:50%;height:var(--rh);translate:0 -50%;border-radius:var(--br);background:color-mix(in srgb,var(--ac) 14%,transparent);pointer-events:none}
.colw{flex:1;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;padding:calc(var(--rh)*(var(--rows) - 1)/2) 0;outline-offset:-3px;border-radius:12px;overscroll-behavior:contain}.colw::-webkit-scrollbar{display:none}
.colw div{height:var(--rh);display:grid;place-items:center;scroll-snap-align:center;font-size:calc(var(--rh)*.5);font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;will-change:transform}
.colw div[aria-selected=true]{color:var(--ac)}
</style>
<body>
<div class="card"><p class="out" aria-live="polite" id="out"></p><div class="wh" id="wh"><div class="band"></div></div><p style="color:var(--mute);font-size:13px">Scroll, drag or use the arrow keys</p></div>
<script type="application/json" id="settings">{"row":44,"rows":5,"curve":22,"shrink":0.1,"fade":0.3,"band":12,"mode":"light","accent":"#5B2DFF"}</script>
<script>
const CONTROLS=[{g:'Drum',k:'row',label:'Row height',min:32,max:60,step:1,unit:'px'},{k:'rows',label:'Rows showing',min:3,max:7,step:2},{k:'curve',label:'Curve',min:0,max:40,step:1,unit:'°'},{k:'shrink',label:'Shrink',min:0,max:.25,step:.01},{k:'fade',label:'Fade',min:0,max:.5,step:.01},
 {g:'Look',k:'band',label:'Band radius',min:0,max:24,step:1,unit:'px'},{k:'mode',label:'Mode',type:'select',options:['light','dark']},{k:'accent',label:'Accent',type:'color'}];
/*TUNER*/
const COLS=[['Hour',Array.from({length:12},(_,i)=>String(i+1)),8],['Minute',Array.from({length:12},(_,i)=>String(i*5).padStart(2,'0')),6],['AM or PM',['AM','PM'],0]],wh=document.getElementById('wh'),sel=COLS.map(c=>c[2]);
wh.insertAdjacentHTML('beforeend',COLS.map(([l,v],c)=>`<div class="colw" role="listbox" aria-label="${l}" tabindex="0" data-c="${c}">${v.map((x,i)=>`<div role="option" id="o${c}-${i}" aria-selected="false">${x}</div>`).join('')}</div>`).join(''));
const cols=[...wh.querySelectorAll('.colw')];
function paint(col){const c=+col.dataset.c,mid=col.scrollTop/S.row;[...col.children].forEach((r,i)=>{const d=i-mid,ad=Math.abs(d);r.style.transform=`perspective(400px) rotateX(${(-d*S.curve).toFixed(1)}deg) scale(${Math.max(.5,1-ad*S.shrink).toFixed(3)})`;r.style.opacity=Math.max(.08,1-ad*S.fade).toFixed(2)});
 const i=Math.max(0,Math.min(col.children.length-1,Math.round(mid)));if(i!==sel[c]||col.children[i].getAttribute('aria-selected')!=='true'){sel[c]=i;[...col.children].forEach((r,k)=>r.setAttribute('aria-selected',k===i));col.setAttribute('aria-activedescendant',`o${c}-${i}`);out()}}
function out(){document.getElementById('out').innerHTML=COLS[0][1][sel[0]]+':'+COLS[1][1][sel[1]]+'<small>'+COLS[2][1][sel[2]]+'</small>'}
const go=(col,i)=>col.scrollTo({top:Math.max(0,Math.min(col.children.length-1,i))*S.row,behavior:calm?'auto':'smooth'});
cols.forEach(col=>{let raf=0;col.addEventListener('scroll',()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;paint(col)})},{passive:true});
 col.addEventListener('click',e=>{const r=e.target.closest('[role=option]');if(r)go(col,[...col.children].indexOf(r))});
 col.addEventListener('keydown',e=>{const c=+col.dataset.c,m={ArrowDown:1,ArrowUp:-1,PageDown:3,PageUp:-3}[e.key];if(m){e.preventDefault();go(col,sel[c]+m)}else if(e.key==='Home'){e.preventDefault();go(col,0)}else if(e.key==='End'){e.preventDefault();go(col,99)}})});
function apply(){theme();const s=wh.style;s.setProperty('--rh',S.row+'px');s.setProperty('--rows',S.rows);s.setProperty('--br',S.band+'px');cols.forEach((col,c)=>{col.scrollTop=sel[c]*S.row;paint(col)})}
apply();out();if(parent!==window&&!calm)setInterval(()=>{if(wh.matches(':hover'))return;const c=Math.random()<.5?0:1;go(cols[c],Math.floor(Math.random()*12))},2200);
</script>
</body>
