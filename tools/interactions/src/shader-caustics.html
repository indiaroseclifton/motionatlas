<!--META {"o": 0.15, "t": "Pool caustics shader", "cat": "Backgrounds", "tone": "light", "added": "2026-11-14", "uses": [], "d": "The bright, rippling net of light you see on the floor of a swimming pool, drifting over a pale ground. Choose the speed, the size of the net, how bright it is and the colour of the water.", "how": "The net is the set of borders between cells whose centres circle slowly, so the cells keep changing shape. The coordinates are rippled first so the lines wobble, and a second, finer net is laid over the first; where the two cross, the light is brightest.", "use": "Travel, hotel, spa and swimwear pages, summer campaigns, drinks and skincare, calm section backgrounds.", "p": "Build a full-screen animated WebGL background in one HTML file with no libraries: a canvas fixed behind the content, one full-screen triangle, a fragment shader with uniforms for resolution, time and pointer, device pixel ratio capped at 1.5, paused when off screen or in a background tab, one still frame under prefers-reduced-motion, a still CSS gradient underneath as the fallback if WebGL is missing, and a fresh canvas if the context is lost and restored. Put a headline, a line of copy and an accent-coloured button over it. Shader: write a cell function that scatters one point per grid square, moves each point on a small circle over time, and returns the second-nearest distance minus the nearest, which is zero on the borders between cells. Ripple the coordinates with slow sine waves and a little noise, then call the cell function twice, at two sizes drifting in different directions. Turn each into light with a thin bright core plus a wider soft glow, add the two, and add their product so crossings sparkle. Light mode: a ground that mixes white with a little of the water colour, slightly deeper in slow patches, with the net blending towards white. Dark mode: a deep version of the colour with the net added as a pale glow. In dark mode ease the brightness inside an oval behind the headline (measured from the text block) so text stays readable, and add faint grain. Settings: speed, scale, brightness, water colour, light or dark, accent."}-->
<style>/*BASE*/
/*UI*/
/* The gradient on the body is what shows if WebGL is missing or the context is lost. */
body{background:linear-gradient(160deg,color-mix(in srgb,var(--w) 22%,#06121C),color-mix(in srgb,var(--w) 10%,#04090F))}
:root[data-mode=light] body{background:linear-gradient(160deg,color-mix(in srgb,var(--w) 16%,#fff),color-mix(in srgb,var(--w) 40%,#fff))}
.hero{position:relative;display:grid;gap:14px;justify-items:center;text-align:center;padding:24px;max-width:760px}
.hero h1{font-size:clamp(34px,7vw,76px);line-height:1;letter-spacing:-.03em;font-weight:700}
.hero p{font-size:clamp(15px,2vw,18px);max-width:44ch}
.hero .btn{margin-top:6px;background:var(--ac);border-color:var(--ac);color:var(--on,#fff)}
</style>
<body>
<main class="hero"><h1>Light on water</h1><p>The net of light on a pool floor, drawn by a shader.</p><a class="btn" href="#">Get started</a></main>
<script type="application/json" id="settings">{"speed":1,"scale":1,"bright":0.7,"water":"#2BB3E6","mode":"light","accent":"#2563EB"}</script>
<script>
const CONTROLS=[{g:'Water',k:'speed',label:'Speed',min:0,max:3,step:.05},{k:'scale',label:'Scale',min:.4,max:2.5,step:.05},{k:'bright',label:'Brightness',min:0,max:1,step:.01},{k:'water',label:'Water colour',type:'color'},{g:'Look',k:'mode',label:'Mode',type:'select',options:['light','dark']},{k:'accent',label:'Accent',type:'color'}];
/*TUNER*/
/*SHADER*/
/* Picks black or white text for whatever accent you choose. */
const on=h=>{const n=parseInt(h.slice(1),16);return(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255>.62?'#111113':'#fff'};
/* net() scatters one point per grid square, lets each one circle slowly, and returns how far a pixel is from the nearest border
   between two cells (0 on a border). Those borders are the lines of light. Two nets of different sizes are laid over each other. */
const FRAG=`uniform vec3 water,box;uniform float scale,bright,dark;
vec2 h2(vec2 p){return fract(sin(vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))))*43758.5453);}
float net(vec2 p,float t){vec2 i=floor(p),f=fract(p);float a=8.,b=8.;for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec2 g=vec2(float(x),float(y)),o=.5+.4*sin(t+6.2831*h2(i+g));float d=length(g+o-f);if(d<a){b=a;a=d;}else if(d<b){b=d;}}return b-a;}
float glow(float e){return .85*smoothstep(.1,0.,e)+.5*exp(-e*7.);}
void main(){vec2 p=(gl_FragCoord.xy-.5*R)/R.y*3.4/scale+(M-.5)*.2;float t=T*.55;
p+=.11*vec2(sin(p.y*2.3+t*1.3)+sin(p.y*5.1-t),sin(p.x*2.1-t*1.1)+sin(p.x*4.7+t*.8))+.25*(vec2(n(p*.9+t*.2),n(p*.9+7.-t*.2))-.5);
float l1=glow(net(p+vec2(t*.07,t*.05),t)),l2=glow(net(p*1.75-vec2(t*.09,-t*.06)+4.,t*1.3+2.));
float light=(l1*.8+l2*.42+l1*l2*.9)*(.75+.5*n(p*.45-t*.15));
float veil=smoothstep(2.,1.15,length((gl_FragCoord.xy-.5*R)/box.xy));
float depth=n(p*.35+vec2(t*.1,3.));
vec3 lc=mix(mix(vec3(1.),water,.16),mix(vec3(1.),water,.46),.25+.6*depth-.2*clamp(light,0.,1.));
lc=mix(lc,vec3(1.),clamp(light*bright*1.5,0.,1.));
vec3 dc=mix(vec3(.012,.03,.05),water,.1+.1*depth);float dl=light*bright*.8;dc+=mix(water,vec3(1.),.45)*dl/(1.+dl*veil*4.);
vec3 col=mix(lc,dc,dark);
col+=(h(gl_FragCoord.xy+fract(T))-.5)*.012;gl_FragColor=vec4(col,1.);}`;
let sh;
function start(){sh=shader(FRAG);const c=document.querySelector('canvas');
 /* If the graphics context is lost, hide the canvas so the CSS gradient shows, and start a fresh one when it comes back. */
 c.addEventListener('webglcontextlost',e=>{e.preventDefault();c.style.visibility='hidden'});
 c.addEventListener('webglcontextrestored',()=>{c.remove();start();apply()})}
/* The shader eases its brightness inside an oval behind the text, so the words stay readable. This measures the text block for it. */
const hero=document.querySelector('.hero'),veil=()=>{const b=hero.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,1.5);sh.set({box:[b.width/2*d,b.height/2*d,0]})};
function apply(){theme();const r=document.documentElement;document.body.style.background='';r.style.setProperty('--on',on(S.accent||'#2563EB'));r.style.setProperty('--w',S.water);
 sh.set({water:rgb(S.water),scale:S.scale,bright:S.bright,dark:S.mode==='dark'?1:0,_speed:S.speed});veil()}
start();apply();addEventListener('resize',veil);
</script>
</body>
