<!--META {"o":4,"t":"Cover flow","cat":"Carousels","tone":"dark","uses":["L08"],"d":"The classic shelf of covers: the centre one faces you, the rest turn away into depth, with an optional mirror floor.","how":"Distance from the centre is clamped to one for the turn and the push back, so every side cover shares the same angle and the row stays tidy; beyond that, covers just step sideways. A box reflection draws the floor.","use":"Album, book and film shelves, document pickers, app switchers.","p":"Build a cover flow in one HTML file with no libraries. Square covers in a perspective container; for distance d from the float position, with s = sign(d) and c = min(|d|,1): translateX = s*c*push + d*gap, rotateY = -s*c*angle, translateZ = -c*depth. The centre cover faces the viewer. Position eases to an integer; drag, arrow keys, Home and End, and clicking a cover centres it. Optional reflection with -webkit-box-reflect. Title and subtitle under the shelf in a polite live region. Settings: cover size, angle, depth, push, gap, perspective, reflection, corner radius, accent."}-->
<style>/*BASE*/
.stage{position:relative;width:100%;height:min(66vh,420px);perspective:var(--p);touch-action:pan-y;cursor:grab;user-select:none}.stage:active{cursor:grabbing}
.c{position:absolute;left:50%;top:42%;width:var(--w);aspect-ratio:1;border-radius:var(--r);overflow:hidden;background:var(--panel);will-change:transform;box-shadow:0 20px 40px -20px #000}
.refl .c{overflow:visible;-webkit-box-reflect:below 6px linear-gradient(transparent 62%,rgba(255,255,255,.28))}.refl .c img{border-radius:var(--r)}
.c img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.cap{position:fixed;left:0;right:0;bottom:22px;text-align:center}.cap h2{font-size:19px}.cap p{color:var(--mute);font-size:13px}
</style>
<body>
<div class="stage" id="stage" tabindex="0" role="group" aria-roledescription="carousel" aria-label="Covers. Use the arrow keys."></div>
<div class="cap" aria-live="polite"><h2 id="t"></h2><p id="s"></p></div>
<script type="application/json" id="settings">{"size":210,"angle":58,"depth":150,"push":150,"gap":58,"perspective":900,"reflect":true,"corner":8,"mode":"dark","accent":"#4CC9F0"}</script>
<script>
const CONTROLS=[{g:'Covers',k:'size',label:'Cover size',min:120,max:320,step:2,unit:'px'},{k:'corner',label:'Corner radius',min:0,max:30,step:1,unit:'px'},{k:'reflect',label:'Mirror floor',type:'toggle'},
 {g:'Depth',k:'angle',label:'Turn',min:0,max:80,step:1,unit:'°'},{k:'depth',label:'Push back',min:0,max:400,step:5,unit:'px'},{k:'perspective',label:'Perspective',min:400,max:2000,step:50,unit:'px'},{g:'Spacing',k:'push',label:'Centre clearance',min:40,max:300,step:2,unit:'px'},{k:'gap',label:'Side spacing',min:20,max:140,step:1,unit:'px'},
 {g:'Look',k:'mode',label:'Mode',type:'select',options:['dark','light']},{k:'accent',label:'Accent',type:'color'}];
/*TUNER*/
/*CAROUSEL*/
const stage=document.getElementById('stage');let cards=[];
function draw(pos){cards.forEach((c,i)=>{const d=i-pos,s=Math.sign(d),k=Math.min(Math.abs(d),1);
 c.style.transform=`translate(-50%,-50%) translateX(${(s*k*S.push+d*S.gap).toFixed(1)}px) translateZ(${(-k*S.depth).toFixed(1)}px) rotateY(${(-s*k*S.angle).toFixed(2)}deg)`;c.style.zIndex=100-Math.round(Math.abs(d)*10)})}
const car=carousel(stage,()=>ITEMS.length,draw,{step:()=>S.gap*1.6,onChange:i=>{document.getElementById('t').textContent=ITEMS[i][1];document.getElementById('s').textContent=ITEMS[i][2]}});
function apply(){theme();stage.style.setProperty('--w',S.size+'px');stage.style.setProperty('--r',S.corner+'px');stage.style.setProperty('--p',S.perspective+'px');stage.classList.toggle('refl',!!S.reflect);car.redraw()}
stage.innerHTML=ITEMS.map(([f,t],i)=>`<figure class="c" data-i="${i}"><img src="${IMG(f)}" alt="${t}" draggable="false"></figure>`).join('');cards=[...stage.children];
apply();car.go(4);
</script>
</body>
