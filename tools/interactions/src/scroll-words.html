<!--META {"o": 0.11, "t": "Scroll text reveal", "cat": "Type", "tone": "light", "added": "2026-11-14", "uses": ["L19", "L24", "L07"], "d": "A large paragraph starts pale and darkens word by word as you scroll, so reading speed and scroll speed become the same thing.", "how": "The section is taller than the screen and its text is pinned. How far you are through the section decides how many words are lit, with a soft edge of a few words.", "use": "Manifestos and mission statements, product intros, case study openers, any single paragraph that deserves full attention.", "p": "Build a scroll text reveal in one HTML file with no libraries. A section 300vh tall contains a sticky full-height block with a kicker and one large paragraph split into word spans. On scroll, progress p = scrolled distance through the section divided by (section height - viewport height). Compute a head position of 1 + p * (word count + spread); each word gets opacity dim + (1 - dim) * clamp((head - index) / spread, 0, 1). Words marked as key words turn the accent colour once lit. Add a thin progress bar at the top of the page and a Scroll to read hint that fades after the first few percent, then a closing section with a button. Settings: text size, unread opacity, how many words light at once, scroll distance, accent, light or dark."}-->
<style>/*BASE*/
/*UI*/
html,body{height:auto;min-height:100%;overflow:visible}body{display:block;overflow:visible}
.pin{position:sticky;top:0;height:100vh;display:grid;align-content:center;gap:18px;padding:0 max(20px,7vw)}
.copy{font-size:clamp(22px,calc(var(--fs,4.2)*1vw),76px);font-weight:600;line-height:1.16;letter-spacing:-.025em;max-width:21em}
.copy span{opacity:.16;transition:color .3s}
.copy .key.lit{color:var(--ac)}
.meter{position:fixed;left:0;top:0;z-index:2;height:3px;width:100%;background:var(--ac);transform-origin:0 50%;transform:scaleX(var(--p,0))}
.end{min-height:70vh;display:grid;place-content:center;justify-items:center;gap:16px;text-align:center;padding:40px 20px;border-top:1px solid var(--line)}
.end h2{margin:0;font-size:clamp(26px,4vw,44px);letter-spacing:-.02em;line-height:1.1}
.hint{transition:opacity .3s}
</style>
<body>
<div class="meter" id="meter" aria-hidden="true"></div>
<section id="read"><div class="pin"><p class="k">Why it moves</p><p class="copy" id="copy"></p></div></section>
<section class="end"><h2>That is the whole idea.</h2><a class="btn pri" href="#">See the work</a></section>
<p class="hint" id="hint">Scroll to read</p>
<script type="application/json" id="settings">{"size":4.2,"dim":0.16,"spread":5,"length":300,"mode":"light","accent":"#2563EB"}</script>
<script>
const CONTROLS=[{g:'Text',k:'size',label:'Size',min:2.4,max:6.5,step:.1,unit:'vw'},{k:'dim',label:'Unread opacity',min:.05,max:.5,step:.01},{g:'Scroll',k:'spread',label:'Words lighting at once',min:1,max:14,step:1},{k:'length',label:'Scroll distance',min:150,max:600,step:10,unit:'vh'},{g:'Look',k:'mode',label:'Mode',type:'select',options:['light','dark']},{k:'accent',label:'Accent',type:'color'}];
/*TUNER*/
const framed=parent!==window;
/* Wrap a word in *stars* to give it the accent colour once it has been read. */
const TEXT='Motion is not decoration. It shows people where they are, what just *changed* and what to do *next.* Done well, nobody notices it. They only notice that the page feels *easy.*';
const copy=document.getElementById('copy'),read=document.getElementById('read'),meter=document.getElementById('meter'),hint=document.getElementById('hint');
copy.innerHTML=TEXT.split(' ').map(w=>`<span${w[0]==='*'?' class="key"':''}>${w.replace(/\*/g,'')}</span>`).join(' ');
const W=[...copy.children];
/* The section is taller than the screen and its content is pinned. How far you are through it decides how many words are lit. */
function draw(){const r=read.getBoundingClientRect(),p=Math.min(1,Math.max(0,-r.top/Math.max(1,r.height-innerHeight))),head=1+p*(W.length+S.spread);
 W.forEach((w,i)=>{const k=Math.min(1,Math.max(0,(head-i)/S.spread));w.style.opacity=S.dim+(1-S.dim)*k;w.classList.toggle('lit',k>.6)});
 meter.style.setProperty('--p',p);hint.style.opacity=p>.03?0:1}
addEventListener('scroll',draw,{passive:true});addEventListener('resize',draw);
function apply(){theme();copy.style.setProperty('--fs',S.size);read.style.height=S.length+'vh';draw()}
apply();
/* In a preview frame the page scrolls itself until you touch it. Delete this block in your own page. */
if(framed&&!calm){let on=true,t0=0;const root=document.documentElement;root.style.scrollbarWidth='none';['wheel','touchstart','pointerdown','keydown'].forEach(e=>addEventListener(e,()=>{on=false;root.style.scrollbarWidth=''},{passive:true,once:true}));
 (function auto(t){if(!on)return;t0=t0||t;const max=document.documentElement.scrollHeight-innerHeight,k=(t-t0)/7/1000%2,u=k<1?k:2-k;scrollTo(0,max*u*u*(3-2*u));requestAnimationFrame(auto)})(0)}
</script>
</body>
