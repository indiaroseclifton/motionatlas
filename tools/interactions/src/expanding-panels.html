<!--META {"o":7,"t":"Expanding panels","cat":"Galleries","tone":"light","uses":["L12"],"d":"A row of image slices. The one you point at, focus or tap opens wide and shows its title while the others squeeze together.","how":"The panels are flex items. The active one gets a larger flex-grow and the browser animates the rest out of the way, so there is no layout maths in script. On a narrow screen the row turns into a column and the same rule works vertically.","use":"Portfolio heroes, category pickers, team rows, destination or product ranges.","p":"Build an expanding-panels gallery in one HTML file with no libraries. A flex row of N buttons, each with a cover image, a rotated short label when closed and a title plus line that fade in when open. The active panel has flex-grow equal to an expand value and the others 1; transition flex-grow with an ease-out curve. Hover, focus and click all set the active panel; Left and Right arrows move it; aria-pressed marks the open one. Under 640px switch to a column with a fixed height. Settings: panel count, expand ratio, gap, corner radius, height, speed, image dimming, accent, light or dark."}-->
<style>/*BASE*/
.g{display:flex;gap:var(--gap);width:min(1000px,94vw);height:var(--h)}
.p{position:relative;flex:1 1 0;min-width:0;border:0;padding:0;border-radius:var(--r);overflow:hidden;background:var(--panel);transition:flex-grow var(--t) cubic-bezier(.2,.8,.2,1);text-align:left;color:#fff}
.p[aria-pressed=true]{flex-grow:var(--grow)}
.p .art{filter:brightness(var(--dim));transition:filter var(--t)}.p[aria-pressed=true] .art{filter:none}
.p .v{position:absolute;left:50%;bottom:18px;writing-mode:vertical-rl;transform:translateX(-50%) rotate(180deg);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;transition:opacity .2s}
.p .o{position:absolute;inset:auto 0 0 0;padding:50px 18px 18px;background:linear-gradient(transparent,rgba(0,0,0,.75));opacity:0;transform:translateY(8px);transition:opacity .3s .1s,transform .3s .1s;white-space:nowrap}
.p .o b{display:block;font-size:20px}.p .o span{font-size:13px;opacity:.85}.p .o i{display:block;width:28px;height:3px;border-radius:2px;background:#fff;margin-bottom:10px}
.p[aria-pressed=true] .v{opacity:0}.p[aria-pressed=true] .o{opacity:1;transform:none}.p:focus-visible{outline-offset:-3px}
@media(max-width:640px){.g{flex-direction:column;height:min(86vh,620px)}.p .v{writing-mode:horizontal-tb;transform:none;left:16px;bottom:50%;translate:0 50%}}
@media(prefers-reduced-motion:reduce){.p,.p .art,.p .o{transition:none}}
</style>
<body>
<div class="g" id="g" role="group" aria-label="Studies. Arrow keys move between panels."></div>
<script type="application/json" id="settings">{"count":5,"grow":5,"gap":10,"corner":20,"height":420,"speed":520,"dim":0.6,"mode":"light","accent":"#111111"}</script>
<script>
const CONTROLS=[{g:'Layout',k:'count',label:'Panels',min:3,max:7,step:1},{k:'grow',label:'Open width',min:2,max:9,step:.5,unit:'×'},{k:'gap',label:'Gap',min:0,max:28,step:1,unit:'px'},{k:'height',label:'Height',min:240,max:560,step:10,unit:'px'},{k:'corner',label:'Corner radius',min:0,max:48,step:1,unit:'px'},
 {g:'Motion',k:'speed',label:'Speed',min:150,max:1200,step:10,unit:'ms'},{g:'Look',k:'dim',label:'Closed brightness',min:.25,max:1,step:.05},{k:'mode',label:'Mode',type:'select',options:['light','dark']},{k:'accent',label:'Accent',type:'color'}];
/*TUNER*/
/*ART*/
const D=[[0,'Ember','Warm, slow, glowing'],[1,'Lagoon','Cool water at night'],[3,'Dune','Soft planes of sand'],[4,'Nebula','Dust, gas and distance'],[2,'Orchid','Colour let loose'],[6,'Moss','Deep, quiet green'],[8,'Dusk','The last light']],g=document.getElementById('g');let on=1;
const set=i=>{on=i;[...g.children].forEach((p,k)=>p.setAttribute('aria-pressed',k===i))};
function apply(){theme();const s=g.style;s.setProperty('--gap',S.gap+'px');s.setProperty('--h',S.height+'px');s.setProperty('--r',S.corner+'px');s.setProperty('--grow',S.grow);s.setProperty('--t',S.speed+'ms');s.setProperty('--dim',S.dim);
 if(g.children.length!==S.count){g.innerHTML=D.slice(0,S.count).map(([f,t,l])=>`<button class="p" aria-pressed="false"><i class="art" style="background:${art(f)}"></i><span class="v" aria-hidden="true">${t}</span><span class="o"><i></i><b>${t}</b><span>${l}</span></span></button>`).join('');set(Math.min(on,S.count-1))}}
g.addEventListener('pointerover',e=>{const p=e.target.closest('.p');if(p)set([...g.children].indexOf(p))});g.addEventListener('focusin',e=>{const p=e.target.closest('.p');if(p)set([...g.children].indexOf(p))});g.addEventListener('click',e=>{const p=e.target.closest('.p');if(p)set([...g.children].indexOf(p))});
g.addEventListener('keydown',e=>{const d=e.key==='ArrowRight'||e.key==='ArrowDown'?1:e.key==='ArrowLeft'||e.key==='ArrowUp'?-1:0;if(d){e.preventDefault();const n=g.children.length,i=(on+d+n)%n;g.children[i].focus()}});
apply();
</script>
</body>
