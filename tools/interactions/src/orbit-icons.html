<!--META {"o": 0.09, "t": "Orbiting icons", "cat": "Sections", "tone": "light", "added": "2026-11-14", "uses": [], "d": "Tool icons circle a centre mark on three rings, turning in opposite directions and always staying upright.", "how": "Each ring is a rotating circle. Its icons are fixed around the edge and spin the opposite way at the same rate, which cancels the turn and keeps them level.", "use": "Integration sections, feature overviews, ecosystem diagrams, the picture side of a split hero.", "p": "Build an orbiting icons section in one HTML file with no libraries. Two columns: on the left a kicker, headline, one line of text, a primary link and a Pause button; on the right a square stage (stacked above the text under 700px). The stage has three concentric rings at 32%, 60% and 88% of its width with hairline borders, holding 3, 5 and 7 round icon chips placed evenly by rotating an arm and putting the chip on its end. Each ring rotates with a linear infinite CSS animation (24, 38 and 56 seconds, the middle ring reversed) and every chip runs the opposite rotation with the same duration so icons stay upright. A rounded square mark sits in the centre and one chip per ring uses the accent. Speed is set with the Web Animations playbackRate so changing it never makes the rings jump. Settings: speed, number of rings, ring lines on or off, pause on hover, icon size, accent, light or dark. Reduced motion: no rotation."}-->
<style>/*BASE*/
/*UI*/
.sec{width:min(1040px,100%);display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:4vw;padding:24px max(20px,5vw)}
.txt{display:grid;gap:14px;justify-items:start}
.txt h1{font-size:clamp(28px,4.6vw,56px);line-height:1.02;letter-spacing:-.035em}
.txt .sub{color:var(--mute);font-size:clamp(15px,1.5vw,17px)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.orbit{position:relative;width:min(100%,76vh);aspect-ratio:1;justify-self:center}
.ring{position:absolute;left:50%;top:50%;width:calc(var(--d)*1%);height:calc(var(--d)*1%);border-radius:50%;border:1px solid var(--line);transform:translate(-50%,-50%);animation:spin var(--t) linear infinite}
.arm{position:absolute;inset:0;transform:rotate(var(--a))}
.spot{position:absolute;left:100%;top:50%;transform:translate(-50%,-50%) rotate(calc(var(--a)*-1))}
.chip{display:grid;place-items:center;width:var(--s,48px);height:var(--s,48px);border-radius:50%;background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 20px -14px rgba(17,17,19,.5);color:var(--ink);animation:unspin var(--t) linear infinite}
.chip svg{width:46%;height:46%}
.chip.hl{background:var(--ac);border-color:var(--ac);color:var(--on,#fff)}
.ring.rev,.ring.rev .chip{animation-direction:reverse}
.core{position:absolute;left:50%;top:50%;width:20%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:30%;background:var(--ink);color:var(--bg);display:grid;place-items:center}.core svg{width:46%;height:46%}
.orbit.nolines .ring{border-color:transparent}
.orbit.paused .ring,.orbit.paused .chip,.orbit.hp:hover .ring,.orbit.hp:hover .chip{animation-play-state:paused}
@keyframes spin{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes unspin{from{transform:rotate(0)}to{transform:rotate(-360deg)}}
@media(max-width:700px){.sec{grid-template-columns:1fr;gap:20px;text-align:center}.txt{justify-items:center}.row{justify-content:center}.orbit{width:min(84vw,44vh);order:-1}}
@media(prefers-reduced-motion:reduce){.ring,.chip{animation:none}}
</style>
<body>

/* Each ring: its width as a share of the stage, its icons, and seconds per lap. Odd rings turn the other way. */
const RINGS=[[32,['chat-circle', 'calendar-blank', 'cloud'],24],[60,['folder', 'envelope', 'image', 'lightning', 'music-note'],38],[88,['credit-card', 'chart-bar', 'lock', 'code', 'user', 'bell', 'camera'],56]];
const orbit=document.getElementById('orbit'),pp=document.getElementById('pp');let built=0,paused=false;

function build(){built=S.rings;orbit.innerHTML=RINGS.slice(0,S.rings).map(([dia,ic,t],j)=>`<div class="ring${j%2?' rev':''}" style="--d:${dia};--t:${t}s">${ic.map((n,i)=>`<span class="arm" style="--a:${(360/ic.length*i+j*25).toFixed(1)}deg"><span class="spot"><span class="chip${i===0?' hl':''}">${svg(n)}</span></span></span>`).join('')}</div>`).join('')+`<div class="core">${svg('lightning')}</div>`}
